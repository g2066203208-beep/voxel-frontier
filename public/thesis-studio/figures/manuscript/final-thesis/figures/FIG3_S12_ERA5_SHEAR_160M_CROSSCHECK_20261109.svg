<text x="75" y="897" font-size="13" font-family="Arial,sans-serif" fill="#627888">SOURCE: R5 Word Table 3-2/3-4; original figures 3-4(a,b). Values transcribed from printed source, not ERA5 hourly reprocessing.</text>
