<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><rect width="900" height="650" fill="white"/><text x="70" y="48" font-size="23" font-family="Arial" font-weight="bold" fill="#182c3c">Horizontal component fractions at synchronous vector peaks</text><text x="70" y="75" font-size="15" font-family="Arial" fill="#516271">ESM-driven E-only linear beam proxy, 0.005 s samples; squared fractions, not physical energy</text><g font-family="Arial"><text x="70" y="112" font-size="17" fill="#223248">Top relative displacement</text><rect x="70" y="130" width="580.192" height="31" fill="#315b78"/><rect x="650.192" y="130" width="99.808" height="31" fill="#9cb5c4"/><text x="70" y="182" font-size="14" fill="#334455">HNE 85.32% / HNN 14.68%; t*= 50.150 s; dt(HNE/HNN)= -0.010 / -13.820 s</text><text x="70" y="217" font-size="17" fill="#223248">Top absolute acceleration</text><rect x="70" y="235" width="289.598" height="31" fill="#315b78"/><rect x="359.598" y="235" width="390.402" height="31" fill="#9cb5c4"/><text x="70" y="287" font-size="14" fill="#334455">HNE 42.59% / HNN 57.41%; t*= 38.795 s; dt(HNE/HNN)= 4.270 / 4.545 s</text><text x="70" y="322" font-size="17" fill="#223248">Base elastic shear</text><rect x="70" y="340" width="217.803" height="31" fill="#315b78"/><rect x="287.803" y="340" width="462.197" height="31" fill="#9cb5c4"/><text x="70" y="392" font-size="14" fill="#334455">HNE 32.03% / HNN 67.97%; t*= 38.595 s; dt(HNE/HNN)= 4.255 / 0.000 s</text><text x="70" y="427" font-size="17" fill="#223248">Base elastic moment</text><rect x="70" y="445" width="590.502" height="31" fill="#315b78"/><rect x="660.502" y="445" width="89.498" height="31" fill="#9cb5c4"/><text x="70" y="497" font-size="14" fill="#334455">HNE 86.84% / HNN 13.16%; t*= 35.435 s; dt(HNE/HNN)= 0.010 / -1.150 s</text></g><text x="70" y="600" font-size="14" font-family="Arial" fill="#516271">Each bar sums to 100% at its own QoI-specific vector-peak time. No wind or material nonlinearity.</text></svg>
