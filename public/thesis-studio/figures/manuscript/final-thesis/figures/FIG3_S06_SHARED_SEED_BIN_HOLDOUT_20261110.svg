-anchor="middle" font-size="15">2</text><text x="380" y="446" text-anchor="middle" font-size="15">3</text><text x="520" y="446" text-anchor="middle" font-size="15">4</text><text x="660" y="446" text-anchor="middle" font-size="15">5</text><text x="380" y="478" font-size="15" text-anchor="middle">Shared seed labels selected (k)</text><text x="30" y="260" transform="rotate(-90 30 260)" font-size="14">Max absolute DEL error (%)</text><text x="695" y="150" font-size="13" fill="#0f766e">All-bin oracle (optimistic)</text><text x="695" y="176" font-size="13" fill="#64748b">Mean over all subsets</text><text x="695" y="202" font-size="13" fill="#b91c1c">Holdout 9.34 m/s</text><text x="695" y="228" font-size="13" fill="#d97706">Holdout 11.4 m/s</text><text x="695" y="254" font-size="13" fill="#7c3aed">Holdout 19.20 m/s</text><text x="65" y="516" font-size="12">Training optimizes against full six-seed reference in the other two bins; heldout reference is evaluation-only.</text><text x="65" y="536" font-size="12">Retrospective finite-sample sensitivity; NOT a population confidence bound, physical validation, or DLC1.2.</text></g></svg>
