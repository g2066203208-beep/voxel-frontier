<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文图件与文献原图核对</title><style>body{font:15px/1.7 "Noto Serif SC",SimSun,serif;color:#222;margin:0;background:#fff}main{max-width:1300px;margin:auto;padding:24px}h1{font-size:24px}h2{font-size:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:8px;vertical-align:top}th{border-top:2px solid #333;border-bottom:1px solid #333}a{color:#245477}figure{margin:20px 0}img{width:100%;height:auto;display:block}figcaption{font-size:14px}small{color:#555}</style><main><p><a href="./manuscript-workbench.html">在线论文</a>　<a href="./wind-figures/he-comparison.html">风场图件拼图</a></p><h1>正式图件与参考文献原图逐项核对</h1><p>每幅正式图须有同类型原图对照、明确出处和实际数据依据。未核查或缺少拼图的图件不得定稿；不得强行配对不同物理量。左为参考文献，右为本文。</p><p id="count"></p><table><thead><tr><th>章节</th><th>正文图题</th><th>文献</th><th>核对记录</th></tr></thead><tbody id="rows"></tbody></table><div id="pairs"></div><p><a href="figure-reference-register.json">核对清单原文件</a></p></main><script>fetch('figure-reference-register.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(async d=>{try{const r=await fetch('wind-figures/he-comparison-04.json',{cache:'no-store'});if(r.ok){const z=await r.json();if(z.comparison_sha256){const x=d.figures.find(x=>x.id==='wind-r21-fig6');x.pair='wind-figures/he-comparison-04.png';x.status='ARCHIVED'}}}catch(e){};const a=d.figures;document.getElementById('count').textContent=d.version+'：明确图件 '+a.length+' 项，拼图已归档 '+a.filter(x=>x.status==='ARCHIVED').length+' 项。';for(const x of a){const tr=document.createElement('tr');for(const v of [x.chapter,x.caption,x.reference||'待核查',x.status==='ARCHIVED'?'拼图已归档（待网页验收）':x.status==='SOURCE_INSPECTED_PAIR_PENDING'?'已核对原图，拼图未归档':'待核查']){const td=document.createElement('td');td.textContent=v;tr.append(td)}if(x.pair){const a=document.createElement('a');a.href=x.pair;a.textContent='打开拼图';tr.lastChild.append('　',a);const f=document.createElement('figure');const img=document.createElement('img');img.src=x.pair;img.loading='lazy';img.alt=x.caption;const c=document.createElement('figcaption');c.textContent=x.caption+'｜左：'+x.reference+'；右：本文。';f.append(img,c);document.getElementById('pairs').append(f)}document.getElementById('rows').append(tr)}}).catch(()=>document.getElementById('count').textContent='清单未加载。请打开JSON原文件核查。');</script></html>
