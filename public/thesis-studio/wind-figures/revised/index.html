<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配对风场图件修订版</title><style>body{margin:0;background:#f4f7f8;color:#20343e;font:16px/1.7 system-ui}header{background:#153643;padding:18px 24px;color:white}header a{color:#d3f2ee}main{max-width:1040px;margin:auto;padding:20px}figure{margin:16px 0;padding:16px;background:white;border:1px solid #dce4e8}img{display:block;width:100%;height:auto}a{color:#126d76}h1{font-size:25px}</style><header><a href="../">风荷载图件</a> · <a href="../native/">原生BTS</a></header><main><h1>配对随机风场 · 期刊制图修订版</h1><p>11.4 m/s，NTM/ETM同seed，11×11，120 s；20–120 s统计。仅为已完成原生试算的重新制图，不作为51×51完整网格验证结果。三高度取最近实际网格点；PSD虚线统一为轮毂参考目标；TI以当地纵向平均速度归一化；相干采用多点对同相归一化交叉谱，点对非独立。</p><p id="status">检查已归档图件…</p><div id="figures"></div><p><a href="plot_wind.py">可复现制图程序</a></p></main><script>const items=[["01_rotor_snapshots","NTM与ETM扫掠面瞬时风速"],["02_spatiotemporal","横向及竖向时空风速"],["03_wind_field_3d","三维时空切片"],["04_height_component_timeseries","三个高度三分量风速时程"],["05_nine_component_spectra","三个高度三分量功率谱"],["06_full_height_profiles","全高度风剖面、平均流向及三分量湍流强度"],["07_spatial_cocoherence","纵向风速同相相干"]];fetch('pilot/manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>{if(m.grid!==11||m.files.length!==7)throw Error();document.querySelector('#status').innerHTML='<a href="pilot/manifest.json">数据来源清单</a> · <a href="pilot/height_stats.csv">三高度统计</a> · <a href="pilot/spectra.csv">谱数据</a> · <a href="pilot/profiles.csv">全高度统计</a>';document.querySelector('#figures').innerHTML=items.map(([f,t])=>'<figure><a href="pilot/'+f+'.png"><img loading="lazy" src="pilot/'+f+'.png" alt="'+t+'"></a><figcaption>'+t+' · <a href="pilot/'+f+'.pdf">PDF</a> · <a href="pilot/'+f+'.svg">SVG</a> · <a href="pilot/'+f+'.png">PNG</a></figcaption></figure>').join('')}).catch(()=>document.querySelector('#status').textContent='远端制图发布任务尚未核验完成；请以原生风场归档及实际运行结果为准。')</script></html>
