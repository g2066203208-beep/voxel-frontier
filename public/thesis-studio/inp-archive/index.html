<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INP 模型档案 · 湖北嘉鱼风机工作室</title><style>
:root{color-scheme:light dark;--accent:#157b70}*{box-sizing:border-box}body{font:15px/1.6 system-ui,sans-serif;margin:0;background:light-dark(#f4f6f5,#142020);color:light-dark(#1d2d2c,#e1eae9)}header{background:#112c33;color:#fff;padding:16px max(20px,calc((100% - 1000px)/2))}header a{color:#b9e4d8;text-decoration:none}main{max-width:1000px;margin:auto;padding:28px 20px}h1{font-size:26px;margin:0 0 16px}section{border:1px solid light-dark(#d4e0dd,#3d5553);border-radius:10px;background:light-dark(#fff,#1e3030);padding:20px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}dl{display:grid;grid-template-columns:120px 1fr;gap:8px;margin:0 0 14px}dt{color:light-dark(#506560,#b1c9c3)}dd{margin:0;overflow-wrap:anywhere}code{font-size:12px}button{font:inherit;background:var(--accent);color:white;border:0;padding:9px 14px;border-radius:6px;margin:3px 8px 3px 0;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:light-dark(#136e66,#99dbce)}#status{min-height:24px;overflow-wrap:anywhere}small{color:light-dark(#506560,#b1c9c3)}@media(max-width:540px){dl{grid-template-columns:1fr}dd{margin-bottom:4px}}
</style></head><body><header><a href="../">← 湖北嘉鱼风机工作室</a></header><main><h1>INP 模型档案</h1><div id="versions" aria-live="polite">正在读取版本目录…</div><section><h2>版本控制</h2><p>冻结原件不覆盖；每次修改另建 REV 版本，并记录原件与新件 SHA-256、修改范围及验证状态。工作室从 GitHub 读取持久化原始字节。下载前校验压缩包，解压后再次校验 INP。</p><a href="https://github.com/g2066203208-beep/voxel-frontier/tree/main/public/thesis-studio/inp-archive">GitHub 版本目录</a> · <a href="https://github.com/g2066203208-beep/voxel-frontier/blob/research/t080-seismic-integration-gates-20261022/research/wind-tower/governance/DEVELOPMENT_WHITEPAPER.md">研发白皮书</a><p><small>此页面为版本读取与校验下载入口。远端修改由授权的 GitHub 提交完成；浏览器本地草稿不视为远端已保存。</small></p></section><p id="status" role="status"></p></main><script>
"use strict";
const status=document.getElementById("status");
async function sha256(buf){return Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",buf)),x=>x.toString(16).padStart(2,"0")).join("")}
function save(bytes,name,type){const a=document.createElement("a");const url=URL.createObjectURL(new Blob([bytes],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function assemble(v){const zip=new Uint8Array(v.zipSize);let offset=0;for(const [i,p] of v.parts.entries()){status.textContent="读取归档 "+(i+1)+"/"+v.parts.length+"…";const r=await fetch(p.path,{cache:"no-store"});if(!r.ok)throw Error("分块读取失败 "+p.path);const a=new Uint8Array(await r.arrayBuffer());if(a.length!==p.size)throw Error("分块长度不符 "+p.path);zip.set(a,offset);offset+=a.length}if(offset!==v.zipSize||await sha256(zip)!==v.zipSha256)throw Error("ZIP SHA-256 不匹配");return zip}
async function unpack(zip,v){const d=new DataView(zip.buffer,zip.byteOffset,zip.byteLength);if(d.getUint32(0,true)!==0x04034b50||d.getUint16(8,true)!==8||(d.getUint16(6,true)&8))throw Error("不支持的 ZIP 结构");const start=30+d.getUint16(26,true)+d.getUint16(28,true);const end=start+d.getUint32(18,true);const name=new TextDecoder().decode(zip.slice(30,30+d.getUint16(26,true)));if(name!==v.file||end>zip.length)throw Error("ZIP 成员不匹配");const data=await new Response(new Blob([zip.slice(start,end)]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer();if(data.byteLength!==v.size||await sha256(data)!==v.sha256)throw Error("INP SHA-256 不匹配");return data}
let archiveVersions=[];
async function recover(v){if(!v.base)return new Uint8Array(await unpack(await assemble(v),v));const parent=archiveVersions.find(x=>x.version===v.base);if(!parent)throw Error("母本版本缺失");const src=await recover(parent);const r=await fetch(v.patch,{cache:"no-store"});if(!r.ok)throw Error("差异档案读取失败");const p=await r.json();if(p.sourceSha256!==await sha256(src)||p.targetSha256!==v.sha256||p.targetSize!==v.size)throw Error("差异版本身份不符");const enc=new TextEncoder(),out=new Uint8Array(v.size);let cursor=0,dest=0;for(const e of p.edits){const b=enc.encode(e.new),i=e.offset,compact=p.schema===2,a=compact?null:enc.encode(e.old),n=compact?e.oldLength:a.length;if(!Number.isSafeInteger(i)||!Number.isSafeInteger(n)||n<0||i<cursor||i+n>src.length)throw Error("差异定位不符");if(compact?await sha256(src.subarray(i,i+n))!==e.oldSha256:a.some((x,j)=>src[i+j]!==x))throw Error("差异原文校验不符");out.set(src.subarray(cursor,i),dest);dest+=i-cursor;out.set(b,dest);dest+=b.length;cursor=i+n}out.set(src.subarray(cursor),dest);dest+=src.length-cursor;if(dest!==v.size||await sha256(out)!==v.sha256)throw Error("新版INP校验失败");return out}
async function download(v,kind,buttons){buttons.forEach(b=>b.disabled=true);try{if(v.base){const inp=await recover(v);save(inp,v.file,"application/octet-stream");status.textContent="INP 大小及 SHA-256 校验通过，已触发下载。";return}const zip=await assemble(v);if(kind==="zip"){save(zip,v.file.replace(/\.inp$/i,".zip"),"application/zip");status.textContent="ZIP 校验通过，已触发下载。"}else{const inp=await unpack(zip,v);save(inp,v.file,"application/octet-stream");status.textContent="INP 大小及 SHA-256 校验通过，已触发下载。"}}catch(e){status.textContent="下载中止："+e.message+"。可尝试 ZIP 下载。"}finally{buttons.forEach(b=>b.disabled=false)}}
function addField(dl,label,value,code=false){const dt=document.createElement("dt"),dd=document.createElement("dd");dt.textContent=label;if(code){const c=document.createElement("code");c.textContent=value;dd.append(c)}else dd.textContent=value;dl.append(dt,dd)}
(async()=>{try{const r=await fetch("manifest.json",{cache:"no-store"});if(!r.ok)throw Error("版本目录读取失败");const m=await r.json();archiveVersions=m.versions;const host=document.getElementById("versions");host.replaceChildren();for(const v of m.versions){const s=document.createElement("section"),h=document.createElement("h2"),dl=document.createElement("dl");h.textContent=v.version+(v.version===m.latest?" · 当前归档":"");addField(dl,"文件",v.file);addField(dl,"归档日期",v.date);addField(dl,"大小",v.size.toLocaleString()+" bytes");addField(dl,"状态",v.state);addField(dl,"SHA-256",v.sha256,true);const a=document.createElement("button"),b=document.createElement("button");a.textContent="校验并下载 INP";b.textContent="校验并下载 ZIP";a.onclick=()=>download(v,"inp",[a,b]);b.onclick=()=>download(v,"zip",[a,b]);s.append(h,dl,a);if(!v.base)s.append(b);host.append(s)}}catch(e){document.getElementById("versions").textContent=e.message}})();
</script></body></html>
