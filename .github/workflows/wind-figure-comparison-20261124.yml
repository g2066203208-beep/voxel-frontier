name: Wind figure original comparison 20261124
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['research/wind-tower/experiments/WIND_FIGURE_COMPARISON_20261124/**', '.github/workflows/wind-figure-comparison-20261124.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            research/wind-tower/experiments/WIND_FIGURE_COMPARISON_20261124
            public/thesis-studio/documents/He_Zeyu_2024_hybrid_tower_thesis.pdf
            public/thesis-studio/wind-figures/native/native-pilot-11m4-1ETM
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests pillow pymupdf
      - run: python research/wind-tower/experiments/WIND_FIGURE_COMPARISON_20261124/compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wind-figure-original-comparison
          path: wind_comparisons/
          retention-days: 30
