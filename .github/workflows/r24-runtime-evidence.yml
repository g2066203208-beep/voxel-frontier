name: R24 Adaptive Runtime Evidence

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_integrate_runtime.py'
      - '.github/scripts/r24_capture.sh'
      - '.github/workflows/r24-runtime-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-adaptive-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout R24 tracked source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/r24-unified-planetary-physics

      - name: Stage R24 adaptive runtime source
        run: |
          python3 .github/scripts/r24_integrate_runtime.py
          grep -q 'buildAdaptivePlanetSurface' native/src/app/Main.cpp
          grep -q 'surfaceAuthority = &surfaceAuthority' native/src/app/Main.cpp
          grep -q 'moonSurfaceMesh' native/src/app/Main.cpp
          git diff --check
          git diff -- native/src/app/Main.cpp | sed -n '1,260p'

      - name: Install Vulkan X11 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure C++23 Vulkan runtime and tests
        run: cmake -S native -B build/r24-runtime -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build adaptive runtime
        run: cmake --build build/r24-runtime --parallel 2

      - name: Run complete native correctness suite
        run: ctest --test-dir build/r24-runtime --verbose --output-on-failure

      - name: Verify real Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture mandatory real framebuffer evidence
        shell: bash
        run: |
          APP="$(find build/r24-runtime -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r24-evidence
          bash .github/scripts/r24_capture.sh "$APP" r24-evidence
          cp vulkan-summary.txt r24-evidence/
          git diff -- native/src/app/Main.cpp > r24-evidence/runtime-source.patch

      - name: Commit tested runtime source to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/app/Main.cpp
          if git diff --cached --quiet; then
            echo 'Runtime already tracked.'
          else
            git commit -m 'R24: integrate adaptive cube-sphere runtime and physical Moon'
            git push origin HEAD:work/r24-unified-planetary-physics
          fi

      - name: Preserve diagnostics after any failure
        if: always()
        shell: bash
        run: |
          mkdir -p r24-evidence
          cp -f vulkan-summary.txt r24-evidence/ 2>/dev/null || true
          git diff -- native/src/app/Main.cpp > r24-evidence/runtime-source.patch 2>/dev/null || true
          printf 'workflow_sha=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > r24-evidence/workflow-source.txt

      - name: Upload every framebuffer even when visually bad
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-real-vulkan-evidence-${{ github.sha }}
          path: r24-evidence/**
          if-no-files-found: warn
          retention-days: 30

  windows-build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout R24 tracked source
        uses: actions/checkout@v6
        with:
          ref: work/r24-unified-planetary-physics
      - name: Stage same R24 runtime source
        shell: pwsh
        run: python .github/scripts/r24_integrate_runtime.py
      - name: Configure Windows x64
        run: cmake -S native -B build/windows-r24 -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
      - name: Build Windows x64
        run: cmake --build build/windows-r24 --config Release --parallel 2
      - name: Test Windows x64
        run: ctest --test-dir build/windows-r24 -C Release --verbose --output-on-failure
