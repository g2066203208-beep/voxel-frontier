name: T074 formal 158m gravity-action baseline

on:
  push:
    paths:
      - '.github/workflows/t074-formal-158m-gravity-baseline.yml'

permissions:
  contents: write

jobs:
  gravity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: A
            nodes: "13,39,65,91,117,142,168,194,220"
            segments: "01,02,03,04,05,06,07,08,09"
          - batch: B
            nodes: "246,271,297,323,349,375,400,426,452"
            segments: "10,11,12,13,14,15,16,17,18"
          - batch: C
            nodes: "478,504,529,555,581,607,633,658,684"
            segments: "19,20,21,22,23,24,25,26,27"
          - batch: D
            nodes: "710,736,762,784,810,850,900,1000,1120"
            segments: "28,29,30,31,EX1,EX2,EX3,EX4,EX5"
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reader
        shell: pwsh
        run: python -m pip install "git+https://github.com/OpenFAST/openfast_toolbox.git" pandas numpy
      - name: Restore exact formal case and make gravity-only static baseline
        shell: pwsh
        env:
          BATCH: ${{ matrix.batch }}
          NODES: ${{ matrix.nodes }}
          SEGMENTS: ${{ matrix.segments }}
        run: |
          $ErrorActionPreference="Stop"
          Expand-Archive "research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip" -DestinationPath static
          Expand-Archive "research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip" -DestinationPath supp
          New-Item -ItemType Directory -Force -Path runroot | Out-Null
          # Preserve the original archive directory topology. ElastoDyn blade files
          # are referenced as ../Rotor/*, so copying a case alone breaks the model.
          Copy-Item -Recurse "static/CASES/*" "runroot/" -Force
          $base="runroot/U09p343881_ETM_S01"
          $case="runroot/GRAVITY_BASELINE"
          Copy-Item -Recurse $base $case -Force
          if (Test-Path "supp/CASES/U09p343881_ETM_S01/Control/DTU_10MW_RWT_DISCON.IN") {
            Copy-Item "supp/CASES/U09p343881_ETM_S01/Control/DTU_10MW_RWT_DISCON.IN" "$case/Control/DTU_10MW_RWT_DISCON.IN" -Force
          }
          @'
          from pathlib import Path
          import os,re,json,hashlib
          case=Path("runroot/GRAVITY_BASELINE")
          fst=case/"DTU_10MW_RWT.fst"
          s=fst.read_text(encoding="utf-8",errors="replace")
          # preserve exact 158 m structural model, but remove environmental/servo variable actions
          reps={
            r'(?m)^\s*\d+\s+CompInflow\b.*$':'0             CompInflow    - T074 still air',
            r'(?m)^\s*\d+\s+CompAero\b.*$':'0             CompAero      - T074 no aerodynamic loads',
            r'(?m)^\s*\d+\s+CompServo\b.*$':'0             CompServo     - T074 no controller/electrical variable action',
            r'(?m)^\s*[0-9.Ee+-]+\s+TMax\b.*$':'2.0           TMax          - T074 gravity baseline duration',
            r'(?m)^\s*[0-9.Ee+-]+\s+TStart\b.*$':'0.0           TStart        - T074 output from start',
          }
          for pat,val in reps.items():
              s,n=re.subn(pat,val,s,count=1)
              if n!=1: raise SystemExit(f"FST patch failed {pat}: {n}")
          fst.write_text(s,encoding="utf-8")

          ed=case/"DTU_10MW_RWT_ElastoDyn.dat"
          s=ed.read_text(encoding="utf-8",errors="replace")
          # Freeze generalized dynamic DOFs so outputs are pure rigid-configuration gravity/self-weight reactions.
          dofs=["FlapDOF1","FlapDOF2","EdgeDOF","TeetDOF","DrTrDOF","GenDOF","YawDOF",
                "TwFADOF1","TwFADOF2","TwSSDOF1","TwSSDOF2",
                "PtfmSgDOF","PtfmSwDOF","PtfmHvDOF","PtfmRDOF","PtfmPDOF","PtfmYDOF"]
          for k in dofs:
              s,n=re.subn(rf'(?mi)^\s*(?:True|False)\s+{k}\b.*$',f'False         {k}      - T074 gravity baseline fixed DOF',s,count=1)
              if n!=1: raise SystemExit(f"DOF patch {k} n={n}")
          s,n=re.subn(r'(?m)^\s*[0-9.Ee+-]+\s+RotSpeed\b.*$','0.0           RotSpeed      - T074 fixed rotor',s,count=1)
          if n!=1: raise SystemExit("RotSpeed patch failed")
          s,n=re.subn(r'(?m)^\s*1,3,5,7,9,13,15,17,20\s+TwrGagNd\b.*$',
                      os.environ["NODES"]+'             TwrGagNd      - T074 31-segment gravity gages',s,count=1)
          if n!=1: raise SystemExit(f"TwrGagNd patch failed {n}")
          ed.write_text(s,encoding="utf-8")
          meta={
            "identity":"FORMAL-158M-GRAVITY-BASELINE",
            "base_case":"U09p343881_ETM_S01 static package",
            "physics_changes":["CompInflow=0","CompAero=0","CompServo=0","all generalized DOFs fixed","RotSpeed=0"],
            "preserved":["Gravity","tower mass/stiffness","blade mass/geometry","hub/nacelle mass and offsets","158m tower file"],
            "batch":os.environ["BATCH"],"nodes":os.environ["NODES"],"segments":os.environ["SEGMENTS"],
            "tower_sha256":hashlib.sha256((case/"C02R3R2_158M_Tower.dat").read_bytes()).hexdigest(),
            "fst_sha256_after_patch":hashlib.sha256(fst.read_bytes()).hexdigest(),
            "ed_sha256_after_patch":hashlib.sha256(ed.read_bytes()).hexdigest()
          }
          Path("T074_meta.json").write_text(json.dumps(meta,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(meta,indent=2))
          '@ | Set-Content -Encoding utf8 prep.py
          python prep.py
      - name: Run OpenFAST v3.5.3
        shell: pwsh
        run: |
          $exe=Resolve-Path "research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe"
          Push-Location "runroot/GRAVITY_BASELINE"
          & $exe "DTU_10MW_RWT.fst" *>&1 | Tee-Object -FilePath "T074_${{ matrix.batch }}.log"
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){ throw "OpenFAST failed with exit code $code" }
      - name: Extract constant gravity reactions
        shell: pwsh
        env:
          BATCH: ${{ matrix.batch }}
          SEGMENTS: ${{ matrix.segments }}
        run: |
          @'
          from pathlib import Path
          import os, numpy as np, pandas as pd
          from openfast_toolbox.io.fast_output_file import FASTOutputFile
          batch=os.environ["BATCH"]; segs=os.environ["SEGMENTS"].split(",")
          f=Path("runroot/GRAVITY_BASELINE/DTU_10MW_RWT.outb")
          df=FASTOutputFile(str(f)).toDataFrame()
          tcol=next(c for c in df.columns if c.startswith("Time"))
          # ignore the first few records; fixed-DOF gravity output should be constant
          w=df[df[tcol]>=0.5].copy()
          rows=[]
          def col(gi,suf):
              h=[c for c in w.columns if c.startswith(f"TwHt{gi}{suf}")]
              if len(h)!=1: raise KeyError((gi,suf,h))
              return h[0]
          for gi,sg in enumerate(segs,1):
              if sg.startswith("EX"): continue
              vals={}
              for suf,nm in [("FLxt","Fx_kN"),("FLyt","Fy_kN"),("FLzt","Fz_kN"),
                             ("MLxt","Mx_kNm"),("MLyt","My_kNm"),("MLzt","Mz_kNm")]:
                  a=w[col(gi,suf)].to_numpy(float)
                  vals[nm]=float(a.mean())
                  vals[nm+"_range"]=float(a.max()-a.min())
              z=float(w[col(gi,"TPzi")].iloc[0])
              rows.append({"segment":f"CSEG_{sg}","gage_z_m":z,**vals})
          od=Path("extract");od.mkdir(exist_ok=True)
          pd.DataFrame(rows).to_csv(od/f"T074_GRAVITY_${batch}.csv",index=False)
          print(pd.DataFrame(rows).to_string(index=False))
          '@ | Set-Content -Encoding utf8 extract.py
          python extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: T074-gravity-${{ matrix.batch }}
          path: |
            extract/*
            T074_meta.json
            runroot/GRAVITY_BASELINE/T074_*.log
          retention-days: 14

  aggregate:
    needs: gravity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: T074-gravity-*
          path: incoming
          merge-multiple: true
      - name: Merge, validate constancy, and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          fs=sorted(Path("incoming").glob("**/T074_GRAVITY_*.csv"))
          x=pd.concat([pd.read_csv(f) for f in fs],ignore_index=True).sort_values("segment")
          if len(x)!=31 or x.segment.nunique()!=31: raise SystemExit("31-segment merge failure")
          range_cols=[c for c in x if c.endswith("_range")]
          maxrange={c:float(x[c].abs().max()) for c in range_cols}
          out=Path("research/wind-tower/experiments/T074");out.mkdir(parents=True,exist_ok=True)
          x.to_csv(out/"T074_158M_31SEG_GRAVITY_BASELINE.csv",index=False)
          (out/"T074_GRAVITY_BASELINE_VALIDATION.json").write_text(json.dumps({
              "rows":len(x),"segments":x.segment.nunique(),"max_time_ranges":maxrange,
              "status":"PASS" if max(maxrange.values())<1e-6 else "REVIEW_NONCONSTANT"
          },indent=2)+"\n")
          print(x.to_string(index=False))
          print(maxrange)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T074
          git commit -m "T074: add formal 158m 31-segment gravity baseline"
          git pull --rebase origin main
          git push
