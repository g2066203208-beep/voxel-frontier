name: S05 CI.CLC REAL ground motion baseline/drift/QC sensitivity (NOT site PASS)
on:
  workflow_dispatch:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - research/wind-tower/experiments/T079/s05_clc_full_response_waveform_qc.py
      - .github/workflows/s05-real-pair-baseline-sensitivity.yml
permissions:
  contents: write
jobs:
  baseline-real-pair:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch hash-locked REAL raw CI.CLC CSV pair, manifest and programs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GH_REPO/pulls/42" --jq .head.sha)"
          base="https://raw.githubusercontent.com/$GH_REPO/$sha/research/wind-tower/experiments/T079"
          mkdir -p real raw-py
          curl -fLsS --retry 3 --output raw-py/s05_real_pair_baseline_sensitivity.py "$base/s05_real_pair_baseline_sensitivity.py"
          curl -fLsS --retry 3 --output raw-py/s05_ground_motion_pair_qc.py "$base/s05_ground_motion_pair_qc.py"
          root="$base/real-records/USGS_ci38457511/CI_CLC"
          for file in manifest.json CI_CLC_HNE_accel_mps2.csv CI_CLC_HNN_accel_mps2.csv; do
            curl -fLsS --retry 3 --output "real/$file" "$root/$file"
          done
          python -m py_compile raw-py/*.py
          python raw-py/s05_real_pair_baseline_sensitivity.py --self-test
          sha256sum real/* raw-py/*.py
      - name: Process actual paired acceleration and run 5-percent-damped SDOF spectrum independently
        run: |
          set -euo pipefail
          python raw-py/s05_real_pair_baseline_sensitivity.py --raw-dir real --output-dir "$RUNNER_TEMP/s05_derived"
      - name: Research backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-ci-clc-baseline-sensitivity-not-design-pass
          path: ${{ runner.temp }}/s05_derived/
          if-no-files-found: warn
          retention-days: 90
      - name: Permanently commit REAL pilot processed files to PR Git tree (separate from immutable original)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,time
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'s05_derived'
          if not (source/'baseline_sensitivity_report.json').exists():raise RuntimeError('REAL_PAIR_PROCESSING_DID_NOT_SUCCEED')
          repo=os.environ['GH_REPO']
          branch='research/t080-seismic-integration-gates-20261022'
          root='research/wind-tower/experiments/T079/real-records/USGS_ci38457511/CI_CLC/processed'
          for file in sorted(source.glob('*')):
              if not file.is_file():continue
              path=root+'/'+file.name;data=file.read_bytes()
              gsha=hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
              for attempt in range(12):
                  old=subprocess.run(['gh','api','--method','GET',f'repos/{repo}/contents/{path}','-f',f'ref={branch}'],capture_output=True,text=True)
                  if old.returncode==0:
                      if json.loads(old.stdout)['sha']==gsha:
                          print('VERIFIED_EXISTING_BASELINE_REPO_FILE',path);break
                      raise RuntimeError('NO_OVERWRITE_UNDIAGNOSED_DERIVED_INPUT '+path)
                  payload={'message':'research(S05): persist measured CI.CLC baseline/drift/spectrum sensitivity '+file.name,'branch':branch,'content':base64.b64encode(data).decode()}
                  up=subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{path}','--input','-'],input=json.dumps(payload),capture_output=True,text=True)
                  if up.returncode==0:
                      print('BASELINE_PILOT_REPO_COMMIT',path,hashlib.sha256(data).hexdigest(),json.loads(up.stdout)['commit']['sha']);break
                  if '409' in up.stderr:
                      time.sleep(2);continue
                  raise RuntimeError('UPLOAD_ERROR '+up.stderr[:400])
              else:raise RuntimeError('GIT_409_RETRIES_EXHAUSTED '+path)
          PY

  full-response-original-2019:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native ObsPy and numeric libraries
        run: python -m pip install 'obspy==1.5.1'
      - name: Fetch exact commit program and immutable original SCEDC inputs
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/$GH_REPO/$SOURCE_COMMIT/research/wind-tower/experiments/T079"
          mkdir -p source/original
          curl -fLsS --retry 3 --output s05_clc_full_response_waveform_qc.py "$base/s05_clc_full_response_waveform_qc.py"
          root="$base/real-records/USGS_ci38457511/CI_CLC"
          for f in source_receipt.json CI_CLC_HNE_accel_mps2.csv CI_CLC_HNN_accel_mps2.csv original/CI_station_response.xml original/CI_waveform_counts.mseed; do
            curl -fLsS --retry 3 --output "source/$f" "$root/$f"
          done
          python -m py_compile s05_clc_full_response_waveform_qc.py
          python s05_clc_full_response_waveform_qc.py --self-test
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('source');r=json.loads((p/'source_receipt.json').read_text())
          for rel in ('original/CI_station_response.xml','original/CI_waveform_counts.mseed','CI_CLC_HNE_accel_mps2.csv','CI_CLC_HNN_accel_mps2.csv'):
              got=hashlib.sha256((p/rel).read_bytes()).hexdigest()
              assert got==r['files_SHA256'][rel],rel
              print('ORIGINAL_BYTE_SHA256_PASS',rel,got)
          PY
      - name: Native real-waveform full response removal and PSA
        run: |
          set -euo pipefail
          python s05_clc_full_response_waveform_qc.py --sensitivity --snr --noise-qc --source-dir source --output "$RUNNER_TEMP/S05_CLC_FULL_RESPONSE_REMOVAL_RECEIPT_20261105.json"
          sha256sum "$RUNNER_TEMP/S05_CLC_FULL_RESPONSE_REMOVAL_RECEIPT_20261105.json" s05_clc_full_response_waveform_qc.py
      - name: Preserve numeric receipt and logs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-clc-2019-full-response-original-qc-not-site-pass
          path: ${{ runner.temp }}/S05_CLC_FULL_RESPONSE_REMOVAL_RECEIPT_20261105.json
          if-no-files-found: warn
          retention-days: 90
      - name: Persist original-data numeric QC receipt in PR 42 branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          f=pathlib.Path(os.environ['RUNNER_TEMP'])/'S05_CLC_FULL_RESPONSE_REMOVAL_RECEIPT_20261105.json'
          data=f.read_bytes()
          repo=os.environ['GH_REPO'];branch='research/t080-seismic-integration-gates-20261022'
          path='research/wind-tower/experiments/T079/real-records/S05_CLC_FULL_RESPONSE_REMOVAL_RECEIPT_20261105.json'
          old=subprocess.run(['gh','api','--method','GET',f'repos/{repo}/contents/{path}','-f',f'ref={branch}'],capture_output=True,text=True)
          if old.returncode:raise RuntimeError('BASELINE_RECEIPT_MISSING '+old.stderr)
          meta=json.loads(old.stdout)
          existing=json.loads(base64.b64decode(meta['content']))
          computed=json.loads(data)
          if existing['SOURCE']!=computed['SOURCE'] or existing['parameters']!=computed['parameters']:
              raise RuntimeError('ORIGINAL_SOURCE_OR_PARAMETERS_CHANGED')
          if len(existing['channels'])!=2 or len(computed['channels'])!=2:
              raise RuntimeError('CHANNEL_COUNT_CHANGED')
          for old_channel,new_channel in zip(existing['channels'],computed['channels']):
              if old_channel['channel']!=new_channel['channel']:
                  raise RuntimeError('CHANNEL_IDENTITY_CHANGED')
              for a,b in zip(old_channel['spectra'],new_channel['spectra']):
                  if a['period_s']!=b['period_s'] or abs(a['full_response_psa_m_s2']-b['full_response_psa_m_s2'])>1e-9*max(1,abs(a['full_response_psa_m_s2'])):
                      raise RuntimeError('BASELINE_SPECTRUM_CHANGED')
          existing['parameter_sensitivity']=computed['parameter_sensitivity']
          if computed.get('low_frequency_snr',{}).get('status')!='S05_REAL_PREORIGIN_CHRONOLOGY_AND_LOW_FREQ_POWER_QC_NOT_BAND_PASS':
              raise RuntimeError('LOW_FREQUENCY_SNR_MISSING')
          existing['low_frequency_snr']=computed['low_frequency_snr']
          if computed.get('noise_window_qc',{}).get('status')!='S05_PRE_EVENT_VARIABILITY_CANDIDATE_TRIGGER_NOT_SITE_PASS':
              raise RuntimeError('NOISE_WINDOW_QC_MISSING')
          existing['noise_window_qc']=computed['noise_window_qc']
          data=(json.dumps(existing,ensure_ascii=False,indent=2)+'\n').encode()
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+bytes([0])+data).hexdigest()
          if meta['sha']==blob:
              print('EXISTING_IDENTICAL_SENSITIVITY_RECEIPT',path);raise SystemExit(0)
          payload={'message':'research(S05): persist original-waveform response sensitivity and pre-origin 0.1-0.25Hz QC',
                   'branch':branch,'sha':meta['sha'],'content':base64.b64encode(data).decode()}
          up=subprocess.run(['gh','api','--method','PUT',f'repos/{repo}/contents/{path}','--input','-'],input=json.dumps(payload),capture_output=True,text=True)
          if up.returncode:raise RuntimeError(up.stderr)
          remote=subprocess.run(['gh','api','--method','GET',f'repos/{repo}/contents/{path}','-f',f'ref={branch}'],capture_output=True,text=True,check=True)
          assert json.loads(remote.stdout)['sha']==blob,'REMOTE_BLOB_MISMATCH'
          print('NATIVE_SENSITIVITY_RECEIPT_COMMIT',json.loads(up.stdout)['commit']['sha'],hashlib.sha256(data).hexdigest())
          PY
