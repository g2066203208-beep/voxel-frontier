name: Materialize Terrain R10 Evidence Geometry

on:
  push:
    branches: [test/terrain-r10-geomorph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R10 source patch
        run: python3 .github/scripts/materialize_terrain_r10.py
      - name: Verify R10 markers
        run: |
          grep -q 'R10 tableland profile' native/src/world/PlanetSurface.cpp
          grep -q 'R10 evidence geometry' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized R10 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp
          git commit -m 'terrain: materialize R10 evidence geometry [skip ci]'
          git push origin HEAD:test/terrain-r10-geomorph
