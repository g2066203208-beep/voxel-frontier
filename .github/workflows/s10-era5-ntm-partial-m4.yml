name: S10 real ERA5 NTM three-bin partial load-m4 + source references (NO SOLVER)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - 'research/wind-tower/experiments/T077/recovery/s10_cycle_sign_m4_partition.cjs'
      - 'research/wind-tower/experiments/T077/recovery/S10_3CONTROL_CYCLE_SIGN_M4_PARTITION_20261104.json'
      - 'research/wind-tower/experiments/T062/s10_era5_ntm_partial_m4_and_seed_subset.py'
      - 'research/wind-tower/experiments/T062/s10_channel_aware_m4_priority.cjs'
      - 'research/wind-tower/experiments/T062/s10_low_wind_30slot_source_readiness.cjs'
      - 'research/wind-tower/experiments/T062/S10_LOW_WIND_30SLOT_SOURCE_READINESS_20261104.csv'
      - 'research/wind-tower/experiments/T062/S10_LOW_WIND_30SLOT_SOURCE_READINESS_20261104.json'
      - 'research/wind-tower/experiments/T062/S10_CHANNEL_AWARE_M4_INTERPOLATION_PRIORITY_20261104.json'
      - 'research/wind-tower/experiments/T062/s06_ntm_seed_dispersion_and_bts_gate.js'
      - 'research/wind-tower/experiments/T062/S06_18NTM_ALL_CHANNEL_SEED_CONVERGENCE_20261105.csv'
      - '.github/workflows/s10-era5-ntm-partial-m4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  era5-ntm-covered-bin-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/T062
            research/wind-tower/archive/local-assets-20261004/file-manifest.json
            research/wind-tower/experiments/T077/recovery/s10_cycle_sign_m4_partition.cjs
            research/wind-tower/experiments/T077/recovery/S10_3CONTROL_CYCLE_SIGN_M4_PARTITION_20261104.json
            research/wind-tower/experiments/T077/recovery/S10_3CONTROL_REAL_GROSS_CYCLES_20261030.csv
          sparse-checkout-cone-mode: false
      - name: Reproduce all 360 historical 18NTM 60-channel m4/m10 seed convergence rows (NO SOLVER)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          node --check "$root/s06_ntm_seed_dispersion_and_bts_gate.js"
          node "$root/s06_ntm_seed_dispersion_and_bts_gate.js" --self-test
          node "$root/s06_ntm_seed_dispersion_and_bts_gate.js" \
            --source "$root/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv" \
            --manifest research/wind-tower/archive/local-assets-20261004/file-manifest.json \
            --out "$RUNNER_TEMP/low_gage.csv" \
            --source-receipt "$root/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json" \
            --all-channel-summary "$RUNNER_TEMP/all_channel.csv"
          cmp "$RUNNER_TEMP/all_channel.csv" "$root/S06_18NTM_ALL_CHANNEL_SEED_CONVERGENCE_20261105.csv"
          python3 - "$RUNNER_TEMP/all_channel.csv" "$root/S10_18NTM_6SEED_LOAD_DEL_CONVERGENCE_SUMMARY_20261031.csv" <<'PY'
          import csv,sys
          new=list(csv.DictReader(open(sys.argv[1],newline='')))
          old=list(csv.DictReader(open(sys.argv[2],newline='')))
          assert len(new)==360 and len(old)==30
          index={(r['wind_case'],r['channel']):r for r in new if r['m']=='4'}
          for r in old:
              v=index[(r['wind_case'],r['channel'])]
              assert abs(float(v['arithmetic_mean_DEL'])-float(r['arithmetic_mean_DEL_m4_kNm']))<1e-6
              assert abs(float(v['six_seed_power_mean_DEL'])-float(r['equal_duration_power_mean_m4_kNm']))<1e-6
          print('REAL_18NTM_360_GROUPS_30_OLD_M4_ORACLES_MATCH_4_NEGATIVE_TESTS_NO_MATERIAL_DAMAGE')
          PY
          sha256sum "$root/s06_ntm_seed_dispersion_and_bts_gate.js" "$RUNNER_TEMP/all_channel.csv" "$root/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json"
      - name: Verify 1574 real nominal cycles material applicability (no solver)
        shell: bash
        run: |
          set -euo pipefail
          p=research/wind-tower/experiments/T077/recovery
          node "$p/s10_cycle_sign_m4_partition.cjs" --self-test
          node "$p/s10_cycle_sign_m4_partition.cjs" --check
          sha256sum "$p/s10_cycle_sign_m4_partition.cjs" "$p/S10_3CONTROL_REAL_GROSS_CYCLES_20261030.csv" "$p/S10_3CONTROL_CYCLE_SIGN_M4_PARTITION_20261104.json"
      - name: Verify source-locked channel-aware wind-bin ranking (no solver)
        shell: bash
        run: |
          set -euo pipefail
          node research/wind-tower/experiments/T062/s10_channel_aware_m4_priority.cjs --check
      - name: Verify 4-8 m/s missing-source 30-slot input readiness (no solver)
        shell: bash
        run: |
          set -euo pipefail
          node research/wind-tower/experiments/T062/s10_low_wind_30slot_source_readiness.cjs --check
      - name: Verify 21-year wind-bin source + 18 original NTM source + 126-slot coverage
        shell: bash
        run: |
          set -euo pipefail
          out=research/wind-tower/experiments/T062/partial-annual-load-diagnostic-20261102
          mkdir -p "$out"
          python3 research/wind-tower/experiments/T062/s10_era5_ntm_partial_m4_and_seed_subset.py --output-dir "$out" | tee /tmp/s10-annual-partial-numeric.log
          python3 - <<'PY'
          import json,math,csv
          from pathlib import Path
          d=Path('research/wind-tower/experiments/T062/partial-annual-load-diagnostic-20261102')
          j=json.loads((d/'S10_REAL_18NTM_3BIN_PARTIAL_M4_RECEIPT_20261102.json').read_text())
          rows=list(csv.DictReader((d/'S10_REAL_18NTM_3BIN_PARTIAL_M4_BY_CHANNEL_20261102.csv').open()))
          assert len(rows)==6 and j['SOURCE_OBSERVATIONS']['era5_hours']==184080
          assert j['SOURCE_OBSERVATIONS']['formal_verified_DLC12_slots']==0
          assert j['SOURCE_OBSERVATIONS']['uncovered_operating_hours']==99736
          assert all(r['formal_DLC12_status']=='NOT_VALIDATED' and r['material_damage_status']=='NOT_COMPUTABLE' for r in rows)
          assert set(j['RESULTS'])=={'TwrBsMxt','TwrBsMyt'}
          assert all(v['3of6_joint_subset_combinations']==8000 for v in j['RESULTS'].values())
          assert all(v['known_bin_partial_all_hour_weighted_m4_3of6_min_MNm4']<=
                     v['known_bin_partial_all_hour_weighted_m4_MNm4']<=
                     v['known_bin_partial_all_hour_weighted_m4_3of6_max_MNm4']
                     for v in j['RESULTS'].values())
          slopes=j['LOAD_M4_SPEED_EXPONENT_DIAGNOSTIC']
          assert set(slopes)=={'TwrBsMxt','TwrBsMyt'}
          for channel in slopes:
            assert len(slopes[channel]['intervals'])==2
            for item in slopes[channel]['intervals']:
              assert item['subset_pairs']==400 and item['not_material_damage'] is True
              assert item['3of6_subset_p_min']<=item['effective_p_for_load_DEL_fourth_moment']<=item['3of6_subset_p_max']
          assert 6<slopes['TwrBsMxt']['intervals'][1]['effective_p_for_load_DEL_fourth_moment']<9
          assert 0<slopes['TwrBsMyt']['intervals'][1]['effective_p_for_load_DEL_fourth_moment']<1
          assert slopes['TwrBsMyt']['intervals'][1]['3of6_subset_p_min']<0
          print('S10_REAL_18NTM_NONUNIVERSAL_U_POWER_LOAD_DEL_PASS_NOT_MATERIAL_DAMAGE')
          assert j['PHYSICAL_PASS'] is False and j['MATERIAL_FATIGUE_PASS'] is False
          print('S10_18_ACTUAL_NTM_3BIN_SOURCE_LOCKED_M4_PARTIAL_3OF6_ENVELOPE_PASS_NOT_LIFE')
          PY
          sha256sum "$out/"*
      - uses: actions/upload-artifact@v4
        with:
          name: S10_18NTM_ERA5_COVERED_ONLY_LOAD4_MOMENT
          path: research/wind-tower/experiments/T062/partial-annual-load-diagnostic-20261102/
          retention-days: 90
      - name: Preserve exact outputs to existing Draft PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T062/partial-annual-load-diagnostic-20261102/
          if ! git diff --cached --quiet; then
            git commit -m "data(S10): three covered ERA5-NMT bin m4 intensity and 8000 seed subsets"
            for n in 1 2 3; do
              git pull --rebase origin research/t080-seismic-integration-gates-20261022
              if git push origin HEAD:refs/heads/research/t080-seismic-integration-gates-20261022; then break; fi
              if [ "$n" = 3 ]; then exit 1; fi
            done
          fi
