name: Materialize R18 Compile Fix

on:
  push:
    branches: [test/terrain-r18-highres-process-bake]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fix duplicate declaration
        run: python3 .github/scripts/fix_r18_plateau_decl.py
      - name: Verify
        run: |
          test "$(grep -c 'std::vector<float> plateauDrive(kCount, 0.0F);' native/include/vf/world/PlanetGeomorph.hpp)" -eq 1
          git diff --check
      - name: Commit source and remove one-shot files
        run: |
          rm .github/scripts/fix_r18_plateau_decl.py .github/workflows/fix-r18-compile.yml
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remove duplicate R18 plateau process declaration [skip ci]'
          git push origin HEAD:test/terrain-r18-highres-process-bake
