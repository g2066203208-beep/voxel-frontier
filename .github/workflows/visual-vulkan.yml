name: Real Vulkan Visual Regression

on:
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/visual-vulkan.yml'
  workflow_dispatch:

concurrency:
  group: visual-vulkan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v6

      - name: Install headless Vulkan and X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Linux Vulkan runtime
        run: cmake -S native -B build/visual -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=OFF

      - name: Build Linux Vulkan runtime
        run: cmake --build build/visual --parallel

      - name: Verify Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Run game and capture real framebuffer
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2

          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          timeout 45s "$APP" >runtime.log 2>&1 &
          RUN_PID=$!

          # Let async terrain/ecology and the Vulkan pipelines settle before the baseline frame.
          sleep 18
          import -display :99 -window root capture-ground.png
          identify capture-ground.png | tee capture-info.txt
          COLORS="$(convert capture-ground.png -format '%k' info:)"
          echo "Ground unique colors: $COLORS" | tee -a capture-info.txt
          test "$COLORS" -gt 64

          # Exercise actual keyboard-driven ground traversal before a second frame. This is not a
          # replacement for collision unit tests; it gives a persistent visual regression view after
          # CharacterController has moved across the streamed procedural surface.
          WINDOW="$(xdotool search --name 'Voxel Frontier' 2>/dev/null | head -n 1 || true)"
          if [ -n "$WINDOW" ]; then
            xdotool keydown --window "$WINDOW" w || true
            sleep 2
            xdotool keyup --window "$WINDOW" w || true
            sleep 1
          fi
          import -display :99 -window root capture-traversal.png

          # Optional aerial evidence: double-tap Space (the game's real flight-mode input), ascend,
          # and pitch the camera down. Input injection is best-effort because Lavapipe/Xvfb drivers
          # differ, but the capture itself always remains the real Vulkan framebuffer.
          if [ -n "$WINDOW" ]; then
            xdotool key --window "$WINDOW" space || true
            sleep 0.14
            xdotool key --window "$WINDOW" space || true
            sleep 0.6
            xdotool keydown --window "$WINDOW" space || true
            sleep 2
            xdotool keyup --window "$WINDOW" space || true
            xdotool mousemove_relative -- 0 260 || true
            sleep 1
          fi
          import -display :99 -window root capture-aerial.png
          identify capture-traversal.png capture-aerial.png | tee -a capture-info.txt

          kill "$RUN_PID" 2>/dev/null || true
          sleep 1
          cat runtime.log || true

      - name: Upload visual evidence
        uses: actions/upload-artifact@v5
        with:
          name: real-vulkan-frame-${{ github.sha }}
          path: |
            capture-ground.png
            capture-traversal.png
            capture-aerial.png
            capture-info.txt
            runtime.log
            vulkan-summary.txt
            xvfb.log
          if-no-files-found: error
          retention-days: 30
