name: T071 rerun max-bending case at 31 segment gages

on:
  push:
    paths:
      - '.github/workflows/t071-rerun-s06-31seg.yml'

permissions:
  contents: write

jobs:
  rerun:
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: A
            nodes: "13,39,65,91,117,142,168,194,220"
            segments: "01,02,03,04,05,06,07,08,09"
          - batch: B
            nodes: "246,271,297,323,349,375,400,426,452"
            segments: "10,11,12,13,14,15,16,17,18"
          - batch: C
            nodes: "478,504,529,555,581,607,633,658,684"
            segments: "19,20,21,22,23,24,25,26,27"
          - batch: D
            nodes: "710,736,762,784,810,850,900,1000,1120"
            segments: "28,29,30,31,EX1,EX2,EX3,EX4,EX5"
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install output reader
        shell: pwsh
        run: python -m pip install "git+https://github.com/OpenFAST/openfast_toolbox.git" pandas

      - name: Restore exact formal 158m case and change gages only
        shell: pwsh
        env:
          BATCH: ${{ matrix.batch }}
          NODES: ${{ matrix.nodes }}
          SEGMENTS: ${{ matrix.segments }}
        run: |
          $ErrorActionPreference="Stop"
          Expand-Archive "research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip" -DestinationPath static
          Expand-Archive "research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip" -DestinationPath supp

          New-Item -ItemType Directory -Force -Path runroot | Out-Null
          Copy-Item -Recurse "static/CASES/*" "runroot/" -Force

          $base="runroot/U09p343881_ETM_S01"
          $case="runroot/U09p343881_ETM_S06"

          Copy-Item "$base/DTU_10MW_RWT.fst" "$case/DTU_10MW_RWT.fst" -Force
          Copy-Item "$base/DTU_10MW_RWT_ElastoDyn.dat" "$case/DTU_10MW_RWT_ElastoDyn.dat" -Force
          Copy-Item "$base/C02R3R2_158M_Tower.dat" "$case/C02R3R2_158M_Tower.dat" -Force
          Copy-Item "$base/C02R3R2_158M_Tower_ZERO_DAMPING_20260831.dat" "$case/C02R3R2_158M_Tower_ZERO_DAMPING_20260831.dat" -Force
          Copy-Item -Recurse "$base/Control" "$case/Control" -Force

          Copy-Item "supp/CASES/U09p343881_ETM_S01/Control/DTU_10MW_RWT_DISCON.IN" "$case/Control/DTU_10MW_RWT_DISCON.IN" -Force
          Copy-Item "research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll" "$case/Control/libdiscon.dll" -Force
          Copy-Item "research/wind-tower/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts" "$case/U09p343881_ETM_S06.bts" -Force

          @'
          from pathlib import Path
          import os,re,json,hashlib

          case=Path("runroot/U09p343881_ETM_S06")

          # Preserve exact S06 InflowWind physics; only convert historical absolute BTS path to local filename.
          p=case/"DTU_10MW_InflowWind.dat"
          s=p.read_text(encoding="utf-8",errors="replace")
          s2,n=re.subn(r'^".*U09p343881_ETM_S06\.bts"\s+FileName_BTS',
                       '"U09p343881_ETM_S06.bts" FileName_BTS',
                       s,flags=re.M)
          if n!=1:
              raise SystemExit(f"BTS path patch failed n={n}")
          p.write_text(s2,encoding="utf-8")

          # Change only tower output-gage node indices.
          p=case/"DTU_10MW_RWT_ElastoDyn.dat"
          s=p.read_text(encoding="utf-8")
          nodes=os.environ["NODES"]
          s,n=re.subn(
              r'(?m)^\s*1,3,5,7,9,13,15,17,20\s+TwrGagNd\b.*$',
              lambda m: nodes+"             TwrGagNd      - T071 distributed reinforcement gages",
              s
          )
          if n!=1:
              raise SystemExit(f"TwrGagNd patch failed n={n}")
          p.write_text(s,encoding="utf-8")

          info={
              "case":"U09p343881_ETM_S06",
              "batch":os.environ["BATCH"],
              "nodes":[int(x) for x in nodes.split(",")],
              "segments":os.environ["SEGMENTS"].split(","),
              "formal_model":"158m",
              "openfast_runtime":"v3.5.3",
              "base_fst_sha256":"5307e04d27721095ce6cbb6c125b8be1b4be71790af6c6258e3187343f5db605",
              "base_elastodyn_sha256":"6d2d871374e25edcfaeb50627831052e8df57bd27cccc5089cae256800492d65",
              "base_tower_sha256":"f738d35fc9c8b8d8745f2ed9490c92578b056cfe37201bbfa0bfdb24906d2983",
              "libdiscon_sha256":hashlib.sha256((case/"Control/libdiscon.dll").read_bytes()).hexdigest(),
              "discon_sha256":hashlib.sha256((case/"Control/DTU_10MW_RWT_DISCON.IN").read_bytes()).hexdigest(),
              "bts_sha256":hashlib.sha256((case/"U09p343881_ETM_S06.bts").read_bytes()).hexdigest(),
          }
          if info["libdiscon_sha256"]!="7aebb0d2166c0cc095d11c2b7bc13da136547c557b0f331dcdce84fe181802aa":
              raise SystemExit("libdiscon identity mismatch")
          if info["discon_sha256"]!="8f5d7546420ee34838e66b63e4b26d64460be5d5492f99c60b6d1ef977ffc61a":
              raise SystemExit("DISCON identity mismatch")
          Path("run_meta.json").write_text(json.dumps(info,indent=2)+"\n")
          print(json.dumps(info,indent=2))
          '@ | Set-Content -Encoding utf8 prep.py
          python prep.py

      - name: Run OpenFAST v3.5.3
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $exe=Resolve-Path "research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe"
          Push-Location "runroot/U09p343881_ETM_S06"
          & $exe "DTU_10MW_RWT.fst" *>&1 | Tee-Object -FilePath "T071_${{ matrix.batch }}.log"
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){ throw "OpenFAST failed with exit code $code" }

      - name: Extract 100-700 s segment histories
        shell: pwsh
        env:
          BATCH: ${{ matrix.batch }}
          SEGMENTS: ${{ matrix.segments }}
        run: |
          @'
          from pathlib import Path
          import os
          import numpy as np
          import pandas as pd
          from openfast_toolbox.io.fast_output_file import FASTOutputFile

          case="U09p343881_ETM_S06"
          batch=os.environ["BATCH"]
          segs=os.environ["SEGMENTS"].split(",")

          f=Path("runroot")/case/"DTU_10MW_RWT.outb"
          df=FASTOutputFile(str(f)).toDataFrame()
          tcol=next(c for c in df.columns if c.startswith("Time"))
          w=df[(df[tcol]>=100.0)&(df[tcol]<=700.0)].copy()

          frames=[]
          for gi,seg in enumerate(segs,1):
              if seg.startswith("EX"):
                  continue
              def getcol(suffix):
                  hits=[c for c in w.columns if c.startswith(f"TwHt{gi}{suffix}")]
                  if len(hits)!=1:
                      raise KeyError((gi,suffix,hits))
                  return hits[0]

              z=float(w[getcol("TPzi")].iloc[0])
              c={k:getcol(k) for k in ["FLxt","FLyt","FLzt","MLxt","MLyt","MLzt"]}
              q=pd.DataFrame({
                  "case":case,
                  "batch":batch,
                  "segment":f"CSEG_{seg}",
                  "gage_index":gi,
                  "gage_z_m":z,
                  "time_s":w[tcol].to_numpy(float),
                  "Fx_kN":w[c["FLxt"]].to_numpy(float),
                  "Fy_kN":w[c["FLyt"]].to_numpy(float),
                  "Fz_kN":w[c["FLzt"]].to_numpy(float),
                  "Mx_kNm":w[c["MLxt"]].to_numpy(float),
                  "My_kNm":w[c["MLyt"]].to_numpy(float),
                  "Mz_kNm":w[c["MLzt"]].to_numpy(float),
              })
              q["V_kN"]=np.hypot(q.Fx_kN,q.Fy_kN)
              q["M_kNm"]=np.hypot(q.Mx_kNm,q.My_kNm)
              q["T_abs_kNm"]=np.abs(q.Mz_kNm)
              q["N_comp_kN"]=np.maximum(0.0,-q.Fz_kN)
              frames.append(q)

          out=pd.concat(frames,ignore_index=True)
          od=Path("extract")
          od.mkdir(exist_ok=True)
          out.to_csv(od/f"{case}_batch{batch}_31seg.csv.gz",index=False,compression="gzip")

          summary=out.groupby("segment").agg(
              gage_z_m=("gage_z_m","first"),
              V_max_kN=("V_kN","max"),
              M_max_kNm=("M_kNm","max"),
              T_max_kNm=("T_abs_kNm","max"),
              N_comp_max_kN=("N_comp_kN","max")
          ).reset_index()
          summary.to_csv(od/f"{case}_batch{batch}_summary.csv",index=False)
          print(summary.to_string(index=False))
          '@ | Set-Content -Encoding utf8 extract.py
          python extract.py

      - uses: actions/upload-artifact@v4
        with:
          name: T071-U09p343881_ETM_S06-${{ matrix.batch }}
          path: extract/*
          retention-days: 30

  aggregate:
    needs: rerun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aggregate dependencies
        run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: T071-U09p343881_ETM_S06-*
          path: incoming
          merge-multiple: true
      - name: Merge and verify all 31 concrete segments
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          fs=sorted(Path("incoming").glob("*_summary.csv"))
          x=pd.concat([pd.read_csv(f) for f in fs],ignore_index=True)
          x=x.sort_values("segment")
          if len(x)!=31 or x.segment.nunique()!=31:
              raise SystemExit(f"expected 31 unique segments, got rows={len(x)} unique={x.segment.nunique()}")

          out=Path("research/wind-tower/experiments/T071")
          out.mkdir(parents=True,exist_ok=True)
          x.to_csv(out/"T071_U09p343881_ETM_S06_31SEG_GAGE_SUMMARY.csv",index=False)
          print(x.to_string(index=False))
          PY
      - name: Commit compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T071
          git commit -m "T071 extract real 158m 31-segment loads for max-bending case"
          git pull --rebase origin main
          git push
