name: Materialize Terrain R4 Relief V5

on:
  push:
    branches: [feature/terrain-r4-geomorph-bake]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R4 relief source patch
        run: python3 .github/scripts/r4_relief_patch.py
      - name: Verify generated source
        run: |
          git diff --check
          grep -q 'R4 relief V5' native/src/world/PlanetSurface.cpp
          grep -q 'sampleLocalRelief' native/src/app/Main.cpp
      - name: Remove one-shot materializer
        run: |
          rm -f .github/workflows/materialize-terrain-r4-relief-v5.yml
          rm -f .github/scripts/r4_relief_patch.py
      - name: Commit generated R4 source
        run: |
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'terrain: make R4 landforms relief-readable'
          git push origin HEAD:feature/terrain-r4-geomorph-bake
