name: S10 three-section fixed reference azimuth source join (NO SOLVER)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - '.github/workflows/s10-three-section-fixed-azimuth-qc.yml'
      - 'research/wind-tower/experiments/T077/recovery/s10_three_section_fixed_azimuth_crosswalk.cjs'
      - 'research/wind-tower/experiments/T077/recovery/S10_3CONTROL_FIXED_AZIMUTH_SOURCE_CROSSWALK_20261102.csv'
      - 'research/wind-tower/experiments/T077/recovery/s10_cycle_sign_m4_partition.cjs'
      - 'research/wind-tower/experiments/T077/recovery/s10_rainflow_endpoint_boundary_qc.py'
      - 'research/wind-tower/experiments/T077/recovery/S10_3CONTROL_CYCLE_SIGN_M4_PARTITION_20261104.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Selftest and 12-row real-source join
        run: |
          set -euo pipefail
          P=research/wind-tower/experiments/T077/recovery
          node --check "$P/s10_three_section_fixed_azimuth_crosswalk.cjs"
          node "$P/s10_three_section_fixed_azimuth_crosswalk.cjs" --selftest
          node "$P/s10_three_section_fixed_azimuth_crosswalk.cjs" --input-dir "$P" --out "$RUNNER_TEMP/crosswalk.csv"
          cmp "$P/S10_3CONTROL_FIXED_AZIMUTH_SOURCE_CROSSWALK_20261102.csv" "$RUNNER_TEMP/crosswalk.csv"
          sha256sum "$RUNNER_TEMP/crosswalk.csv"
      - name: Wrong-source SHA fail closed
        run: |
          set -euo pipefail
          P=research/wind-tower/experiments/T077/recovery
          mkdir -p "$RUNNER_TEMP/tamper"
          cp "$P/S10_4CASE_31SEG_16AZ_SYNC_GROSS_RAINFLOW_20261030.csv" "$P/S10_4ETM_31SEG_CONTINUOUS_AZIMUTH_ENVELOPE_20261102.csv" "$P/S10_4ETM_31SEG_NATIVE_ELEMENT_SPATIAL_BINDING_QC_20261031.csv" "$RUNNER_TEMP/tamper/"
          printf '\nTAMPER\n' >> "$RUNNER_TEMP/tamper/S10_4ETM_31SEG_CONTINUOUS_AZIMUTH_ENVELOPE_20261102.csv"
          if node "$P/s10_three_section_fixed_azimuth_crosswalk.cjs" --input-dir "$RUNNER_TEMP/tamper" --out "$RUNNER_TEMP/should_not_exist.csv"; then exit 1; fi
          test ! -e "$RUNNER_TEMP/should_not_exist.csv"
          echo S10_TAMPER_REJECT_PASS
      - name: S10 real 1574-cycle residual weighting and concentration (no solver)
        run: |
          set -euo pipefail
          P=research/wind-tower/experiments/T077/recovery
          node --check "$P/s10_cycle_sign_m4_partition.cjs"
          node "$P/s10_cycle_sign_m4_partition.cjs" --self-test
          printf '%s\n' '646065838456b6465e321c4c6fd24966f180f275df99c615000577557219ff83  research/wind-tower/experiments/T077/recovery/S10_3CONTROL_REAL_GROSS_CYCLES_20261030.csv' | sha256sum -c -
          node "$P/s10_cycle_sign_m4_partition.cjs" --check
          mkdir -p "$RUNNER_TEMP/cycle_negative"
          cp "$P/s10_cycle_sign_m4_partition.cjs" "$P/S10_3CONTROL_REAL_GROSS_CYCLES_20261030.csv" "$P/S10_3CONTROL_REAL_CYCLE_MEAN_SUMMARY_20261030.csv" "$P/S10_3CONTROL_CYCLE_SIGN_M4_PARTITION_20261104.json" "$RUNNER_TEMP/cycle_negative/"
          printf '\nTAMPER\n' >> "$RUNNER_TEMP/cycle_negative/S10_3CONTROL_REAL_GROSS_CYCLES_20261030.csv"
          if node "$RUNNER_TEMP/cycle_negative/s10_cycle_sign_m4_partition.cjs" --check >"$RUNNER_TEMP/cycle_negative/negative.log" 2>&1; then
            echo "ERROR: tampered cycle source accepted"; exit 1
          fi
          grep -q 'SOURCE_SHA256' "$RUNNER_TEMP/cycle_negative/negative.log"
          echo S10_REAL_CYCLE_TAMPER_REJECTED_NO_MATERIAL_LIFE
      - name: Real 12001-point open versus assumed-periodic endpoint QC (no solver)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P=research/wind-tower/experiments/T077/recovery
          mkdir -p "$RUNNER_TEMP/etm"
          gh api "repos/${{ github.repository }}/actions/artifacts/11465219800/zip" > "$RUNNER_TEMP/etm/T071-U09-S06-B.zip"
          gh api "repos/${{ github.repository }}/actions/artifacts/11483249910/zip" > "$RUNNER_TEMP/etm/T072-U11-S04-A.zip"
          printf '%s\n' "5acbb25968ce43892157545cded26973623f22b5a137839e5154b293aef167db  $RUNNER_TEMP/etm/T071-U09-S06-B.zip" "c66a8a22693af0ed5c9cb8f68f51c48a24c046ba4e60cacdb1115040dd0007a9  $RUNNER_TEMP/etm/T072-U11-S04-A.zip" | sha256sum -c -
          python "$P/s10_control_cycle_export_compact.py" --self-test
          python "$P/s10_rainflow_endpoint_boundary_qc.py" --zip-dir "$RUNNER_TEMP/etm" --receipt "$RUNNER_TEMP/s10_endpoint.json"
          python - "$RUNNER_TEMP/s10_endpoint.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert len(r["results"])==3 and r["stage_PASS_count"]==0
          assert all(x["assumed_periodic"]["half_rows"]==0 for x in r["results"])
          assert all(x["time_reversed_open_m4_abs_diff"]<1e-7 for x in r["results"])
          print("S10_ENDPOINT_NATIVE_QC_PASS_NOT_MATERIAL_LIFE")
          PY
          sha256sum "$P/s10_rainflow_endpoint_boundary_qc.py" "$RUNNER_TEMP/s10_endpoint.json"
      - name: Preserve native endpoint receipt as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: s10-real-endpoint-qc-native-receipt
          path: ${{ runner.temp }}/s10_endpoint.json
          retention-days: 90
