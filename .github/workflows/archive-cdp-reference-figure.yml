name: Archive verified CDP reference figure
on:
  push:
    paths:
      - '.github/workflows/archive-cdp-reference-figure.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain publisher original and check PNG integrity
        shell: bash
        run: |
          set -euo pipefail
          cd public/thesis-studio/inp-archive/REV22_REVIEW
          mkdir -p original-literature
          url='https://mdpi-res.com/energies/energies-13-00533/article_deploy/html/images/energies-13-00533-g007.png'
          curl --fail --location --retry 2 --max-time 30 --user-agent 'Mozilla/5.0' "$url" -o /tmp/chen-2020-fig7.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageStat
          from pathlib import Path
          import hashlib, json
          p=Path('/tmp/chen-2020-fig7.png')
          with Image.open(p) as im:
              assert im.format=='PNG'
              im.verify()
          with Image.open(p) as im:
              w,h=im.size
              assert w>=500 and 2 < w/h < 4
              assert max(ImageStat.Stat(im.convert('RGB')).stddev)>5
          target=Path('original-literature/chen-2020-fig7.png')
          target.write_bytes(p.read_bytes())
          receipt=dict(doi='10.3390/en13030533',authors='Junling Chen, Yiqing Xu, Jinwei Li',figure=7,license='CC BY 4.0',url='https://mdpi-res.com/energies/energies-13-00533/article_deploy/html/images/energies-13-00533-g007.png',sha256=hashlib.sha256(p.read_bytes()).hexdigest(),width=w,height=h,bytes=p.stat().st_size)
          Path('original-literature/chen-2020-fig7.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Commit verified original bytes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/thesis-studio/inp-archive/REV22_REVIEW/original-literature/chen-2020-fig7.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive Chen 2020 Fig 7 original PNG with source receipt'
          git pull --rebase origin main
          git push origin HEAD:main
