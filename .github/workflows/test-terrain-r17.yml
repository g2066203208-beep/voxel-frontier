name: Terrain R17 Single Authority Real Vulkan Gate

on:
  push:
    branches: [test/terrain-r17-authority-cleanup]
  workflow_dispatch:

concurrency:
  group: terrain-r17-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Verify R17 authority
        run: |
          grep -q 'R17 SINGLE MACRO AUTHORITY' native/src/world/PlanetSurface.cpp
          grep -q 'kErosionSteps = 30' native/include/vf/world/PlanetGeomorph.hpp
          grep -q 'kMfdPower = 6.0' native/include/vf/world/PlanetGeomorph.hpp
          ! grep -q 'R13 connected orogen structure' native/src/world/PlanetSurface.cpp
          ! grep -q 'const double plateauShelf = 2700.0' native/src/world/PlanetSurface.cpp
          git diff --check
      - run: cmake -S native -B build/core -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=OFF -DVF_BUILD_TESTS=ON
      - run: cmake --build build/core --parallel
      - run: ctest --test-dir build/core --verbose --output-on-failure

  real-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Verify R17 authority
        run: |
          grep -q 'R17 SINGLE MACRO AUTHORITY' native/src/world/PlanetSurface.cpp
          grep -q 'R15 mutually exclusive orbital proxy' native/src/app/Main.cpp
          git diff --check
      - name: Install Vulkan headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version
      - name: Build Vulkan runtime
        run: |
          cmake -S native -B build/visual -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=OFF
          cmake --build build/visual --parallel
      - name: Verify Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt
      - name: Capture R17 rendered landforms
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11 DISPLAY=:99
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2
          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          mkdir -p r17-captures
          failures=0
          for mode in mountain river coast highland; do
            start=$(date +%s)
            stdbuf -oL -eL env VF_CAPTURE_LANDFORM="$mode" timeout 180s "$APP" >"r17-captures/runtime-$mode.log" 2>&1 &
            pid=$!
            located=0
            for i in $(seq 1 120); do
              if grep -q 'Capture target elevation' "r17-captures/runtime-$mode.log"; then located=1; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            frame_ready=0
            colors=0
            if [ "$located" -eq 1 ]; then
              for attempt in $(seq 1 20); do
                sleep 3
                import -display :99 -window root "r17-captures/$mode.png"
                colors="$(convert "r17-captures/$mode.png" -format '%k' info:)"
                if [ "$colors" -gt 64 ]; then frame_ready=1; break; fi
                if ! kill -0 "$pid" 2>/dev/null; then break; fi
              done
            fi
            elapsed=$(( $(date +%s) - start ))
            echo "$mode located=$located frame_ready=$frame_ready unique_colors=$colors seconds=$elapsed" | tee -a r17-captures/capture-info.txt
            if [ "$located" -ne 1 ] || [ "$frame_ready" -ne 1 ]; then failures=$((failures+1)); fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            sleep 1
          done
          identify r17-captures/*.png 2>/dev/null | tee -a r17-captures/capture-info.txt || true
          grep -h 'Capture target elevation' r17-captures/runtime-*.log | tee r17-captures/prominence.txt || true
          test "$failures" -eq 0
      - name: Upload R17 evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: terrain-r17-real-vulkan-${{ github.sha }}
          path: |
            r17-captures
            vulkan-summary.txt
            xvfb.log
          if-no-files-found: warn
