name: Build CDP manuscript page comparison
on:
  push:
    paths:
      - '.github/workflows/build-cdp-page-comparison.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact publisher PDF and generate comparison
        run: |
          set -euo pipefail
          dir=public/thesis-studio/inp-archive/REV22_REVIEW
          curl --fail --location --retry 2 --max-time 60 --user-agent 'Mozilla/5.0' 'https://mdpi-res.com/d_attachment/energies/energies-13-00533/article_deploy/energies-13-00533.pdf' -o "$dir/original-literature/chen-2020-original.pdf"
          python -m pip install --quiet pymupdf pillow
          sudo apt-get -qq install -y fonts-noto-cjk || true
          python "$dir/build_cdp_page_comparison.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir/original-literature/chen-2020-original.pdf" "$dir/original-literature/chen-2020-page08.png" "$dir/original-literature/chen-2020-page09.png" "$dir/cdp-manuscript-excerpt.html" "$dir/cdp-manuscript-excerpt.png" "$dir/cdp-page-comparison.png" "$dir/cdp-page-comparison.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Archive Chen PDF pages 8–9 and R20 manuscript page comparison'
          git pull --rebase origin main
          git push origin HEAD:main
