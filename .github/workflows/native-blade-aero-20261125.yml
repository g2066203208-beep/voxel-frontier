name: Native blade aerodynamic output 20261125
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-blade-aero-20261125.yml', 'research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: native-blade-aero-20261125
  cancel-in-progress: true
jobs:
  restore:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125
            public/thesis-studio/wind-figures/blade-aero
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125/native_blade.py --stage restore
      - name: Persist verified original-input evidence in the studio
        run: |
          mkdir -p public/thesis-studio/wind-figures/blade-aero
          cp native-aero/source_receipt.json native-aero/original-inputs.zip public/thesis-studio/wind-figures/blade-aero/
          git config user.name thesis-wind-archive
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse public/thesis-studio/wind-figures/blade-aero
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve SHA-verified original DTU158 aero and control inputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: native-blade-restored-inputs
          path: native-aero/
          retention-days: 30
  pilot:
    needs: restore
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: native-blade-restored-inputs
          path: native-aero
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45422889134
          name: native-full-11.4-NTM-bts
          path: incoming
      - name: Restore official pinned solver and controller binaries
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force bin | Out-Null
          curl.exe -fLsS --retry 3 https://github.com/OpenFAST/openfast/releases/download/v3.5.3/openfast_x64.exe -o bin/openfast_x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Official OpenFAST executable download failed' }
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/NatLabRockies/ROSCO/releases/tags/v2.6.0' -ErrorAction SilentlyContinue
          $asset = $release.assets | Where-Object { $_.name -match '^(lib)?discon.*\.dll$' -and $_.name -notmatch '32' } | Select-Object -First 1
          if ($asset) {
            curl.exe -fLsS --retry 3 $asset.browser_download_url -o bin/libdiscon.dll
            if ($LASTEXITCODE -ne 0) { throw 'ROSCO release binary download failed' }
          } else {
            & "$env:CONDA\Scripts\conda.exe" create --yes --prefix "$pwd\rosco-env" --channel conda-forge --override-channels rosco=2.6.0
            if ($LASTEXITCODE -ne 0) { throw 'Exact ROSCO 2.6.0 package unavailable; do not substitute unverified version' }
            $dll = Get-ChildItem rosco-env -Recurse -Filter libdiscon.dll | Select-Object -First 1
            if (-not $dll) { throw 'ROSCO DLL not found' }
            Copy-Item $dll.FullName bin/libdiscon.dll
            Get-ChildItem rosco-env\Library\bin -Filter *.dll | Copy-Item -Destination bin -Force
            "$pwd\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          Get-FileHash bin/*.exe,bin/*.dll -Algorithm SHA256 | Format-List
      - name: Native 10 s pilot with all three blade nodal outputs
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          python -m pip install numpy==1.26.4 matplotlib==3.9.2
          $p = 'research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125/native_blade.py'
          $reader = 'research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125/outb_reader.py'
          curl.exe -fLsS --retry 3 https://raw.githubusercontent.com/g2066203208-beep/voxel-frontier/5ce9b969cbbbf6a4e921d432eb43b596696458be/research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py -o $reader
          if ($LASTEXITCODE -ne 0) { throw 'Pinned reader unavailable' }
          python $p --stage run --type NTM --duration 10 --exe bin/openfast_x64.exe --dll bin/libdiscon.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native pilot failed' }
          python $p --stage post --type NTM --duration 10
          if ($LASTEXITCODE -ne 0) { throw 'Output audit failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-blade-pilot
          path: |
            native-aero/*.json
            native-aero/*.log
            native-aero/*.csv
            native-aero/*.npz
            native-aero/*.png
            native-aero/*.svg
            native-aero/*.pdf
            native-aero/case/*.outb
            native-aero/case/*.sum
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: native-blade-verified-binaries
          path: bin/
          retention-days: 14
  full:
    needs: pilot
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        turbulence: [NTM, 1ETM]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: native-blade-restored-inputs
          path: native-aero
      - uses: actions/download-artifact@v4
        with:
          name: native-blade-verified-binaries
          path: bin
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45422889134
          name: native-full-11.4-${{ matrix.turbulence }}-bts
          path: incoming
      - name: Run 700 s new native controlled wind case
        run: |
          python -m pip install numpy==1.26.4 matplotlib==3.9.2
          $p = 'research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125/native_blade.py'
          $reader = 'research/wind-tower/experiments/BLADE_AERO_NATIVE_20261125/outb_reader.py'
          curl.exe -fLsS --retry 3 https://raw.githubusercontent.com/g2066203208-beep/voxel-frontier/5ce9b969cbbbf6a4e921d432eb43b596696458be/research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py -o $reader
          if ($LASTEXITCODE -ne 0) { throw 'Pinned reader unavailable' }
          python $p --stage run --type "${{ matrix.turbulence }}" --duration 700 --exe bin/openfast_x64.exe --dll bin/libdiscon.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native full case failed' }
          python $p --stage post --type "${{ matrix.turbulence }}" --duration 700
          if ($LASTEXITCODE -ne 0) { throw 'Output audit failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-blade-full-11m4-${{ matrix.turbulence }}
          path: |
            native-aero/*.json
            native-aero/*.log
            native-aero/*.csv
            native-aero/*.npz
            native-aero/*.png
            native-aero/*.svg
            native-aero/*.pdf
            native-aero/case/*.outb
            native-aero/case/*.sum
          retention-days: 30
