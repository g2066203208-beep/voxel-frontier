name: T071 reproduce one formal 158m case

on:
  push:
    paths:
      - '.github/workflows/t071-reproduce-one-formal-case.yml'

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S01.bts
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
            research/wind-tower/experiments/T071
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OpenFAST output reader
        shell: pwsh
        run: python -m pip install "git+https://github.com/OpenFAST/openfast_toolbox.git"

      - name: Restore exact case and patch paths only
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          New-Item -ItemType Directory -Force -Path work | Out-Null
          Expand-Archive -Path "research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip" -DestinationPath work/static
          Expand-Archive -Path "research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip" -DestinationPath work/supp
          Copy-Item -Recurse -Force "work/static/CASES" "work/runroot/"
          $case = Resolve-Path "work/runroot/U09p343881_ETM_S01"
          Copy-Item -Force "work/supp/CASES/U09p343881_ETM_S01/Control/DTU_10MW_RWT_DISCON.IN" "$case/Control/DTU_10MW_RWT_DISCON.IN"
          Copy-Item -Force "research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll" "$case/Control/libdiscon.dll"
          Copy-Item -Force "research/wind-tower/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S01.bts" "$case/U09p343881_ETM_S01.bts"

          @'
          from pathlib import Path
          import re, hashlib, json
          case=Path(r"work/runroot/U09p343881_ETM_S01")
          inflow=case/"DTU_10MW_InflowWind.dat"
          s=inflow.read_text(encoding="utf-8",errors="replace")
          s2=re.sub(r'^".*U09p343881_ETM_S01\.bts"\s+FileName_BTS',
                    '"U09p343881_ETM_S01.bts" FileName_BTS',
                    s,flags=re.M)
          if s==s2:
              raise SystemExit("BTS path replacement failed")
          inflow.write_text(s2,encoding="utf-8")

          expected={
            "DTU_10MW_RWT.fst":"5307e04d27721095ce6cbb6c125b8be1b4be71790af6c6258e3187343f5db605",
            "DTU_10MW_RWT_ElastoDyn.dat":"6d2d871374e25edcfaeb50627831052e8df57bd27cccc5089cae256800492d65",
            "C02R3R2_158M_Tower.dat":"f738d35fc9c8b8d8745f2ed9490c92578b056cfe37201bbfa0bfdb24906d2983",
            "C02R3R2_158M_Tower_ZERO_DAMPING_20260831.dat":"6b45e4018657bfd60aa0d0259c5a0a112a2d4c1b404f0085ba2ee21abeccadd6",
            "Control/DTU_10MW_RWT_ServoDyn.dat":"103e7bd71209a095b833ca4ba62627ae7724870615112fdccfbff502076c966e",
            "Rotor/DTU_10MW_RWT_AeroDyn15.dat":"7ebaa0bdf25076041a98ee25ae0577f2d02be61569092965e47be5f875bbcc6d"
          }
          for rel,sha in expected.items():
              got=hashlib.sha256((case/rel).read_bytes()).hexdigest()
              if got!=sha: raise SystemExit(f"SHA mismatch {rel}: {got}")
          info={
            "openfast_sha256":hashlib.sha256(Path(r"research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe").read_bytes()).hexdigest(),
            "libdiscon_sha256":hashlib.sha256((case/"Control/libdiscon.dll").read_bytes()).hexdigest(),
            "discon_sha256":hashlib.sha256((case/"Control/DTU_10MW_RWT_DISCON.IN").read_bytes()).hexdigest(),
            "bts_sha256":hashlib.sha256((case/"U09p343881_ETM_S01.bts").read_bytes()).hexdigest()
          }
          print(json.dumps(info,indent=2))
          Path("work/RUNTIME_HASHES.json").write_text(json.dumps(info,indent=2)+"\n")
          '@ | Set-Content -Encoding utf8 work\prep.py
          python work\prep.py

      - name: Run OpenFAST v3.5.3
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $exe = Resolve-Path "research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe"
          Push-Location "work/runroot/U09p343881_ETM_S01"
          & $exe "DTU_10MW_RWT.fst" *>&1 | Tee-Object -FilePath "reproduce_stdout.log"
          $code=$LASTEXITCODE
          Pop-Location
          if($code -ne 0){ throw "OpenFAST exit code $code" }

      - name: Compare reproduced OUTB to archived original
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json, shutil
          import numpy as np
          from openfast_toolbox.io.fast_output_file import FASTOutputFile

          orig=next(Path("work/supp/CASES/U09p343881_ETM_S01").glob("*.outb"))
          new=Path("work/runroot/U09p343881_ETM_S01/DTU_10MW_RWT.outb")
          if not new.exists(): raise SystemExit("new OUTB missing")
          a=FASTOutputFile(str(orig)).toDataFrame()
          b=FASTOutputFile(str(new)).toDataFrame()
          chans=["Time_[s]","TwrBsFxt_[kN]","TwrBsFyt_[kN]","TwrBsFzt_[kN]",
                 "TwrBsMxt_[kN-m]","TwrBsMyt_[kN-m]","TwrBsMzt_[kN-m]",
                 "RotSpeed_[rpm]","GenPwr_[kW]"]
          report={}
          for c in chans:
              if c not in a or c not in b:
                  report[c]={"missing":True}; continue
              x=np.asarray(a[c],float); y=np.asarray(b[c],float)
              n=min(len(x),len(y)); x=x[:n]; y=y[:n]
              d=np.abs(x-y)
              scale=max(float(np.max(np.abs(x))),1e-12)
              report[c]={
                  "n":int(n),
                  "max_abs":float(d.max()),
                  "rmse":float(np.sqrt(np.mean((x-y)**2))),
                  "max_rel_to_orig_peak":float(d.max()/scale)
              }
          print(json.dumps(report,indent=2))
          out=Path("research/wind-tower/experiments/T071")
          out.mkdir(parents=True,exist_ok=True)
          shutil.copy("work/RUNTIME_HASHES.json",out/"T071_RUNTIME_HASHES.json")
          (out/"T071_REPRODUCE_U09p343881_ETM_S01.json").write_text(json.dumps(report,indent=2)+"\n")
          (out/"README.md").write_text(
              "# T071 — 158 m OpenFAST distributed-gage reinforcement loads\n\n"
              "本实验用于恢复正式36工况输入、验证可重复运行环境，并补跑31个混凝土段的正式N/M/V/T用于NB/T 10907配筋。\n\n"
              "第一门禁：U09p343881_ETM_S01原gage不变重跑，与归档原OUTB逐点对比。\n",
              encoding="utf-8"
          )
          # hard gate for core loads; tolerate tiny single-precision/platform noise
          core=[k for k in report if k.startswith("TwrBs")]
          worst=max(report[k].get("max_rel_to_orig_peak",1.0) for k in core)
          print("WORST_CORE_REL",worst)
          if worst>1e-4:
              raise SystemExit(f"Reproduction mismatch too large: {worst}")
          '@ | Set-Content -Encoding utf8 work\compare.py
          python work\compare.py

      - name: Commit reproduction evidence
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T071
          if (git diff --cached --quiet) { Write-Host "No changes" }
          else {
            git commit -m "T071 reproduce formal 158m OpenFAST case before gage reruns"
            git pull --rebase origin main
            git push
          }
