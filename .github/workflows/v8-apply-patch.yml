name: Apply V8 terrain render patch

on:
  push:
    branches:
      - feature/v8-v7-terrain-render-lod
    paths:
      - 'scripts/apply_v8_terrain_render_patch.py'
      - '.github/workflows/v8-apply-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/v8-v7-terrain-render-lod
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/apply_v8_terrain_render_patch.py

      - name: Verify only intended production files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r path; do
            case "$path" in
              native/include/vf/world/PlanetSurface.hpp|native/src/world/PlanetSurface.cpp|native/src/app/Main.cpp|native/src/render/VulkanRenderer.cpp|native/shaders/planet.slang) ;;
              *) echo "Unexpected source change: $path"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Remove one-shot patch plumbing
        run: |
          rm scripts/apply_v8_terrain_render_patch.py
          rm .github/workflows/v8-apply-patch.yml

      - name: Commit V8 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: rebuild V7 terrain LOD and stylized ocean safely"
          git push origin HEAD:feature/v8-v7-terrain-render-lod
