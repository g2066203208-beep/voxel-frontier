name: t065-index-fatigue-reference-figures

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t065-index-fatigue-reference-figures.yml'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/references/user-provided/Fatigue analysis of segmental precast post-tensioned concrete towers under operational wind turbine loads.pdf
            research/wind-tower/references/user-provided/The Response and Optimisation of Hybrid Wind Turbine Towers_Alan Kenna.pdf
            research/wind-tower/references/open-access/Qu_2026_Buildings_16_3854.pdf
            research/wind-tower/references/user-provided/Numerical Simulation and Fatigue Analysis of the Grout Layer Replacement for Horizontal Joint of Wind Turbine Prestressed Concrete Tower.pdf
            research/wind-tower/references/open-access/Zhao_2023_AdvCivilEng_1100725_SteelTower_Fatigue_MeasuredData.pdf
            research/wind-tower/references/user-provided/Experimental Investigation of the Steel-Concrete Joint in a Hybrid Tower for a Wind Turbine under Fatigue Loading.pdf
          sparse-checkout-cone-mode: false

      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Build figure/table caption index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,json,csv

          sources=[
            ("REF018_Huang2025","research/wind-tower/references/user-provided/Fatigue analysis of segmental precast post-tensioned concrete towers under operational wind turbine loads.pdf",
             ["fatigue","prestress","mean stress","sample size","azimuth","wind speed","damage","rainflow","S-N","Miner","horizontal joint","SPPT"]),
            ("REF002_Kenna2019","research/wind-tower/references/user-provided/The Response and Optimisation of Hybrid Wind Turbine Towers_Alan Kenna.pdf",
             ["fatigue","S-N","Miner","concrete","steel","hybrid tower","rainflow","damage"]),
            ("REF023_Qu2026","research/wind-tower/references/open-access/Qu_2026_Buildings_16_3854.pdf",
             ["fatigue","prestress relaxation","Weibull","rainflow","damage","life","stress history","wind speed","PT"]),
            ("REF041_Wang2025","research/wind-tower/references/user-provided/Numerical Simulation and Fatigue Analysis of the Grout Layer Replacement for Horizontal Joint of Wind Turbine Prestressed Concrete Tower.pdf",
             ["fatigue","reference stress","single point","thickness average","damage","joint","stress","Miner"]),
            ("REF143_Zhao2023","research/wind-tower/references/open-access/Zhao_2023_AdvCivilEng_1100725_SteelTower_Fatigue_MeasuredData.pdf",
             ["fatigue","hot spot","hot-spot","SCF","rainflow","S-N","wind direction","damage","weld","flange"]),
            ("REF036_Kim2019","research/wind-tower/references/user-provided/Experimental Investigation of the Steel-Concrete Joint in a Hybrid Tower for a Wind Turbine under Fatigue Loading.pdf",
             ["fatigue","specimen","anchor bolt","cyclic","residual","joint","loading","test"])
          ]
          out=Path('/tmp/t065'); out.mkdir(parents=True,exist_ok=True)
          rows=[]
          summaries={}
          for sid,pdf,kws in sources:
            txt=out/(sid+'.txt')
            subprocess.run(['pdftotext','-layout',pdf,str(txt)],check=True)
            raw=txt.read_text(errors='ignore')
            pages=raw.split('\\f')
            summaries[sid]={'pdf':pdf,'pages':len(pages),'matches':0}
            for pi,page in enumerate(pages,1):
              lines=[re.sub(r'\s+',' ',x).strip() for x in page.splitlines()]
              for li,line in enumerate(lines):
                low=line.lower()
                is_caption=bool(re.match(r'^(fig(?:ure)?\.?|table)\s*\d+',low))
                kw_hits=[k for k in kws if k.lower() in low]
                # Keep figure/table captions and strong keyword lines.
                if is_caption or (kw_hits and len(line)>=20):
                  score=(3 if is_caption else 0)+len(kw_hits)
                  context=' | '.join([x for x in lines[max(0,li-1):min(len(lines),li+2)] if x])
                  rows.append({
                    'source_id':sid,'pdf_page':pi,'is_caption':is_caption,'score':score,
                    'keywords':';'.join(kw_hits),'text':line,'context':context
                  })
                  summaries[sid]['matches']+=1

          rows.sort(key=lambda r:(r['source_id'],r['pdf_page'],-r['score'],r['text']))
          with (out/'FATIGUE_REFERENCE_FIGURE_CAPTION_INDEX.tsv').open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=['source_id','pdf_page','is_caption','score','keywords','text','context'],delimiter='\t')
            w.writeheader(); w.writerows(rows)
          (out/'INDEX_SUMMARY.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          src=Path('/tmp/t065'); prefix='research/wind-tower/experiments/T065'
          H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'t065'}
          def api(m,p,x=None):
            data=None if x is None else json.dumps(x).encode()
            q=urllib.request.Request('https://api.github.com/repos/'+repo+p,data=data,headers=H,method=m)
            with urllib.request.urlopen(q,timeout=300) as r:return json.loads(r.read().decode())
          ref=api('GET','/git/ref/heads/'+branch); parent=ref['object']['sha']; base=api('GET','/git/commits/'+parent)['tree']['sha']
          ents=[]
          for p in sorted(src.glob('*')):
            raw=p.read_bytes(); b=api('POST','/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
            ents.append({'path':prefix+'/'+p.name,'mode':'100644','type':'blob','sha':b['sha']})
          t=api('POST','/git/trees',{'base_tree':base,'tree':ents})
          c=api('POST','/git/commits',{'message':'research: index figures and tables in fatigue references','tree':t['sha'],'parents':[parent]})
          api('PATCH','/git/refs/heads/'+branch,{'sha':c['sha'],'force':False}); print(c['sha'])
          PY
