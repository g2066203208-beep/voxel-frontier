name: Inspect original IEA 15MW CAD assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-iea15-original-cad.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Read upstream official CAD tree (no generated geometry)
        run: |
          python3 - <<'PY'
          import json, urllib.request, pathlib, datetime
          url='https://api.github.com/repos/IEAWindSystems/IEA-15-240-RWT/git/trees/master?recursive=1'
          req=urllib.request.Request(url, headers={'User-Agent':'paper-studio-research','Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=75) as f: data=json.load(f)
          cad=[o for o in data.get('tree',[]) if o.get('path','').startswith('CAD/') and o.get('type')=='blob']
          dst=pathlib.Path('research/wind-tower/references/reference-models-20261008/IEA15_ORIGINAL_CAD_INVENTORY.tsv')
          dst.parent.mkdir(parents=True,exist_ok=True)
          with dst.open('w') as f:
            f.write('path\tbytes\tsha\turl\n')
            for o in cad:
              f.write(f"{o['path']}\t{o.get('size','')}\t{o['sha']}\thttps://github.com/IEAWindSystems/IEA-15-240-RWT/blob/master/{o['path']}\n")
          print('Truncated:',data.get('truncated'),'Files:',len(cad))
          print('\n'.join(f"{o['path']}\t{o.get('size')}" for o in cad if o['path'].endswith('.zip')))
          PY
      - name: Commit upstream binary-source inventory
        run: |
          git config user.name github-actions\[bot\]
          git config user.email 41898282+github-actions\[bot\]@users.noreply.github.com
          git add research/wind-tower/references/reference-models-20261008/IEA15_ORIGINAL_CAD_INVENTORY.tsv
          git commit -m "data(iea15): inventory official CAD source binaries [skip ci]" || true
          git pull --rebase origin main
          git push origin HEAD:main
