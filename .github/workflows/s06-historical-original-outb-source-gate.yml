name: S06 historical original OUTB source/header QC (NOT physics PASS)
on:
  push:
    paths:
      - '.github/workflows/s06-historical-original-outb-source-gate.yml'
      - 'research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py'
  pull_request:
    paths:
      - '.github/workflows/s06-historical-original-outb-source-gate.yml'
      - 'research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-outb-one-case:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download exactly one 5 MB archived source ZIP, SHA-pinned manifest and audit code
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          mkdir -p audit
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/part-001.zip \
            "$base/research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/file-manifest.json \
            "$base/research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/s06_historical_outb_source_gate.py \
            "$base/research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/previous-three-sample-receipt.json \
            "$base/research/wind-tower/experiments/T062/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT_20261028.json"
      - name: Parser negative tests and full real 12001 x 9 synchronous native-channel extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile audit/s06_historical_outb_source_gate.py
          python3 audit/s06_historical_outb_source_gate.py --self-test
          python3 audit/s06_historical_outb_source_gate.py \
            --zip-path audit/part-001.zip --manifest audit/file-manifest.json \
            --case U09p343881_ETM_S01 --output audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json \
            --full-series-gzip audit/S06_T062_9GAGE_FULL_NATIVE_SERIES.csv.gz \
            --previous-receipt audit/previous-three-sample-receipt.json
          sha256sum audit/part-001.zip audit/file-manifest.json audit/s06_historical_outb_source_gate.py \
            audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json \
            audit/S06_T062_9GAGE_FULL_NATIVE_SERIES.csv.gz
          python3 - <<'PY'
          import json
          d=json.load(open("audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json"))["full_synchronous_native_series"]
          assert d["sample_count"] == 12001 and d["gage_count"] == 9
          assert d["selected_channel_count"] == 141 and d["channel_value_count"] == 1692141
          assert d["three_instant_parity"] == "PASS"
          print("REAL_FULL_SERIES_QC", {k:v for k,v in d.items() if k not in ("native_channel_summary","hold")})
          PY
          echo 'S06: ORIGINAL ARCHIVE SOURCE/QC ONLY; NOT 31-GAGE RERUN, DYNAMIC FORCE OWNERSHIP, ABAQUS, OR PHYSICS PASS.'
      - name: Retain small source/header receipt for inspection
        uses: actions/upload-artifact@v4
        with:
          name: s06-t062-one-original-outb-full-native-series-qc
          path: |
            audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json
            audit/S06_T062_9GAGE_FULL_NATIVE_SERIES.csv.gz
          retention-days: 14
