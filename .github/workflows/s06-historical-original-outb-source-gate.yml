name: S06 historical original OUTB source/header QC (NOT physics PASS)
on:
  push:
    paths:
      - '.github/workflows/s06-historical-original-outb-source-gate.yml'
      - 'research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py'
      - 'research/wind-tower/experiments/T062/s06_t062_original_tower_gage_geometry_gate.py'
      - 'research/wind-tower/experiments/T062/s06_ntm_18case_original_outb_gate.py'
      - 'research/wind-tower/experiments/T062/s10_ntm_18case_nearbase_gross_rainflow.py'
  pull_request:
    paths:
      - '.github/workflows/s06-historical-original-outb-source-gate.yml'
      - 'research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-outb-one-case:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download exactly one 5 MB archived source ZIP, SHA-pinned manifest and audit code
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          mkdir -p audit
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/part-001.zip \
            "$base/research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/file-manifest.json \
            "$base/research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/s06_historical_outb_source_gate.py \
            "$base/research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/previous-three-sample-receipt.json \
            "$base/research/wind-tower/experiments/T062/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT_20261028.json"
      - name: Parser negative tests and full real 12001 x 9 synchronous native-channel extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile audit/s06_historical_outb_source_gate.py
          python3 audit/s06_historical_outb_source_gate.py --self-test
          python3 audit/s06_historical_outb_source_gate.py \
            --zip-path audit/part-001.zip --manifest audit/file-manifest.json \
            --case U09p343881_ETM_S01 --output audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json \
            --full-series-gzip audit/S06_T062_9GAGE_FULL_NATIVE_SERIES.csv.gz \
            --previous-receipt audit/previous-three-sample-receipt.json
          sha256sum audit/part-001.zip audit/file-manifest.json audit/s06_historical_outb_source_gate.py \
            audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json \
            audit/S06_T062_9GAGE_FULL_NATIVE_SERIES.csv.gz
          python3 - <<'PY'
          import json
          d=json.load(open("audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json"))["full_synchronous_native_series"]
          assert d["sample_count"] == 12001 and d["gage_count"] == 9
          assert d["selected_channel_count"] == 141 and d["channel_value_count"] == 1692141
          assert d["three_instant_parity"] == "PASS"
          print("REAL_FULL_SERIES_QC", {k:v for k,v in d.items() if k not in ("native_channel_summary","hold")})
          PY
          echo 'S06: ORIGINAL ARCHIVE SOURCE/QC ONLY; NOT 31-GAGE RERUN, DYNAMIC FORCE OWNERSHIP, ABAQUS, OR PHYSICS PASS.'
      - name: Match original ElastoDyn TwrGagNd and 158m node midpoint to nine actual OUTB TPzi
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/static-part-001.zip \
            "$base/research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip"
          curl --fail --location --silent --show-error --retry 3 \
            --output audit/s06_t062_original_tower_gage_geometry_gate.py \
            "$base/research/wind-tower/experiments/T062/s06_t062_original_tower_gage_geometry_gate.py"
          python3 -m py_compile audit/s06_t062_original_tower_gage_geometry_gate.py
          python3 audit/s06_t062_original_tower_gage_geometry_gate.py --self-test
          python3 audit/s06_t062_original_tower_gage_geometry_gate.py \
            --static-zip audit/static-part-001.zip \
            --receipt audit/previous-three-sample-receipt.json \
            --out audit/S06_T062_ORIGINAL_GAGE_GEOMETRY_RECEIPT.json
          sha256sum audit/static-part-001.zip \
            audit/s06_t062_original_tower_gage_geometry_gate.py \
            audit/S06_T062_ORIGINAL_GAGE_GEOMETRY_RECEIPT.json
          echo 'STATIC SOURCE GAGE GEOMETRY ONLY; NOT 31-GAGE, PHYSICS, OR ABAQUS PASS.'
      - name: Retain small source/header receipt for inspection
        uses: actions/upload-artifact@v4
        with:
          name: s06-t062-one-original-outb-full-native-series-qc
          path: |
            audit/S06_T062_ORIGINAL_OUTB_CHANNEL_RECEIPT.json
            audit/S06_T062_ORIGINAL_GAGE_GEOMETRY_RECEIPT.json
            audit/S06_T062_9GAGE_FULL_NATIVE_SERIES.csv.gz
          retention-days: 14

  original-ntm-18case-load-screen:
    if: github.event_name == 'push' && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            research/wind-tower/experiments/T062
            research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
            research/wind-tower/experiments/T077/recovery/S01_PT_AXIAL_31SEG_SOURCE_20261026.csv
          sparse-checkout-cone-mode: false
      - name: Known-answer and invalid-input rainflow checks
        run: |
          set -euo pipefail
          python3 -m py_compile research/wind-tower/experiments/T062/s06_ntm_18case_original_outb_gate.py
          python3 research/wind-tower/experiments/T062/s06_ntm_18case_original_outb_gate.py --self-test
          python3 -m py_compile research/wind-tower/experiments/T062/s10_ntm_18case_nearbase_gross_rainflow.py
          python3 research/wind-tower/experiments/T062/s10_ntm_18case_nearbase_gross_rainflow.py --self-test
      - name: Fetch only 18 SHA-identified original NTM OUTB archives
        shell: bash
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T062/s06_ntm_18case_original_outb_gate.py
          manifest=research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
          mkdir -p /tmp/ntm-archives
          count=0
          while IFS= read -r p; do
            echo "FETCH_ORIGINAL_NTM_ARCHIVE $p"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --output "/tmp/ntm-archives/$(basename "$p")" \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$p"
            count=$((count+1))
          done < <(python3 "$script" --manifest "$manifest" --list-archives)
          test "$count" -eq 18
      - name: Recompute 18 original NTM cases, 60 native load channels each
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wind-tower/experiments/T062/s06_ntm_18case_original_outb_gate.py \
            --manifest research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json \
            --zip-dir /tmp/ntm-archives \
            --out research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv \
            --receipt research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json
          sha256sum research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv \
            research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json
          python3 - <<'PY'
          import csv,json
          p='research/wind-tower/experiments/T062/'
          rows=list(csv.DictReader(open(p+'S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv')))
          r=json.load(open(p+'S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json'))
          assert len(rows)==1080 and len({x['case'] for x in rows})==18
          assert len({x['channel'] for x in rows})==60
          assert len(r['sources'])==18 and r['physical_pass'] is False
          print('PASS 18 ORIGINAL NTM CASES / 1080 SHA-PINNED CHANNEL DEL ROWS')
          PY
      - name: S10 18 original NTM synchronous near-base nominal stress and 6-seed controls (no solver)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower
          python3 "$root/experiments/T062/s10_ntm_18case_nearbase_gross_rainflow.py" \
            --manifest "$root/archive/local-assets-20261004-supplement/file-manifest.json" \
            --zip-dir /tmp/ntm-archives \
            --oracle "$root/experiments/T062/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv" \
            --identity "$root/experiments/T062/S06_18NTM_INPUT_SOURCE_IDENTITY_20261031.csv" \
            --gage-receipt "$root/experiments/T062/S06_T062_ORIGINAL_GAGE_GEOMETRY_RECEIPT_20261028.json" \
            --geometry "$root/experiments/T077/recovery/S01_PT_AXIAL_31SEG_SOURCE_20261026.csv" \
            --out "$root/experiments/T062/S10_18NTM_10NEARBASE_16AZ_GROSS_RAINFLOW_20261031.csv" \
            --summary "$root/experiments/T062/S10_18NTM_6SEED_GROSS_STRESS_CONTROL_20261031.csv" \
            --receipt "$root/experiments/T062/S10_18NTM_GROSS_STRESS_SOURCE_RECEIPT_20261031.json"
          python3 - <<'PY'
          import csv,json,hashlib,pathlib
          p=pathlib.Path('research/wind-tower/experiments/T062')
          full=p/'S10_18NTM_10NEARBASE_16AZ_GROSS_RAINFLOW_20261031.csv'
          short=p/'S10_18NTM_6SEED_GROSS_STRESS_CONTROL_20261031.csv'
          rec=json.loads((p/'S10_18NTM_GROSS_STRESS_SOURCE_RECEIPT_20261031.json').read_text())
          assert sum(1 for _ in csv.DictReader(full.open()))==2880
          assert sum(1 for _ in csv.DictReader(short.open()))==30
          assert rec['oracle_load_DEL_checked']==540 and rec['physical_pass'] is False
          assert hashlib.sha256(full.read_bytes()).hexdigest()==rec['full_sha256']
          assert hashlib.sha256(short.read_bytes()).hexdigest()==rec['summary_sha256']
          print('S10_REAL_18NTM_2880_GROSS_30_CONTROL_540_LOAD_ORACLE_NUMERIC_PASS_NO_ABAQUS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s06-18-original-ntm-9gage-rainflow-20261031
          path: |
            research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv
            research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json
            research/wind-tower/experiments/T062/S10_18NTM_10NEARBASE_16AZ_GROSS_RAINFLOW_20261031.csv
            research/wind-tower/experiments/T062/S10_18NTM_6SEED_GROSS_STRESS_CONTROL_20261031.csv
            research/wind-tower/experiments/T062/S10_18NTM_GROSS_STRESS_SOURCE_RECEIPT_20261031.json
          retention-days: 14
      - name: Persist verified small results to the same Draft PR branch (no merge)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/t080-seismic-integration-gates-20261022'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv \
            research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json \
            research/wind-tower/experiments/T062/S10_18NTM_10NEARBASE_16AZ_GROSS_RAINFLOW_20261031.csv \
            research/wind-tower/experiments/T062/S10_18NTM_6SEED_GROSS_STRESS_CONTROL_20261031.csv \
            research/wind-tower/experiments/T062/S10_18NTM_GROSS_STRESS_SOURCE_RECEIPT_20261031.json
          if git diff --cached --quiet; then
            echo 'NO_CHANGE_SOURCE_VERIFIED'
          else
            git commit -m 'data(S10): persist 18 original NTM 10-station gross-stress rainflow and seed controls'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'SOURCE-NUMERIC ONLY; NOT DLC1.2/31-GAGE/ABAQUS/MATERIAL FATIGUE PASS'
