name: Build Faithbound Android APK

on:
  push:
    branches: [ mobile-rpg-v2-voxel ]
    paths:
      - 'mobile-rpg/**'
      - '.github/workflows/mobile-rpg-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bootstrap Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip             https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" /tmp/cmdline-tools
          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android native toolchain
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: mobile-rpg
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp mobile-rpg/app/build/outputs/apk/debug/app-debug.apk dist/Faithbound-v0.2-voxel-alpha.apk
          sha256sum dist/Faithbound-v0.2-voxel-alpha.apk > dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Faithbound-Android-v0.2-Voxel
          path: dist/
          if-no-files-found: error
