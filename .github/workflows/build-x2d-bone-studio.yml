name: Build X2D Bone Studio APK
on:
  push:
    branches: [x2d-bone-studio-apk]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate source project
        shell: bash
        run: |
          cat > /tmp/x2d.b64 <<'EOF'
[...]UEsFBgAAAAATABMAfAYAAJlBAAAAAA==
EOF
          base64 -d /tmp/x2d.b64 > /tmp/x2d.zip
          mkdir -p /tmp/x2d
          unzip -q /tmp/x2d.zip -d /tmp/x2d
      - name: Build debug APK
        run: gradle -p /tmp/x2d assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X2DBoneStudio-v0.1-debug-apk
          path: /tmp/x2d/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
