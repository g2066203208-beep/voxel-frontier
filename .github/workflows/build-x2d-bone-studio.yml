name: Build X2D Bone Studio APK
on:
  push:
    branches:
      - x2d-bone-studio-apk
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | head -80

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate Android project
        shell: bash
        run: |
          cat .ci/x2d/p*.b64 | tr -d '\n\r ' | base64 -d > /tmp/x2d.zip
          rm -rf /tmp/x2d
          mkdir -p /tmp/x2d
          unzip -q /tmp/x2d.zip -d /tmp/x2d
          test -f /tmp/x2d/settings.gradle
          test -f /tmp/x2d/app/build.gradle

      - name: Build APK
        shell: bash
        run: gradle -p /tmp/x2d assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s /tmp/x2d/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/x2d/app/build/outputs/apk/debug/app-debug.apk
          sha256sum /tmp/x2d/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: X2DBoneStudio-v0.1-debug-apk
          path: /tmp/x2d/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
