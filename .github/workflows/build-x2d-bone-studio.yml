name: Build X2D Bone Studio APK
on:
  push:
    branches:
      - x2d-bone-studio-apk
    paths:
      - '.ci/x2d_v03/**'
      - '.ci/x2d_v031d/**'
      - '.ci/x2d_v04/**'
      - '.github/workflows/build-x2d-bone-studio.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recreate base
        shell: bash
        run: |
          cat .ci/x2d/p*.b64 | tr -d '\n\r ' | base64 -d > /tmp/x2d.zip
          rm -rf /tmp/x2d && mkdir -p /tmp/x2d
          unzip -q /tmp/x2d.zip -d /tmp/x2d
          PROJECT_ROOT="$(dirname "$(find /tmp/x2d -name settings.gradle -type f | head -1)")"
          test -f "$PROJECT_ROOT/settings.gradle"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
      - name: Apply v0.3
        shell: bash
        run: |
          cat .ci/x2d_v03/p*.b64 | tr -d '\n\r ' | base64 -d > /tmp/v03.zip
          unzip -oq /tmp/v03.zip -d "$PROJECT_ROOT"
      - name: Apply v0.3.1
        shell: bash
        run: |
          cat .ci/x2d_v031d/p*.b64 | tr -d '\n\r ' | base64 -d > /tmp/v031.zip
          unzip -t /tmp/v031.zip
          unzip -oq /tmp/v031.zip -d "$PROJECT_ROOT"
          grep -q 'versionName "0.3.1"' "$PROJECT_ROOT/app/build.gradle"
          grep -q 'reparentSelectedBone' "$PROJECT_ROOT/app/src/main/java/com/openai/x2dbonestudio/RigEditorView.java"
      - name: Apply v0.4 professional rigging + 2D deformation
        shell: bash
        run: |
          cat .ci/x2d_v04/p*.b64 | tr -d '\n\r ' | base64 -d > /tmp/v04.zip
          echo "9c61f2c45f28b42d11ee5008bfb4056d5713a6bf159526c52c4e07adc9b5be6a  /tmp/v04.zip" | sha256sum -c -
          unzip -t /tmp/v04.zip
          unzip -oq /tmp/v04.zip -d "$PROJECT_ROOT"
          grep -q 'versionName "0.4.0"' "$PROJECT_ROOT/app/build.gradle"
          test -f "$PROJECT_ROOT/app/src/main/java/com/openai/x2dbonestudio/ParameterEngine.java"
          test -f "$PROJECT_ROOT/app/src/main/java/com/openai/x2dbonestudio/TransformConstraint2D.java"
          test -f "$PROJECT_ROOT/app/src/main/java/com/openai/x2dbonestudio/PathConstraint2D.java"
          test -f "$PROJECT_ROOT/app/src/main/java/com/openai/x2dbonestudio/BonePhysicsEngine.java"

      - name: Build APK
        run: gradle -p "$PROJECT_ROOT" assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" /tmp/X2DBoneStudio-v0.4.0-debug.apk
          unzip -t /tmp/X2DBoneStudio-v0.4.0-debug.apk >/dev/null
          sha256sum /tmp/X2DBoneStudio-v0.4.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: X2DBoneStudio-v0.4.0-debug-apk
          path: /tmp/X2DBoneStudio-v0.4.0-debug.apk
          if-no-files-found: error
