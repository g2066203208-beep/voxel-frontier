name: Materialize Terrain R13 Relief Structure

on:
  push:
    branches: [test/terrain-r13-relief-structure]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R13 source patch
        run: python3 .github/scripts/materialize_terrain_r13.py
      - name: Verify R13 markers
        run: |
          grep -q 'R13 connected orogen structure' native/src/world/PlanetSurface.cpp
          grep -q 'R13 tableland' native/src/world/PlanetSurface.cpp
          grep -q 'R13 coast profiles' native/src/world/PlanetSurface.cpp
          grep -q 'R13 terrain readability' native/shaders/planet.slang
          grep -q 'R13 evidence target geometry' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized R13 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/shaders/planet.slang native/src/app/Main.cpp
          git commit -m 'terrain: materialize R13 relief structure [skip ci]'
          git push origin HEAD:test/terrain-r13-relief-structure
