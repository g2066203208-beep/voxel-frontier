name: T048 DPM RNA generate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/t048-dpm-generate.yml"
      - "research/wind-tower/experiments/T048/**"
      - "research/wind-tower/references/baselines-and-site-20261004/dtu-hawc2-reference/data/DTU_10MW_RWT_Blade_st.dat"
      - "research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/0Linearization/Template_Servo/DTU_10MW_RWT_ElastoDyn.dat"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate T048 standalone and BASE001 DPM deck
        run: |
          python research/wind-tower/experiments/T048/build_dpm_rna.py             --patch-baseline research/wind-tower/experiments/T046/inputs/BASE001_T046_E1B_HOOP_TIE_NSM_REMOVE.inp             --patched-output research/wind-tower/experiments/T048/generated/BASE001_T048_DPM.inp

      - name: Static audit
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("research/wind-tower/experiments/T048/generated/RNA_DPM_AUDIT.json")
          d=json.loads(p.read_text())
          err=abs(d["generated_rna_mass_kg"]-d["target_rna_mass_kg"])
          print(json.dumps(d,indent=2))
          assert err < 1e-3, f"RNA mass mismatch {err} kg"
          q=pathlib.Path("research/wind-tower/experiments/T048/generated/BASE001_T048_DPM.inp").read_text(errors="replace")
          assert "RNA_DPM" in q
          assert "RNA_R2_EQUIV" not in q.upper()
          assert q.upper().count("*ELEMENT, TYPE=B31") >= 1
          print("T048 STATIC AUDIT PASS")
          PY

      - name: Commit generated model package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T048/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "T048: generate distributed RNA Abaqus decks"
            git push
          fi
