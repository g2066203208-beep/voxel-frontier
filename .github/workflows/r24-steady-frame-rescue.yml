name: R24 Steady Frame Rescue

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_steady_frame_rescue.py'
      - '.github/workflows/r24-steady-frame-rescue.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-steady-frame-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply ecology hotpath
        run: python3 .github/scripts/r24_ecology_hotpath.py

      - name: Apply extreme runtime foundation
        run: python3 .github/scripts/r24_extreme_runtime_rescue.py

      - name: Apply steady-frame rescue
        run: python3 .github/scripts/r24_steady_frame_rescue.py

      - name: Validate source contracts
        shell: bash
        run: |
          git diff --check
          grep -q 'terrainSamples_' native/include/vf/world/PlanetClimateGrid.hpp
          grep -q 'kClimateServiceStepSeconds = 300.0' native/src/world/PlanetaryBodySystem.cpp
          grep -q '1500U' native/src/app/Main.cpp
          grep -q 'kDynamicSceneCadenceSeconds = 0.10' native/src/app/Main.cpp
          grep -q 'refreshDynamicScene && currentMoon' native/src/app/Main.cpp
          grep -q 'dynamicMeshGeneration_' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'dynamicMeshGenerationByFrame_\[frame\] == dynamicMeshGeneration_' native/src/render/VulkanRenderer.cpp
          grep -q 'dynamicShadowCasters' native/src/render/VulkanRenderer.cpp
          grep -q 'skyDepth.depthCompareOp = VK_COMPARE_OP_EQUAL' native/src/render/VulkanRenderer.cpp
          grep -q 'Depth-first ordering' native/src/render/VulkanRenderer.cpp
          grep -q 'static const float2 offsets\[5\]' native/shaders/planet.slang
          grep -q 'Four view samples x two sun samples' native/shaders/planet.slang
          grep -q 'Corona FBM/atan/trigonometry used to execute' native/shaders/planet.slang
          ! grep -q 'static const float2 offsets\[9\]' native/shaders/planet.slang

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-steady -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-steady --parallel 2

      - name: Run all native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-steady --verbose --output-on-failure 2>&1 | tee r24-steady-ctest.log

      - name: Gate physical runtime regressions
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-steady --verbose --output-on-failure \
            -R 'vf_planetary_body_system_tests|vf_r24_runtime_stability_tests|vf_r24_hydrologic_canyon_tests|vf_terrain_landform_tests|vf_r24_physical_planet_tests|vf_shader_contract_tests' \
            2>&1 | tee r24-steady-focused.log
          grep -q 'vf_planetary_body_system_tests: PASS' r24-steady-focused.log
          grep -q 'vf_r24_runtime_stability_tests: PASS' r24-steady-focused.log
          grep -q 'Terrain landform tests passed' r24-steady-focused.log
          grep -q 'R24 hydrologic canyon tests passed' r24-steady-focused.log
          grep -q 'All production shader SPIR-V entry-point contracts passed' r24-steady-focused.log

      - name: Verify Lavapipe Vulkan
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real optimized Vulkan terrain
        shell: bash
        run: |
          APP="$(find build/r24-steady -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-steady-frame-evidence

      - name: Gate images and geometry budgets
        shell: bash
        run: |
          test -s r24-steady-frame-evidence/r24-epic-landscape-overview.png
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('r24-steady-frame-evidence/logs')
          pattern = re.compile(
              r'R24 PERF terrain_build_ms=([0-9.]+) vertices=([0-9]+) indices=([0-9]+) '
              r'leaf_patches=([0-9]+) culled_nodes=([0-9]+) hydrology_reused=([01])')
          rows = []
          for log in root.glob('*.log'):
              if log.name.startswith('xvfb'):
                  continue
              found = pattern.findall(log.read_text(encoding='utf-8', errors='replace'))
              if found:
                  ms, verts, inds, leaves, culled, reused = found[-1]
                  row = (log.stem, float(ms), int(verts), int(inds), int(leaves), int(culled), int(reused))
                  rows.append(row)
                  print('STEADY_PERF', row)
          if len(rows) < 4:
              raise SystemExit(f'expected four terrain rows, got {len(rows)}')
          max_indices = max(r[3] for r in rows)
          max_leaves = max(r[4] for r in rows)
          min_culled = min(r[5] for r in rows)
          max_build_ms = max(r[1] for r in rows)
          print('STEADY_SUMMARY', 'max_build_ms=', max_build_ms,
                'max_indices=', max_indices, 'max_leaves=', max_leaves,
                'min_culled=', min_culled)
          if max_indices >= 2_250_000:
              raise SystemExit(f'index budget regression: {max_indices} >= 2,250,000')
          if max_leaves > 1500:
              raise SystemExit(f'leaf budget regression: {max_leaves} > 1500')
          if min_culled <= 0:
              raise SystemExit('view/horizon culling rejected no nodes')
          PY

      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-steady-frame-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-steady-frame-evidence ]]; then
            cp -a r24-steady-frame-evidence/. "$EVIDENCE_DIR/"
          fi
          [[ -f r24-steady-ctest.log ]] && cp -f r24-steady-ctest.log "$EVIDENCE_DIR/" || true
          [[ -f r24-steady-focused.log ]] && cp -f r24-steady-focused.log "$EVIDENCE_DIR/" || true
          [[ -f vulkan-summary.txt ]] && cp -f vulkan-summary.txt "$EVIDENCE_DIR/" || true
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-steady-frame-${{ github.run_id }}
          path: |
            r24-steady-frame-evidence/**
            r24-steady-ctest.log
            r24-steady-focused.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote steady-frame rescue
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          git commit -m "perf(r24): eliminate steady-frame mesh uploads and hidden sky work"
          git reset --hard HEAD
          git clean -fd build/r24-steady || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
