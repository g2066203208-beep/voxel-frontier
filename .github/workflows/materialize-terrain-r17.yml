name: Materialize Terrain R17 Authority Cleanup

on:
  push:
    branches: [test/terrain-r17-authority-cleanup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R17 cleanup
        run: python3 .github/scripts/materialize_terrain_r17.py
      - name: Verify cleanup
        run: |
          grep -q 'R17 SINGLE MACRO AUTHORITY' native/src/world/PlanetSurface.cpp
          ! grep -q 'R13 connected orogen structure' native/src/world/PlanetSurface.cpp
          ! grep -q 'const double plateauShelf = 2700.0' native/src/world/PlanetSurface.cpp
          ! grep -q 'elevation += 430.0 \* coastEscarpment' native/src/world/PlanetSurface.cpp
          git diff --check
      - name: Commit materialized source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp
          git commit -m 'terrain: make R16 geomorph bake sole macro authority [skip ci]'
          git push origin HEAD:test/terrain-r17-authority-cleanup
