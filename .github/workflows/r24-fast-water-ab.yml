name: R24 Fast Water Same-Binary A-B

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_fast_water_120.py'
      - '.github/workflows/r24-fast-water-ab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-fast-water-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-water-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16

      - name: Materialize same-binary Fast Water V1
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r24_fast_water_120.py
          git diff --check
          grep -q 'R24_FAST_WATER_120_V1' native/shaders/planet.slang
          grep -q 'VF_FAST_WATER' native/src/app/Main.cpp
          grep -q 'scene.featureFlags' native/src/render/VulkanRenderer.cpp
          grep -q 'fastWaterEnabled' native/include/vf/render/VulkanRenderer.hpp

      - name: Install build and Vulkan dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Configure and build Release
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/r24-fast-water -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
          cmake --build build/r24-fast-water --parallel 2

      - name: Run complete native regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p r24-fast-water-evidence
          ctest --test-dir build/r24-fast-water --verbose --output-on-failure 2>&1 \
            | tee r24-fast-water-evidence/ctest.log
          grep -q '100% tests passed' r24-fast-water-evidence/ctest.log

      - name: Verify software Vulkan identity
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary \
            | tee r24-fast-water-evidence/vulkan-summary.txt
          grep -q 'llvmpipe' r24-fast-water-evidence/vulkan-summary.txt

      - name: Start locked 1080p display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
            > r24-fast-water-evidence/xvfb.log 2>&1 &
          echo $! > /tmp/r24-fast-water-xvfb.pid
          sleep 1
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'SDL_VIDEODRIVER=x11' >> "$GITHUB_ENV"

      - name: Run same-binary coast water OFF ON
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/r24-fast-water -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"

          run_case() {
            local name="$1"; local enabled="$2"
            echo "===== CASE $name ====="
            env \
              VF_PERF_PROFILE=mainstream_1080p \
              VF_TERRAIN_TARGET=coast \
              VF_CAPTURE_AERIAL=1 \
              VF_CAPTURE_ALTITUDE_METERS=1200 \
              VF_RUNTIME_DIAGNOSTICS=1 \
              VF_CELESTIAL_TIME_SCALE=1 \
              VF_VELOCITY_AWARE_LOD=1 \
              VF_PERCEPTUAL_RESIDENCY=1 \
              VF_FAST_WATER="$enabled" \
              timeout 32s "$APP" > "r24-fast-water-evidence/${name}.log" 2>&1 &
            local pid=$!
            sleep 4
            import -window root "r24-fast-water-evidence/${name}.png" || true
            set +e
            wait "$pid"
            local rc=$?
            set -e
            cat "r24-fast-water-evidence/${name}.log"
            test "$rc" -eq 0 -o "$rc" -eq 124
            test -s "r24-fast-water-evidence/${name}.png"
            identify "r24-fast-water-evidence/${name}.png" | grep -q '1920x1080'
            grep -q "R24 FAST_WATER enabled=${enabled}" "r24-fast-water-evidence/${name}.log"
            grep -q '^R24 BENCHMARK profile=' "r24-fast-water-evidence/${name}.log"
            grep -q '^R24 GPU steady_pass_ms' "r24-fast-water-evidence/${name}.log"
          }

          run_case water_off 0
          run_case water_on 1

      - name: Parse measured FPS and transparent GPU cost
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('r24-fast-water-evidence')
          def parse(name):
              text=(root/f'{name}.log').read_text(encoding='utf-8',errors='replace')
              bench=[x for x in text.splitlines() if x.startswith('R24 BENCHMARK profile=')][-1]
              gpu=[x for x in text.splitlines() if x.startswith('R24 GPU steady_pass_ms')][-1]
              b={k:float(v) for k,v in re.findall(
                  r'(avg_fps|one_percent_low_fps|p99_ms|render_mean_ms)=([0-9.]+)',bench)}
              g={k:float(v) for k,v in re.findall(
                  r'(shadow_mean|opaque_mean|sky_mean|transparent_mean|total_mean)=([0-9.]+)',gpu)}
              if len(b)!=4 or len(g)!=5:
                  raise SystemExit(f'{name}: incomplete metrics\n{bench}\n{gpu}')
              return text,bench,gpu,b,g

          off=parse('water_off'); on=parse('water_on')
          ob,og=off[3],off[4]
          nb,ng=on[3],on[4]

          # The feature is specifically a transparent-water optimization. Require a clear pass win,
          # no frame-pacing regression, and an end-to-end gain rather than accepting noise.
          if ng['transparent_mean'] > og['transparent_mean'] * 0.85:
              raise SystemExit(f'transparent GPU gain too small: {og["transparent_mean"]} -> {ng["transparent_mean"]}')
          if ng['total_mean'] > og['total_mean'] * 0.99:
              raise SystemExit(f'total GPU time did not improve: {og["total_mean"]} -> {ng["total_mean"]}')
          if nb['avg_fps'] < ob['avg_fps'] * 1.01:
              raise SystemExit(f'average FPS did not improve: {ob["avg_fps"]} -> {nb["avg_fps"]}')
          if nb['one_percent_low_fps'] < ob['one_percent_low_fps'] * 0.98:
              raise SystemExit(f'1% low regression: {ob["one_percent_low_fps"]} -> {nb["one_percent_low_fps"]}')
          if nb['p99_ms'] > ob['p99_ms'] * 1.02:
              raise SystemExit(f'p99 regression: {ob["p99_ms"]} -> {nb["p99_ms"]}')

          report=[
              'R24 FAST WATER V1 SAME-BINARY A-B',
              'device=llvmpipe software Vulkan; relative performance evidence only, not discrete-GPU 120 FPS certification.',
              'render is uncapped; target_fps=120 is the minimum acceptance metadata, not an FPS cap.',
              f'water_off: {off[1]}', f'water_off_gpu: {off[2]}',
              f'water_on: {on[1]}', f'water_on_gpu: {on[2]}',
              f'avg_fps_delta_pct={(nb["avg_fps"]/ob["avg_fps"]-1)*100:.3f}',
              f'one_percent_low_delta_pct={(nb["one_percent_low_fps"]/ob["one_percent_low_fps"]-1)*100:.3f}',
              f'p99_delta_pct={(nb["p99_ms"]/ob["p99_ms"]-1)*100:.3f}',
              f'transparent_gpu_delta_pct={(ng["transparent_mean"]/og["transparent_mean"]-1)*100:.3f}',
              f'total_gpu_delta_pct={(ng["total_mean"]/og["total_mean"]-1)*100:.3f}',
          ]
          out='\n'.join(report)+'\n'
          (root/'README.txt').write_text(out,encoding='utf-8')
          print(out)
          PY

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-fast-water-v1-${{ github.run_id }}
          path: r24-fast-water-evidence/**
          if-no-files-found: warn
          retention-days: 30

      - name: Promote measured Fast Water V1
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          DEST="docs/evidence/r24-fast-water-v1-${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -a r24-fast-water-evidence/. "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/shaders/planet.slang \
            native/include/vf/render/VulkanRenderer.hpp \
            native/src/render/VulkanRenderer.cpp \
            native/src/app/Main.cpp \
            "$DEST"
          git commit -m 'perf(r24): promote measured same-binary Fast Water V1'
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics

      - name: Stop display
        if: always()
        shell: bash
        run: |
          if test -f /tmp/r24-fast-water-xvfb.pid; then kill "$(cat /tmp/r24-fast-water-xvfb.pid)" 2>/dev/null || true; fi
