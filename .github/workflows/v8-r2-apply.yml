name: Apply V8 R2 visual patch

on:
  push:
    branches:
      - feature/v8-v7-terrain-render-lod
    paths:
      - 'scripts/apply_v8_r2_visual_patch.py'
      - '.github/workflows/v8-r2-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/v8-v7-terrain-render-lod
          fetch-depth: 0

      - name: Apply guarded R2 patch
        run: python3 scripts/apply_v8_r2_visual_patch.py

      - name: Verify intended source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          while IFS= read -r path; do
            case "$path" in
              native/include/vf/player/PlanetCamera.hpp|native/src/player/PlanetCamera.cpp|native/include/vf/world/PlanetSurface.hpp|native/src/world/PlanetSurface.cpp|native/src/app/Main.cpp|native/src/render/VulkanRenderer.cpp|native/shaders/planet.slang) ;;
              *) echo "Unexpected source change: $path"; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Assert V7 physics/controller/celestial authority untouched
        shell: bash
        run: |
          set -euo pipefail
          for p in native/src/physics native/src/player/CharacterController.cpp native/src/world/CelestialSystem.cpp native/src/world/CelestialPhysicsFrame.cpp; do
            if ! git diff --quiet HEAD -- "$p"; then
              echo "Forbidden authority change: $p"; exit 1
            fi
          done

      - name: Remove one-shot patch plumbing
        run: |
          rm scripts/apply_v8_r2_visual_patch.py
          rm .github/workflows/v8-r2-apply.yml

      - name: Commit R2 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add safe land start and terrain material detail"
          git push origin HEAD:feature/v8-v7-terrain-render-lod
