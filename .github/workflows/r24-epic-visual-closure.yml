name: R24 Epic Visual Closure

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_epic_visual_closure.py'
      - '.github/workflows/r24-epic-visual-closure.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-epic-visual-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply relief-aware visual closure
        run: python .github/scripts/r24_epic_visual_closure.py

      - name: Validate generated production source
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path native/src/app/Main.cpp -Pattern 'highestEvidenceElevation' -Quiet | Out-Null
          Select-String -Path native/src/app/Main.cpp -Pattern 'relief_lift_m=' -Quiet | Out-Null
          Select-String -Path native/src/world/PlanetLodMeshBuilder.cpp -Pattern 'radialReliefRadius' -Quiet | Out-Null
          Select-String -Path native/src/world/PlanetLodMeshBuilder.cpp -Pattern 'screenErrorPixels' -Quiet | Out-Null

      - name: Configure Windows runtime
        run: cmake -S native -B build/r24-visual-win -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Windows runtime
        run: cmake --build build/r24-visual-win --config Release --parallel

      - name: Run full Windows tests
        run: ctest --test-dir build/r24-visual-win -C Release --verbose --output-on-failure

  linux-vulkan:
    needs: windows-native
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply relief-aware visual closure
        run: python3 .github/scripts/r24_epic_visual_closure.py

      - name: Validate production changes
        run: |
          git diff --check
          grep -q 'highestEvidenceElevation' native/src/app/Main.cpp
          grep -q 'relief_lift_m=' native/src/app/Main.cpp
          grep -q 'radialReliefRadius' native/src/world/PlanetLodMeshBuilder.cpp
          grep -q 'std::priority_queue' native/src/world/PlanetLodMeshBuilder.cpp
          grep -q 'epicOrogeny' native/src/world/PlanetSurface.cpp
          grep -q 'sample.abyss = abyss' native/src/world/PlanetSurface.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Linux runtime
        run: cmake -S native -B build/r24-visual -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Linux runtime
        run: cmake --build build/r24-visual --parallel 2

      - name: Run full Linux native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-visual --verbose --output-on-failure 2>&1 | tee r24-visual-ctest.log

      - name: Gate epic physical geometry
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-visual --verbose --output-on-failure \
            -R 'vf_terrain_landform_tests|vf_r24_physical_planet_tests|vf_r24_runtime_stability_tests' \
            2>&1 | tee r24-visual-focused.log
          grep -q 'mountain_local_relief_m=' r24-visual-focused.log
          grep -q 'abyss=' r24-visual-focused.log

      - name: Verify Lavapipe Vulkan
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real production terrain after closure
        shell: bash
        run: |
          APP="$(find build/r24-visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-epic-visual-closure-evidence

      - name: Gate camera above local relief
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('r24-epic-visual-closure-evidence/logs')
          for target in ('mountain','rift','canyon','abyss'):
              text = (root / f'{target}.log').read_text(encoding='utf-8', errors='replace')
              rows = re.findall(r'relief_lift_m=([0-9.]+)', text)
              alt = re.findall(r'deterministic aerial camera altitude=([0-9.]+)', text)
              if not rows or not alt:
                  raise SystemExit(f'{target}: missing safe-camera diagnostics')
              lift = float(rows[-1]); altitude = float(alt[-1])
              print(f'{target}: relief_lift_m={lift:.1f} final_radial_clearance_m={altitude:.1f}')
              if altitude <= 0.0:
                  raise SystemExit(f'{target}: invalid camera altitude')
          PY

      - name: Preserve exact evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-epic-visual-closure-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-epic-visual-closure-evidence ]]; then
            cp -a r24-epic-visual-closure-evidence/. "$EVIDENCE_DIR/"
          fi
          [[ -f r24-visual-ctest.log ]] && cp -f r24-visual-ctest.log "$EVIDENCE_DIR/" || true
          [[ -f r24-visual-focused.log ]] && cp -f r24-visual-focused.log "$EVIDENCE_DIR/" || true
          [[ -f vulkan-summary.txt ]] && cp -f vulkan-summary.txt "$EVIDENCE_DIR/" || true
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-epic-visual-closure-${{ github.run_id }}
          path: |
            r24-epic-visual-closure-evidence/**
            r24-visual-ctest.log
            r24-visual-focused.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested visual closure
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          git commit -m "fix(r24): keep epic terrain camera and LOD clear of relief"
          git reset --hard HEAD
          git clean -fd build/r24-visual || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
