name: T073 quick fixed-count feasibility

on:
  push:
    paths:
      - 'research/wind-tower/experiments/T073/t073_e01_quick_map.py'
      - '.github/workflows/t073-quick-map.yml'

permissions:
  contents: write
  actions: read

jobs:
  calc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/T071/T071_input_geometry_31_segments.csv
            research/wind-tower/experiments/T073/T073_T053_RBLONG_RADII.csv
            research/wind-tower/experiments/T073/t073_e01_fixed_counts_feasible_map.py
            research/wind-tower/experiments/T073/t073_e01_quick_map.py
            research/wind-tower/experiments/T073
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - name: Download T071 full histories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/wind-tower/experiments/T073/artifacts/{A,B,C,D}
          declare -A IDS=( [A]=11466755161 [B]=11465219800 [C]=11466308388 [D]=11465344577 )
          for b in A B C D; do
            curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${IDS[$b]}/zip" -o "/tmp/$b.zip"
            unzip -q "/tmp/$b.zip" -d "research/wind-tower/experiments/T073/artifacts/$b"
          done
      - name: Run quick map
        working-directory: research/wind-tower/experiments/T073
        run: python t073_e01_quick_map.py
      - run: rm -rf research/wind-tower/experiments/T073/artifacts
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse research/wind-tower/experiments/T073
          git diff --cached --quiet && exit 0
          git commit -m "T073: run quick fixed-count feasibility scan"
          git pull --rebase origin main
          git push
