name: Live Studio Chromium Screenshots
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project and browser
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build local preview
        run: |
          npm run build
          npm run preview -- --port 4173 > /tmp/studio-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/voxel-frontier/thesis-studio/ > /dev/null && break; sleep 1; done
      - name: Capture every studio view
        env:
          STUDIO_BASE: http://127.0.0.1:4173/voxel-frontier/thesis-studio/
        run: node scripts/live-studio-screenshots.cjs
      - name: Upload screenshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-studio-chromium-screenshots
          path: artifacts/visual-audit/
          retention-days: 7
