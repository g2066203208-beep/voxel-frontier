name: Expand real seismic record pool and screen replacements
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/expand-seismic-pool-20261124.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet numpy scipy matplotlib requests
      - name: Acquire and screen real paired records
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool/expand_and_screen.py
      - name: Preserve all results and originals
        run: |
          git config user.name paper-studio-bot
          git config user.email paper-studio-bot@users.noreply.github.com
          git add research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool/replacement_v3
          git commit -m 'Archive expanded actual earthquake record pool and source diagnostics'
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: T079-replacement-source-pool
          path: research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool/replacement_v3
