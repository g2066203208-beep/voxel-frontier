name: Materialize Terrain R4 Walkable Relief

on:
  push:
    branches: [feature/terrain-r4-geomorph-bake]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore walkable regional and local relief under global geomorph
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/src/world/PlanetSurface.cpp')
          s=p.read_text()
          old='        * (0.0100 * local + 0.0032 * micro + 0.00115 * fine + 0.00036 * ultra);'
          new='        * (0.0100 * local + 0.0038 * micro + 0.0062 * fine + 0.0018 * ultra);'
          if old not in s and new not in s:
              raise SystemExit('local relief expression not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          grep -q '0.0062 \* fine' native/src/world/PlanetSurface.cpp
      - name: Commit correction
        run: |
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'terrain: restore walkable local relief over R4 geomorph'
          git push origin HEAD:feature/terrain-r4-geomorph-bake
