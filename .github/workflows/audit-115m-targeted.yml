name: Audit 115m references targeted

on:
  push:
    paths:
      - '.github/workflows/audit-115m-targeted.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/README.md
            research/wind-tower/AGENTS.md
            research/wind-tower/audit
            research/wind-tower/governance
            research/wind-tower/manuscript/final-thesis
            research/wind-tower/experiments/T061
            research/wind-tower/experiments/T035
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation
          sparse-checkout-cone-mode: false
      - name: Grep
        shell: bash
        run: |
          grep -RInEi --exclude='*.pdf' --exclude='*.png' --exclude='*.jpg' --exclude='*.zip' \
            '115\.63|115 ?m|115m|115\.6' research/wind-tower || true
