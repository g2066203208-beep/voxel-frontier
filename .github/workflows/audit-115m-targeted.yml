name: Audit active 115m references

on:
  push:
    paths:
      - '.github/workflows/audit-115m-targeted.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/T061
            research/wind-tower/manuscript/final-thesis
            research/wind-tower/governance
          sparse-checkout-cone-mode: false
      - name: Grep active workspace
        shell: bash
        run: |
          echo '=== ACTIVE occurrences; intentional identity warnings may remain ==='
          grep -RInEi '115\.63|115 ?m|115m|115\.6' \
            research/wind-tower/experiments/T061 \
            research/wind-tower/manuscript/final-thesis \
            research/wind-tower/governance || true
