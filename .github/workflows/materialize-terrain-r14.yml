name: Materialize Terrain R14 Relief Quality

on:
  push:
    branches: [test/terrain-r14-relief-quality]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize R14 source anchors
        run: python3 .github/scripts/prepare_r14_anchor.py
      - name: Apply R14 patch
        run: python3 .github/scripts/materialize_terrain_r14.py
      - name: Verify R14 markers
        run: |
          grep -q 'R14 plateau authority' native/src/world/PlanetSurface.cpp
          grep -q 'R14 coast authority' native/src/world/PlanetSurface.cpp
          grep -q 'R14 mid-distance density' native/src/app/Main.cpp
          grep -q 'R14 water readability' native/shaders/planet.slang
          git diff --check
      - name: Commit materialized R14 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp native/shaders/planet.slang
          git commit -m 'terrain: materialize R14 relief quality [skip ci]'
          git push origin HEAD:test/terrain-r14-relief-quality
