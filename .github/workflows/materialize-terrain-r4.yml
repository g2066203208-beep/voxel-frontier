name: Materialize Terrain R4 Geomorph

on:
  push:
    branches: [feature/terrain-r4-geomorph-bake]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-terrain-r4
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch R4 geomorph authority and evidence targeting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('native/src/world/PlanetSurface.cpp')
          s = p.read_text()
          inc = '#include "vf/world/PlanetSurface.hpp"\n'
          if '#include "vf/world/PlanetGeomorph.hpp"' not in s:
              s = s.replace(inc, inc + '#include "vf/world/PlanetGeomorph.hpp"\n', 1)

          marker = '    // Walking-scale geometry. Frequencies now span tens of kilometres down to a few\n'
          inject = '''    // R4 macro authority: a globally baked DEM is hydrologically conditioned with\n    // Priority-Flood, downhill discharge accumulation, hydraulic incision and conservative\n    // thermal relaxation. The old analytic sin()-river remains diagnostic only; it no longer\n    // controls the actual terrain elevation.\n    const GlobalGeomorphSample geomorph = sampleGlobalGeomorph(\n        definition.seed, definition.radius, definition.maxElevation, d);\n    elevation = geomorph.elevationMeters;\n    const double geomorphLandness = smooth01(-80.0, 220.0, geomorph.elevationMeters);\n\n'''
          if 'const GlobalGeomorphSample geomorph' not in s:
              if marker not in s:
                  raise SystemExit('walking-scale marker not found')
              s = s.replace(marker, inject + marker, 1)

          old = '''    const double detailDamp = landness\n        * (1.0 - 0.72 * wetland) * (1.0 - 0.52 * plateau);'''
          new = '''    const double detailDamp = geomorphLandness\n        * (1.0 - 0.72 * std::max(wetland, geomorph.floodplain))\n        * (1.0 - 0.52 * plateau);'''
          if old in s:
              s = s.replace(old, new, 1)

          replacements = {
              '    sample.continentalness = continentalness;': '    sample.continentalness = geomorph.continentalness;',
              '    sample.mountain = mountain;': '    sample.mountain = std::max(mountain, geomorph.mountain);',
              '    sample.river = river;': '    sample.river = geomorph.river;',
              '    sample.canyon = canyon;': '    sample.canyon = std::max(canyon, geomorph.incision);',
              '    sample.wetland = wetland;': '    sample.wetland = std::max(wetland, geomorph.floodplain);',
          }
          for a,b in replacements.items():
              if a in s:
                  s = s.replace(a,b,1)
          p.write_text(s)

          m = Path('native/src/app/Main.cpp')
          s = m.read_text()
          if '#include <cstdlib>' not in s:
              s = s.replace('#include <cstdint>\n', '#include <cstdint>\n#include <cstdlib>\n', 1)
          if '#include <string_view>' not in s:
              s = s.replace('#include <sstream>\n', '#include <sstream>\n#include <string_view>\n', 1)

          anchor = '''    glm::dvec3 best = preferred;\n    double bestScore = -std::numeric_limits<double>::infinity();\n    bool found = false;\n'''
          repl = anchor + '''    const char* captureEnv = std::getenv("VF_CAPTURE_LANDFORM");\n    const std::string_view captureMode = captureEnv != nullptr ? std::string_view{captureEnv} : std::string_view{};\n'''
          if 'VF_CAPTURE_LANDFORM' not in s:
              if anchor not in s:
                  raise SystemExit('spawn anchor not found')
              s = s.replace(anchor,repl,1)

          loop_anchor = '''        const vf::PlanetTerrainSample terrain = vf::samplePlanetTerrain(planet, d);\n        const double aboveSea = terrain.elevationMeters - planet.seaLevelElevationMeters;\n'''
          loop_repl = '''        const vf::PlanetTerrainSample terrain = vf::samplePlanetTerrain(planet, d);\n        const double aboveSea = terrain.elevationMeters - planet.seaLevelElevationMeters;\n        if (!captureMode.empty()) {\n            if (terrain.submerged(planet) || aboveSea < 15.0) continue;\n            double captureScore = -std::numeric_limits<double>::infinity();\n            if (captureMode == "mountain")\n                captureScore = terrain.mountain * 5.0 + aboveSea / 2200.0 + terrain.canyon * 0.8;\n            else if (captureMode == "river")\n                captureScore = terrain.river * 6.0 + terrain.canyon * 1.8 - std::max(0.0, aboveSea - 1800.0) / 1800.0;\n            else if (captureMode == "coast")\n                captureScore = terrain.coastalCliff * 5.0 - std::abs(aboveSea - 80.0) / 600.0 + terrain.mountain * 0.4;\n            else if (captureMode == "highland")\n                captureScore = terrain.plateau * 4.0 + terrain.mountain * 1.6 + aboveSea / 2600.0;\n            if (captureScore > bestScore) {\n                bestScore = captureScore;\n                best = d;\n                found = true;\n            }\n            continue;\n        }\n'''
          if 'captureScore = terrain.mountain' not in s:
              if loop_anchor not in s:
                  raise SystemExit('spawn loop anchor not found')
              s = s.replace(loop_anchor,loop_repl,1)
          m.write_text(s)
          PY
      - name: Verify source integration markers
        run: |
          grep -q 'PlanetGeomorph.hpp' native/src/world/PlanetSurface.cpp
          grep -q 'sampleGlobalGeomorph' native/src/world/PlanetSurface.cpp
          grep -q 'VF_CAPTURE_LANDFORM' native/src/app/Main.cpp
      - name: Commit materialized R4 source
        run: |
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp
          git commit -m 'terrain: integrate global hydrology geomorph authority R4'
          git push origin HEAD:feature/terrain-r4-geomorph-bake
