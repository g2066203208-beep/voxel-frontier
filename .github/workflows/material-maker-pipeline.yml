name: Procedural Material Bake

on:
  push:
    branches:
      - work/r24-unified-planetary-physics
    paths:
      - tools/material-pipeline/recipes/**
      - .github/workflows/material-maker-pipeline.yml
  workflow_dispatch:
    inputs:
      recipe:
        description: Optional recipe basename without .ptex; blank bakes all recipes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: procedural-materials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake-materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MM_VERSION: "1.7"
      MM_ARCHIVE_SHA256: "c8e3b6f1993540875d26fe49645c91511bba36cda0412c715bd13249f7141647"
      MM_URL: "https://github.com/RodZill4/material-maker/releases/download/1.7/material_maker_1_7_linux.tar.gz"
      OUT_ROOT: "build/generated-materials"

    steps:
      - name: Checkout r24 source
        uses: actions/checkout@v4

      - name: Install software Vulkan and X11 runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            mesa-vulkan-drivers \
            vulkan-tools \
            libgl1 \
            libx11-6 \
            libxcursor1 \
            libxinerama1 \
            libxrandr2 \
            libxi6 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libasound2t64

      - name: Download pinned Material Maker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/material-maker
          curl --fail --location --retry 4 --retry-delay 2 "$MM_URL" -o .cache/material-maker/mm.tar.gz
          echo "$MM_ARCHIVE_SHA256  .cache/material-maker/mm.tar.gz" | sha256sum --check --strict
          tar -xzf .cache/material-maker/mm.tar.gz -C .cache/material-maker
          find .cache/material-maker -maxdepth 3 -type f -print

      - name: Locate Material Maker executable
        id: mm
        shell: bash
        run: |
          set -euo pipefail
          MM_BIN="$(find "$PWD/.cache/material-maker" -type f -perm -111 \( -iname 'material_maker*' -o -iname 'material-maker*' \) | head -n 1)"
          if [[ -z "$MM_BIN" ]]; then
            echo "Material Maker executable not found" >&2
            exit 1
          fi
          echo "bin=$MM_BIN" >> "$GITHUB_OUTPUT"
          echo "Material Maker executable: $MM_BIN"

      - name: Verify software Vulkan
        shell: bash
        run: |
          set -euo pipefail
          vulkaninfo --summary | sed -n '1,120p'

      - name: Bake procedural PBR materials
        shell: bash
        env:
          MM_BIN: ${{ steps.mm.outputs.bin }}
          REQUESTED_RECIPE: ${{ inputs.recipe }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT"

          mapfile -t RECIPES < <(find tools/material-pipeline/recipes -maxdepth 1 -type f -name '*.ptex' | sort)
          if [[ ${#RECIPES[@]} -eq 0 ]]; then
            echo "No .ptex recipes found" >&2
            exit 1
          fi

          if [[ -n "${REQUESTED_RECIPE:-}" ]]; then
            RECIPES=("tools/material-pipeline/recipes/${REQUESTED_RECIPE}.ptex")
            [[ -f "${RECIPES[0]}" ]] || { echo "Requested recipe does not exist: ${RECIPES[0]}" >&2; exit 1; }
          fi

          MM_DIR="$(dirname "$MM_BIN")"
          MM_EXE="./$(basename "$MM_BIN")"

          for recipe in "${RECIPES[@]}"; do
            name="$(basename "$recipe" .ptex)"
            recipe_abs="$(realpath "$recipe")"
            out_abs="$(realpath -m "$OUT_ROOT/$name")"
            mkdir -p "$out_abs"

            echo "::group::Bake $name"
            (
              cd "$MM_DIR"
              xvfb-run -a "$MM_EXE" \
                --rendering-method gl_compatibility \
                --export-material \
                -o "$out_abs" \
                --output-file "$name" \
                "$recipe_abs"
            )
            echo "::endgroup::"

            cp "$recipe" "$out_abs/${name}.ptex"

            mapfile -t PNGS < <(find "$out_abs" -type f -name '*.png' | sort)
            if [[ ${#PNGS[@]} -lt 3 ]]; then
              echo "Expected at least 3 PBR PNG maps for $name, found ${#PNGS[@]}" >&2
              find "$out_abs" -maxdepth 2 -type f -ls
              exit 1
            fi

            {
              echo "generator=RodZill4/material-maker"
              echo "generator_version=$MM_VERSION"
              echo "generator_archive_sha256=$MM_ARCHIVE_SHA256"
              echo "recipe=$recipe"
              echo "recipe_sha256=$(sha256sum "$recipe" | awk '{print $1}')"
              echo "source_commit=$GITHUB_SHA"
              echo "generated_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "maps=${#PNGS[@]}"
              for png in "${PNGS[@]}"; do
                echo "file=$(basename "$png") sha256=$(sha256sum "$png" | awk '{print $1}') bytes=$(stat -c %s "$png")"
              done
            } > "$out_abs/manifest.txt"
          done

          echo "Generated files:"
          find "$OUT_ROOT" -type f -maxdepth 3 -print | sort

      - name: Upload generated material pack
        uses: actions/upload-artifact@v4
        with:
          name: r24-procedural-materials-${{ github.run_id }}
          path: build/generated-materials/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Publish generation summary
        shell: bash
        run: |
          {
            echo '## Procedural material bake'
            echo
            echo "- Generator: Material Maker $MM_VERSION"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo '- Method: deterministic procedural node graphs; no neural image generation'
            echo
            echo '### Files'
            echo '```text'
            find "$OUT_ROOT" -type f -maxdepth 3 -printf '%P\n' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
