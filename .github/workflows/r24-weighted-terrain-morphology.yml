name: R24 Weighted Terrain Morphology

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_weighted_terrain_morphology.py'
      - '.github/workflows/r24-weighted-terrain-morphology.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-weighted-terrain-morphology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply weighted terrain morphology
        run: python .github/scripts/r24_weighted_terrain_morphology.py

      - name: Validate generated production source
        shell: pwsh
        run: |
          git diff --check
          Select-String -Path native/src/world/PlanetSurface.cpp -Pattern 'weightedFineRidge' -Quiet | Out-Null
          Select-String -Path native/src/world/PlanetSurface.cpp -Pattern 'canyonShoulder' -Quiet | Out-Null
          Select-String -Path native/src/world/PlanetSurface.cpp -Pattern 'terrainWeathering' -Quiet | Out-Null
          if (Select-String -Path native/src/world/PlanetSurface.cpp -Pattern 'epicOrogeny' -Quiet) { throw 'legacy epicOrogeny still present' }

      - name: Configure Windows runtime
        run: cmake -S native -B build/r24-weighted-win -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Windows runtime
        run: cmake --build build/r24-weighted-win --config Release --parallel

      - name: Run full Windows tests
        run: ctest --test-dir build/r24-weighted-win -C Release --verbose --output-on-failure

  linux-vulkan:
    needs: windows-native
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply weighted terrain morphology
        run: python3 .github/scripts/r24_weighted_terrain_morphology.py

      - name: Validate production changes
        run: |
          git diff --check
          grep -q 'weightedFineRidge' native/src/world/PlanetSurface.cpp
          grep -q 'canyonShoulder' native/src/world/PlanetSurface.cpp
          grep -q 'terrainWeathering' native/src/world/PlanetSurface.cpp
          ! grep -q 'epicOrogeny' native/src/world/PlanetSurface.cpp
          grep -q 'radialReliefRadius' native/src/world/PlanetLodMeshBuilder.cpp
          grep -q 'highestEvidenceElevation' native/src/app/Main.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Linux runtime
        run: cmake -S native -B build/r24-weighted -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Linux runtime
        run: cmake --build build/r24-weighted --parallel 2

      - name: Run full Linux native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-weighted --verbose --output-on-failure 2>&1 | tee r24-weighted-ctest.log

      - name: Gate physical terrain hierarchy
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-weighted --verbose --output-on-failure \
            -R 'vf_terrain_landform_tests|vf_r24_physical_planet_tests|vf_r24_runtime_stability_tests' \
            2>&1 | tee r24-weighted-focused.log
          grep -q 'mountain_local_relief_m=' r24-weighted-focused.log
          grep -q 'rift_local_relief_m=' r24-weighted-focused.log
          grep -q 'abyss=' r24-weighted-focused.log

      - name: Verify Lavapipe Vulkan
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real production weighted terrain
        shell: bash
        run: |
          APP="$(find build/r24-weighted -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-weighted-terrain-evidence

      - name: Gate camera and real target relief
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('r24-weighted-terrain-evidence/logs')
          limits = {'mountain': 4500.0, 'rift': 1800.0, 'canyon': 2200.0, 'abyss': 4500.0}
          for target, required in limits.items():
              text = (root / f'{target}.log').read_text(encoding='utf-8', errors='replace')
              contrast = re.findall(r'contrast_m=([0-9.]+)', text)
              altitude = re.findall(r'deterministic aerial camera altitude=([0-9.]+)', text)
              lift = re.findall(r'relief_lift_m=([0-9.]+)', text)
              if not contrast or not altitude or not lift:
                  raise SystemExit(f'{target}: missing terrain diagnostics')
              c = float(contrast[-1]); a = float(altitude[-1]); l = float(lift[-1])
              print(f'{target}: contrast_m={c:.1f} altitude_m={a:.1f} relief_lift_m={l:.1f}')
              if c < required:
                  raise SystemExit(f'{target}: real rendered relief {c:.1f} < {required:.1f} m')
              if a <= 0.0:
                  raise SystemExit(f'{target}: invalid camera clearance')
          PY

      - name: Preserve exact evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-weighted-terrain-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-weighted-terrain-evidence ]]; then
            cp -a r24-weighted-terrain-evidence/. "$EVIDENCE_DIR/"
          fi
          [[ -f r24-weighted-ctest.log ]] && cp -f r24-weighted-ctest.log "$EVIDENCE_DIR/" || true
          [[ -f r24-weighted-focused.log ]] && cp -f r24-weighted-focused.log "$EVIDENCE_DIR/" || true
          [[ -f vulkan-summary.txt ]] && cp -f vulkan-summary.txt "$EVIDENCE_DIR/" || true
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-weighted-terrain-${{ github.run_id }}
          path: |
            r24-weighted-terrain-evidence/**
            r24-weighted-ctest.log
            r24-weighted-focused.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested weighted terrain
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          git commit -m "fix(r24): weight terrain frequencies by geomorphic scale"
          git reset --hard HEAD
          git clean -fd build/r24-weighted || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
