name: Materialize Terrain R9 Visibility Fixes

on:
  push:
    branches: [test/terrain-r9-geomorph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R9 source patch
        run: python3 .github/scripts/materialize_terrain_r9.py
      - name: Verify R9 markers
        run: |
          grep -q 'R9 plateau detail suppression' native/src/world/PlanetSurface.cpp
          grep -q 'R9 capture visibility' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized R9 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp
          git commit -m 'terrain: materialize R9 visibility fixes [skip ci]'
          git push origin HEAD:test/terrain-r9-geomorph
