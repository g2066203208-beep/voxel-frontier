name: S06 archived 158m tower provenance (static only)
on:
  push:
    paths:
      - '.github/workflows/s06-archived-tower-provenance.yml'
      - 'research/wind-tower/experiments/T062/s06_ntm_fst_ed_31seg_gage_contract.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-source-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
          sparse-checkout-cone-mode: false
      - name: Inspect archived tower source members and possible generator files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, re, zipfile
          from pathlib import Path
          archive=Path('research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip')
          assert archive.is_file(), 'Source ZIP absent'
          expected='f738d35fc9c8b8d8745f2ed9490c92578b056cfe37201bbfa0bfdb24906d2983'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          archive_sha=sha(archive.read_bytes())
          rows=[];source_hits=[];source_scripts=[]
          with zipfile.ZipFile(archive) as z:
              entries=[x for x in z.infolist() if not x.is_dir()]
              for x in entries:
                  basename=x.filename.rsplit('/',1)[-1]
                  if basename=='C02R3R2_158M_Tower.dat':
                      b=z.read(x)
                      rows.append(dict(path=x.filename,bytes=len(b),sha256=sha(b),expected_sha=(sha(b)==expected)))
                  elif Path(basename).suffix.lower() in {'.py','.m','.jl','.sh','.json','.yaml','.yml','.md','.txt'} and x.file_size<2_000_000:
                      b=z.read(x)
                      if 0 in b[:1024]: continue
                      s=b.decode('utf-8',errors='replace')
                      hits=[n for n,line in enumerate(s.splitlines(),1) if re.search('TMassDen|TwEAStff|TwFAStif|C02R3R2_158M_Tower',line,re.I)]
                      if Path(basename).suffix.lower() in {'.py','.m','.jl','.sh'}:
                          source_scripts.append(dict(path=x.filename,sha256=sha(b),bytes=len(b),
                              mentions_tower_columns=bool(re.search(r'TMassDen|TwEAStff|TwFAStif',s,re.I)),
                              mentions_tower_filename=bool(re.search(r'C02R3R2_158M_Tower',s,re.I)),
                              has_numeric_property_formula=bool(re.search(r'(?:TwEAStff|TwFAStif|TMassDen)\s*(?:\[|=)',s,re.I))))
                      if hits:source_hits.append(dict(path=x.filename,sha256=sha(b),line_numbers=hits[:20],total_hits=len(hits)))
          assert rows, 'No exact 158m tower files found in source archive'
          # Read the actual matching lines: a filename reference is not a property generator.
          with zipfile.ZipFile(archive) as z:
              for hit in source_hits:
                  lines=z.read(hit['path']).decode('utf-8',errors='replace').splitlines()
                  context=[]
                  for n in hit['line_numbers']:
                      context.append({'line':n,'nearby':[
                          {'n':i+1,'text':lines[i][:300]}
                          for i in range(max(0,n-3),min(len(lines),n+2))]})
                  hit['matching_source_context']=context
                  hit['property_columns_named']=any(re.search(r'TMassDen|TwEAStff|TwFAStif',lines[n-1],re.I) for n in hit['line_numbers'])
          print('SOURCE_REFERENCE_CONTEXT='+json.dumps(source_hits,ensure_ascii=False))
          out=Path('s06-source-inventory');out.mkdir()
          with (out/'tower_member_hashes.csv').open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          report=dict(archive_path=str(archive),archive_sha256=archive_sha,zip_member_count=len(entries),
              tower_member_count=len(rows),tower_unique_sha256=sorted({x['sha256'] for x in rows}),
              all_towers_match_expected=all(x['expected_sha'] for x in rows),
              expected_tower_sha256=expected,source_candidates_in_zip=source_hits,
              source_scripts_in_first_archive=source_scripts,
              limitation='Archive member inspection only; does not establish tower mass/EI generator provenance outside ZIP',
              native_abaqus='NOT_RUN',native_openfast='NOT_RUN',standard_fulltext='NOT_READ',
              stage='S06_PARTIAL_HOLD',physical_error_budget='NEED_ESTIMATE')
          (out/'source_provenance.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:report[k] for k in ('archive_sha256','zip_member_count','tower_member_count','tower_unique_sha256','all_towers_match_expected','source_candidates_in_zip','source_scripts_in_first_archive')},ensure_ascii=False))
          if not report['all_towers_match_expected']:
              raise SystemExit('HOLD: archive tower inputs differ from registered source hash')
          print('STATIC SOURCE IDENTITY ONLY; NO PHYSICS PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s06-archive-tower-source-inventory
          path: s06-source-inventory/
          retention-days: 14

  original-fst-ed-31cseg-source-contract:
    if: github.event_name == 'push' && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/experiments/T038/model-disclosure-20261005/tower-segment-geometry-mesh.csv
            research/wind-tower/experiments/T062/s06_ntm_fst_ed_31seg_gage_contract.py
            research/wind-tower/experiments/T062/S06_31CSEG_ORIGINAL_ED_GAGE_MAPPING_20261031.csv
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
          sparse-checkout-cone-mode: false
      - name: Validate real source bytes, plan 31 segment nodes, reject invalid test inputs
        shell: bash
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T062/s06_ntm_fst_ed_31seg_gage_contract.py
          python3 -m py_compile "$script"
          python3 "$script" --self-test
          python3 "$script" \
            --zip research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip \
            --geometry research/wind-tower/experiments/T038/model-disclosure-20261005/tower-segment-geometry-mesh.csv \
            --outdir research/wind-tower/experiments/T062
          sha256sum "$script" \
            research/wind-tower/experiments/T062/S06_31CSEG_ORIGINAL_ED_GAGE_MAPPING_20261031.csv \
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
          echo 'SOURCE CONFIGURATION QC ONLY: no 31-gage native histories, no DLC1.2/physics PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: s06-original-fst-ed-31cseg-source-contract
          path: |
            research/wind-tower/experiments/T062/S06_31CSEG_ORIGINAL_ED_GAGE_MAPPING_20261031.csv
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
          retention-days: 14
      - name: Save only small verified source mapping to PR draft branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/t080-seismic-integration-gates-20261022'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/wind-tower/experiments/T062/S06_31CSEG_ORIGINAL_ED_GAGE_MAPPING_20261031.csv \
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
          if git diff --cached --quiet; then
            echo 'NO_CHANGE_SOURCE_VERIFIED'
          else
            git commit -m 'data(S06): retain original FST/ED source contract and 31 CSEG node mapping'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
