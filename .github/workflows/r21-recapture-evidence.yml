name: R21 Recapture Terrain And Celestial Motion

on:
  push:
    branches: [work/r21-recapture-evidence]
  workflow_dispatch:

concurrency:
  group: r21-recapture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recapture:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Patch evidence-only landform camera altitude
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/src/app/Main.cpp')
          s = p.read_text()
          old = '''            const double cameraLift = captureMode == "mountain" ? 120.0
                : (captureMode == "highland" ? 105.0
                : (captureMode == "coast" ? 45.0 : 180.0));'''
          new = '''            // Evidence-only overview camera: the old near-surface values hid kilometre-scale
            // relief behind the local horizon. Production gameplay camera behavior is untouched.
            const double cameraLift = captureMode == "mountain" ? 5500.0
                : (captureMode == "highland" ? 3000.0
                : (captureMode == "coast" ? 1500.0 : 1500.0));'''
          if old not in s:
              raise SystemExit('landform camera block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff -- native/src/app/Main.cpp

      - name: Build real Vulkan runtime
        run: |
          cmake -S native -B build/visual -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=OFF
          cmake --build build/visual --parallel

      - name: Verify Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture kilometre-scale landforms
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11 DISPLAY=:99 VF_CELESTIAL_TIME_SCALE=1
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp >xvfb-landforms.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2
          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p recapture

          capture_landform() {
            local mode="$1"
            local log="recapture/${mode}.log"
            stdbuf -oL -eL env VF_CAPTURE_LANDFORM="$mode" "$APP" >"$log" 2>&1 &
            local pid=$!
            local ready=0
            for t in $(seq 1 70); do
              sleep 2
              if grep -q 'Capture target elevation' "$log"; then ready=1; break; fi
              kill -0 "$pid" 2>/dev/null || break
            done
            test "$ready" -eq 1
            sleep 7
            import -display :99 -window root "recapture/${mode}-overview.png"
            local colors
            colors="$(convert "recapture/${mode}-overview.png" -format '%k' info:)"
            echo "${mode} unique_colors=${colors}" | tee -a recapture/capture-info.txt
            test "$colors" -gt 64
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            sleep 1
          }

          capture_landform mountain
          capture_landform highland
          capture_landform coast
          capture_landform river

          montage recapture/mountain-overview.png recapture/highland-overview.png \
                  recapture/coast-overview.png recapture/river-overview.png \
                  -tile 2x2 -geometry 800x450+0+0 recapture/terrain-montage.png
          identify recapture/*-overview.png recapture/terrain-montage.png | tee -a recapture/capture-info.txt
          grep -hE 'Capture target elevation|Spawn land elevation:' recapture/*.log > recapture/terrain-physics.txt || true
          cat recapture/terrain-physics.txt

      - name: Capture physical celestial motion at two times
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11 DISPLAY=:99
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp >xvfb-celestial.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2
          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p recapture

          # Same physical camera, same physical Sun, two times. At 3600x a nominal 60 Hz frame
          # advances about 60 simulated seconds per call, matching the R21 integrator substep bound.
          stdbuf -oL -eL env VF_CAPTURE_CELESTIAL=sun VF_CELESTIAL_TIME_SCALE=3600 "$APP" >recapture/sun-motion.log 2>&1 &
          pid=$!
          ready=0
          for t in $(seq 1 70); do
            sleep 2
            if grep -q 'Celestial capture: sun' recapture/sun-motion.log; then ready=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
          done
          test "$ready" -eq 1
          sleep 3
          import -display :99 -window root recapture/sun-t0.png
          sleep 2
          import -display :99 -window root recapture/sun-t-plus-2h.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          convert recapture/sun-t0.png recapture/sun-t-plus-2h.png +append recapture/sun-motion-pair.png
          compare -metric AE recapture/sun-t0.png recapture/sun-t-plus-2h.png recapture/sun-motion-diff.png 2>recapture/sun-motion-ae.txt || true
          identify recapture/sun-t0.png recapture/sun-t-plus-2h.png recapture/sun-motion-pair.png | tee -a recapture/capture-info.txt
          grep -hE 'Celestial capture:|Aster-Sun distance:|Aster-Luna distance:' recapture/sun-motion.log > recapture/celestial-physics.txt || true
          cat recapture/celestial-physics.txt
          cat recapture/sun-motion-ae.txt

      - name: Upload recaptured evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r21-recapture-terrain-celestial-${{ github.sha }}
          path: |
            recapture
            vulkan-summary.txt
            xvfb-landforms.log
            xvfb-celestial.log
          if-no-files-found: error
          retention-days: 30
