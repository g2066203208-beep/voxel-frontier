name: R21 Recapture Terrain And Celestial Motion

on:
  push:
    branches: [work/r21-recapture-evidence]
  workflow_dispatch:

concurrency:
  group: r21-recapture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recapture:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick xdotool mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Build real Vulkan runtime
        run: |
          cmake -S native -B build/visual -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=OFF
          cmake --build build/visual --parallel

      - name: Verify Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Recapture landforms with aerial oblique views
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11 DISPLAY=:99 VF_CELESTIAL_TIME_SCALE=1
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2
          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p recapture

          wait_for_target() {
            local log="$1"
            for t in $(seq 1 60); do
              sleep 2
              grep -q 'Capture target elevation' "$log" && return 0
            done
            return 1
          }

          capture_landform() {
            local mode="$1" forward_s="$2" up_s="$3" pitch="$4"
            local log="recapture/${mode}.log"
            stdbuf -oL -eL env VF_CAPTURE_LANDFORM="$mode" "$APP" >"$log" 2>&1 &
            local pid=$!
            wait_for_target "$log"
            sleep 5
            local window
            window="$(xdotool search --name 'Voxel Frontier' 2>/dev/null | head -n 1 || true)"
            if [ -n "$window" ]; then
              xdotool windowactivate --sync "$window" || true
              if [ "$forward_s" != "0" ]; then
                xdotool keydown --window "$window" w || true
                sleep "$forward_s"
                xdotool keyup --window "$window" w || true
              fi
              if [ "$up_s" != "0" ]; then
                xdotool keydown --window "$window" space || true
                sleep "$up_s"
                xdotool keyup --window "$window" space || true
              fi
              xdotool mousemove_relative -- 0 "$pitch" || true
              sleep 2
            fi
            import -display :99 -window root "recapture/${mode}-aerial.png"
            convert "recapture/${mode}-aerial.png" -format "${mode} unique_colors=%k\n" info: | tee -a recapture/capture-info.txt
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            sleep 1
          }

          # Move toward the already-selected physical feature before climbing. R21's old evidence
          # camera was often several kilometres outside the renderer's most legible local terrain.
          capture_landform mountain 10 5 180
          capture_landform highland 5 4 170
          capture_landform coast 0 3 210
          capture_landform river 1 3 190

          montage recapture/mountain-aerial.png recapture/highland-aerial.png \
                  recapture/coast-aerial.png recapture/river-aerial.png \
                  -tile 2x2 -geometry 800x450+0+0 recapture/terrain-montage.png
          identify recapture/*-aerial.png recapture/terrain-montage.png | tee -a recapture/capture-info.txt
          grep -hE 'Capture target elevation|Spawn land elevation:' recapture/*.log > recapture/terrain-physics.txt || true

      - name: Capture physical celestial motion at two times
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11 DISPLAY=:99
          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"

          # 3600x means roughly one simulated hour per real second at 60 fps while each individual
          # CelestialSystem step remains near its 60 s stability bound. The camera is initialized
          # once from the physical Sun direction; the second frame therefore shows actual apparent
          # celestial motion instead of a second hand-authored sky angle.
          stdbuf -oL -eL env VF_CAPTURE_CELESTIAL=sun VF_CELESTIAL_TIME_SCALE=3600 "$APP" >recapture/sun-motion.log 2>&1 &
          pid=$!
          for t in $(seq 1 60); do
            sleep 2
            grep -q 'Celestial capture: sun' recapture/sun-motion.log && break
          done
          sleep 5
          import -display :99 -window root recapture/sun-t0.png
          sleep 2
          import -display :99 -window root recapture/sun-t-plus-2h.png
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          convert recapture/sun-t0.png recapture/sun-t-plus-2h.png +append recapture/sun-motion-pair.png
          compare -metric AE recapture/sun-t0.png recapture/sun-t-plus-2h.png recapture/sun-motion-diff.png 2>recapture/sun-motion-ae.txt || true
          identify recapture/sun-t0.png recapture/sun-t-plus-2h.png recapture/sun-motion-pair.png | tee -a recapture/capture-info.txt
          grep -hE 'Celestial capture:|Aster-Sun distance:|Aster-Luna distance:' recapture/sun-motion.log > recapture/celestial-physics.txt || true
          cat recapture/celestial-physics.txt
          cat recapture/sun-motion-ae.txt

      - name: Upload recaptured evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r21-recapture-terrain-celestial-${{ github.sha }}
          path: |
            recapture
            vulkan-summary.txt
            xvfb.log
          if-no-files-found: error
          retention-days: 30
