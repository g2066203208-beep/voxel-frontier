name: R21 Full Terrain And Celestial Motion Evidence

on:
  push:
    branches:
      - work/r21-recapture-evidence
  workflow_dispatch:

concurrency:
  group: r21-recapture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Vulkan headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Patch evidence-only target search and camera
        run: |
          python3 .github/scripts/r21_full_evidence_patch.py
          git diff --check
          git diff -- native/src/app/Main.cpp

      - name: Build real Vulkan runtime
        run: |
          cmake -S native -B build/visual -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=OFF
          cmake --build build/visual --parallel

      - name: Verify Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture twelve landforms and celestial motion sequences
        run: |
          bash .github/scripts/r21_full_evidence_capture.sh

      - name: Upload complete visual evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r21-full-terrain-celestial-evidence-${{ github.sha }}
          path: |
            recapture
            vulkan-summary.txt
            xvfb-full-evidence.log
          if-no-files-found: error
          retention-days: 30
