name: Current tower settings studio audit (NO SOLVER)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - '.github/workflows/current-model-studio-source-ci.yml'
      - 'research/wind-tower/models/CURRENT_TOWER_SETTINGS_20261114.json'
      - 'src/current-model.ts'
      - 'src/current-model.test.ts'
      - 'src/source-evidence.ts'
      - 'src/source-evidence.test.ts'
      - 'src/main.ts'
      - 'src/style.css'
      - 'src/engineering.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify current model source-only UI
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          echo 'CURRENT_TOWER_STUDIO_SOURCE_TEST_AND_TYPESCRIPT_BUILD_PASS'
