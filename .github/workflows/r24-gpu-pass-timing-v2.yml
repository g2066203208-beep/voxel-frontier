name: R24 GPU Pass Timing V2

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_gpu_pass_timing_v2.py'
      - '.github/workflows/r24-gpu-pass-timing-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-gpu-pass-timing-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32

      - name: Materialize timing fix
        run: |
          set -euo pipefail
          python3 .github/scripts/r24_gpu_pass_timing_v2.py
          git diff --check
          grep -q 'R24_GPU_PASS_TIMING_V2_ALL_COMMANDS' native/src/render/VulkanRenderer.cpp
          test "$(grep -o 'VK_PIPELINE_STAGE_2_TOP_OF_PIPE_BIT' native/src/render/VulkanRenderer.cpp | wc -l)" -eq 0
          test "$(grep -o 'VK_PIPELINE_STAGE_2_BOTTOM_OF_PIPE_BIT' native/src/render/VulkanRenderer.cpp | wc -l)" -eq 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang" && unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n1)"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Release build and full regressions
        run: |
          set -euo pipefail
          mkdir -p evidence
          cmake -S native -B build/r24-gpu-timing-v2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
          cmake --build build/r24-gpu-timing-v2 --parallel 2
          ctest --test-dir build/r24-gpu-timing-v2 --verbose --output-on-failure 2>&1 | tee evidence/ctest.log
          grep -q '100% tests passed' evidence/ctest.log

      - name: Run 1080p profiler evidence
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n1)"
          test -n "$ICD"
          export VK_ICD_FILENAMES="$ICD"
          vulkaninfo --summary | tee evidence/vulkan-summary.txt
          grep -qi llvmpipe evidence/vulkan-summary.txt
          printf '%s\n' 'PERF_CLASS=CI_SW_RELATIVE_ONLY' 'TIMING_MODE=ISOLATED_ALL_COMMANDS' 'ABSOLUTE_120FPS_CERTIFICATION=INVALID_ON_SOFTWARE_VULKAN' > evidence/classification.txt
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > evidence/xvfb.log 2>&1 &
          XPID=$!; trap 'kill $XPID 2>/dev/null || true' EXIT
          export DISPLAY=:99 SDL_VIDEODRIVER=x11
          sleep 1
          APP="$(find build/r24-gpu-timing-v2 -type f -name voxel_frontier -perm -111 | head -n1)"
          env VF_PERF_PROFILE=mainstream_1080p VF_TERRAIN_TARGET=coast VF_CAPTURE_AERIAL=1 \
            VF_CAPTURE_ALTITUDE_METERS=1200 VF_RUNTIME_DIAGNOSTICS=1 VF_CELESTIAL_TIME_SCALE=1 \
            timeout 28s "$APP" > evidence/runtime.log 2>&1 &
          PID=$!; sleep 4
          import -window root evidence/runtime.png || true
          set +e; wait $PID; RC=$?; set -e
          test "$RC" -eq 0 -o "$RC" -eq 124
          identify evidence/runtime.png | grep -q '1920x1080'
          grep -q '^R24 GPU steady_pass_ms' evidence/runtime.log
          grep -q '^R24 BENCHMARK profile=' evidence/runtime.log
          tail -n 1 <(grep '^R24 GPU steady_pass_ms' evidence/runtime.log) > evidence/gpu-pass-final.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          line=Path('evidence/gpu-pass-final.txt').read_text()
          vals={k:float(v) for k,v in re.findall(r'(shadow_mean|opaque_mean|sky_mean|transparent_mean|total_mean)=([0-9.]+)',line)}
          if len(vals)!=5 or any(v < 0 or v > 500 for v in vals.values()): raise SystemExit(f'invalid isolated timings: {vals}')
          if abs(sum(vals[k] for k in ('shadow_mean','opaque_mean','sky_mean','transparent_mean'))-vals['total_mean']) > 0.01:
              raise SystemExit(f'pass total mismatch: {vals}')
          print(vals)
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v5
        with:
          name: r24-gpu-pass-timing-v2-${{ github.run_id }}
          path: evidence/**
          retention-days: 30

      - name: Promote measured profiler
        run: |
          set -euo pipefail
          DEST="docs/evidence/r24-gpu-pass-timing-v2-${GITHUB_RUN_ID}"
          mkdir -p "$DEST" && cp -a evidence/. "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/render/VulkanRenderer.cpp "$DEST"
          git commit -m 'perf(r24): isolate Vulkan GPU pass timestamps'
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
