name: Terrain R8 Real Vulkan Landform Gate

on:
  push:
    branches: [test/terrain-r8-geomorph]
  workflow_dispatch:

concurrency:
  group: terrain-r8-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Verify R8 source
        run: |
          grep -q 'R5 geomorph' native/include/vf/world/PlanetGeomorph.hpp
          grep -q 'R5 river corridor' native/src/world/PlanetSurface.cpp
          grep -q 'R5 river exclusion' native/src/world/ProceduralEcology.cpp
          grep -q 'R8 mountain hierarchy' native/src/world/PlanetSurface.cpp
          grep -q 'R8 plateau hierarchy' native/src/world/PlanetSurface.cpp
          grep -q 'R8 rugged coast' native/src/world/PlanetSurface.cpp
          grep -q 'R8 capture geometry' native/src/app/Main.cpp
          git diff --check
      - name: Configure core tests
        run: cmake -S native -B build/core -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=OFF -DVF_BUILD_TESTS=ON
      - name: Build core tests
        run: cmake --build build/core --parallel
      - name: Run terrain and engine tests
        run: ctest --test-dir build/core --verbose --output-on-failure

  real-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Verify R8 source
        run: |
          grep -q 'R8 mountain hierarchy' native/src/world/PlanetSurface.cpp
          grep -q 'R8 plateau hierarchy' native/src/world/PlanetSurface.cpp
          grep -q 'R8 rugged coast' native/src/world/PlanetSurface.cpp
          grep -q 'R8 capture geometry' native/src/app/Main.cpp
          git diff --check
      - name: Install Vulkan headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version
      - name: Configure and build Vulkan runtime
        run: |
          cmake -S native -B build/visual -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=OFF
          cmake --build build/visual --parallel
      - name: Verify real Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt
      - name: Capture R8 mountain river coast highland
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11
          export DISPLAY=:99
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2
          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r8-captures
          failures=0
          capture_mode() {
            mode="$1"
            VF_CAPTURE_LANDFORM="$mode" timeout 80s "$APP" >"r8-captures/runtime-$mode.log" 2>&1 &
            pid=$!
            sleep 24
            import -display :99 -window root "r8-captures/$mode.png"
            colors="$(convert "r8-captures/$mode.png" -format '%k' info:)"
            mean="$(convert "r8-captures/$mode.png" -colorspace Gray -format '%[fx:mean]' info:)"
            echo "$mode unique_colors=$colors gray_mean=$mean" | tee -a r8-captures/capture-info.txt
            if [ "$colors" -le 64 ]; then failures=$((failures+1)); fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            sleep 1
          }
          capture_mode mountain
          capture_mode river
          capture_mode coast
          capture_mode highland
          identify r8-captures/*.png | tee -a r8-captures/capture-info.txt
          echo "capture_failures=$failures" | tee -a r8-captures/capture-info.txt
          test "$failures" -eq 0
      - name: Upload R8 screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: terrain-r8-real-vulkan-${{ github.sha }}
          path: |
            r8-captures
            vulkan-summary.txt
            xvfb.log
          if-no-files-found: warn
