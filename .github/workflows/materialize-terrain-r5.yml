name: Materialize Terrain R5 Geomorph

on:
  push:
    branches: [test/terrain-r5-geomorph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R5 geomorph source
        run: |
          python3 .github/scripts/materialize_r5_geomorph.py
          git diff --check
          grep -q 'R5 geomorph' native/include/vf/world/PlanetGeomorph.hpp
          grep -q 'R5 river corridor' native/src/world/PlanetSurface.cpp
          grep -q 'R5 capture geometry' native/src/app/Main.cpp
          grep -q 'R5 river exclusion' native/src/world/ProceduralEcology.cpp
      - name: Commit materialized source
        run: |
          rm -f .github/scripts/materialize_r5_geomorph.py .github/workflows/materialize-terrain-r5.yml
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/include/vf/world/PlanetGeomorph.hpp native/src/world/PlanetSurface.cpp native/src/world/ProceduralEcology.cpp native/src/app/Main.cpp .github
          git commit -m 'terrain: materialize R5 geomorph candidate'
          git push origin HEAD:test/terrain-r5-geomorph
