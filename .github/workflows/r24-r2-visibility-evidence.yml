name: R24.1 Visibility And Moon Evidence

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_refine_visibility.py'
      - '.github/scripts/r24_capture_r2.sh'
      - '.github/workflows/r24-r2-visibility-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-r2-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout tracked R24
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/r24-unified-planetary-physics

      - name: Stage R24.1 refinement
        run: |
          python3 .github/scripts/r24_refine_visibility.py
          grep -q 'apparent_diameter_px' native/src/app/Main.cpp
          grep -q 'betaR = float3(5.802e-6' native/shaders/planet.slang
          grep -q 'testHydrologyAuthorityFadesBeforeRegionalGridEdge' native/tests/R24PhysicalPlanetTests.cpp
          git diff --check

      - name: Install Vulkan X11 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure C++23 Vulkan runtime
        run: cmake -S native -B build/r24-r2 -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build runtime and tests
        run: cmake --build build/r24-r2 --parallel 2

      - name: Run full correctness suite
        run: ctest --test-dir build/r24-r2 --verbose --output-on-failure

      - name: Verify Lavapipe Vulkan
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real R24.1 framebuffers
        run: |
          APP="$(find build/r24-r2 -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r24-r2-evidence
          bash .github/scripts/r24_capture_r2.sh "$APP" r24-r2-evidence
          cp vulkan-summary.txt r24-r2-evidence/
          git diff -- native/src/app/Main.cpp native/shaders/planet.slang native/tests/R24PhysicalPlanetTests.cpp \
            > r24-r2-evidence/source.patch

      - name: Commit tested R24.1 production source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/app/Main.cpp native/shaders/planet.slang native/tests/R24PhysicalPlanetTests.cpp
          if git diff --cached --quiet; then
            echo 'No production-source delta.'
          else
            git commit -m 'R24.1: improve aerial visibility and prove physical Moon tracking'
            git push origin HEAD:work/r24-unified-planetary-physics
          fi

      - name: Preserve diagnostics on every outcome
        if: always()
        run: |
          mkdir -p r24-r2-evidence
          cp -f vulkan-summary.txt r24-r2-evidence/ 2>/dev/null || true
          printf 'workflow_sha=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > r24-r2-evidence/workflow-source.txt

      - name: Upload every real framebuffer even when bad
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-r2-real-vulkan-evidence-${{ github.sha }}
          path: r24-r2-evidence/**
          if-no-files-found: warn
          retention-days: 30

  windows-r2:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout tracked R24
        uses: actions/checkout@v6
        with:
          ref: work/r24-unified-planetary-physics
      - name: Stage same R24.1 refinement
        run: python .github/scripts/r24_refine_visibility.py
      - name: Configure Windows x64
        run: cmake -S native -B build/windows-r24-r2 -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
      - name: Build Windows x64
        run: cmake --build build/windows-r24-r2 --config Release --parallel 2
      - name: Test Windows x64
        run: ctest --test-dir build/windows-r24-r2 -C Release --verbose --output-on-failure
