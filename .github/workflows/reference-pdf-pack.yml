name: Package all wind-tower reference PDFs

on:
  push:
    paths:
      - "research/wind-tower/references/**/*.pdf"
      - ".github/workflows/reference-pdf-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build <=85 MiB ZIP packs from every valid reference PDF
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, csv, os

          root=Path('research/wind-tower/references')
          out=root/'archives'
          out.mkdir(parents=True, exist_ok=True)
          for p in out.glob('all-reference-pdfs-part-*.zip'):
              p.unlink()

          files=[]
          for p in sorted(root.rglob('*.pdf')):
              if out in p.parents:
                  continue
              try:
                  with p.open('rb') as f:
                      if f.read(5) != b'%PDF-':
                          continue
              except OSError:
                  continue
              files.append(p)

          limit=85*1024*1024
          groups=[]; cur=[]; total=0
          for p in files:
              sz=p.stat().st_size
              if cur and total+sz>limit:
                  groups.append(cur); cur=[]; total=0
              cur.append(p); total+=sz
          if cur: groups.append(cur)

          manifest=[]
          for gi,grp in enumerate(groups,1):
              zpath=out/f'all-reference-pdfs-part-{gi:02d}.zip'
              with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_STORED,allowZip64=True) as z:
                  for p in grp:
                      rel=p.relative_to(root)
                      z.write(p, arcname=str(rel))
                      h=hashlib.sha256(p.read_bytes()).hexdigest()
                      manifest.append([gi,str(rel),p.stat().st_size,h])

          mpath=out/'ALL_REFERENCE_PDFS_ARCHIVE_MANIFEST.tsv'
          with mpath.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['part','path','bytes','sha256'])
              w.writerows(manifest)

          print(f'valid_pdfs={len(files)} parts={len(groups)}')
          for gi in range(1,len(groups)+1):
              z=out/f'all-reference-pdfs-part-{gi:02d}.zip'
              print(z, z.stat().st_size)
          PY

      - name: Commit ZIP packs and archive manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/references/archives
          if git diff --cached --quiet; then
            echo "No archive changes."
          else
            git commit -m "research: package all valid reference PDFs into GitHub ZIP archives"
            git pull --rebase origin main
            git push
          fi
