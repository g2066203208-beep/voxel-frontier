name: Materialize Terrain R7 Geomorph Refinement

on:
  push:
    branches: [test/terrain-r7-geomorph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R7 source patch
        run: python3 .github/scripts/materialize_terrain_r7.py
      - name: Verify R7 markers
        run: |
          grep -q 'R7 mountain refinement' native/src/world/PlanetSurface.cpp
          grep -q 'R7 plateau refinement' native/src/world/PlanetSurface.cpp
          grep -q 'R7 capture geometry' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized R7 source
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No source diff.'
            exit 0
          fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp
          git commit -m 'terrain: materialize R7 geomorph refinement [skip ci]'
          git push origin HEAD:test/terrain-r7-geomorph
