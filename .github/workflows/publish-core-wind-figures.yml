name: Publish thesis core wind figures
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-core-wind-figures.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: core-wind-figures
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            public/thesis-studio/wind-figures
            public/thesis-studio/editor-data
            public/thesis-studio/manuscript-workbench.html
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45422889134
          pattern: native-full-11.4-*-figures
          path: incoming
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-arphic-gbsn00lp
          python -m pip install numpy==1.26.4 scipy==1.13.1 matplotlib==3.9.2 pillow
      - name: Render and check the three figures
        run: |
          python public/thesis-studio/wind-figures/core/plot_core.py incoming/native-full-11.4-NTM-figures incoming/native-full-11.4-1ETM-figures public/thesis-studio/wind-figures/core
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          p=Path('public/thesis-studio/wind-figures/core')
          m=json.loads((p/'manifest.json').read_text())
          assert m['grid']==[51,51] and len(m['figures'])==3
          for f in m['figures']:
              with Image.open(p/(f+'.png')) as im:im.verify()
              assert (p/(f+'.svg')).read_text().rstrip().endswith('</svg>')
              assert (p/(f+'.pdf')).read_bytes().startswith(b'%PDF-')
          PY
      - name: Integrate verified figures in chapter 3
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('public/thesis-studio/editor-data/manuscript-v8-bem.json')
          j=json.loads(p.read_text()); c=next(c for c in j['chapters'] if c['id']=='03'); b=c['blocks']; ix={x['id']:x for x in b}
          assert j['online_revision']['version'] in ['V8-R11-WIND','V8-R12-WIND-CORE']
          ix['wind-r11-001']['text']='以额定风速11.4 m/s和A类参考湍流强度0.16为例，按式（3.2-3）计算NTM纵向脉动风速目标标准差为2.264 m/s，横向及竖向分别为1.8112和1.132 m/s。式（3.2-5）所示三分量目标谱用于随机风速的谱特性检验。'
          ix['wind-r11-003']['text']='由式（3.2-11）可知，空间间距增大时，同频率下的纵向风速目标相干程度降低；同一间距下，高频脉动的空间相干程度低于低频脉动。'
          ix['wind-r11-005']['text']='根据轮毂高度161.368806 m、叶轮直径178.3 m及200 m×200 m风场尺寸，构建51×51的转子扫掠面网格。为补充转子网格下方的入流，新生成风场启用TurbSim塔身补充风速节点，输出16个塔身节点，最低节点高程为1.369 m。风场离散及其空间覆盖如图3.2-1所示。塔架和叶片轮廓为几何示意，塔身风速节点的设置不等同于已完成塔身气动力计算。'
          def cap(id,t,f):
              x=ix[id];x.update(text=t,figure_caption_match=t,figure_asset='./wind-figures/core/'+f+'.svg');return x
          g=cap('wind-r11-006','图3.2-1  随机风场离散示意图','01_wind_grid')
          h=cap('wind-r11-002','图3.2-2  轮毂中心纵向风速时程','02_hub_wind_history')
          s=cap('wind-r11-004','图3.2-3  轮毂中心风速自谱与Kaimal目标谱对比','03_hub_autospectrum')
          def txt(id,t):return dict(id=id,kind='text',style='Normal',text=t,has_media=False,has_math=False,online_only=True)
          n=txt('wind-r12-001','为检验随机风场输入，采用OpenFAST v3.5.3 TurbSim生成额定风速11.4 m/s下的NTM和1ETM独立研究工况。两工况采用同一随机种子20261124、0.05 s时间步长及700 s计算时长，截取100～700 s的12000个采样点，按有效时段起点重新计时。图3.2-2给出轮毂中心纵向风速分量时程，虚线为参考平均风速。NTM与ETM的样本均值分别为11.495和11.547 m/s，样本标准差分别为2.176和3.377 m/s；ETM的波动幅度高于NTM。新生成的风场与历史36组整机计算的原始入流分别归档。')
          v=txt('wind-r12-002','采用Welch法估计轮毂中心纵向脉动风速自谱，选用2048点Hann窗、50%重叠和分段去均值，频率分辨率为0.009765625 Hz。由图3.2-3可见，两组模拟自谱总体呈现与Kaimal目标谱相近的衰减趋势。NTM和ETM纵向标准差的目标值分别为2.264和3.513 m/s，样本标准差相对偏差分别为−3.88%和−3.87%。上述结果为同一随机种子两类风况的数值检查，尚不能代替多种子统计、实测风场验证或正式设计载荷工况验收。')
          b[:]=[x for x in b if x['id'] not in {'wind-r11-002','wind-r11-004','wind-r11-006','wind-r12-001','wind-r12-002'}]
          at=next(i for i,x in enumerate(b) if x['id']=='wind-r11-005')+1;b[at:at]=[g,n,h,v,s]
          ids=[x['id'] for ch in j['chapters'] for x in ch['blocks']];assert len(ids)==len(set(ids))
          j['online_revision'].update(version='V8-R12-WIND-CORE',scope='Three core wind figures use two new full-grid native TurbSim cases; theoretical-only plots retained in archive, not in body; original Word/PDF unchanged.',wind_manifest='./wind-figures/core/manifest.json')
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Publish core figures and revised online manuscript together
        run: |
          git config user.name thesis-wind-archive
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/thesis-studio/wind-figures/core public/thesis-studio/editor-data/manuscript-v8-bem.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V8-R12: publish three verified core wind figures and chapter 3 narrative'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: core-wind-figures-11m4
          path: public/thesis-studio/wind-figures/core
          retention-days: 30
