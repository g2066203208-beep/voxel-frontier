name: Cute Neutral Human Blender

on:
  push:
    branches: [main]
    paths:
      - 'tools/procedural-human/blender/**'
      - '.github/workflows/origami-human-blender.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version
          blender --background --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Generate cute neutral basemesh GLB and real Blender render
        run: |
          mkdir -p artifacts/cute-neutral-human
          blender --background --python tools/procedural-human/blender/cute_neutral_basemesh_v11.py -- "$GITHUB_WORKSPACE/artifacts/cute-neutral-human"
          test -s artifacts/cute-neutral-human/neutral.glb
          test -s artifacts/cute-neutral-human/neutral-preview.png
          test -s artifacts/cute-neutral-human/metrics.json
          python3 - <<'PY'
          import json
          m=json.load(open('artifacts/cute-neutral-human/metrics.json'))
          assert m['neutral_only'] is True
          assert m['male_female_split'] is False
          assert m['extra_character_geometry'] is False
          assert m['hair'] is False and m['face_addons'] is False and m['clothing'] is False and m['props'] is False
          assert 850 <= m['tris'] <= 1100, m
          print(json.dumps(m, indent=2))
          PY

      - name: Upload Blender output
        uses: actions/upload-artifact@v4
        with:
          name: cute-neutral-human-blender
          path: artifacts/cute-neutral-human/
          if-no-files-found: error
          retention-days: 30
