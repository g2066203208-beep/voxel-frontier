name: Origami Human Blender

on:
  push:
    branches: [main]
    paths:
      - 'tools/procedural-human/blender/**'
      - '.github/workflows/origami-human-blender.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version
          blender --background --python-expr "import numpy; print('Blender numpy', numpy.__version__)"

      - name: Generate retro low-poly body-only GLB and real Blender render
        run: |
          mkdir -p artifacts/retro-lowpoly-human
          blender --background --python tools/procedural-human/blender/retro_lowpoly_human_v9.py -- "$GITHUB_WORKSPACE/artifacts/retro-lowpoly-human"
          test -s artifacts/retro-lowpoly-human/male.glb
          test -s artifacts/retro-lowpoly-human/female.glb
          test -s artifacts/retro-lowpoly-human/male-female-retro-lowpoly.png
          test -s artifacts/retro-lowpoly-human/metrics.json
          python3 - <<'PY'
          import json
          m=json.load(open('artifacts/retro-lowpoly-human/metrics.json'))
          assert m['extra_character_geometry'] is False
          assert m['hair'] is False and m['face_addons'] is False and m['clothing'] is False
          assert 650 <= m['male_tris'] <= 850, m
          assert 650 <= m['female_tris'] <= 850, m
          print(json.dumps(m, indent=2))
          PY

      - name: Upload Blender output
        uses: actions/upload-artifact@v4
        with:
          name: retro-lowpoly-human-blender
          path: artifacts/retro-lowpoly-human/
          if-no-files-found: error
          retention-days: 30
