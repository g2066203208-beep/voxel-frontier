name: Neutral Tailor Mannequin Blender

on:
  push:
    branches: [main]
    paths:
      - 'tools/procedural-human/blender/**'
      - '.github/workflows/origami-human-blender.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri
          blender --version
      - name: Generate and validate human-derived waist-up mannequin
        run: |
          mkdir -p artifacts/human-tailor-v23
          blender --background --python tools/procedural-human/blender/human_tailor_mannequin_v23.py -- "$GITHUB_WORKSPACE/artifacts/human-tailor-v23"
          test -s artifacts/human-tailor-v23/neutral-human-waist-up.glb
          test -s artifacts/human-tailor-v23/front.png
          test -s artifacts/human-tailor-v23/side.png
          test -s artifacts/human-tailor-v23/back.png
          test -s artifacts/human-tailor-v23/metrics.json
          python3 - <<'PY'
          import json,struct
          root='artifacts/human-tailor-v23';m=json.load(open(f'{root}/metrics.json'))
          assert m['original_human_surface'] is True
          assert m['neutral_only'] is True
          assert m['waist_up_only'] is True and m['head'] is True and m['full_arms'] is True and m['legs'] is False
          assert not any(m[k] for k in ['hair','face_addons','clothing','props'])
          assert m['single_continuous_shell'] is True
          assert m['connected_components']==1 and m['boundary_edges']==0 and m['nonmanifold_edges']==0
          assert 900 <= m['tris'] <= 1350, m
          assert m['glb_valid_mesh'] and m['glb_meshes']>0 and m['glb_primitives']>0
          data=open(f'{root}/neutral-human-waist-up.glb','rb').read();assert len(data)>1000 and data[:4]==b'glTF'
          off=12;doc=None
          while off+8<=len(data):
              ln,typ=struct.unpack_from('<II',data,off);off+=8;chunk=data[off:off+ln];off+=ln
              if typ==0x4E4F534A:doc=json.loads(chunk.decode().rstrip(' \x00'))
          assert doc and doc.get('meshes') and sum(len(x.get('primitives',[])) for x in doc['meshes'])>0
          print(json.dumps(m,indent=2));print('GLB bytes',len(data))
          PY
      - name: Upload Blender output
        uses: actions/upload-artifact@v4
        with:
          name: neutral-human-tailor-v23
          path: artifacts/human-tailor-v23/
          if-no-files-found: error
          retention-days: 30
