name: Build and Deploy Voxel Frontier

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build C++23 engine to WebAssembly SIMD
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            emscripten/emsdk:6.0.9 \
            bash -lc 'emcmake cmake -S engine -B build/wasm -DCMAKE_BUILD_TYPE=Release && cmake --build build/wasm --parallel'
          mkdir -p public/engine
          cp build/wasm/vf_engine.js public/engine/vf_engine.js
          cp build/wasm/vf_engine.wasm public/engine/vf_engine.wasm
          test -s public/engine/vf_engine.js
          test -s public/engine/vf_engine.wasm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build web client
        run: npm run build

      - name: Verify native engine is packaged
        run: |
          test -s dist/engine/vf_engine.js
          test -s dist/engine/vf_engine.wasm

      - name: Upload production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
