name: Deploy Paper Studio to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Abaqus viewer data
        run: |
          node scripts/read-abaqus.cjs
          node scripts/read-source-rna.cjs
          node scripts/audit-rebar-geometry.cjs
          node scripts/build-t046-rebar-completion.cjs
          node scripts/sanity-check-reported.mjs
          node scripts/check-material-audit.mjs

      - name: Run tests
        run: npm test

      - name: Upload T046 Abaqus candidates
        uses: actions/upload-artifact@v4
        with:
          name: T046-Abaqus-rebar-completion-candidates
          path: |
            artifacts/T046/*.inp.gz
            public/research/t046-rebar-report.json
          retention-days: 30
      - name: Build production site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
