name: Legacy Browser Prototype

# The browser build is retained only as a historical prototype.
# Production development and CI now target the native C++ desktop engine.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build legacy C++ WebAssembly engine
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            emscripten/emsdk:6.0.9 \
            bash -lc 'emcmake cmake -S engine -B build/wasm -DCMAKE_BUILD_TYPE=Release && cmake --build build/wasm --parallel'
          mkdir -p public/engine
          cp build/wasm/vf_engine.js public/engine/vf_engine.js
          cp build/wasm/vf_engine.wasm public/engine/vf_engine.wasm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build legacy web client
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy legacy prototype
        id: deployment
        uses: actions/deploy-pages@v4
