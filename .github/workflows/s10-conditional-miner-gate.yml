          curl -fLsS --retry 3 -o committed.csv "$root/T077/recovery/S10_4CASE_31SEG_P0_PE_UNIFORM_OFFSET_COUNTERFACTUAL_20261030.csv"
          echo "fff6dfcc6bc094353ebee042392033e8df47e7fb792ccc1812c0962c9c43f800  geometry.csv" | sha256sum -c -
          echo "16c9864ef7a344e5b97338c31ce26de6adb86c0f0f64942ef894fe9983926b2b  gross.csv" | sha256sum -c -
          echo "1d56cdf44971589dde25ab8075cdf50999a94eac47707eadfb4870cf74fc8f5d  committed.csv" | sha256sum -c -
      - name: Independently reproduce real 124-row P0/Pe sensitivity and negative tests (NOT physics)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile s10_pt_uniform_offset_counterfactual.py
          python3 s10_pt_uniform_offset_counterfactual.py --self-test
          python3 s10_pt_uniform_offset_counterfactual.py --geometry geometry.csv --gross gross.csv --check committed.csv
          python3 - <<'PY'
          import csv,math
          rows=list(csv.DictReader(open('committed.csv',newline='')))
          assert len(rows)==124
          assert len({(x['case'],x['segment']) for x in rows})==124
          assert all(x['status']=='COUNTERFACTUAL_UNIFORM_PT_SHIFT_NOT_LOCAL_OR_FATIGUE_OR_NATIVE' for x in rows)
          for x in rows:
              ng=int(x['n_of_16_angles_positive_peak_gross'])
              ne=int(x['n_of_16_angles_positive_peak_Pe'])
              n0=int(x['n_of_16_angles_positive_peak_P0'])
