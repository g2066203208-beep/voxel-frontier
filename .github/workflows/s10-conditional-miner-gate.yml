                                  float(x['Pe_shifted_max_sigma_MPa']),rel_tol=1e-10,abs_tol=1e-9)
          print('REAL_S10_PT_P0_PE_124ROW_MONOTONIC_QC_PASS_NOT_NATIVE_OR_LIFE')
