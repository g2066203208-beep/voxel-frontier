name: S10 conditional Miner accumulation (synthetic gate, NOT material life)
on:
  push:
    paths:
      - '.github/workflows/s10-conditional-miner-gate.yml'
      - 'research/wind-tower/experiments/T077/recovery/s10_miner_damage_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/s10_local_stress_rainflow_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/s10_native_odb_local_stress_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/s10_d400_pe_source_map_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/s10_azimuth_height_candidate_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/s10_candidate_run_card_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv'
      - 'research/wind-tower/experiments/T077/recovery/s10_native_part_station_binding_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/S10_68PART_NATIVE_STRESS_BINDING_PREFLIGHT_20261028.csv'
      - 'research/wind-tower/experiments/T077/recovery/S10_T057_68PART_INP_METADATA_20261028.csv'
      - 'research/wind-tower/experiments/T077/recovery/S10_D400_PE_68PART_INP_METADATA_20261028.csv'
      - 'research/wind-tower/experiments/T077/recovery/s10_4case_gross_component_nominal_del.py'
      - 'research/wind-tower/experiments/T077/recovery/S10_4CASE_31SEG_GROSS_SINGLE_CHANNEL_NOMINAL_DEL_20261030.csv'
      - 'research/wind-tower/experiments/T077/recovery/S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv'
      - 'research/wind-tower/experiments/T071/T071_input_geometry_31_segments.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s10-miner-synthetic:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch SHA-pinned single source file (avoid 2.2GB checkout)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output s10_miner_damage_gate.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/research/wind-tower/experiments/T077/recovery/s10_miner_damage_gate.py"
      - name: Fetch SHA-pinned S10 local-stress rainflow source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output s10_local_stress_rainflow_gate.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/research/wind-tower/experiments/T077/recovery/s10_local_stress_rainflow_gate.py"
      - name: Fetch SHA-pinned read-only native ODB extraction gate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --output s10_native_odb_local_stress_gate.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/research/wind-tower/experiments/T077/recovery/s10_native_odb_local_stress_gate.py"
          curl --fail --location --silent --show-error --retry 3 \
            --output s10_candidate_run_card_gate.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/research/wind-tower/experiments/T077/recovery/s10_candidate_run_card_gate.py"
      - name: Fetch SHA-pinned 68-part and 31-gage S10 sources
        shell: bash
        run: |
          set -euo pipefail
          for f in s10_load_del_control_stability.py s10_native_part_station_binding_gate.py S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv S10_ETM_LOAD_DEL_CONTROL_186_20261028.csv S01_T057_ORIGINAL_68PART_STATIC_MASS_20261027.csv S10_68PART_NATIVE_STRESS_BINDING_PREFLIGHT_20261028.csv S10_T057_68PART_INP_METADATA_20261028.csv S10_D400_PE_68PART_INP_METADATA_20261028.csv; do
            curl --fail --location --silent --show-error --retry 3 \
              --output "$f" \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/research/wind-tower/experiments/T077/recovery/$f"
          done
      - name: Source-locked 68-part binding real-data and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile s10_load_del_control_stability.py s10_native_part_station_binding_gate.py
          python3 s10_native_part_station_binding_gate.py --self-test
      - name: Compile and known-answer/negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile s10_miner_damage_gate.py
          python3 s10_miner_damage_gate.py --self-test
          python3 -m py_compile s10_local_stress_rainflow_gate.py
          python3 s10_local_stress_rainflow_gate.py --self-test
          python3 -m py_compile s10_native_odb_local_stress_gate.py
          echo '9850c1983a1bc69cc829f338260a31ff29b4e6ab86660749d453f9cc5791ff83  S10_D400_PE_68PART_INP_METADATA_20261028.csv' | sha256sum --check
          python3 s10_native_odb_local_stress_gate.py --self-test --source-map S10_T057_68PART_INP_METADATA_20261028.csv --d400-source-map S10_D400_PE_68PART_INP_METADATA_20261028.csv
          sha256sum s10_miner_damage_gate.py s10_local_stress_rainflow_gate.py s10_native_odb_local_stress_gate.py
          echo 'S10: SYNTHETIC NUMERICAL QC ONLY; NO VERIFIED MATERIAL STRESS, NO S-N PARAMETER OR PHYSICAL PASS.'

      - name: Reconstruct SHA-pinned D400 Pe child and inspect actual 68-part source (NO ABAQUS)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/research/wind-tower"
          for f in s01_native_inp_cage_polygon_clearance.py s01_straight_bar_radial_clearance.py s01_d400_d500_straight_t3d2_exact.py s01_d400_relayout_pe_diagnostic_inp.py s01_d400_pe_g1_instrument.py s01_d400_uniform_pe_repro_min.py s01_frozen_t057_full_mesh_mass_repro.py s10_t057_native_metadata_gate.py s10_d400_pe_source_map_gate.py s10_azimuth_height_candidate_gate.py S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv S01_D400_D500_UNMOVED_CAGE_CLEARANCE_31SEG_20261025.csv; do
            curl --fail --location --silent --show-error --retry 3 --output "$f" "$ROOT/experiments/T077/recovery/$f"
          done
          curl --fail --location --silent --show-error --retry 3 --output T057.inp "$ROOT/experiments/T057/inputs/BASE001_T057_EVIDENCE_RECONCILED_HRB335_Q345_PTBF8_CONTACT_RNA_R2.inp"
          echo 'c5652eae36ad8b60ef2caed1ab12e147b149f5199d40b83a3cb2af4dfaf672db  T057.inp' | sha256sum --check
          python3 -m py_compile s10_d400_pe_source_map_gate.py
          python3 s10_d400_pe_source_map_gate.py --self-test
          python3 s01_d400_d500_straight_t3d2_exact.py --inp T057.inp --outdir "$RUNNER_TEMP/s10_geom"
          python3 s01_d400_relayout_pe_diagnostic_inp.py --inp T057.inp --geometry "$RUNNER_TEMP/s10_geom/S01_D400_D500_31SEG_STRAIGHT_T3D2_EXACT_GEOMETRY.csv" --outdir "$RUNNER_TEMP/s10_child"
          python3 s01_d400_pe_g1_instrument.py --input "$RUNNER_TEMP/s10_child/S01_D400_RELAYOUT_Pe_PROXY_DIAGNOSTIC_ONLY.inp" --output "$RUNNER_TEMP/S01_D400_Pe_G1_INSTRUMENTED_DIAGNOSTIC_ONLY.inp" --manifest "$RUNNER_TEMP/s10_instrument_manifest.json"
          python3 - <<'PY'
          import os, pathlib, zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          src=root/'S01_D400_Pe_G1_INSTRUMENTED_DIAGNOSTIC_ONLY.inp'
          with zipfile.ZipFile(root/'s10_g1.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              z.write(src,arcname=src.name)
          PY
          python3 s01_d400_uniform_pe_repro_min.py --zip "$RUNNER_TEMP/s10_g1.zip" --out "$RUNNER_TEMP/S01_D400_UNIFORM_REBAR_Pe_G1_PROVISIONAL_NOT_FROZEN.inp"
          python3 s10_d400_pe_source_map_gate.py --child "$RUNNER_TEMP/S01_D400_UNIFORM_REBAR_Pe_G1_PROVISIONAL_NOT_FROZEN.inp" --t057-map S10_T057_68PART_INP_METADATA_20261028.csv --out "$RUNNER_TEMP/S10_D400_PE_68PART_INP_METADATA_20261028.csv" | tee "$RUNNER_TEMP/s10_d400_source_receipt.json"
          sha256sum "$RUNNER_TEMP/S10_D400_PE_68PART_INP_METADATA_20261028.csv"
          cmp "$RUNNER_TEMP/S10_D400_PE_68PART_INP_METADATA_20261028.csv" S10_D400_PE_68PART_INP_METADATA_20261028.csv
          echo 'BEGIN_S10_D400_CSV'
          cat "$RUNNER_TEMP/S10_D400_PE_68PART_INP_METADATA_20261028.csv"
          echo 'END_S10_D400_CSV'
          python3 -m py_compile s10_azimuth_height_candidate_gate.py
          python3 s10_azimuth_height_candidate_gate.py --self-test
          python3 s10_azimuth_height_candidate_gate.py --inp "$RUNNER_TEMP/S01_D400_UNIFORM_REBAR_Pe_G1_PROVISIONAL_NOT_FROZEN.inp" --source-map S10_D400_PE_68PART_INP_METADATA_20261028.csv --out "$RUNNER_TEMP/S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv" | tee "$RUNNER_TEMP/s10_azimuth_receipt.json"
          echo '9052f70b39544c8fbd27b0813face4eecf2dcace3efdbd7c3cebbc896b395595  S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv' | sha256sum --check
          cmp "$RUNNER_TEMP/S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv" S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv
          sha256sum "$RUNNER_TEMP/S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv"
          python3 -m py_compile s10_candidate_run_card_gate.py
          python3 s10_candidate_run_card_gate.py --self-test \
            --candidate-table S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv \
            --source-map S10_D400_PE_68PART_INP_METADATA_20261028.csv \
            --out "$RUNNER_TEMP/s10_candidate_card_preflight.json"
          sha256sum s10_candidate_run_card_gate.py s10_native_odb_local_stress_gate.py
          echo 'BEGIN_S10_AZIMUTH_CSV'
          cat "$RUNNER_TEMP/S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv"
          echo 'END_S10_AZIMUTH_CSV'
          echo 'NO NATIVE ODB, NO PT EQUILIBRIUM, NO MATERIAL FATIGUE PASS.'
      - name: Archive D400 Pe source-level CSV and receipt (no INP/ODB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s10-d400-pe-68part-static-source-map
          path: |
            ${{ runner.temp }}/S10_D400_PE_68PART_INP_METADATA_20261028.csv
            ${{ runner.temp }}/s10_d400_source_receipt.json
            ${{ runner.temp }}/S10_D400_PE_AZIMUTH_HEIGHT_CANDIDATES_20261028.csv
            ${{ runner.temp }}/s10_azimuth_receipt.json
            ${{ runner.temp }}/s10_candidate_card_preflight.json
          if-no-files-found: warn
          retention-days: 14

  s10-nominal-4case:
    name: Real 4-case gross-section component DEL (NO material life)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch four SHA-pinned small CSV and code sources
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/research/wind-tower"
          curl -fLsS --retry 3 -o s10_4case_gross_component_nominal_del.py "$base/experiments/T077/recovery/s10_4case_gross_component_nominal_del.py"
          curl -fLsS --retry 3 -o loads.csv "$base/experiments/T077/recovery/S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv"
          curl -fLsS --retry 3 -o geometry.csv "$base/experiments/T071/T071_input_geometry_31_segments.csv"
          curl -fLsS --retry 3 -o committed.csv "$base/experiments/T077/recovery/S10_4CASE_31SEG_GROSS_SINGLE_CHANNEL_NOMINAL_DEL_20261030.csv"
          echo "9e22e98ac44c2cbd6bf011c4bc2e9a150c4bac76b5e7c4a1eddd8e6de611134b  loads.csv" | sha256sum -c -
          echo "fff6dfcc6bc094353ebee042392033e8df47e7fb792ccc1812c0962c9c43f800  geometry.csv" | sha256sum -c -
          python3 -m py_compile s10_4case_gross_component_nominal_del.py
          python3 s10_4case_gross_component_nominal_del.py --self-test
          python3 s10_4case_gross_component_nominal_del.py --loads loads.csv --geometry geometry.csv --output recomputed.csv --receipt receipt.json
          python3 - <<'PY'
          import csv, json, math
          with open('committed.csv', newline='') as f: x=list(csv.DictReader(f))
          with open('recomputed.csv', newline='') as f: y=list(csv.DictReader(f))
          assert len(x)==len(y)==124
          assert set(x[0])==set(y[0])
          for a,b in zip(x,y):
              assert (a['case'],a['segment'])==(b['case'],b['segment'])
              for key in a:
                  if key in ('case','segment','source_class'):
                      assert a[key]==b[key],key
                  else:
                      assert math.isclose(float(a[key]),float(b[key]),rel_tol=3e-11,abs_tol=3e-12),(key,a[key],b[key])
          j=json.load(open('receipt.json'))
          assert j['rows']==124 and j['material_fatigue_life'] is None
          PY
      - name: Negative input integrity and no-material-life proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          j=json.load(open('receipt.json'))
          assert j['rows']==124 and j['material_fatigue_life'] is None
          assert j['native_Abaqus_runs']==0 and j['physical_pass'] is False
          assert j['status']=='REAL_4CASE_31SEG_COMPONENT_NOMINAL_DEL_ONLY'
          print('REAL_124_ROW_4CASE_31SEG_NOMINAL_COMPONENT_DEL_PASS_NO_MATERIAL_LIFE')
          PY
          cp loads.csv bad_loads.csv
          printf '\nTAMPER' >> bad_loads.csv
          if python3 s10_4case_gross_component_nominal_del.py --loads bad_loads.csv --geometry geometry.csv --output invalid.csv --receipt invalid.json >negative.log 2>&1; then
            echo "ERROR: source tamper accepted" >&2; exit 1
          fi
          grep -q 'SOURCE_SHA256_MISMATCH' negative.log
          sha256sum s10_4case_gross_component_nominal_del.py recomputed.csv receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s10-real-4case-nominal-component-del
          path: |
            recomputed.csv
            receipt.json
            negative.log
          if-no-files-found: warn
          retention-days: 14
