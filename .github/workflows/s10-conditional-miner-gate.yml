          cp gross.csv tampered.csv
          sed -i '2s/U09p343881_ETM_S06/FAKE_CASE/' tampered.csv
          if python3 s10_pt_uniform_offset_counterfactual.py --geometry geometry.csv --gross tampered.csv --check committed.csv >/dev/null 2>&1; then
            echo 'ERROR: altered source unexpectedly accepted'; exit 1
          fi
          echo 'REAL_S10_SOURCE_SHA_TAMPER_REJECTED'

