          python3 s10_fz_gravity_ownership_real.py --load loads.csv --gravity gravity.csv --output recomputed.csv
          python3 - <<'PY'
          import csv,math
          with open('committed.csv',newline='') as f: rows=list(csv.DictReader(f))
          with open('recomputed.csv',newline='') as f: own=list(csv.DictReader(f))
          assert len(rows)==len(own)==124
