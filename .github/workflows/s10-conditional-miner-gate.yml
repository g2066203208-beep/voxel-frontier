              assert not c['native_integration_point'] and not rb['native_integration_point']
          print('REAL_FZ_124STATIONS_120JOINTS_D400_CSEG16_17_SOURCE_QC_NOT_PT_OR_NATIVE_PASS')
          PY
          cp loads.csv tampered.csv
          sed -i '2s/U09p343881_ETM_S06/FAKE_CASE/' tampered.csv
