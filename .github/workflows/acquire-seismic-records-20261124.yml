name: Acquire ESM seismic records and audit source pool
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/acquire-seismic-records-20261124.yml'
      - 'research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool/acquire_esm.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests numpy scipy
      - name: Query official ESM and acquire actual paired records
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool/acquire_esm.py
      - name: Archive source data and receipt
        run: |
          git config user.name paper-studio-bot
          git config user.email paper-studio-bot@users.noreply.github.com
          git add research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool/acquired
          if ! git diff --cached --quiet; then
            git commit -m 'Archive official ESM actual ground-motion record acquisition and screening'
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: T079-ESM-source-pool
          path: research/wind-tower/experiments/T079/seismic-evidence-20261124/record-pool/acquired
