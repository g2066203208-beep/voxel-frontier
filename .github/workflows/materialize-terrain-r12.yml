name: Materialize Terrain R12 Visual Authority

on:
  push:
    branches: [test/terrain-r12-visual-authority]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R12 source patch
        run: python3 .github/scripts/materialize_terrain_r12.py
      - name: Verify R12 markers
        run: |
          grep -q 'R12 visual authority' native/src/world/PlanetSurface.cpp
          grep -q 'R12 apparent-prominence evidence' native/src/app/Main.cpp
          grep -q 'R12 clipmap density' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized R12 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp
          git commit -m 'terrain: materialize R12 visual authority [skip ci]'
          git push origin HEAD:test/terrain-r12-visual-authority
