# T052 trigger: render source evidence pages
name: T052 Render He2024 original evidence pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t052-render-he2024-original-pages.yml"
      - "research/wind-tower/references/user-provided/He_Zeyu_2024_hybrid_tower_thesis.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check pymupdf

      - name: Render REF008 original PDF pages 33-35
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fitz, hashlib

          src = Path("research/wind-tower/references/user-provided/He_Zeyu_2024_hybrid_tower_thesis.pdf")
          out = Path("research/wind-tower/references/extracts/REF008-original-pages")
          out.mkdir(parents=True, exist_ok=True)

          doc = fitz.open(src)
          rows = ["asset\tpdf_page\tbody_page\tcontent\tsha256"]
          labels = {
              33: ("22", "Table 3-1 + 158/112/46 m + Abaqus material/PT/RNA modeling text"),
              34: ("23", "Table 3-2 concrete tower geometry and inner/outer rebar counts"),
              35: ("24", "Table 3-3 + Figure 3-4 + Figure 3-5")
          }
          for pdf_page, (body_page, desc) in labels.items():
              page = doc.load_page(pdf_page - 1)
              pix = page.get_pixmap(matrix=fitz.Matrix(2.5, 2.5), alpha=False)
              target = out / f"REF008_pdf-p{pdf_page}_body-p{body_page}.png"
              pix.save(target)
              sha = hashlib.sha256(target.read_bytes()).hexdigest()
              rows.append(f"{target.name}\t{pdf_page}\t{body_page}\t{desc}\t{sha}")

          (out / "MANIFEST.tsv").write_text("\n".join(rows) + "\n", encoding="utf-8")
          PY

      - name: Commit rendered source evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/references/extracts/REF008-original-pages
          if git diff --cached --quiet; then
            echo "No rendered page changes."
          else
            git commit -m "T052: archive He2024 original evidence page renders"
            git pull --rebase origin main
            git push
          fi
