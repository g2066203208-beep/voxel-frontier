name: S05 real ESM RotD source-locked 16-period regression (not design PASS)
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/s05-esm-rotd-real.yml'
      - 'research/wind-tower/experiments/T079/s05_esm_rotd_real.py'
      - 'research/wind-tower/experiments/T079/s05_esm_public_processed_pair.py'
      - 'research/wind-tower/experiments/T079/s08_base_motion_amplitude_gate.py'
      - 'research/wind-tower/manuscript/final-thesis/figures/plot_s08_esm_3comp_real_acceleration.py'
      - 'research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  real-processed-wave-rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch only two small PR-HEAD text inputs (avoid huge repository checkout)
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T079
          mkdir -p "$root/real-records"
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$root"
          curl --fail --location --silent --show-error --retry 3 -o "$root/s05_esm_rotd_real.py" "$base/s05_esm_rotd_real.py"
          curl --fail --location --silent --show-error --retry 3 -o "$root/real-records/S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv" "$base/real-records/S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv"
          sha256sum "$root/s05_esm_rotd_real.py" "$root/real-records/S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin numerical package used in measured reference
        run: python -m pip install 'numpy==2.3.5'
      - name: Retrieve ALREADY archived real 2012 ESM 3-component source (no new event fetch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh run download 40847442979 -R "$GITHUB_REPOSITORY" -n s05-esm-v3-public-processed-source-or-failure-NOT-DESIGN-WAVE -D source
          test -f source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv
          test -f source/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv
          echo 'a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34  source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv' | sha256sum --check
          echo 'a2e2ea94d81ef1cfff63863148518cf2159bb821161577a67b5c4b7705143bc6  source/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv' | sha256sum --check
      - name: Execute real processed 16x360 angle spectra, strict input checks, and compare reference
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T079/s05_esm_rotd_real.py
          python -m py_compile "$script"
          python "$script" --self-test
          python "$script" \
            --source-csv source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv \
            --reference-csv source/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv \
            --output-csv recomputed.csv --output-receipt recomputed.json
          python - <<'PY'
          import csv,math,json
          root='research/wind-tower/experiments/T079/real-records/'
          with open(root+'S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv',newline='') as f: old=list(csv.DictReader(f))
          with open('recomputed.csv',newline='') as f: new=list(csv.DictReader(f))
          assert len(old)==len(new)==16
          for a,b in zip(old,new):
              assert a.keys()==b.keys()
              for k in a:
                  if k=='status': assert a[k]==b[k]
                  else: assert math.isclose(float(a[k]),float(b[k]),rel_tol=3e-12,abs_tol=2e-13),(k,a[k],b[k])
          with open('recomputed.json') as f:j=json.load(f)
          assert j['S05_PASS'] is False and j['Abaqus_E_WE_RUN']==0
          print('REAL_ESM_ROTD_16_PERIOD_CROSS_CHECK_PASS_NO_DESIGN_WAVE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-esm-rotd-real-16period-independent-recompute-NOT-DESIGN-PASS
          path: |
            recomputed.csv
            recomputed.json
          if-no-files-found: warn
          retention-days: 90

  s08-real-acceleration-source-figure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve archived 2012 ESM source, not a new earthquake event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source figures
          gh run download 40847442979 -R "$GITHUB_REPOSITORY" -n s05-esm-v3-public-processed-source-or-failure-NOT-DESIGN-WAVE -D source
          echo 'a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34  source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv' | sha256sum -c
          echo 'd5df379ff81cfd8aac061f2b7738c54effb952c106b5149ca2d03244c5963f30  source/committed_s08_arias_husid.csv' | sha256sum -c
          script=research/wind-tower/manuscript/final-thesis/figures/plot_s08_esm_3comp_real_acceleration.py
          mkdir -p "$(dirname "$script")"
          curl --fail --location --silent --show-error --retry 3 -o "$script" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$script"
          sha256sum "$script"
      - name: Real waveform min-max, source SHA, SVG XML and negative-input checks
        run: |
          set -euo pipefail
          script=research/wind-tower/manuscript/final-thesis/figures/plot_s08_esm_3comp_real_acceleration.py
          python -m py_compile "$script"
          python "$script" --self-test
          python "$script" \
            --source-csv source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv \
            --arias-csv source/committed_s08_arias_husid.csv \
            --svg figures/FIG_S08_04_ESM_REAL_3COMP_ACCELERATION_SOURCE_QC.svg \
            --receipt figures/S08_ESM_3COMP_ACCELERATION_FIGURE_RECEIPT_20261031.json
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('figures')
          r=json.loads((root/'S08_ESM_3COMP_ACCELERATION_FIGURE_RECEIPT_20261031.json').read_text())
          f=root/'FIG_S08_04_ESM_REAL_3COMP_ACCELERATION_SOURCE_QC.svg'
          assert r['Abaqus_E_WE_RUN']==0 and not r['S08_PASS']
          assert r['figure_bytes']==f.stat().st_size
          svg=ET.parse(f).getroot()
          assert svg.tag=='{http://www.w3.org/2000/svg}svg'
          assert len(list(svg.iter('{http://www.w3.org/2000/svg}line')))>3000
          assert len(list(svg.iter('{http://www.w3.org/2000/svg}circle')))==6
          print('S08_REAL_WAVEFORM_XML_AND_EXTREMA_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: s08-real-esm-3comp-acceleration-source-figure-NOT-DESIGN-PASS
          path: figures/*
          retention-days: 90
      - name: Commit exact original source figure and receipt to Draft PR branch, create-only
        if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          for entry in \
            'figures/FIG_S08_04_ESM_REAL_3COMP_ACCELERATION_SOURCE_QC.svg|research/wind-tower/manuscript/final-thesis/figures/FIG_S08_04_ESM_REAL_3COMP_ACCELERATION_SOURCE_QC.svg' \
            'figures/S08_ESM_3COMP_ACCELERATION_FIGURE_RECEIPT_20261031.json|research/wind-tower/experiments/T079/real-records/S08_ESM_3COMP_ACCELERATION_FIGURE_RECEIPT_20261031.json'
          do
            IFS='|' read -r localfile target <<< "$entry"
            if gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$branch" --jq '.content' > existing.b64 2>/dev/null; then
              base64 --decode existing.b64 > existing.file
              cmp existing.file "$localfile" || { echo "EXISTING_FILE_DIFFERS_HOLD: $target"; exit 1; }
              echo "EXACT_FILE_ALREADY_ARCHIVED $target"
              continue
            fi
            python - "$localfile" "$branch" <<'PY' > payload.json
          import base64,json,sys
          p,b=sys.argv[1:]
          data=open(p,'rb').read()
          print(json.dumps({'message':'research(S08): archive real three-component ESM acceleration source figure and SHA receipt','content':base64.b64encode(data).decode(),'branch':b}))
          PY
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input payload.json --jq '.commit.sha'
            echo "S08_REAL_SOURCE_QC_PERSISTED $target"
          done

  s08-t057-yup-si-full-source-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover original archived 32040x3 processed ESM source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source output
          gh run download 40847442979 -R "$GITHUB_REPOSITORY" -n s05-esm-v3-public-processed-source-or-failure-NOT-DESIGN-WAVE -D source
          echo 'a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34  source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv' | sha256sum -c
          script=research/wind-tower/experiments/T079/s08_base_motion_amplitude_gate.py
          mkdir -p "$(dirname "$script")"
          curl --fail --location --silent --show-error --retry 3 -o "$script" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$script"
          sha256sum "$script"
      - name: Full-wave source/axis/unit/roundtrip checks without solver
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T079/s08_base_motion_amplitude_gate.py
          python -m py_compile "$script"
          python "$script" --self-test
          python "$script" --source source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv --outdir output --frame t057-yup-si --confirm-t057-identity --azimuth-deg 0
          python - <<'PY'
          import json,hashlib,pathlib,math
          p=pathlib.Path('output/S08_ESM_T057_YUP_SI_AMPLITUDE_RECEIPT.json')
          r=json.loads(p.read_text())
          assert r['SOURCE_NPTS']==32040 and r['SOURCE_LAST_TIME_S']==160.195
          assert r['SOURCE_SHA256']=='a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34'
          assert r['Abaqus_E_WE_RUN']==0 and r['S08_PASS'] is False
          assert r['frame'].endswith('Y-up; metre-second SI')
          assert len(r['artifacts'])==3 and len(r['samples'])==7
          assert math.isclose(r['error_budget']['max_synch_vector_peak_m_s2'],0.5665313757667056,abs_tol=2e-14)
          for a in r['artifacts']:
              f=pathlib.Path('output')/a['filename']
              assert f.stat().st_size==a['bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==a['sha256']
              assert b'*BASE MOTION' not in f.read_bytes() and b'*BOUNDARY' not in f.read_bytes()
          print('S08_T057_FULL_32040x3_YUP_SI_SOURCE_NUMERIC_QC_PASS_NOT_NATIVE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-t057-yup-si-32040x3-amplitudes-NOT-DESIGN-OR-NATIVE
          path: output/*
          if-no-files-found: warn
          retention-days: 90

  s05-esm-dense-longperiod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch locked program and historical RotD16
        run: |
          set -euo pipefail
          mkdir -p source output
          root=research/wind-tower/experiments/T079
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$root"
          curl -fLsS --retry 3 -o source/s05_esm_rotd_real.py "$base/s05_esm_rotd_real.py"
          curl -fLsS --retry 3 -o source/legacy_rotd16.csv "$base/real-records/S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv"
          echo '6f03869384193a4e00b27a11af6470ff3d11fcb73ebb08f0f19332b4edbe0205  source/legacy_rotd16.csv' | sha256sum -c
          python -m py_compile source/s05_esm_rotd_real.py
          python -m pip install --disable-pip-version-check 'numpy==2.3.5'
      - name: Recover archived 32040x3 ESM and SHA gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40847442979 -R "$GITHUB_REPOSITORY" -n s05-esm-v3-public-processed-source-or-failure-NOT-DESIGN-WAVE -D source
          echo 'a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34  source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv' | sha256sum -c
      - name: Real 46-period RotD with 12 legacy period numeric regression
        run: |
          set -euo pipefail
          python source/s05_esm_rotd_real.py --dense-band --self-test \
            --source-csv source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv \
            --legacy-rotd source/legacy_rotd16.csv \
            --out-dense output/S05_ESM_IT2012_NVL_DENSE_LONGPERIOD_ROTD_20261102.csv \
            --out-receipt output/S05_ESM_IT2012_NVL_DENSE_LONGPERIOD_ROTD_RECEIPT_20261102.json | tee output/runner_stdout.log
          python - <<'PY'
          import csv,json,math,pathlib,hashlib
          p=pathlib.Path('output')
          table=p/'S05_ESM_IT2012_NVL_DENSE_LONGPERIOD_ROTD_20261102.csv'
          r=json.loads((p/'S05_ESM_IT2012_NVL_DENSE_LONGPERIOD_ROTD_RECEIPT_20261102.json').read_text())
          rows=list(csv.DictReader(table.open()))
          assert len(rows)==46 and r['period_count']==46
          assert r['overlap_period_count']==12 and r['overlap_numeric_cells']==60
          assert r['max_overlap_relative_difference']<5e-11
          assert sum(x['is_conditional_beam_T1']=='True' for x in rows)==1
          assert all(0<float(x['RotD00_psa_m_s2'])<=float(x['RotD50_psa_m_s2'])<=float(x['RotD100_psa_m_s2']) for x in rows)
          assert hashlib.sha256(table.read_bytes()).hexdigest()==r['output_csv_sha256']
          assert not r['S05_PASS'] and not r['S08_PASS'] and r['native_Abaqus_E_WE']==0
          print('S05_REAL_ESM_46_PERIOD_12_ANCHOR_SOURCE_QC_PASS_NOT_DESIGN')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-esm-46period-dense-rotd-real-source-NOT-DESIGN
          path: output/*
          if-no-files-found: warn
          retention-days: 90
      - name: Create-only archive of numeric table and SHA receipt on Draft PR
        if: success() && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T079/real-records
          for name in S05_ESM_IT2012_NVL_DENSE_LONGPERIOD_ROTD_20261102.csv S05_ESM_IT2012_NVL_DENSE_LONGPERIOD_ROTD_RECEIPT_20261102.json; do
            file="output/$name"
            target="$root/$name"
            if gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$GITHUB_REF_NAME" --jq '.content' > existing.b64 2>/dev/null; then
              base64 -d existing.b64 > existing.file
              cmp -s existing.file "$file" || { echo "EXISTING_SOURCE_OUTPUT_DIFFERS_HOLD: $target"; exit 1; }
              echo "ALREADY_IDENTICAL $target"
              continue
            fi
            python - "$file" "$GITHUB_REF_NAME" <<'PY' > payload.json
          import base64,json,sys
          f,branch=sys.argv[1:]
          print(json.dumps({'message':'research(S05): persist real ESM dense long-period RotD and SHA receipt (not design PASS)',
                            'content':base64.b64encode(open(f,'rb').read()).decode(),'branch':branch}))
          PY
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input payload.json --jq '.commit.sha'
            echo "PERSISTED_REAL_ESM_DENSE_ROTD $target"
          done

  s05-independent-event-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch existing ESM source inspector from PR commit
        run: |
          set -euo pipefail
          mkdir -p source output
          root=research/wind-tower/experiments/T079
          curl -fLsS --retry 3 -o source/s05_esm_public_processed_pair.py "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$root/s05_esm_public_processed_pair.py"
          curl -fLsS --retry 3 -o source/s05_ground_motion_pair_qc.py "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$root/s05_ground_motion_pair_qc.py"
          python -m py_compile source/s05_esm_public_processed_pair.py
          sha256sum source/s05_esm_public_processed_pair.py
      - name: Run synthetic negative gate and attempt second independent ESM event
        run: |
          set -euo pipefail
          python source/s05_esm_public_processed_pair.py --independent-self-test
          python source/s05_esm_public_processed_pair.py --independent-source --output-dir output --timeout 65 | tee output/runner_stdout.log
          python - <<'PY'
          import json,pathlib,hashlib
          p=pathlib.Path('output/S05_ESM_IT2012_0009_OFFICIAL_SOURCE_RECEIPT.json')
          r=json.loads(p.read_text())
          assert r['event_id']=='IT-2012-0009' and not r['S05_PASS'] and r['Abaqus_E_WE_RUN']==0
          for fn,key in [('S05_ESM_IT2012_0009_OFFICIAL_SELECTION.json','metadata_sha256'),
                         ('S05_ESM_IT2012_0009_MP_ACC_OFFICIAL.zip','waveform_response_sha256')]:
              f=p.parent/fn
              if f.exists():
                  assert hashlib.sha256(f.read_bytes()).hexdigest()==r[key]
          print('S05_INDEPENDENT_SOURCE_FETCH_RECEIPT_QC',r['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-independent-esm-2012-0009-official-source-or-failure-NOT-DESIGN
          path: output/*
          if-no-files-found: warn
          retention-days: 90
      - name: Archive official small JSON and exact source receipt on Draft PR
        if: success() && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T079/real-records
          for name in S05_ESM_IT2012_0009_OFFICIAL_SELECTION.json S05_ESM_IT2012_0009_OFFICIAL_SOURCE_RECEIPT.json; do
            file="output/$name"
            test -f "$file" || continue
            test "$(wc -c < "$file")" -le 300000 || { echo "LARGE_OFFICIAL_JSON_ARTIFACT_ONLY $name"; continue; }
            target="$root/$name"
            existing_sha=""
            if gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$GITHUB_REF_NAME" --jq '.content' > existing.b64 2>/dev/null; then
              base64 -d existing.b64 > existing.file
              if cmp -s existing.file "$file"; then echo "ALREADY_IDENTICAL $target"; continue; fi
              if [[ "$name" != "S05_ESM_IT2012_0009_OFFICIAL_SOURCE_RECEIPT.json" ]]; then
                echo "IMMUTABLE_SOURCE_JSON_DIFFERS_HOLD: $target"; exit 1
              fi
              existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$GITHUB_REF_NAME" --jq '.sha')"
            fi
            python - "$file" "$GITHUB_REF_NAME" "$existing_sha" <<'PY' > payload.json
          import base64,json,sys
          f,branch,existing_sha=sys.argv[1:]
          payload={'message':'research(S05): update official second-event source QC after filter mismatch triage',
                   'content':base64.b64encode(open(f,'rb').read()).decode(),'branch':branch}
          if existing_sha: payload['sha']=existing_sha
          print(json.dumps(payload))
          PY
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input payload.json --jq '.commit.sha'
            echo "PERSISTED_INDEPENDENT_ESM_SOURCE $target"
          done
