name: Native Desktop Engine

on:
  push:
    branches:
      - engine/native-cpp-vulkan
  pull_request:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/native-desktop.yml'

jobs:
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure C++23 engine core
        run: cmake -S native -B build/core -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=OFF -DVF_BUILD_TESTS=ON

      - name: Build core tests
        run: cmake --build build/core --parallel

      - name: Run correctness tests
        run: ctest --test-dir build/core --verbose --output-on-failure

  windows-runtime:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure native Windows runtime
        run: cmake -S native -B build/windows -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build native Windows runtime
        run: cmake --build build/windows --config Release --parallel

      - name: Run core tests on Windows
        run: ctest --test-dir build/windows -C Release --verbose --output-on-failure

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/windows -Recurse -Filter voxel_frontier.exe | Select-Object -First 1
          if (-not $exe) { throw 'voxel_frontier.exe was not produced' }
          Write-Host "Native executable: $($exe.FullName)"
