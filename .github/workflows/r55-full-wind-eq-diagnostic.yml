name: R55 rotor and tower wind earthquake diagnostic input
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r55-full-wind-eq-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/thesis-studio/inp-archive/R44_REBAR_RESEARCH_PRECHECK
            public/thesis-studio/inp-archive/R47_RNA_WIND_GATE
            public/thesis-studio/inp-archive/R49_WIND_EQ_DIAGNOSTIC
            public/thesis-studio/inp-archive/R54_GLOBAL_WRENCH
            public/thesis-studio/inp-archive/R55_FULL_WIND_EQ_DIAGNOSTIC
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify all diagnostic input decks
        run: |
          python -m pip install numpy==1.26.4 matplotlib==3.9.2
          python public/thesis-studio/inp-archive/R55_FULL_WIND_EQ_DIAGNOSTIC/build_r55.py
      - uses: actions/upload-artifact@v4
        with:
          name: r55-wind-rna-eq-diagnostic-inputs
          path: public/thesis-studio/inp-archive/R55_FULL_WIND_EQ_DIAGNOSTIC/
      - name: Archive results
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f public/thesis-studio/inp-archive/R55_FULL_WIND_EQ_DIAGNOSTIC
          git commit -m "Archive R55 nominal RNA plus tower wind earthquake diagnostic decks and verified figures"
          git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
