name: R24 Interstellar Sun Closure V4

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_interstellar_sun_hotfix_v2.py'
      - '.github/scripts/r24_interstellar_sun_hotfix_v3.py'
      - '.github/scripts/r24_interstellar_sun_hotfix_v4.py'
      - '.github/scripts/r24_interstellar_sun_capture.sh'
      - '.github/workflows/r24-interstellar-sun-closure-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-interstellar-sun-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-real-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
          ref: ${{ github.sha }}
      - name: Apply interstellar Sun closure and V4 safety
        run: |
          python3 .github/scripts/r24_interstellar_sun_closure.py
          python3 .github/scripts/r24_interstellar_sun_hotfix_v2.py
          python3 .github/scripts/r24_interstellar_sun_hotfix_v3.py
          python3 .github/scripts/r24_interstellar_sun_hotfix_v4.py
      - name: Validate generated production source
        run: |
          git diff --check
          grep -q 'kCreativeInterstellarSprintMaxMps' native/include/vf/player/PlanetCamera.hpp
          grep -q 'sunAngularRadiusRadians' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'R24 SUN_TRANSIT_ARRIVED\\n' native/src/app/Main.cpp
          grep -q 'solarPlane' native/shaders/planet.slang
          grep -q 'R24 moon ground observer' native/src/app/Main.cpp
          grep -q 'earliestHit' native/src/player/PlanetCamera.cpp
          grep -q 'testInterstellarCreativeSweepCannotTunnelThroughStar' native/tests/InterplanetaryFlightTests.cpp
      - name: Install Vulkan X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick xdotool mesa-vulkan-drivers vulkan-tools libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Install Slang
        run: |
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang" && unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
      - name: Configure Linux runtime and tests
        run: cmake -S native -B build/r24-interstellar-sun-v4 -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
      - name: Build Linux runtime and tests
        run: cmake --build build/r24-interstellar-sun-v4 --parallel 2
      - name: Run complete Linux native suite
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-interstellar-sun-v4 --verbose --output-on-failure 2>&1 | tee r24-interstellar-sun-ctest.log
      - name: Run focused interstellar celestial camera and shader gates
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-interstellar-sun-v4 --verbose --output-on-failure -R 'vf_interplanetary_flight_tests|vf_r24_runtime_stability_tests|vf_camera_input_tests|vf_shader_contract_tests|vf_celestial_system_tests' 2>&1 | tee r24-interstellar-sun-focused.log
      - name: Verify real Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt
      - name: Capture physical ground Moon and actual Sun transit
        id: capture
        shell: bash
        run: |
          APP="$(find build/r24-interstellar-sun-v4 -type f -name voxel_frontier -perm -111 | head -n1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_interstellar_sun_capture.sh
          .github/scripts/r24_interstellar_sun_capture.sh "$APP" r24-interstellar-sun-evidence
      - name: Preserve exact tested source and permanent evidence
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-interstellar-sun-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          cp -a r24-interstellar-sun-evidence/. "$EVIDENCE_DIR/"
          cp r24-interstellar-sun-ctest.log r24-interstellar-sun-focused.log vulkan-summary.txt "$EVIDENCE_DIR/"
          git diff -- native > "$EVIDENCE_DIR/tested-source.patch"
          cat > "$EVIDENCE_DIR/ci-status.txt" <<EOF
          workflow_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          linux_full_tests=success
          focused_tests=success
          vulkan=success
          physical_ground_moon=success
          actual_sun_transit=success
          close_sun_framebuffer=success
          swept_star_safety=success
          local_speed_gate=success
          inertial_warp_gate=success
          EOF
      - name: Upload real Vulkan evidence even when a visual gate fails
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-interstellar-sun-real-vulkan-${{ github.run_id }}
          path: |
            r24-interstellar-sun-evidence/**
            r24-interstellar-sun-ctest.log
            r24-interstellar-sun-focused.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Promote tested production source and permanent evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            native/include/vf/player/PlanetCamera.hpp \
            native/src/player/PlanetCamera.cpp \
            native/include/vf/render/VulkanRenderer.hpp \
            native/src/render/VulkanRenderer.cpp \
            native/src/app/Main.cpp \
            native/shaders/planet.slang \
            native/tests/InterplanetaryFlightTests.cpp \
            native/tests/CameraInputTests.cpp \
            native/tests/R24RuntimeStabilityTests.cpp \
            docs/evidence
          git commit -m 'feat(r24): add swept interstellar travel and inspectable close Sun'
          git reset --hard HEAD
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics

  windows-native-regression:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20
          ref: ${{ github.sha }}
      - name: Apply interstellar Sun closure and V4 safety
        shell: pwsh
        run: |
          python .github/scripts/r24_interstellar_sun_closure.py
          python .github/scripts/r24_interstellar_sun_hotfix_v2.py
          python .github/scripts/r24_interstellar_sun_hotfix_v3.py
          python .github/scripts/r24_interstellar_sun_hotfix_v4.py
      - name: Validate generated source
        run: git diff --check
      - name: Configure Windows x64
        run: cmake -S native -B build/r24-interstellar-sun-win-v4 -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
      - name: Build Windows x64
        run: cmake --build build/r24-interstellar-sun-win-v4 --config Release --parallel 2
      - name: Run complete Windows native suite
        run: ctest --test-dir build/r24-interstellar-sun-win-v4 -C Release --verbose --output-on-failure
