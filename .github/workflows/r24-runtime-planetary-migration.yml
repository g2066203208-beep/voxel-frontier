name: R24 Runtime Planetary Migration

on:
  push:
    branches:
      - work/r24-unified-planetary-physics
    paths:
      - '.github/scripts/r24_migrate_planetary_runtime.py'
      - '.github/workflows/r24-runtime-planetary-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-runtime-planetary-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: windows-2025
    steps:
      - name: Checkout R24
        uses: actions/checkout@v6
        with:
          ref: work/r24-unified-planetary-physics
          fetch-depth: 0

      - name: Apply deterministic runtime ownership migration
        run: python .github/scripts/r24_migrate_planetary_runtime.py

      - name: Reject whitespace or patch damage
        shell: pwsh
        run: git diff --check

      - name: Configure full native Windows runtime
        run: cmake -S native -B build/r24-runtime-migration -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Vulkan runtime and all native tests
        run: cmake --build build/r24-runtime-migration --config Release --parallel

      - name: Run complete Windows regression suite
        run: ctest --test-dir build/r24-runtime-migration -C Release --verbose --output-on-failure

      - name: Verify runtime executable exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build/r24-runtime-migration -Recurse -Filter voxel_frontier.exe | Select-Object -First 1
          if (-not $exe) { throw 'voxel_frontier.exe was not produced after planetary runtime migration' }
          Write-Host "Verified runtime: $($exe.FullName)"

      - name: Commit verified Main.cpp migration
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- native/src/app/Main.cpp)) {
            throw 'Migration produced no Main.cpp change'
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/app/Main.cpp
          git commit -m "R24.7: route live runtime through planetary body services"
          git push origin HEAD:work/r24-unified-planetary-physics
