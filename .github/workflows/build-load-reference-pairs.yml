name: Archive wind load reference pairs
on:
  push:
    paths:
      - '.github/workflows/build-load-reference-pairs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eu
          python -m pip install -q pymupdf pillow
          python public/thesis-studio/wind-figures/build_load_reference_pairs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/thesis-studio/wind-figures/load-comparison/
          git diff --cached --quiet && exit 0
          git commit -m 'Archive wind load reference pair results with exact PDF source receipts'
          git pull --rebase origin main
          git push origin HEAD:main
