name: Build XiaoQi Rigged APK

on:
  push:
    branches: [ companion-v0.3-rigged ]
    paths:
      - 'companion-app/**'
      - '.github/workflows/companion-rigged-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore rig art assets
        run: |
          mkdir -p companion-app/app/src/main/assets
          cat companion-app/assets-b64/part*.txt | tr -d '\r\n' | base64 -d > /tmp/xiaoqi_assets.zip
          unzip -o /tmp/xiaoqi_assets.zip -d companion-app/app/src/main/assets/
          test -f companion-app/app/src/main/assets/parts/character_master.webp
          echo "Rig assets:"
          find companion-app/app/src/main/assets/parts -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bootstrap Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" /tmp/cmdline-tools
          mkdir -p /tmp/cmdline-tools
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: companion-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp companion-app/app/build/outputs/apk/debug/app-debug.apk dist/XiaoQi-Companion-v0.3-Rigged.apk
          sha256sum dist/XiaoQi-Companion-v0.3-Rigged.apk > dist/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XiaoQi-Companion-v0.3-Rigged
          path: dist/
          if-no-files-found: error
