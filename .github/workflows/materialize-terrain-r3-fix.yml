name: Materialize Terrain R3 Fix

on:
  push:
    branches: [feature/terrain-r3-open-source-rebuild]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/terrain-r3-open-source-rebuild
          fetch-depth: 0

      - name: Execute R3 patch with structural anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/materialize-terrain-r3.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          start = wf.index(begin) + len(begin)
          end = wf.index("\n          PY\n", start)
          script = textwrap.dedent(wf[start:end])

          # Replace appendFace + surface-patch slope insertion with structural anchors.
          a = script.index('# Encode the correct sphere-relative slope per vertex.')
          b = script.index('p.write_text(s)', a) + len('p.write_text(s)')
          robust_surface = "\n".join([
              "# Encode true sphere-relative slope per vertex.",
              "append_anchor = s.index('void appendFace(')",
              "mat = s.index('            vertex.material = definition', append_anchor)",
              "push = s.index('            mesh.vertices.push_back(vertex);', mat)",
              "slope_code = '            if (definition) {\\n                vertex.material.x = static_cast<float>(std::clamp(\\n                    1.0 - glm::dot(localNormal, localDirection), 0.0, 1.0));\\n            }\\n'",
              "s = s[:push] + slope_code + s[push:]",
              "patch_anchor = s.index('PlanetMesh buildPlanetSurfacePatch(')",
              "normal_line = '            vertex.normal = glm::vec3(planetSurfaceNormal(definition, direction));'",
              "normal_pos = s.index(normal_line, patch_anchor)",
              "normal_repl = '            const glm::dvec3 surfaceNormal = planetSurfaceNormal(definition, direction);\\n            vertex.normal = glm::vec3(surfaceNormal);'",
              "s = s[:normal_pos] + normal_repl + s[normal_pos + len(normal_line):]",
              "mat_line = '            vertex.material = planetTerrainMaterial(definition, terrain);'",
              "mat_pos = s.index(mat_line, patch_anchor) + len(mat_line)",
              "slope_repl = '\\n            vertex.material.x = static_cast<float>(std::clamp(\\n                1.0 - glm::dot(surfaceNormal, direction), 0.0, 1.0));'",
              "s = s[:mat_pos] + slope_repl + s[mat_pos:]",
              "p.write_text(s)",
          ])
          script = script[:a] + robust_surface + script[b:]

          # Replace custom ring material slope insertion structurally.
          a = script.index("old = '''                        vertex.color = vf::planetTerrainColor")
          b = script.index('s = s.replace(old, new, 1)', a) + len('s = s.replace(old, new, 1)')
          robust_ring = "\n".join([
              "ring_anchor = s.index('const std::array<Ring, 7> rings{{')",
              "ring_mat = s.index('                        vertex.material = vf::planetTerrainMaterial(planet, terrain);', ring_anchor)",
              "ring_push = s.index('                        mesh.vertices.push_back(vertex);', ring_mat)",
              "ring_slope = '                        vertex.material.x = static_cast<float>(std::clamp(\\n                            1.0 - glm::dot(normalPlanet, direction), 0.0, 1.0));\\n'",
              "s = s[:ring_push] + ring_slope + s[ring_push:]",
          ])
          script = script[:a] + robust_ring + script[b:]

          # Replace whole-planet proxy block by comment anchors.
          a = script.index("old_proxy = '''")
          b = script.index('s = s.replace(old_proxy, new_proxy, 1)', a) + len('s = s.replace(old_proxy, new_proxy, 1)')
          robust_proxy = "\n".join([
              "proxy_start = s.index('            // The orbital proxy is still deliberately cheaper')",
              "proxy_end_line = '            appendMesh(mesh, proxy);'",
              "proxy_end = s.index(proxy_end_line, proxy_start) + len(proxy_end_line)",
              "proxy_code = '            // Cached whole-planet proxy: no expensive global re-sampling on every local stream update.\\n            appendMesh(mesh, orbitalProxy);'",
              "s = s[:proxy_start] + proxy_code + s[proxy_end:]",
          ])
          script = script[:a] + robust_proxy + script[b:]

          # Replace streaming threshold structurally.
          a = script.index("old_threshold = '''")
          b = script.index('s = s.replace(old_threshold, new_threshold, 1)', a) + len('s = s.replace(old_threshold, new_threshold, 1)')
          robust_threshold = "\n".join([
              "threshold_start = s.index('                const double threshold = altitude < 20000.0 ? 8000.0')",
              "threshold_end = s.index('                if (!terrainBuildInFlight', threshold_start)",
              "threshold_code = '                // Refresh before the 384 m inner ring morph region.\\n                const double threshold = altitude < 20000.0 ? 600.0\\n                    : (altitude < 100000.0 ? 4000.0\\n                    : (altitude < 350000.0 ? 25000.0 : 120000.0));\\n                const double prefetchThreshold = threshold * 0.42;\\n\\n'",
              "s = s[:threshold_start] + threshold_code + s[threshold_end:]",
          ])
          script = script[:a] + robust_threshold + script[b:]

          exec(compile(script, 'terrain-r3-materialize', 'exec'), {})
          PY

      - name: Verify R3 source markers
        shell: bash
        run: |
          grep -n "std::array<Ring, 7>" native/src/app/Main.cpp
          grep -n "384.0,        0.0, 192U" native/src/app/Main.cpp
          grep -n "triplanarTerrainNoise" native/shaders/planet.slang
          grep -n "broadUndulation" native/src/world/PlanetSurface.cpp
          grep -n -- "-10.0F" native/src/world/PlanetSurface.cpp

      - name: Commit R3 source and remove one-shot workflows
        shell: bash
        run: |
          git config user.name "Voxel Frontier CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/materialize-terrain-r3.yml .github/workflows/materialize-terrain-r3-fix.yml
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp native/shaders/planet.slang
          git commit -m "terrain: rebuild macro relief materials and local streaming R3"
          git push origin HEAD:feature/terrain-r3-open-source-rebuild
