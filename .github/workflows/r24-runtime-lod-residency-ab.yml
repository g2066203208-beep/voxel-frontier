name: R24 Runtime LOD Residency A-B

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - 'native/include/vf/world/VelocityAwareLodPolicy.hpp'
      - 'native/include/vf/world/PerceptualResidencyPolicy.hpp'
      - 'native/tests/VelocityAwareLodPolicyTests.cpp'
      - 'native/tests/PerceptualResidencyPolicyTests.cpp'
      - '.github/scripts/r24_integrate_runtime_lod_residency.py'
      - '.github/workflows/r24-runtime-lod-residency-ab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-runtime-lod-residency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 16

      - name: Materialize runtime LOD and residency integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r24_integrate_runtime_lod_residency.py
          git diff --check
          grep -q 'R24_RUNTIME_LOD_RESIDENCY_V1' native/src/app/Main.cpp
          grep -q 'VelocityAwareLodPolicy.hpp' native/src/app/Main.cpp
          grep -q 'PerceptualResidencyPolicy.hpp' native/src/app/Main.cpp
          grep -q 'requestedMotionLod' native/src/app/Main.cpp
          grep -q 'effectiveUseDistantGlobe' native/src/app/Main.cpp
          grep -q 'VF_CAPTURE_HIGH_SPEED_AUTOPILOT' native/src/app/Main.cpp

      - name: Install build and Vulkan dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Configure and build Release
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native -B build/r24-lod-residency -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
          cmake --build build/r24-lod-residency --parallel 2

      - name: Run complete native regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p r24-lod-residency-evidence
          ctest --test-dir build/r24-lod-residency --verbose --output-on-failure 2>&1 \
            | tee r24-lod-residency-evidence/ctest.log
          grep -q '100% tests passed' r24-lod-residency-evidence/ctest.log

      - name: Verify software Vulkan identity
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary \
            | tee r24-lod-residency-evidence/vulkan-summary.txt
          grep -q 'llvmpipe' r24-lod-residency-evidence/vulkan-summary.txt

      - name: Start locked 1080p display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp \
            > r24-lod-residency-evidence/xvfb.log 2>&1 &
          echo $! > /tmp/r24-xvfb.pid
          sleep 1
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'SDL_VIDEODRIVER=x11' >> "$GITHUB_ENV"

      - name: Run four isolated A-B benchmarks
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/r24-lod-residency -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"

          run_case() {
            local name="$1"; shift
            echo "===== CASE $name ====="
            env \
              VF_PERF_PROFILE=mainstream_1080p \
              VF_TERRAIN_TARGET=canyon \
              VF_RUNTIME_DIAGNOSTICS=1 \
              VF_CELESTIAL_TIME_SCALE=1 \
              "$@" \
              timeout 32s "$APP" > "r24-lod-residency-evidence/${name}.log" 2>&1 &
            local pid=$!
            sleep 4
            import -window root "r24-lod-residency-evidence/${name}.png" || true
            set +e
            wait "$pid"
            local rc=$?
            set -e
            cat "r24-lod-residency-evidence/${name}.log"
            test -s "r24-lod-residency-evidence/${name}.png"
            test "$rc" -eq 0 -o "$rc" -eq 124
            grep -q '^R24 BENCHMARK profile=' "r24-lod-residency-evidence/${name}.log"
          }

          # Real camera travel at 800 m/s: same world, same renderer; only velocity-aware policy differs.
          run_case velocity_off \
            VF_CAPTURE_AERIAL=1 VF_CAPTURE_ALTITUDE_METERS=7000 \
            VF_CAPTURE_HIGH_SPEED=1 VF_CAPTURE_HIGH_SPEED_AUTOPILOT=1 VF_CAPTURE_SPEED_MPS=800 \
            VF_VELOCITY_AWARE_LOD=0 VF_PERCEPTUAL_RESIDENCY=0
          run_case velocity_on \
            VF_CAPTURE_AERIAL=1 VF_CAPTURE_ALTITUDE_METERS=7000 \
            VF_CAPTURE_HIGH_SPEED=1 VF_CAPTURE_HIGH_SPEED_AUTOPILOT=1 VF_CAPTURE_SPEED_MPS=800 \
            VF_VELOCITY_AWARE_LOD=1 VF_PERCEPTUAL_RESIDENCY=0

          # High-altitude large-view scene: same camera, only perceptual residency/proxy selection differs.
          run_case residency_off \
            VF_CAPTURE_AERIAL=1 VF_CAPTURE_ALTITUDE_METERS=450000 \
            VF_VELOCITY_AWARE_LOD=0 VF_PERCEPTUAL_RESIDENCY=0
          run_case residency_on \
            VF_CAPTURE_AERIAL=1 VF_CAPTURE_ALTITUDE_METERS=450000 \
            VF_VELOCITY_AWARE_LOD=0 VF_PERCEPTUAL_RESIDENCY=1

      - name: Parse FPS and enforce feature budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('r24-lod-residency-evidence')
          cases = ['velocity_off', 'velocity_on', 'residency_off', 'residency_on']

          def parse(name):
              text = (root / f'{name}.log').read_text(encoding='utf-8', errors='replace')
              lines = [x for x in text.splitlines() if x.startswith('R24 BENCHMARK profile=')]
              if not lines:
                  raise SystemExit(f'{name}: missing benchmark summary')
              line = lines[-1]
              values = {k: float(v) for k, v in re.findall(r'(avg_fps|one_percent_low_fps|p99_frame_ms|render_mean_ms)=([0-9.]+)', line)}
              if 'avg_fps' not in values:
                  raise SystemExit(f'{name}: avg_fps missing: {line}')
              builds = []
              for bline in text.splitlines():
                  if 'R24 PERF terrain_build_ms=' not in bline:
                      continue
                  b = {k: float(v) for k, v in re.findall(r'(terrain_build_ms|vertices|indices|leaf_patches)=([0-9.]+)', bline)}
                  if b:
                      builds.append(b)
              modes = [x for x in text.splitlines() if x.startswith('R24 Earth renderer mode:')]
              return values, builds, modes, line

          parsed = {name: parse(name) for name in cases}
          vo, von = parsed['velocity_off'][0], parsed['velocity_on'][0]
          ro, ron = parsed['residency_off'][0], parsed['residency_on'][0]

          # Software Vulkan is used for relative regression only. New policies must not make the
          # measured scenario slower; a 2% tolerance absorbs hosted-run noise.
          if von['avg_fps'] < vo['avg_fps'] * 0.98:
              raise SystemExit(f'velocity LOD regressed FPS: {vo["avg_fps"]} -> {von["avg_fps"]}')
          if ron['avg_fps'] < ro['avg_fps'] * 0.98:
              raise SystemExit(f'perceptual residency regressed FPS: {ro["avg_fps"]} -> {ron["avg_fps"]}')

          # The feature must actually execute. At 800 m/s, optimized rebuilds (when present) must
          # never exceed the legacy leaf budget. At 450 km, residency-on must select the proxy globe.
          off_builds = parsed['velocity_off'][1]
          on_builds = parsed['velocity_on'][1]
          if on_builds and off_builds:
              if max(x.get('leaf_patches', 0) for x in on_builds) > max(x.get('leaf_patches', 0) for x in off_builds):
                  raise SystemExit('velocity LOD increased terrain leaf count')
          residency_modes = parsed['residency_on'][2]
          if not any('smooth-globe' in x for x in residency_modes):
              raise SystemExit('perceptual residency did not select smooth-globe proxy at 450 km')

          report = [
              'R24 RUNTIME LOD/RESIDENCY A-B',
              'device=llvmpipe software Vulkan; FPS deltas are relative regression evidence, not discrete-GPU certification.',
          ]
          for name in cases:
              report.append(f'{name}: {parsed[name][3]}')
              for b in parsed[name][1]:
                  report.append(f'{name}_build: ' + ' '.join(f'{k}={v}' for k, v in b.items()))
              for m in parsed[name][2][-3:]:
                  report.append(f'{name}_mode: {m}')
          report.append(f'velocity_avg_fps_delta_pct={(von["avg_fps"] / vo["avg_fps"] - 1.0) * 100.0:.3f}')
          report.append(f'residency_avg_fps_delta_pct={(ron["avg_fps"] / ro["avg_fps"] - 1.0) * 100.0:.3f}')
          out = '\n'.join(report) + '\n'
          (root / 'README.txt').write_text(out, encoding='utf-8')
          print(out)
          PY

      - name: Upload A-B screenshots and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-runtime-lod-residency-${{ github.run_id }}
          path: r24-lod-residency-evidence/**
          if-no-files-found: warn
          retention-days: 30

      - name: Promote only validated runtime integration
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          DEST="docs/evidence/r24-runtime-lod-residency-${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -a r24-lod-residency-evidence/. "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/app/Main.cpp native/include/vf/world/VelocityAwareLodPolicy.hpp "$DEST"
          git commit -m 'perf(r24): integrate measured velocity lod and far residency'
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics

      - name: Stop display
        if: always()
        shell: bash
        run: |
          if test -f /tmp/r24-xvfb.pid; then kill "$(cat /tmp/r24-xvfb.pid)" 2>/dev/null || true; fi
