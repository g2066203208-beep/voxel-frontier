name: Pack GB50010 source PDF

on:
  push:
    paths:
      - '.github/workflows/pack-gb50010-pdf.yml'

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/references/standards/rebar-prestress-20261006/GB_50010-2010_2015_混凝土结构设计规范.pdf
          sparse-checkout-cone-mode: false
      - uses: actions/upload-artifact@v4
        with:
          name: gb50010-source-pdf
          path: research/wind-tower/references/standards/rebar-prestress-20261006/GB_50010-2010_2015_混凝土结构设计规范.pdf
          retention-days: 1
