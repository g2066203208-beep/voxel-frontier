name: S12 RNA source-mass chain QC (non-solver)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - 'research/wind-tower/manuscript/final-thesis/assemble/s12_rna_mass_chain_table.py'
      - 'research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_MASS_CHAIN_TABLE.csv'
      - '.github/workflows/s12-rna-mass-chain.yml'
      - 'research/wind-tower/manuscript/final-thesis/assemble/s12_rna_mass_figure.py'
      - 'research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_MASS_SOURCE_FIG.svg'
      - 'research/wind-tower/manuscript/final-thesis/assemble/s12_rna_cg_inertia_source_qc.py'
      - 'research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_CG_INERTIA_SOURCE_TABLE.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-table:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Source-locked real T038 table + byte-identical output
        run: |
          python3 research/wind-tower/manuscript/final-thesis/assemble/s12_rna_mass_chain_table.py \
            --source-json research/wind-tower/experiments/T038/openfast-rna-current.json \
            --delta-csv research/wind-tower/experiments/T038/openfast-rna-mass-difference.csv \
            --expected-json-sha256 cf60ca9d6d2e65f24d9e0037ec8f66bde8010002bc6050e1bccccad70f9db71e \
            --expected-delta-sha256 7992ec3318d72fd6673a729e06a4e7764c2beb58a29cdad2d0b24f7d3cdeee44 \
            --output /tmp/S12_RNA_MASS_CHAIN_TABLE.csv
          cmp /tmp/S12_RNA_MASS_CHAIN_TABLE.csv research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_MASS_CHAIN_TABLE.csv
          sha256sum research/wind-tower/experiments/T038/openfast-rna-current.json \
            research/wind-tower/experiments/T038/openfast-rna-mass-difference.csv \
            research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_MASS_CHAIN_TABLE.csv
      - name: Negative tests (bad SHA and inconsistent mass both rejected)
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          script='research/wind-tower/manuscript/final-thesis/assemble/s12_rna_mass_chain_table.py'
          source=Path('research/wind-tower/experiments/T038/openfast-rna-current.json')
          delta='research/wind-tower/experiments/T038/openfast-rna-mass-difference.csv'
          out=Path('/tmp/S12_SHOULD_NOT_EXIST.csv')
          out.unlink(missing_ok=True)
          def invoke(src,extra=[]):
              r=subprocess.run([sys.executable,script,'--source-json',str(src),'--delta-csv',delta,'--output',str(out),*extra],capture_output=True,text=True)
              assert r.returncode!=0 and not out.exists(),(r.returncode,r.stdout,r.stderr)
              print(r.stderr.strip().splitlines()[-1])
          invoke(source,['--expected-json-sha256','0'*64])
          bad=json.loads(source.read_text())
          bad['mass_chain']['RNA_kg']+=1
          changed=Path('/tmp/S12_BAD_RNA_SOURCE.json')
          changed.write_text(json.dumps(bad))
          invoke(changed)
          print('NEGATIVE 2/2 PASS (no output written)')
          PY

      - name: Source-locked SVG regeneration and bad-SHA rejection
        run: |
          python3 research/wind-tower/manuscript/final-thesis/assemble/s12_rna_mass_figure.py --source-csv research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_MASS_CHAIN_TABLE.csv --output /tmp/S12_RNA_MASS_SOURCE_FIG.svg
          cmp /tmp/S12_RNA_MASS_SOURCE_FIG.svg research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_MASS_SOURCE_FIG.svg
          python3 - <<'PY'
          import subprocess,sys
          from pathlib import Path
          src=Path('research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_MASS_CHAIN_TABLE.csv')
          tampered=Path('/tmp/S12_TAMPERED.csv')
          tampered.write_bytes(src.read_bytes().replace(b'676727.233844509465',b'676728.233844509465'))
          out=Path('/tmp/S12_SHOULD_NOT_EXIST.svg')
          out.unlink(missing_ok=True)
          p=subprocess.run([sys.executable,'research/wind-tower/manuscript/final-thesis/assemble/s12_rna_mass_figure.py','--source-csv',str(tampered),'--output',str(out)],capture_output=True,text=True)
          assert p.returncode!=0 and not out.exists(),p.stdout+p.stderr
          print('FIGURE BAD-SHA REJECTED')
          PY

      - name: OpenFAST R2 155-point CG/J source identity + negative SHA and mass tamper
        run: |
          python3 research/wind-tower/manuscript/final-thesis/assemble/s12_rna_cg_inertia_source_qc.py \
            --source-json research/wind-tower/experiments/T038/openfast-rna-current.json \
            --mass-points research/wind-tower/experiments/T038/openfast-rna-frozen-mass-points.csv \
            --output /tmp/S12_RNA_CG_INERTIA_SOURCE_TABLE.csv
          cmp /tmp/S12_RNA_CG_INERTIA_SOURCE_TABLE.csv research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_CG_INERTIA_SOURCE_TABLE.csv
          sha256sum research/wind-tower/experiments/T038/openfast-rna-frozen-mass-points.csv \
            research/wind-tower/manuscript/final-thesis/assemble/S12_RNA_CG_INERTIA_SOURCE_TABLE.csv
          python3 - <<'PY'
          import csv,hashlib,io,subprocess,sys
          from pathlib import Path
          base='research/wind-tower/'
          script=base+'manuscript/final-thesis/assemble/s12_rna_cg_inertia_source_qc.py'
          source=base+'experiments/T038/openfast-rna-current.json'
          points=Path(base+'experiments/T038/openfast-rna-frozen-mass-points.csv')
          bad=Path('/tmp/S12_BAD_POINTS.csv')
          output=Path('/tmp/S12_CG_SHOULD_NOT_EXIST.csv')
          def run(pts,extra=()):
              output.unlink(missing_ok=True)
              p=subprocess.run([sys.executable,script,'--source-json',source,'--mass-points',str(pts),'--output',str(output),*extra],capture_output=True,text=True)
              assert p.returncode!=0 and not output.exists(),(p.returncode,p.stdout,p.stderr)
              print(p.stderr.strip().splitlines()[-1])
          run(points,['--expected-points-sha256','0'*64])
          rows=list(csv.DictReader(io.StringIO(points.read_text())))
          rows[0]['mass_kg']=str(float(rows[0]['mass_kg'])+1.0)
          with bad.open('w',newline='') as f:
              writer=csv.DictWriter(f,fieldnames=list(rows[0]))
              writer.writeheader();writer.writerows(rows)
          newsha=hashlib.sha256(bad.read_bytes()).hexdigest()
          run(bad,['--expected-points-sha256',newsha])
          print('CG/J NEGATIVE 2/2 PASS; no output written')
          PY
