name: Procedural Human Preview

on:
  push:
    branches: [main]
    paths:
      - 'tools/procedural-human/**'
      - '.github/workflows/procedural-human-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser renderer
        run: |
          npm --prefix "$RUNNER_TEMP/human-preview" init -y
          npm --prefix "$RUNNER_TEMP/human-preview" install playwright@1.55.0
          cd "$RUNNER_TEMP/human-preview"
          npx playwright install --with-deps chromium

      - name: Start local preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/human-http.log 2>&1 &
          echo $! > /tmp/human-http.pid
          sleep 2

      - name: Render real male and female meshes
        env:
          NODE_PATH: ${{ runner.temp }}/human-preview/node_modules
        run: |
          mkdir -p artifacts/procedural-human
          cat > "$RUNNER_TEMP/human-preview/render.mjs" <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:1000}, deviceScaleFactor:1});
          const url = 'http://127.0.0.1:8765/tools/procedural-human/';

          page.on('console', m => console.log('[browser]', m.type(), m.text()));
          page.on('pageerror', e => console.error('[pageerror]', e.message));
          await page.goto(url, {waitUntil:'networkidle', timeout:120000});
          await page.waitForFunction(() => document.querySelector('#status')?.textContent?.includes('fixed topology'), null, {timeout:120000});
          await page.waitForTimeout(500);

          const viewport = page.locator('#viewport');
          const statusMale = await page.locator('#status').innerText();
          const measureMale = await page.locator('#measurements').innerText();
          console.log('MALE', statusMale, measureMale);
          await viewport.screenshot({path:'artifacts/procedural-human/male.png'});
          await page.screenshot({path:'artifacts/procedural-human/male-ui.png', fullPage:true});

          await page.locator('#presetFemale').click();
          await page.waitForTimeout(700);
          const statusFemale = await page.locator('#status').innerText();
          const measureFemale = await page.locator('#measurements').innerText();
          console.log('FEMALE', statusFemale, measureFemale);
          await viewport.screenshot({path:'artifacts/procedural-human/female.png'});
          await page.screenshot({path:'artifacts/procedural-human/female-ui.png', fullPage:true});

          const male = fs.readFileSync('artifacts/procedural-human/male.png').toString('base64');
          const female = fs.readFileSync('artifacts/procedural-human/female.png').toString('base64');
          await page.setViewportSize({width:1700,height:900});
          const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
          await page.setContent(`<!doctype html><style>
            html,body{margin:0;background:#0c0f14;color:#e9eef6;font-family:system-ui,sans-serif}
            main{padding:28px 30px 18px} h1{font-size:28px;margin:0 0 18px;font-weight:700}
            .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
            figure{margin:0;background:#10151d;border:1px solid #2a3443;border-radius:16px;overflow:hidden}
            img{width:100%;height:690px;object-fit:cover;display:block;background:#0c0f14}
            figcaption{padding:12px 16px 14px;font-size:18px;font-weight:650}
            small{display:block;font-size:13px;font-weight:450;opacity:.67;margin-top:4px;white-space:pre-wrap}
            p{opacity:.62;margin:12px 0 0;font-size:14px}
          </style><main><h1>Procedural Human · actual GitHub renderer</h1>
          <div class="grid"><figure><img src="data:image/png;base64,${male}"><figcaption>Male · same master topology<small>${esc(measureMale)}</small></figcaption></figure>
          <figure><img src="data:image/png;base64,${female}"><figcaption>Female · same master topology<small>${esc(measureFemale)}</small></figcaption></figure></div>
          <p>Rendered from tools/procedural-human/ with real CC0 phenotype displacement fields. No image-generation model.</p></main>`);
          await page.screenshot({path:'artifacts/procedural-human/male-female.png', fullPage:true});

          fs.writeFileSync('artifacts/procedural-human/measurements.json', JSON.stringify({
            male:{status:statusMale, measurements:measureMale},
            female:{status:statusFemale, measurements:measureFemale}
          }, null, 2));
          await browser.close();
          NODE
          cd "$GITHUB_WORKSPACE"
          node "$RUNNER_TEMP/human-preview/render.mjs"

      - name: Upload real renderer output
        uses: actions/upload-artifact@v4
        with:
          name: procedural-human-preview
          path: artifacts/procedural-human/
          if-no-files-found: error
          retention-days: 30
