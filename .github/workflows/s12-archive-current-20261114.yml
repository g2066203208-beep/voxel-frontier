name: Archive verified current S12 Word PDF on research branch (NO CAE)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths: [.github/workflows/s12-archive-current-20261114.yml]

permissions:
  actions: read
  contents: write

jobs:
  archive-verified:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve already successful current S12 Word and PDF
        uses: actions/download-artifact@v4
        with:
          name: S12_CURRENT_20261114_SIXCHAPTER_WORD_PDF_SOURCE_QA
          run-id: 43586214517
          github-token: ${{ github.token }}
          path: stage
      - name: Verify source identity and exact DOCX/PDF receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root=Path.cwd()
          out=root/'stage'
          manifest=list(out.rglob('ASSEMBLY_SOURCE_MANIFEST.json'))
          docs=list(out.rglob('DTU10MW_158m_CURRENT_six_chapter_research_20261114.docx'))
          pdfs=list(out.rglob('DTU10MW_158m_CURRENT_six_chapter_research_20261114.pdf'))
          assert len(manifest)==len(docs)==len(pdfs)==1,(manifest,docs,pdfs)
          m=json.loads(manifest[0].read_text())
          assert m['stage']=='SOURCE_ASSEMBLED_NOT_THESIS_OR_PHYSICS_PASS'
          assert m['source_git_commit']=='bd9500765603c3407bf04f5f44d8a67e14d32440'
          assert m['reference_count']==30 and m['figure_occurrences']==47
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(docs[0])=='9b770c40bff3c052dcd509733137fee4a5c25a29a1ae454038c0fcf380e4a0bf'
          base=root/'research/wind-tower/manuscript/final-thesis'
          for s in m['chapters']:
              path=base/'chapters'/s['name']
              assert path.exists() and sha(path)==s['sha256'],'CHAPTER_DRIFT:'+s['name']
          for s in m['other_sources']:
              path=base/s['name']
              assert path.exists() and sha(path)==s['sha256'],'BIB_OR_APPENDIX_DRIFT:'+s['name']
          qa=list(out.rglob('PDF_LAYOUT_QA.json'))
          assert len(qa)==1
          q=json.loads(qa[0].read_text())
          assert q['status']=='AUTOMATED_ALL_PAGE_TEXT_POSITION_QA_PASS'
          assert q['pdf_pages']==265 and not q['offpage_text_spans'] and not q['blank_page_indices']
          with zipfile.ZipFile(docs[0]) as z: assert z.testzip() is None
          print('SOURCE_AND_BINARY_SHA_VALIDATED',docs[0].stat().st_size,pdfs[0].stat().st_size)
          PY
      - name: Commit current reading drafts and receipts on research branch, preserve originals
        shell: bash
        run: |
          set -euo pipefail
          output="research/wind-tower/manuscript/final-thesis/deliverables/20261114"
          mkdir -p "$output"
          find stage -name 'DTU10MW_158m_CURRENT_six_chapter_research_20261114.docx' -exec cp '{}' "$output/" \;
          find stage -name 'DTU10MW_158m_CURRENT_six_chapter_research_20261114.pdf' -exec cp '{}' "$output/" \;
          for n in ASSEMBLY_SOURCE_MANIFEST.json WORD_SOURCE_RECEIPT.json WORD_STRUCTURE_QA.json PDF_LAYOUT_QA.json; do
             find stage -name "$n" -exec cp '{}' "$output/" \;
          done
          cat > "$output/README.md" <<'EOF'
          # Current 158 m six-chapter research Word and PDF, 2026-11-14

          This is a reading draft, NOT a thesis submission or physical acceptance.
          Six current Markdown chapters, 30 references and appendix A were included.

          Source commit: bd9500765603c3407bf04f5f44d8a67e14d32440
          Successful build: https://github.com/g2066203208-beep/voxel-frontier/actions/runs/43586214517
          Word SHA256: 9b770c40bff3c052dcd509733137fee4a5c25a29a1ae454038c0fcf380e4a0bf
          PDF has 265 pages, zero detected blank pages/off-page text.
          Word has 47 embedded research figures, 63 tables, 779 OMML equations.
          Manifests and automated source/structural/page QA receipts are alongside.
          The August, September and previous November Word originals are untouched.

          LIMIT: Full Microsoft Word page-by-page HUMAN visual QA, final GB/T 7714
          citations and missing physical results are still pending.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The parent research manuscript folder is gitignored; explicitly stage
          # only the verified new binary deliverables in this confined directory.
          git add -f "$output"
          git diff --cached --quiet && { echo "VERIFIED_DELIVERABLE_ALREADY_PRESENT"; exit 0; }
          git commit -m "docs(S12): archive current 265-page source-verified research Word PDF and receipts"
          git fetch origin research/t080-seismic-integration-gates-20261022
          git rebase origin/research/t080-seismic-integration-gates-20261022
          git push origin HEAD:research/t080-seismic-integration-gates-20261022
