name: T035 OpenFAST 36-case input audit

on:
  push:
    paths:
      - '.github/workflows/t035-openfast-input-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit archived OpenFAST input identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, csv, zipfile, difflib, re, hashlib

          root = Path("research/wind-tower")
          manifest_path = root/"archive/local-assets-20261004/file-manifest.json"
          rows = json.loads(manifest_path.read_text(encoding="utf-8"))
          of = [r for r in rows if r.get("section")=="openfast-36-r2" and r.get("relative_path","").startswith("CASES/")]

          outdir = root/"experiments/T035/openfast-input-audit"
          outdir.mkdir(parents=True, exist_ok=True)

          case_re = re.compile(r"^CASES/(U[^/]+)/")
          cases = sorted({case_re.match(r["relative_path"]).group(1) for r in of if case_re.match(r.get("relative_path",""))})

          keys = [
              "DTU_10MW_RWT.fst",
              "DTU_10MW_RWT_ElastoDyn.dat",
              "DTU_10MW_RWT_ServoDyn.dat",
              "DTU_10MW_RWT_AeroDyn15.dat",
              "DTU_10MW_AeroDyn15_blade.dat",
              "C02R3R2_158M_Tower.dat",
              "C02R3R2_158M_Tower_ZERO_DAMPING_20260831.dat",
              "DTU_10MW_InflowWind.dat",
              "DTU_10MW_RWT_DISCON.IN",
              "libdiscon.dll",
              "gen_discon.py",
              "Cp_Ct_Cq_10MW.txt",
          ]

          audit=[]
          for key in keys:
              hits=[r for r in of if r.get("relative_path","").split("/")[-1]==key and case_re.match(r.get("relative_path",""))]
              hashes=sorted({r.get("sha256") for r in hits if r.get("sha256")})
              audit.append({
                  "file":key,
                  "case_records":len(hits),
                  "unique_sha256":len(hashes),
                  "missing_sha_records":sum(not bool(r.get("sha256")) for r in hits),
                  "statuses":";".join(sorted({r.get("status","") for r in hits})),
                  "sha256_values":";".join(hashes),
              })
          with (outdir/"OPENFAST_36CASE_STATIC_IDENTITY.tsv").open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f, fieldnames=audit[0].keys(), delimiter="\t"); w.writeheader(); w.writerows(audit)

          # per-case AeroDyn hash
          aero=[]
          for r in of:
              if r.get("relative_path","").endswith("/Rotor/DTU_10MW_RWT_AeroDyn15.dat"):
                  m=case_re.match(r["relative_path"])
                  if m:
                      aero.append((m.group(1),r.get("bytes"),r.get("sha256"),r.get("canonical_archive"),r.get("canonical_member")))
          with (outdir/"AERODYN_CASE_HASHES.tsv").open("w",encoding="utf-8",newline="") as f:
              w=csv.writer(f,delimiter="\t"); w.writerow(["case","bytes","sha256","canonical_archive","canonical_member"]); w.writerows(sorted(aero))

          # extract unique AeroDyn canonical contents
          uniq={}
          for case, size, sha, arc, member in aero:
              if sha and sha not in uniq:
                  uniq[sha]=(case,arc,member)
          contents={}
          for sha,(case,arc,member) in uniq.items():
              zpath=Path(arc)
              with zipfile.ZipFile(zpath) as z:
                  data=z.read(member)
              contents[sha]=data.decode("utf-8",errors="replace")
              (outdir/f"AERODYN_{sha[:12]}.dat").write_bytes(data)

          verdict="NO_AERODYN_VARIATION"
          diff_text=""
          pre_equal=None
          diff_before=[]
          diff_after=[]
          if len(contents)==2:
              (sha1,t1),(sha2,t2)=list(contents.items())
              l1=t1.splitlines(); l2=t2.splitlines()
              diff_text="\n".join(difflib.unified_diff(l1,l2,fromfile=sha1,tofile=sha2,lineterm=""))+"\n"
              def outlist_idx(lines):
                  for i,line in enumerate(lines):
                      s=line.strip().lower()
                      if s.startswith("outlist") or s=="outlist":
                          return i
                  return len(lines)
              i1,i2=outlist_idx(l1),outlist_idx(l2)
              def norm_pre(lines,i):
                  out=[]
                  for x in lines[:i]:
                      # preserve values but normalize spacing and strip ! comments
                      x=x.split("!")[0].strip()
                      if x: out.append(" ".join(x.split()))
                  return out
              pre_equal = norm_pre(l1,i1)==norm_pre(l2,i2)
              verdict = "ONLY_OUTPUT_SECTION_DIFF" if pre_equal else "MODEL_INPUT_DIFF_BEFORE_OUTLIST"
              diff_before = list(difflib.unified_diff(norm_pre(l1,i1),norm_pre(l2,i2),lineterm=""))
              diff_after = list(difflib.unified_diff(l1[i1:],l2[i2:],lineterm=""))
          (outdir/"AERODYN_DIFFERENCE.diff").write_text(diff_text,encoding="utf-8")

          # Semantic field comparison: detect reordered but value-equivalent input fields.
          semantic_verdict = verdict
          semantic_delta = []
          if len(contents)==2:
              vals=[]
              for txt in contents.values():
                  lines=txt.splitlines()
                  oi=outlist_idx(lines)
                  mp={}
                  for line in lines[:oi]:
                      s=line.strip()
                      if not s or s.startswith("=") or s.startswith("#"): continue
                      if " - " not in line: continue
                      left=line.split(" - ",1)[0].strip()
                      toks=left.split()
                      if len(toks)<2: continue
                      key=toks[-1]
                      value=" ".join(toks[:-1])
                      # parameter labels are alphabetic-ish; ignore table rows
                      if re.match(r"^[A-Za-z][A-Za-z0-9_()]*$", key):
                          mp[key]=value
                  vals.append(mp)
              kset=set(vals[0])|set(vals[1])
              semantic_delta=[(k,vals[0].get(k),vals[1].get(k)) for k in sorted(kset) if vals[0].get(k)!=vals[1].get(k)]
              if not semantic_delta:
                  semantic_verdict="PHYSICS_FIELDS_EQUIVALENT_REORDERED_PLUS_OUTLIST_DIFF"
              (outdir/"AERODYN_SEMANTIC_FIELD_DELTA.tsv").write_text(
                  "field\tvariant_A\tvariant_B\n"+"\n".join(f"{k}\t{a or ''}\t{b or ''}" for k,a,b in semantic_delta)+"\n",
                  encoding="utf-8"
              )

          # Extract module/version/warning evidence from two representative logs.
          def extract_member(canonical_archive, canonical_member):
              with zipfile.ZipFile(Path(canonical_archive)) as z:
                  return z.read(canonical_member).decode("utf-8",errors="replace")
          log_lines=[]
          log_summary=[]
          for rr in of:
              m=case_re.match(rr.get("relative_path",""))
              if not m or not rr.get("relative_path","").endswith("/openfast_stdout.log"): continue
              case=m.group(1)
              txt=extract_member(rr["canonical_archive"],rr["canonical_member"])
              ofver=""; roscover=""; warn=[]; fatal=[]
              for line in txt.splitlines():
                  lo=line.lower()
                  if "openfast-v" in lo and not ofver: ofver=line.strip()
                  if "running rosco-v" in lo and not roscover: roscover=line.strip()
                  if "warning" in lo or "improperly formatted" in lo: warn.append(line.strip())
                  if "fatal" in lo or "severe error" in lo: fatal.append(line.strip())
                  if any(k in lo for k in ["openfast-v","aerodyn","rosco","warning","severe","fatal","version"]):
                      log_lines.append(f"[{case}] {line}")
              log_summary.append((case,ofver,roscover,len(warn),len(fatal)," | ".join(warn[:4])," | ".join(fatal[:4])))
          (outdir/"ALL36_LOG_VERSION_WARNINGS.txt").write_text("\n".join(log_lines)+"\n",encoding="utf-8")
          with (outdir/"ALL36_RUNTIME_IDENTITY.tsv").open("w",encoding="utf-8",newline="") as f:
              w=csv.writer(f,delimiter="\t"); w.writerow(["case","openfast_version","rosco_version","warning_count","fatal_count","warning_excerpt","fatal_excerpt"]); w.writerows(sorted(log_summary))
          ofvers=sorted({x[1] for x in log_summary if x[1]})
          rvers=sorted({x[2] for x in log_summary if x[2]})
          fatal_cases=[x[0] for x in log_summary if x[4]>0]

          # detect known archive gaps
          discon=[r for r in of if r.get("relative_path","").endswith("/Control/DTU_10MW_RWT_DISCON.IN")]
          dll=[r for r in of if r.get("relative_path","").endswith("/Control/libdiscon.dll")]
          missing_discon=sum(not bool(r.get("sha256")) for r in discon)
          missing_dll=sum(not bool(r.get("sha256")) for r in dll)

          # markdown report
          md=[]
          md.append("# T035.1 OpenFAST 36-case canonical input identity audit")
          md.append("")
          md.append(f"Cases detected: **{len(cases)}**.")
          md.append("")
          md.append("## Static-input identity summary")
          md.append("")
          md.append("|file|records|unique SHA|missing SHA|status|")
          md.append("|---|---:|---:|---:|---|")
          for a in audit:
              md.append(f"|{a['file']}|{a['case_records']}|{a['unique_sha256']}|{a['missing_sha_records']}|{a['statuses']}|")
          md.append("")
          md.append("## AeroDyn exception")
          md.append("")
          md.append(f"Two AeroDyn SHA families detected across the 36 cases. Raw positional verdict: **{verdict}**. Field-name/value semantic verdict: **{semantic_verdict}**.")
          if semantic_verdict=="PHYSICS_FIELDS_EQUIVALENT_REORDERED_PLUS_OUTLIST_DIFF":
              md.append("The field-name/value comparison found **no physics-input value differences** between the two AeroDyn variants. The raw difference is parameter-section ordering plus requested output channels. Therefore U11p4_NTM_S01 remains dynamically comparable for shared physical QoIs; only channel availability differs.")
          elif pre_equal is True:
              md.append("The normalized portion before the AeroDyn OutList marker is identical; the detected variant is confined to the output-request section.")
          else:
              md.append("A physics-relevant AeroDyn difference has not been ruled out; the affected case must be isolated until explained or rerun.")
          md.append("")
          md.append("The case-hash table, semantic-field delta and raw unified diff are stored beside this report.")
          md.append("")
          md.append("## Runtime identity across all 36 cases")
          md.append("")
          md.append(f"OpenFAST runtime strings: {ofvers}. ROSCO runtime strings: {rvers}. Cases with fatal/severe errors: {fatal_cases}.")
          md.append("The repeated AeroDyn nodal-output formatting message is recorded in ALL36_RUNTIME_IDENTITY.tsv and must not be silently discarded; it concerns nodal output configuration and requires checking only if nodal AeroDyn outputs are used as thesis evidence.")
          md.append("")
          md.append("## Controller archive gap")
          md.append("")
          md.append(f"DISCON.IN: {len(discon)} case records, {missing_discon} without archived SHA. libdiscon.dll: {len(dll)} records, {missing_dll} without archived SHA.")
          md.append("Therefore the 36-case structural/static identity can be substantially closed from existing hashes, but **controller identity is not yet G0-complete**. The original DISCON.IN and controller binary/config provenance must be hash-bound before BASE001.")
          md.append("")
          md.append("## Gate consequence")
          md.append("")
          md.append("- FST, ElastoDyn, ServoDyn and the 158 m tower file are one SHA family across all 36 cases.")
          md.append("- InflowWind is 36 distinct SHA values, consistent with case-specific stochastic inflow.")
          md.append(f"- AeroDyn raw positional verdict: **{verdict}**; semantic field verdict: **{semantic_verdict}**.")
          md.append(f"- Runtime versions across archived logs: OpenFAST={ofvers}; ROSCO={rvers}; fatal/severe-error cases={fatal_cases}.")
          md.append("- G0 OpenFAST can move from 'raw files absent' to 'canonical static/physics input and runtime version substantially bound / exact controller configuration HOLD'.")
          (outdir/"README.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          PY

      - name: Commit audit outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T035/openfast-input-audit
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "T035.1 audit OpenFAST 36-case canonical input identity"
            git pull --rebase origin main
            git push
          fi
