name: t067-index-ch123-reference-pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t067-index-ch123-reference-pages.yml'

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/references/user-provided/He_Zeyu_2024_hybrid_tower_thesis.pdf
            research/wind-tower/references/user-provided/Experimental and two-scale numerical studies on the behavior of prestressed concrete-steel hybrid wind turbine tower models.pdf
            research/wind-tower/references/user-provided/Intelligent analysis of dynamic characteristics of steel-concrete hybrid wind turbine tower based on adaptive vibration mode.pdf
            research/wind-tower/references/user-provided/Closed-Form Solution of Fundamental Frequency of Steel-Concrete Hybrid Wind Turbine Tower.pdf
            research/wind-tower/references/user-provided/Nonlinear dynamic response analyses of Onshore Wind Turbines with Steel-Concrete Hybrid Tower using a co-simulation approach.pdf
            research/wind-tower/references/open-access/Bak_2013_DTU_Wind_Energy_Report_I_0092.pdf
            research/wind-tower/references/user-provided/ERA5 - The new champion of wind power modelling.pdf
            research/wind-tower/references/user-provided/The role of the power law exponent in wind energy assessment - A global analysis.pdf
            research/wind-tower/references/user-provided/Spatiotemporal variation of power law exponent on the use of wind energy.pdf
            research/wind-tower/references/user-provided/Analysing the uncertainties of reanalysis data used for wind resource assessment - A critical review.pdf
            research/wind-tower/references/open-access/Abbas_2022_WES_ROSCO_7_53.pdf
            research/wind-tower/references/open-access/Brown_2024_WES_9_1791.pdf
          sparse-checkout-cone-mode: false

      - name: Install PDF text tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Index captions and key lines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,re,csv,json
          srcs=[
            ("REF008_He2024","research/wind-tower/references/user-provided/He_Zeyu_2024_hybrid_tower_thesis.pdf",
             ["steel-concrete","158","31","prestress","reinforcement","DTU","OpenFAST","wind load","modal","finite element"]),
            ("REF005_Li2023","research/wind-tower/references/user-provided/Experimental and two-scale numerical studies on the behavior of prestressed concrete-steel hybrid wind turbine tower models.pdf",
             ["two-scale","finite element","experiment","prestress","tendon","CDP","mesh","modal","fatigue","validation"]),
            ("REF010_Cheng2024","research/wind-tower/references/user-provided/Intelligent analysis of dynamic characteristics of steel-concrete hybrid wind turbine tower based on adaptive vibration mode.pdf",
             ["RNA","rotary inertia","eccentric","prestress","frequency","Abaqus","mass","modal"]),
            ("REF039_Frequency2023","research/wind-tower/references/user-provided/Closed-Form Solution of Fundamental Frequency of Steel-Concrete Hybrid Wind Turbine Tower.pdf",
             ["rotary inertia","prestress","gravity","mass","frequency","finite element","Rayleigh","hybrid tower"]),
            ("REF061_Xu2025","research/wind-tower/references/user-provided/Nonlinear dynamic response analyses of Onshore Wind Turbines with Steel-Concrete Hybrid Tower using a co-simulation approach.pdf",
             ["10 MW","158","HRB335","Q345","1280","nonlinear","P-Delta","OpenFAST","600","100"]),
            ("REF001_DTU10MW","research/wind-tower/references/open-access/Bak_2013_DTU_Wind_Energy_Report_I_0092.pdf",
             ["rated wind speed","rotor diameter","rated power","hub height","mass","inertia","DTU 10 MW"]),
            ("REF080_ERA5","research/wind-tower/references/user-provided/ERA5 - The new champion of wind power modelling.pdf",
             ["ERA5","MERRA","wind speed","capacity factor","correlation","bias","validation"]),
            ("REF083_PowerLaw","research/wind-tower/references/user-provided/The role of the power law exponent in wind energy assessment - A global analysis.pdf",
             ["10 m","100 m","ERA5","power law","alpha","hourly","hub height","1/7"]),
            ("REF093_DynamicAlpha","research/wind-tower/references/user-provided/Spatiotemporal variation of power law exponent on the use of wind energy.pdf",
             ["10 m","100 m","ERA5","power law exponent","wind tower","validation","spatiotemporal"]),
            ("REF090_ReanalysisReview","research/wind-tower/references/user-provided/Analysing the uncertainties of reanalysis data used for wind resource assessment - A critical review.pdf",
             ["uncertainty","ERA5","reanalysis","observations","terrain","complex","bias"]),
            ("REF046_ROSCO","research/wind-tower/references/open-access/Abbas_2022_WES_ROSCO_7_53.pdf",
             ["workflow","Region 2","Region 3","pitch","torque","OpenFAST","ROSCO"]),
            ("REF009_Brown2024","research/wind-tower/references/open-access/Brown_2024_WES_9_1791.pdf",
             ["validation","OpenFAST","loads","performance","fatigue","modal","operating","one-to-one"])
          ]
          out=Path('/tmp/t067'); out.mkdir(parents=True,exist_ok=True)
          rows=[]; sm={}
          for sid,pdf,kws in srcs:
            txt=out/(sid+'.txt')
            subprocess.run(['pdftotext','-layout',pdf,str(txt)],check=True)
            pages=txt.read_text(errors='ignore').split('\f')
            sm[sid]={'pages':len(pages),'matches':0,'pdf':pdf}
            for pi,page in enumerate(pages,1):
              ls=[re.sub(r'\s+',' ',x).strip() for x in page.splitlines()]
              for li,line in enumerate(ls):
                low=line.lower()
                cap=bool(re.match(r'^(fig(?:ure)?\.?|table|图|表)\s*\d+',low))
                hits=[k for k in kws if k.lower() in low]
                if cap or (hits and len(line)>=18):
                  ctx=' | '.join(x for x in ls[max(0,li-1):min(len(ls),li+2)] if x)
                  rows.append({'source_id':sid,'pdf_page':pi,'caption':cap,'score':(3 if cap else 0)+len(hits),'keywords':';'.join(hits),'text':line,'context':ctx})
                  sm[sid]['matches']+=1
          with (out/'CH123_REFERENCE_PAGE_INDEX.tsv').open('w',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=['source_id','pdf_page','caption','score','keywords','text','context'],delimiter='\t')
            w.writeheader(); w.writerows(rows)
          (out/'INDEX_SUMMARY.json').write_text(json.dumps(sm,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          src=Path('/tmp/t067'); prefix='research/wind-tower/experiments/T067'
          H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'t067'}
          def api(m,p,x=None):
            data=None if x is None else json.dumps(x).encode()
            q=urllib.request.Request('https://api.github.com/repos/'+repo+p,data=data,headers=H,method=m)
            with urllib.request.urlopen(q,timeout=300) as r:return json.loads(r.read().decode())
          ref=api('GET','/git/ref/heads/'+branch); parent=ref['object']['sha']; base=api('GET','/git/commits/'+parent)['tree']['sha']
          ents=[]
          for p in sorted(src.glob('*')):
            raw=p.read_bytes(); b=api('POST','/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
            ents.append({'path':prefix+'/'+p.name,'mode':'100644','type':'blob','sha':b['sha']})
          t=api('POST','/git/trees',{'base_tree':base,'tree':ents})
          c=api('POST','/git/commits',{'message':'research: index source pages for Chapters 1-3','tree':t['sha'],'parents':[parent]})
          api('PATCH','/git/refs/heads/'+branch,{'sha':c['sha'],'force':False}); print(c['sha'])
          PY
