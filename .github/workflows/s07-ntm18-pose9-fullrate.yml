name: S07 recover 18 original NTM near-base TP/RP pose fullrate (NO SOLVER)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - '.github/workflows/s07-ntm18-pose9-fullrate.yml'
      - 'research/wind-tower/experiments/T062/s07_ntm18_pose9_fullrate.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-ntm-pose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062/s07_ntm18_pose9_fullrate.py
            research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py
            research/wind-tower/experiments/T062/s06_ntm_18case_original_outb_gate.py
            research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json
            research/wind-tower/experiments/T062/S06_18NTM_W_BASE6_COINCIDENT_ENVELOPES_18ROW_20261110.csv
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
            research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
      - name: Syntax and synthetic coincidence/rejection tests
        run: |
          set -euo pipefail
          p=research/wind-tower/experiments/T062
          python3 -m py_compile "$p/s07_ntm18_pose9_fullrate.py"
          python3 "$p/s07_ntm18_pose9_fullrate.py" --self-test
      - name: Fetch 18 SHA-identified existing original NTM archives (read-only)
        run: |
          set -euo pipefail
          root=research/wind-tower
          mkdir -p "$RUNNER_TEMP/ntm-original"
          count=0
          while IFS= read -r p; do
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --output "$RUNNER_TEMP/ntm-original/$(basename "$p")" \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$p"
            count=$((count+1))
          done < <(python3 "$root/experiments/T062/s06_ntm_18case_original_outb_gate.py" \
            --manifest "$root/archive/local-assets-20261004-supplement/file-manifest.json" --list-archives)
          test "$count" -eq 18
      - name: Recover 216018 synchronized nine-gage TP/RP rows and 162 real coincidence summaries
        run: |
          set -euo pipefail
          root=research/wind-tower
          mkdir -p pose-fullrate
          python3 "$root/experiments/T062/s07_ntm18_pose9_fullrate.py" \
            --manifest "$root/archive/local-assets-20261004-supplement/file-manifest.json" \
            --zip-dir "$RUNNER_TEMP/ntm-original" \
            --source-receipt "$root/experiments/T062/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json" \
            --base6 "$root/experiments/T062/S06_18NTM_W_BASE6_COINCIDENT_ENVELOPES_18ROW_20261110.csv" \
            --contract "$root/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json" \
            --out pose-fullrate
          sha256sum pose-fullrate/*
          echo 'SOURCE-LEVEL TP/RP only; RP is NOT an exact DCM, NO external wind load, NO B/W/E/WE'
      - uses: actions/upload-artifact@v4
        with:
          name: s07-18ntm-original-pose9-fullrate-source-20261111
          path: pose-fullrate/*
          retention-days: 30
