name: R47 original RNA wind motion inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r47-rna-wind-gate.yml','public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/audit_r47.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            public/thesis-studio/inp-archive/R44_REBAR_RESEARCH_PRECHECK
            public/thesis-studio/inp-archive/R47_RNA_WIND_GATE
            public/thesis-studio/wind-figures/blade-aero/NTM
            public/thesis-studio/wind-figures/blade-aero/1ETM
            public/thesis-studio/wind-figures/blade-aero/original-inputs.zip
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6
      - run: python public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/audit_r47.py
      - uses: actions/upload-artifact@v4
        with:
          name: R47-verified-motion-inventory
          path: public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/
      - name: Archive actual channel inventories and geometry
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/*.csv public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive R47 actual native motion channel inventory"
          git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
