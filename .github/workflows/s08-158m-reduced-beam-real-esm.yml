name: S08 158m reduced beam real ESM screening (NOT Abaqus E)
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/s08-158m-reduced-beam-real-esm.yml'
      - 'research/wind-tower/experiments/T079/s08_158m_reduced_beam_real_esm.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  reduced-beam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch source-locked code and original OpenFAST 70-station tower
        run: |
          set -euo pipefail
          mkdir -p source output
          base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/research/wind-tower"
          curl -fLsS --retry 3 -o s08_158m_reduced_beam_real_esm.py "$base/experiments/T079/s08_158m_reduced_beam_real_esm.py"
          curl -fLsS --retry 3 -o source/tower.dat "$base/experiments/T077/recovery/S06_C02R3R2_158M_Tower_RECOVERED_20261026.dat"
          sha256sum s08_158m_reduced_beam_real_esm.py source/tower.dat
      - name: Retrieve archived real processed ESM ground motion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40847442979 -R "$GITHUB_REPOSITORY" -n s05-esm-v3-public-processed-source-or-failure-NOT-DESIGN-WAVE -D source
          echo 'a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34  source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv' | sha256sum -c
      - name: Execute analytic cantilever test and real 158m reduced beam
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'
          python s08_158m_reduced_beam_real_esm.py --self-test
          python s08_158m_reduced_beam_real_esm.py \
            --tower source/tower.dat \
            --esm source/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv \
            --outdir output --full-rate-history | tee output/runner_stdout.log
          python - <<'PY'
          import csv,hashlib,json,pathlib
          d=pathlib.Path('output')
          r=json.loads((d/'S08_158M_BEAM_PROXY_RECEIPT_20261102.json').read_text())
          assert r['tower_height_m']==158 and r['ground_motion_npts']==32040
          assert r['max_first_six_mesh_frequency_relative_difference']<.02
          assert r['modal_mass_orthogonality_max']<1e-8
          assert r['modal_residual_relative_max']<1e-7
          assert r['source_tower_sha256']==hashlib.sha256(pathlib.Path('source/tower.dat').read_bytes()).hexdigest()
          assert r['source_esm_sha256']=='a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34'
          assert len(list(csv.DictReader((d/'S08_158M_BEAM_PROXY_MODAL_20261102.csv').open())))==12
          assert len(list(csv.DictReader((d/'S08_158M_BEAM_PROXY_PEAKS_20261102.csv').open())))==2
          legacy=list(csv.DictReader((d/'S08_158M_BEAM_PROXY_HISTORY_20261102.csv').open()))
          full=list(csv.DictReader((d/'S08_158M_BEAM_PROXY_HISTORY_0P005S_20261106.csv').open()))
          assert len(legacy)==3204 and len(full)==64080
          assert [x['direction'] for x in full[::32040]]==['HNE','HNN']
          assert all(float(full[i]['time_s'])==0.005*i for i in (0,1,20,32039))
          assert all(float(full[32040+i]['time_s'])==0.005*i for i in (0,1,20,32039))
          for i in range(2):
            for j in range(1602):
              assert full[i*32040+j*20]==legacy[i*1602+j],(i,j)
          side=json.loads((d/'S08_158M_BEAM_PROXY_FULL_RATE_RECEIPT_20261106.json').read_text())
          m=side['full_rate_history']
          assert m['n_rows']==64080 and m['rows_per_direction']==32040
          assert m['dt_s']==0.005 and len(m['eight_peak_integrator_checks'])==8
          assert m['file_sha256']==hashlib.sha256((d/m['file']).read_bytes()).hexdigest()
          assert m['legacy_file_sha256']==hashlib.sha256((d/m['legacy_file']).read_bytes()).hexdigest()
          assert side['S09_PASS'] is False and side['native_E_WE_RUN']==0
          assert side['source_esm_sha256']=='a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34'
          print('PASS_REAL_ESM_0P005S_64080ROWS_8PEAKS_20X_EXACT_DECIMATION_E_ONLY_NOT_S09')
          assert r['RUN'].endswith('native Abaqus E/WE=0')
          moments=list(csv.DictReader((d/'S08_158M_BEAM_PROXY_35SEG_MOMENT_ENVELOPE_20261102.csv').open()))
          nodes=list(csv.DictReader((d/'S08_158M_BEAM_PROXY_36NODE_DISPLACEMENT_ENVELOPE_20261102.csv').open()))
          assert len(moments)==140 and len(nodes)==72
          for p in r['peak_summary']:
            direction=p['direction']
            m=next(x for x in moments if x['direction']==direction and x['element']=='1' and x['end']=='lower')
            u=next(x for x in nodes if x['direction']==direction and x['node']=='35')
            assert abs(float(m['peak_abs_elastic_bending_moment_kNm'])/p['peak_base_elastic_moment_kNm']-1)<1e-10
            assert abs(float(u['peak_abs_relative_u_mm'])/1000/p['peak_top_relative_displacement_m']-1)<1e-10
          assert r['along_height_envelopes']['moment_rows']==140
          svg=(d/'FIG_S08_07_158M_BEAM_PROXY_ALONG_HEIGHT_ENVELOPES_NOT_ABAQUS.svg').read_text()
          assert '<svg' in svg and 'NOT ABAQUS E/WE' in svg
          print('S08_REAL_158M_ALONG_HEIGHT_140M_72U_QC_PASS_NOT_ABAQUS_E')

          print('S08_REAL_158M_REDUCED_BEAM_SOURCE_QC_PASS_NOT_ABAQUS_E')
          PY
      - name: Independent historical-output numeric regression and new envelope receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p historical
          for f in S08_158M_BEAM_PROXY_MODAL_20261102.csv S08_158M_BEAM_PROXY_PEAKS_20261102.csv S08_158M_BEAM_PROXY_HISTORY_20261102.csv; do
            gh api "repos/$GITHUB_REPOSITORY/contents/research/wind-tower/experiments/T079/real-records/$f?ref=$GITHUB_REF_NAME" --jq '.content' | base64 -d > "historical/$f"
          done
          python - <<'PY'
          import csv,json,math,pathlib
          names=['S08_158M_BEAM_PROXY_MODAL_20261102.csv',
                 'S08_158M_BEAM_PROXY_PEAKS_20261102.csv',
                 'S08_158M_BEAM_PROXY_HISTORY_20261102.csv']
          results=[]
          for name in names:
              with open('historical/'+name,newline='') as f:a=list(csv.DictReader(f))
              with open('output/'+name,newline='') as f:b=list(csv.DictReader(f))
              assert len(a)==len(b) and a and a[0].keys()==b[0].keys(),name
              scales={}
              for k in a[0]:
                  vals=[]
                  for old,new in zip(a,b):
                      try:vals.extend((abs(float(old[k])),abs(float(new[k]))))
                      except ValueError:continue
                  scales[k]=max(1.,*vals) if vals else 1.
              max_abs=0.;max_scaled=0.;num=0
              for old,new in zip(a,b):
                  for k in old:
                      try:x=float(old[k]);y=float(new[k])
                      except ValueError:
                          assert old[k]==new[k],(name,k,old[k],new[k]);continue
                      assert math.isfinite(x) and math.isfinite(y)
                      delta=abs(x-y);scale=scales[k]
                      max_abs=max(max_abs,delta);max_scaled=max(max_scaled,delta/scale)
                      # Near-zero shear/moment histories are cancellation-prone.
                      # Compare against each column's peak physical scale, not each tiny sample.
                      assert delta<=1e-6*scale,(name,k,x,y,delta,scale)
                      num+=1
              results.append({'file':name,'rows':len(a),'numeric_cells':num,
                              'max_absolute_difference':max_abs,
                              'max_column_scale_normalized_difference':max_scaled,
                              'pass_threshold':'abs(x-y)<=1e-6*max(1,column_peak_abs)'})
          p=pathlib.Path('output/S08_158M_BEAM_PROXY_RECEIPT_20261102.json')
          r=json.loads(p.read_text())
          r['historical_regression']=results
          r['historical_receipt_policy']='Old 20261102 receipt and three original tables remain byte-unchanged in Git; this separate receipt documents the extended code version.'
          r['status']='ALONG_HEIGHT_NUMERIC_QC_PASS_NOT_ABAQUS_E'
          dest=pathlib.Path('output/S08_158M_BEAM_PROXY_ALONG_HEIGHT_RECEIPT_20261102.json')
          dest.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          print('S08_HISTORICAL_3TABLE_NUMERIC_REGRESSION_PASS',json.dumps(results))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s08-real-esm-158m-reduced-beam-NOT-ABAQUS
          path: output/*
          if-no-files-found: warn
          retention-days: 90
      - name: Persist small source-locked tables and receipt on Draft PR
        if: success() && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in S08_158M_BEAM_PROXY_FULL_RATE_RECEIPT_20261106.json S08_158M_BEAM_PROXY_35SEG_MOMENT_ENVELOPE_20261102.csv S08_158M_BEAM_PROXY_36NODE_DISPLACEMENT_ENVELOPE_20261102.csv S08_158M_BEAM_PROXY_ALONG_HEIGHT_RECEIPT_20261102.json FIG_S08_07_158M_BEAM_PROXY_ALONG_HEIGHT_ENVELOPES_NOT_ABAQUS.svg; do
            if [[ "$f" == *.svg ]]; then
              target="research/wind-tower/manuscript/final-thesis/figures/$f"
            else
              target="research/wind-tower/experiments/T079/real-records/$f"
            fi
            sha=""
            if gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$GITHUB_REF_NAME" --jq '.content' > existing.b64 2>/dev/null; then
              base64 -d existing.b64 > existing.file
              if cmp -s existing.file "output/$f"; then
                echo "ALREADY_IDENTICAL $target"
                continue
              fi
              if [[ "$f" == "S08_158M_BEAM_PROXY_ALONG_HEIGHT_RECEIPT_20261102.json" ]]; then
                echo "PRESERVE_HISTORICAL_RECEIPT_DIFFERENT_CODE_SHA $target"
                continue
              fi
              echo "EXISTING_NUMERICAL_ENVELOPE_DIFFERENT_HOLD $target"
              exit 1
            fi
            python - "$f" "$GITHUB_REF_NAME" "$sha" <<'PY' > payload.json
          import base64,json,sys
          filename,branch,sha=sys.argv[1:]
          payload={'message':'research(S08): persist real-ESM 158m along-height beam envelopes (NOT Abaqus)',
                   'content':base64.b64encode(open('output/'+filename,'rb').read()).decode(),
                   'branch':branch}
          if sha:payload['sha']=sha
          print(json.dumps(payload))
          PY
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input payload.json --jq '.commit.sha'
            echo "PERSISTED $target"
          done
