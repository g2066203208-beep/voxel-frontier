name: Materialize Terrain R8 Hierarchy

on:
  push:
    branches: [test/terrain-r8-geomorph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R8 source patch
        run: python3 .github/scripts/materialize_terrain_r8.py
      - name: Verify R8 markers
        run: |
          grep -q 'R8 mountain hierarchy' native/src/world/PlanetSurface.cpp
          grep -q 'R8 plateau hierarchy' native/src/world/PlanetSurface.cpp
          grep -q 'R8 rugged coast' native/src/world/PlanetSurface.cpp
          grep -q 'R8 capture geometry' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized R8 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp
          git commit -m 'terrain: materialize R8 hierarchy [skip ci]'
          git push origin HEAD:test/terrain-r8-geomorph
