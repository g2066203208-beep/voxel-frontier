name: R24 Render Pass Partition

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_render_pass_partition.py'
      - '.github/workflows/r24-render-pass-partition.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-render-pass-partition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact optimized R24
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply opaque transparent index partition
        run: python3 .github/scripts/r24_render_pass_partition.py

      - name: Validate renderer partition source
        shell: bash
        run: |
          git diff --check
          grep -q 'opaqueIndexCount' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'transparentIndexCount' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'partitionMeshIndicesByTransmission' native/src/render/VulkanRenderer.cpp
          grep -q 'drawScenePass(opaquePipeline_, false)' native/src/render/VulkanRenderer.cpp
          grep -q 'drawScenePass(transparentPipeline_, true)' native/src/render/VulkanRenderer.cpp
          grep -q 'staticMesh.opaqueIndexCount, 0U' native/src/render/VulkanRenderer.cpp
          ! grep -q 'drawScenePass(opaquePipeline_);' native/src/render/VulkanRenderer.cpp
          ! grep -q 'drawScenePass(transparentPipeline_);' native/src/render/VulkanRenderer.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-render-partition -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-render-partition --parallel 2

      - name: Run full native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-render-partition --verbose --output-on-failure 2>&1 | tee r24-render-partition-ctest.log

      - name: Gate runtime stability terrain and renderer
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-render-partition --verbose --output-on-failure \
            -R 'vf_r24_runtime_stability_tests|vf_r24_hydrologic_canyon_tests|vf_terrain_landform_tests|vf_r24_physical_planet_tests' \
            2>&1 | tee r24-render-partition-focused.log
          grep -q 'vf_r24_runtime_stability_tests: PASS' r24-render-partition-focused.log
          grep -q 'R24 hydrologic canyon tests passed' r24-render-partition-focused.log

      - name: Verify Lavapipe Vulkan
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real partitioned production terrain
        shell: bash
        run: |
          APP="$(find build/r24-render-partition -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-render-pass-partition-evidence

      - name: Gate real images and performance telemetry
        shell: bash
        run: |
          test -s r24-render-pass-partition-evidence/r24-epic-landscape-overview.png
          test -s r24-render-pass-partition-evidence/terrain/mega-mountain-range.png
          test -s r24-render-pass-partition-evidence/terrain/mega-rift-valley.png
          test -s r24-render-pass-partition-evidence/terrain/mega-canyon.png
          test -s r24-render-pass-partition-evidence/terrain/mega-abyss-cave-throat.png
          grep -R -q 'R24 PERF terrain_build_ms=' r24-render-pass-partition-evidence/logs

      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-render-pass-partition-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-render-pass-partition-evidence ]]; then
            cp -a r24-render-pass-partition-evidence/. "$EVIDENCE_DIR/"
          fi
          [[ -f r24-render-partition-ctest.log ]] && cp -f r24-render-partition-ctest.log "$EVIDENCE_DIR/" || true
          [[ -f r24-render-partition-focused.log ]] && cp -f r24-render-partition-focused.log "$EVIDENCE_DIR/" || true
          [[ -f vulkan-summary.txt ]] && cp -f vulkan-summary.txt "$EVIDENCE_DIR/" || true

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-render-pass-partition-${{ github.run_id }}
          path: |
            r24-render-pass-partition-evidence/**
            r24-render-partition-ctest.log
            r24-render-partition-focused.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested render partition
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          git commit -m "perf(r24): stop submitting every triangle to every material pass"
          git reset --hard HEAD
          git clean -fd build/r24-render-partition || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
