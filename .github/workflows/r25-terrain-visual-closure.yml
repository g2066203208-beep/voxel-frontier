name: R25 Terrain Visual Closure

on:
  push:
    branches: [work/r25-terrain-visual-closure]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r25-terrain-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-test-capture-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize R25 evidence-frame fix
        run: |
          set -euo pipefail
          python3 .github/scripts/materialize_r25_terrain_visual_closure.py
          grep -q 'R25 TERRAIN EVIDENCE FRAME' native/src/app/Main.cpp
          git diff --check
          git diff --stat
          git diff > r25-source.patch

      - name: Build and run native regression suite
        run: |
          cmake -S native -B build/core -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=OFF -DVF_BUILD_TESTS=ON
          cmake --build build/core --parallel
          ctest --test-dir build/core --verbose --output-on-failure

      - name: Install Vulkan headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Build Vulkan runtime
        run: |
          cmake -S native -B build/visual -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=OFF
          cmake --build build/visual --parallel

      - name: Verify Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture and gate four terrain classes
        shell: bash
        run: |
          set -euo pipefail
          export SDL_VIDEODRIVER=x11 DISPLAY=:99 VF_CELESTIAL_TIME_SCALE=1
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2
          APP="$(find build/visual -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r25-final
          failures=0

          capture_ready_frame() {
            local out="$1"
            for attempt in $(seq 1 20); do
              sleep 3
              import -display :99 -window root "$out"
              local colors
              colors="$(convert "$out" -format '%k' info:)"
              if [ "$colors" -gt 256 ]; then
                echo "$(basename "$out") unique_colors=$colors" | tee -a r25-final/capture-info.txt
                return 0
              fi
            done
            echo "$(basename "$out") failed visual-complexity gate" | tee -a r25-final/capture-info.txt
            return 1
          }

          for mode in mountain river coast highland; do
            echo "=== $mode ===" | tee -a r25-final/capture-info.txt
            stdbuf -oL -eL env VF_CAPTURE_LANDFORM="$mode" "$APP" >"r25-final/runtime-$mode.log" 2>&1 &
            pid=$!
            for t in $(seq 1 70); do
              sleep 2
              grep -q 'Capture semantic valid:' "r25-final/runtime-$mode.log" && break
              kill -0 "$pid" 2>/dev/null || break
            done
            if ! grep -q 'Capture semantic valid: YES' "r25-final/runtime-$mode.log"; then
              echo "$mode failed semantic camera/target gate" | tee -a r25-final/capture-info.txt
              grep -E 'Capture target elevation|Capture semantic valid|R25 evidence camera' "r25-final/runtime-$mode.log" | tee -a r25-final/capture-info.txt || true
              failures=$((failures+1))
            fi
            capture_ready_frame "r25-final/$mode.png" || failures=$((failures+1))
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            grep -E 'Capture target elevation|Capture semantic valid|Spawn land elevation' "r25-final/runtime-$mode.log" | tee -a r25-final/capture-info.txt || true
          done

          identify r25-final/*.png | tee -a r25-final/capture-info.txt
          test "$failures" -eq 0

      - name: Upload R25 evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r25-terrain-visual-closure-${{ github.sha }}
          path: |
            r25-final
            r25-source.patch
            vulkan-summary.txt
            xvfb.log
          if-no-files-found: warn

      - name: Commit validated R25 source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- native/src/app/Main.cpp; then
            echo 'No source diff to commit'
            exit 0
          fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/app/Main.cpp
          git commit -m 'terrain: fix barycentric landform evidence frame'
          git push origin HEAD:work/r25-terrain-visual-closure
