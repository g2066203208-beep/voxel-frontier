name: Inspect Li Zeyu seismic pages

on:
  push:
    paths:
      - '.github/workflows/inspect-li-zeyu-seismic-pages.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf
      - name: Extract selected thesis pages to job log
        shell: bash
        run: |
          python - <<'PY'
          import fitz
          pdf="research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf"
          doc=fitz.open(pdf)
          for pno in range(104,138):
              if pno > len(doc):
                  break
              page=doc[pno-1]
              text=page.get_text("text")
              print("\n" + "="*30 + f" PDF_FILE_PAGE {pno} " + "="*30)
              print(text[:16000])
          PY
