name: Build X2D Bone Player APK
on:
  push:
    branches: [x2d-bone-player-apk]
    paths:
      - 'bone-player/app/**'
      - 'bone-player/settings.gradle'
      - 'bone-player/build.gradle'
      - 'bone-player/gradle.properties'
      - '.github/workflows/build-x2d-bone-player.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: x2d-bone-player-apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle -p bone-player assembleDebug --stacktrace
      - name: Verify
        shell: bash
        run: |
          APK=bone-player/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p bone-player/releases
          cp "$APK" bone-player/releases/X2DBonePlayer-v0.1-debug.apk
          unzip -t bone-player/releases/X2DBonePlayer-v0.1-debug.apk >/dev/null
          sha256sum bone-player/releases/X2DBonePlayer-v0.1-debug.apk
      - name: Commit direct APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bone-player/releases/X2DBonePlayer-v0.1-debug.apk
          git diff --cached --quiet || git commit -m "build: publish X2D Bone Player v0.1 APK"
          git push origin HEAD:x2d-bone-player-apk
      - uses: actions/upload-artifact@v4
        with:
          name: X2DBonePlayer-v0.1-debug-apk
          path: bone-player/releases/X2DBonePlayer-v0.1-debug.apk
          if-no-files-found: error
