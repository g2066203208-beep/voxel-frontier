name: Build X2D Bone Player APK
on:
  push:
    branches: [x2d-bone-player-apk]
    paths:
      - 'bone-player/**'
      - '.github/workflows/build-x2d-bone-player.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle -p bone-player assembleDebug --stacktrace
      - name: Verify
        shell: bash
        run: |
          APK=bone-player/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" /tmp/X2DBonePlayer-v0.1-debug.apk
          unzip -t /tmp/X2DBonePlayer-v0.1-debug.apk >/dev/null
          sha256sum /tmp/X2DBonePlayer-v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: X2DBonePlayer-v0.1-debug-apk
          path: /tmp/X2DBonePlayer-v0.1-debug.apk
          if-no-files-found: error
