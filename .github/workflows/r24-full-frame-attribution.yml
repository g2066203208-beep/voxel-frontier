name: R24 Full Frame Attribution

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_full_frame_attribution.py'
      - '.github/workflows/r24-full-frame-attribution.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-full-frame-attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Materialize full-frame telemetry and 120 FPS acceptance target
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r24_full_frame_attribution.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/src/app/Main.cpp')
          t = p.read_text(encoding='utf-8')
          t = t.replace('            60.0,\n            40U,\n            "mainstream_1080p"}};',
                        '            120.0,\n            40U,\n            "mainstream_1080p"}};', 1)
          t = t.replace('memory_budget_gib=16 target_fps=60\\n',
                        'memory_budget_gib=16 target_fps=120\\n', 1)
          p.write_text(t, encoding='utf-8')
          PY
          git diff --check
          grep -q 'R24_FULL_FRAME_ATTRIBUTION_V1' native/src/app/Main.cpp
          grep -q 'R24_FULL_FRAME_ATTRIBUTION_V1' native/src/render/VulkanRenderer.cpp
          grep -q 'target_fps=120' native/src/app/Main.cpp

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Configure and build Release
        run: |
          cmake -S native -B build/r24-attribution -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
          cmake --build build/r24-attribution --parallel 2

      - name: Run all native regressions
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-attribution --verbose --output-on-failure 2>&1 | tee r24-attribution-ctest.log

      - name: Verify Vulkan device
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt
          grep -q 'llvmpipe' vulkan-summary.txt

      - name: Run uncapped locked 1080p canyon attribution benchmark
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/r24-attribution -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r24-attribution-evidence
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > r24-attribution-evidence/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 1
          export DISPLAY=:99 SDL_VIDEODRIVER=x11
          export VF_PERF_PROFILE=mainstream_1080p
          export VF_CAPTURE_AERIAL=1 VF_CAPTURE_ALTITUDE_METERS=7000 VF_TERRAIN_TARGET=canyon
          export VF_RUNTIME_DIAGNOSTICS=1 VF_CELESTIAL_TIME_SCALE=1
          timeout 35s "$APP" > r24-attribution-evidence/benchmark.log 2>&1 &
          APP_PID=$!
          sleep 4
          import -window root r24-attribution-evidence/mainstream-1080p-attribution.png || true
          set +e
          wait $APP_PID
          APP_RC=$?
          set -e
          cat r24-attribution-evidence/benchmark.log
          test -s r24-attribution-evidence/mainstream-1080p-attribution.png
          test "$APP_RC" -eq 0 -o "$APP_RC" -eq 124

      - name: Extract frame attribution report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('r24-attribution-evidence/benchmark.log').read_text(encoding='utf-8', errors='replace')
          benchmark = [x for x in text.splitlines() if x.startswith('R24 BENCHMARK profile=')]
          cpu = [x for x in text.splitlines() if x.startswith('R24 CPU stage_ms')]
          renderer = [x for x in text.splitlines() if x.startswith('R24 RENDER_CPU stage_ms')]
          gpu = [x for x in text.splitlines() if x.startswith('R24 GPU steady_pass_ms')]
          wsi = [x for x in text.splitlines() if 'R24 WSI present_mode=' in x]
          if not benchmark: raise SystemExit('missing benchmark summary')
          if not cpu: raise SystemExit('missing main CPU attribution')
          if not renderer: raise SystemExit('missing renderer CPU attribution')
          if not gpu: raise SystemExit('missing GPU pass attribution')
          if not wsi: raise SystemExit('missing WSI present-mode telemetry')
          report = '\n'.join([
              'CI_DEVICE=llvmpipe software Vulkan; relative attribution only, not hardware 120 FPS certification.',
              benchmark[-1], cpu[-1], renderer[-1], gpu[-1], wsi[-1],
          ]) + '\n'
          Path('r24-full-frame-attribution.txt').write_text(report, encoding='utf-8')
          print(report)
          PY

      - name: Preserve evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="docs/evidence/r24-full-frame-attribution-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          cp -a r24-attribution-evidence/. "$EVIDENCE_DIR/"
          cp -f r24-attribution-ctest.log vulkan-summary.txt r24-full-frame-attribution.txt "$EVIDENCE_DIR/"
          printf 'workflow_run=%s\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-full-frame-attribution-${{ github.run_id }}
          path: |
            r24-attribution-evidence/**
            r24-attribution-ctest.log
            vulkan-summary.txt
            r24-full-frame-attribution.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote measured telemetry to R24 branch
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          if ! git diff --cached --quiet; then
            git commit -m 'perf(r24): instrument complete 120fps frame budget'
          fi
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
