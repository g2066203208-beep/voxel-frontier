name: S05 official ESM processing and SNR at provisional 158m T1 (NOT design PASS)
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/s05-esm-official-longperiod-source-qc.yml'
      - 'research/wind-tower/experiments/T079/s05_esm_official_longperiod_source_qc.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  official-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact PR-head source and run negative self-test
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 -o s05_esm_official_longperiod_source_qc.py \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/research/wind-tower/experiments/T079/s05_esm_official_longperiod_source_qc.py"
          sha256sum s05_esm_official_longperiod_source_qc.py
          python -m py_compile s05_esm_official_longperiod_source_qc.py
          python s05_esm_official_longperiod_source_qc.py --self-test
      - name: Query actual ESM v3 official station processing and SNR; record 404/417/timeouts as HOLD
        run: |
          set -euo pipefail
          python s05_esm_official_longperiod_source_qc.py --outdir output | tee runner_stdout.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('output/S05_ESM_IT2012_NVL_OFFICIAL_LOWFREQ_SOURCE_QC_20261102.json').read_text())
          assert r['S05_PASS'] is False and r['S08_PASS'] is False and r['Abaqus_E_WE_RUN']==0
          assert len(r['attempts'])==2 and r['source_level_status'] in (
              'OFFICIAL_PROCESSING_AND_SNR_RETRIEVED_NOT_DESIGN_PASS',
              'HOLD_OFFICIAL_STATION_DETAILS_OR_SNR_NOT_RETRIEVED')
          for a in r['attempts']:
              for k in ('details','snr'):
                  assert a[k]['url'].startswith('https://esm-db.eu/esmws/')
                  if 'raw_response_sha256' in a[k]:
                      import hashlib
                      b=Path('output/ESM_OFFICIAL_'+a['instrument']+'_'+k+'.json').read_bytes()
                      assert hashlib.sha256(b).hexdigest()==a[k]['raw_response_sha256']
          print('OFFICIAL_ESM_SOURCE_RECEIPT_SHA_AND_HOLD_GATE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s05-esm-official-v3-actual-processing-snr-source-not-design-pass
          path: |
            output/*
            runner_stdout.log
          if-no-files-found: warn
          retention-days: 90
      - name: Persist official raw HN processing/SNR JSON and small audit receipt to T079
        if: success() && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="research/wind-tower/experiments/T079/real-records"
          for filename in S05_ESM_IT2012_NVL_OFFICIAL_LOWFREQ_SOURCE_QC_20261102.json ESM_OFFICIAL_HN_details.json ESM_OFFICIAL_HN_snr.json; do
            file="output/$filename"
            if [[ ! -f "$file" ]]; then
              if [[ "$filename" == ESM_OFFICIAL_HN_* ]]; then
                echo "OFFICIAL_HN_SOURCE_NOT_RETURNED_HOLD $filename"
                continue
              fi
              echo "RECEIPT_MISSING_HOLD $filename"; exit 1
            fi
            target="$root/$filename"
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$target?ref=$GITHUB_REF_NAME" --jq '.sha' 2>/dev/null || true)"
            python - "$file" "$GITHUB_REF_NAME" "$sha" <<'PY' > payload.json
          import base64,json,sys
          file,branch,sha=sys.argv[1:]
          data={'message':'research(S05): preserve official ESM v3 raw processing/SNR and source receipt (not design PASS)',
                'content':base64.b64encode(open(file,'rb').read()).decode(),'branch':branch}
          if sha:data['sha']=sha
          print(json.dumps(data))
          PY
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$target" --input payload.json --jq '.commit.sha'
            echo "OFFICIAL_ESM_SOURCE_PERSISTED $target"
          done
