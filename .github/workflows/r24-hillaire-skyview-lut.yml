name: R24 Hillaire SkyView LUT

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_hillaire_skyview_lut.py'
      - '.github/scripts/r24_cached_spherical_skyview.py'
      - '.github/workflows/r24-hillaire-skyview-lut.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-hillaire-skyview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Materialize cached spherical SkyView V2 and permanent 120 FPS target
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/r24_hillaire_skyview_lut.py
          python3 .github/scripts/r24_cached_spherical_skyview.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('native/src/app/Main.cpp')
          t = p.read_text(encoding='utf-8')
          t = t.replace('            60.0,\n            40U,\n            "mainstream_1080p"}};',
                        '            120.0,\n            40U,\n            "mainstream_1080p"}};', 1)
          t = t.replace('memory_budget_gib=16 target_fps=60\\n',
                        'memory_budget_gib=16 target_fps=120\\n', 1)
          if '            120.0,\n            40U,\n            "mainstream_1080p"}};' not in t:
              raise SystemExit('120 FPS benchmark target anchor missing')
          if 'memory_budget_gib=16 target_fps=120\\n' not in t:
              raise SystemExit('120 FPS benchmark banner anchor missing')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Validate V2 source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'kSkyViewLutWidth = 128' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'kSkyViewLutHeight = 72' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'R24_CACHED_SPHERICAL_SKYVIEW_V2' native/src/render/VulkanRenderer.cpp
          grep -q 'skyViewNeedsRefresh' native/src/render/VulkanRenderer.cpp
          grep -q 'R24_CACHED_SPHERICAL_SKYVIEW_V2' native/shaders/planet.slang
          grep -q 'viewSunCos' native/shaders/planet.slang
          grep -q 'viewUpCos' native/shaders/planet.slang
          grep -q 'gSkyViewLut.SampleLevel' native/shaders/planet.slang
          grep -q 'VF_SKY_VIEW_FRAGMENT_SPV' native/CMakeLists.txt
          grep -q 'target_fps=120' native/src/app/Main.cpp

      - name: Install build and Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Configure and build Release
        run: |
          cmake -S native -B build/r24-skyview -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
          cmake --build build/r24-skyview --parallel 2

      - name: Run complete native regression suite
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-skyview --verbose --output-on-failure 2>&1 | tee r24-skyview-ctest.log

      - name: Verify software Vulkan identity
        shell: bash
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt
          grep -q 'llvmpipe' vulkan-summary.txt
          printf '%s\n' 'CI_DEVICE=llvmpipe software Vulkan; absolute FPS is not a hardware certification.' > hardware-gpu-status.txt

      - name: Run locked 1920x1080 canyon benchmark and capture screenshot
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/r24-skyview -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r24-skyview-evidence
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > r24-skyview-evidence/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 1
          export DISPLAY=:99 SDL_VIDEODRIVER=x11
          export VF_PERF_PROFILE=mainstream_1080p
          export VF_CAPTURE_AERIAL=1 VF_CAPTURE_ALTITUDE_METERS=7000 VF_TERRAIN_TARGET=canyon
          export VF_RUNTIME_DIAGNOSTICS=1 VF_CELESTIAL_TIME_SCALE=1
          timeout 30s "$APP" > r24-skyview-evidence/benchmark.log 2>&1 &
          APP_PID=$!
          sleep 4
          import -window root r24-skyview-evidence/mainstream-1080p-skyview-v2.png || true
          set +e
          wait $APP_PID
          APP_RC=$?
          set -e
          cat r24-skyview-evidence/benchmark.log
          test -s r24-skyview-evidence/mainstream-1080p-skyview-v2.png
          test "$APP_RC" -eq 0 -o "$APP_RC" -eq 124

      - name: Gate real runtime improvement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('r24-skyview-evidence/benchmark.log').read_text(encoding='utf-8', errors='replace')
          summaries = [x for x in text.splitlines() if x.startswith('R24 BENCHMARK profile=')]
          if not summaries:
              raise SystemExit('missing benchmark summary')
          line = summaries[-1]
          def value(key):
              m = re.search(rf'\b{key}=([0-9]+(?:\.[0-9]+)?)', line)
              if not m:
                  raise SystemExit(f'missing {key}')
              return float(m.group(1))
          if 'resolution=1920x1080' not in line or 'target_fps=120.000' not in line or 'valid=1' not in line:
              raise SystemExit('benchmark profile is not locked 1080p/120')
          fps = value('avg_fps')
          one = value('one_percent_low_fps')
          p99 = value('p99_ms')
          gpu = [x for x in text.splitlines() if x.startswith('R24 GPU steady_pass_ms')]
          if not gpu:
              raise SystemExit('missing GPU pass telemetry')
          g = gpu[-1]
          def gv(key):
              m = re.search(rf'\b{key}=([0-9]+(?:\.[0-9]+)?)', g)
              if not m:
                  raise SystemExit(f'missing GPU {key}')
              return float(m.group(1))
          sky = gv('sky_mean')
          total = gv('total_mean')
          opaque = gv('opaque_mean')
          transparent = gv('transparent_mean')
          shadow = gv('shadow_mean')
          # LOD1100 + old per-frame screen-space LUT was 13.878 FPS / ~30.5 ms sky on the same
          # software Vulkan class. V2 must demonstrate a large architectural improvement before it
          # can become production source.
          if fps < 20.0:
              raise SystemExit(f'cached SkyView did not materially raise throughput: {fps:.3f} FPS')
          if sky > 8.0:
              raise SystemExit(f'steady Sky pass still exceeds a 120-Hz-sized budget: {sky:.3f} ms')
          if total > 18.0:
              raise SystemExit(f'tracked GPU passes remain too high after V2: {total:.3f} ms')
          report = (
              f'avg_fps={fps:.3f}\n1pct_low_fps={one:.3f}\np99_ms={p99:.3f}\n'
              f'shadow_mean_ms={shadow:.3f}\nopaque_mean_ms={opaque:.3f}\n'
              f'sky_mean_ms={sky:.3f}\ntransparent_mean_ms={transparent:.3f}\n'
              f'tracked_gpu_total_mean_ms={total:.3f}\n'
              'target_hardware_fps=120\ntarget_frame_ms=8.333\n'
              'ci_device=llvmpipe_software_vulkan\n')
          print(report)
          Path('r24-skyview-performance.txt').write_text(report, encoding='utf-8')
          PY

      - name: Preserve evidence in repository
        if: success()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-skyview-v2-120fps-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          cp -a r24-skyview-evidence/. "$EVIDENCE_DIR/"
          cp -f r24-skyview-ctest.log vulkan-summary.txt hardware-gpu-status.txt r24-skyview-performance.txt "$EVIDENCE_DIR/"
          printf 'workflow_run=%s\nworkflow_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-skyview-v2-120fps-${{ github.run_id }}
          path: |
            r24-skyview-evidence/**
            r24-skyview-ctest.log
            vulkan-summary.txt
            hardware-gpu-status.txt
            r24-skyview-performance.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested V2 source changes
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          if ! git diff --cached --quiet; then
            git commit -m "perf(r24): cache spherical SkyView outside steady frame budget"
          fi
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
