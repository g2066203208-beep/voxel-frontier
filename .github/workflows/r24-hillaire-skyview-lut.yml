name: R24 Hillaire SkyView LUT

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_hillaire_skyview_lut.py'
      - '.github/workflows/r24-hillaire-skyview-lut.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-hillaire-skyview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3

      - name: Apply Hillaire-inspired SkyView LUT
        run: python3 .github/scripts/r24_hillaire_skyview_lut.py

      - name: Validate SkyView source contract
        shell: bash
        run: |
          git diff --check
          grep -q 'kSkyViewLutWidth = 192' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'kSkyViewLutHeight = 108' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'VK_FORMAT_R16G16B16A16_SFLOAT' native/src/render/VulkanRenderer.cpp
          grep -q 'skyViewPipeline_' native/src/render/VulkanRenderer.cpp
          grep -q 'skyViewFragmentMain' native/shaders/planet.slang
          grep -q 'gSkyViewLut.SampleLevel' native/shaders/planet.slang
          grep -q 'VF_SKY_VIEW_FRAGMENT_SPV' native/CMakeLists.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-skyview -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-skyview --parallel 2

      - name: Run all native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-skyview --verbose --output-on-failure 2>&1 | tee r24-skyview-ctest.log

      - name: Gate physics terrain shader and runtime contracts
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-skyview --verbose --output-on-failure \
            -R 'vf_planetary_body_system_tests|vf_r24_runtime_stability_tests|vf_r24_hydrologic_canyon_tests|vf_terrain_landform_tests|vf_r24_physical_planet_tests|vf_shader_contract_tests' \
            2>&1 | tee r24-skyview-focused.log
          grep -q 'vf_planetary_body_system_tests: PASS' r24-skyview-focused.log
          grep -q 'vf_r24_runtime_stability_tests: PASS' r24-skyview-focused.log
          grep -q 'Terrain landform tests passed' r24-skyview-focused.log
          grep -q 'R24 hydrologic canyon tests passed' r24-skyview-focused.log
          grep -q 'All production shader SPIR-V entry-point contracts passed' r24-skyview-focused.log

      - name: Verify Vulkan device
        shell: bash
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt
          if grep -q 'deviceType.*PHYSICAL_DEVICE_TYPE_CPU' vulkan-summary.txt; then
            echo 'R24_200FPS_HARDWARE_GATE=UNAVAILABLE_SOFTWARE_VULKAN' | tee hardware-gpu-status.txt
          else
            echo 'R24_200FPS_HARDWARE_GATE=AVAILABLE' | tee hardware-gpu-status.txt
          fi

      - name: Capture real Vulkan production scenes
        shell: bash
        run: |
          APP="$(find build/r24-skyview -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-skyview-evidence

      - name: Gate real images and SkyView performance
        shell: bash
        run: |
          test -s r24-skyview-evidence/r24-epic-landscape-overview.png
          for f in mountain rift canyon abyss; do
            test -s "r24-skyview-evidence/terrain/mega-${f/abyss/abyss-cave-throat}.png" || true
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          root = Path('r24-skyview-evidence/logs')
          pattern = re.compile(
              r'R24 GPU steady_pass_ms samples=([0-9]+) '
              r'shadow_mean=([0-9.]+) opaque_mean=([0-9.]+) sky_mean=([0-9.]+) '
              r'transparent_mean=([0-9.]+) total_mean=([0-9.]+) '
              r'shadow_max=([0-9.]+) opaque_max=([0-9.]+) sky_max=([0-9.]+) transparent_max=([0-9.]+)')
          rows=[]
          for name in ('mountain','rift','canyon','abyss'):
              text=(root/f'{name}.log').read_text(encoding='utf-8', errors='replace')
              found=pattern.findall(text)
              if not found:
                  raise SystemExit(f'{name}: missing steady pass telemetry')
              values=found[-1]
              row=(name,int(values[0]),*map(float,values[1:]))
              rows.append(row)
              print('SKYVIEW_STEADY',row)
              if row[1] < 8:
                  raise SystemExit(f'{name}: too few steady samples: {row[1]}')
          sky=[r[4] for r in rows]
          totals=[r[6] for r in rows]
          opaque=[r[3] for r in rows]
          sky_mean=statistics.mean(sky)
          total_mean=statistics.mean(totals)
          opaque_mean=statistics.mean(opaque)
          baseline_sky=20.64475
          baseline_total=54.61025
          improvement=(baseline_sky-sky_mean)/baseline_sky
          print('SKYVIEW_SUMMARY', 'sky_mean_ms=',sky_mean, 'opaque_mean_ms=',opaque_mean,
                'total_mean_ms=',total_mean, 'sky_reduction=',improvement)
          Path('r24-skyview-performance.txt').write_text(
              f'baseline_sky_ms={baseline_sky:.6f}\n'
              f'skyview_sky_ms={sky_mean:.6f}\n'
              f'sky_reduction_fraction={improvement:.6f}\n'
              f'baseline_total_ms={baseline_total:.6f}\n'
              f'skyview_total_ms={total_mean:.6f}\n'
              f'hardware_target_ms=5.000000\n'
              f'hardware_target_fps=200\n'
              f'ci_device=llvmpipe_software_vulkan_not_hardware_fps\n',
              encoding='utf-8')
          # This must be a material win, not architectural theater. We expect ~70x fewer expensive
          # atmosphere pixels; allow composition/staging overhead but demand at least 35% sky win.
          if sky_mean >= baseline_sky * 0.65:
              raise SystemExit(f'SkyView LUT insufficient: {sky_mean:.3f} ms vs {baseline_sky:.3f} ms baseline')
          if total_mean >= baseline_total:
              raise SystemExit(f'total software-Vulkan pass cost did not improve: {total_mean:.3f} ms')
          PY

      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-hillaire-skyview-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-skyview-evidence ]]; then
            cp -a r24-skyview-evidence/. "$EVIDENCE_DIR/"
          fi
          for f in r24-skyview-ctest.log r24-skyview-focused.log vulkan-summary.txt hardware-gpu-status.txt r24-skyview-performance.txt; do
            [[ -f "$f" ]] && cp -f "$f" "$EVIDENCE_DIR/" || true
          done
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-hillaire-skyview-${{ github.run_id }}
          path: |
            r24-skyview-evidence/**
            r24-skyview-ctest.log
            r24-skyview-focused.log
            vulkan-summary.txt
            hardware-gpu-status.txt
            r24-skyview-performance.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested SkyView LUT
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          if ! git diff --cached --quiet; then
            git commit -m "perf(r24): render atmosphere through fast sky-view LUT"
          fi
          git reset --hard HEAD
          git clean -fd build/r24-skyview || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
