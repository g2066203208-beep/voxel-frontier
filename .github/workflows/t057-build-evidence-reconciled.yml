name: T057 Build evidence-reconciled Abaqus candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t057-build-evidence-reconciled.yml"
      - "research/wind-tower/experiments/T057/build_t057_evidence_reconciled.py"
      - "research/wind-tower/experiments/T053/inputs/BASE001_T053_HE_ALIGNED_S345_CAGE_RNA_R2.inp"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build T057
        run: python research/wind-tower/experiments/T057/build_t057_evidence_reconciled.py
      - name: Commit generated T057 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T057/inputs research/wind-tower/experiments/T057/T057_BUILD_AUDIT.json research/wind-tower/experiments/T057/T057_MATERIAL_TRUE_STRESS_TABLE.csv
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "T057: generate evidence-reconciled Abaqus candidate"
            git pull --rebase origin main
            git push
          fi
