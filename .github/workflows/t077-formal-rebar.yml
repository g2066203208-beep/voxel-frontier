name: T077 formal 31-segment reinforcement closure

on:
  workflow_run:
    workflows: ["T072 rerun 31-segment control cases"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  calc:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/T071/T071_input_geometry_31_segments.csv
            research/wind-tower/experiments/T073/T073_T053_RBLONG_RADII.csv
            research/wind-tower/experiments/T073/t073_e01_fixed_counts_feasible_map.py
            research/wind-tower/experiments/T074/T074_158M_31SEG_GRAVITY_BASELINE.csv
            research/wind-tower/experiments/T077
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pandas numpy

      - name: Download selected-control 31-segment histories from upstream run
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/wind-tower/experiments/T077/artifacts/selected
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'T072-*' --dir /tmp/t072
          find /tmp/t072 -type f -name '*31seg.csv.gz' -print -exec cp {} research/wind-tower/experiments/T077/artifacts/selected/ \;

      - name: Download formal S06 31-segment histories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/wind-tower/experiments/T077/artifacts/S06/{A,B,C,D}
          declare -A IDS=( [A]=11466755161 [B]=11465219800 [C]=11466308388 [D]=11465344577 )
          for b in A B C D; do
            curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${IDS[$b]}/zip" -o "/tmp/S06_$b.zip"
            unzip -q "/tmp/S06_$b.zip" -d "research/wind-tower/experiments/T077/artifacts/S06/$b"
          done
          echo "history files:"
          find research/wind-tower/experiments/T077/artifacts -type f -name '*31seg.csv.gz' -print

      - name: Run formal Table 5.2.5 + E.0.1 scan
        shell: bash
        run: |
          set -euo pipefail
          python research/wind-tower/experiments/T077/t077_formal_rebar.py

      - name: Clean transient histories
        run: rm -rf research/wind-tower/experiments/T077/artifacts

      - name: Commit formal reinforcement results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse research/wind-tower/experiments/T077
          git diff --cached --quiet && exit 0
          git commit -m "T077: close formal 31-segment reinforcement design"
          git pull --rebase origin main
          git push
