name: T059 Audit T057 steel mesh
# trigger-audit-20261007

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t059-audit-t057-steel-mesh.yml"
      - "research/wind-tower/experiments/T059/audit_t057_steel_mesh.py"
      - "research/wind-tower/experiments/T057/inputs/BASE001_T057_EVIDENCE_RECONCILED_HRB335_Q345_PTBF8_CONTACT_RNA_R2.inp"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit T057 steel mesh
        run: python research/wind-tower/experiments/T059/audit_t057_steel_mesh.py
      - name: Commit audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T059/README.md                   research/wind-tower/experiments/T059/T059_STEEL_MESH_AUDIT.json                   research/wind-tower/experiments/T059/T059_STEEL_ELEMENT_METRICS.csv
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "T059: publish T057 steel mesh audit"
            git pull --rebase origin main
            git push
          fi
