name: R24 Shadow Contact Fix

on:
  push:
    branches: [work/r24-shadow-contact-fix]
    paths:
      - '.github/scripts/r24_shadow_contact_refine.py'
      - '.github/workflows/r24-shadow-contact-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Apply refined contact-shadow framing
        run: python3 .github/scripts/r24_shadow_contact_refine.py
      - name: Validate patch
        run: |
          git diff --check
          ! grep -q 'shadow-contact downward view' native/src/app/Main.cpp
          grep -q 'placementTangentPlanet' native/src/app/Main.cpp
          grep -q 'shadowDirectionSurface' native/src/app/Main.cpp
          grep -q 'shadowRaster.depthBiasConstantFactor = 0.18F' native/src/render/VulkanRenderer.cpp
          grep -q '0.000012 + 0.000055' native/shaders/planet.slang
      - name: Commit refined proof framing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/app/Main.cpp
          git commit -m 'test(r24): frame contact-shadow origin from low side angle'
          git push origin HEAD:work/r24-shadow-contact-fix
