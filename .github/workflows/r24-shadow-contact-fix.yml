name: R24 Shadow Contact Fix

on:
  push:
    branches: [work/r24-shadow-contact-fix]
    paths:
      - '.github/scripts/r24_shadow_contact_fix.py'
      - '.github/workflows/r24-shadow-contact-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Apply focused production shadow fix
        run: python3 .github/scripts/r24_shadow_contact_fix.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'shadowRaster.depthBiasConstantFactor = 0.18F' native/src/render/VulkanRenderer.cpp
          grep -q '0.000012 + 0.000055' native/shaders/planet.slang
          grep -q 'R24 shadow-contact probe' native/src/app/Main.cpp
          grep -q 'contact-side.png' .github/scripts/r24_stability_capture.sh
      - name: Commit focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/render/VulkanRenderer.cpp native/shaders/planet.slang native/src/app/Main.cpp .github/scripts/r24_stability_capture.sh
          git commit -m 'fix(r24): anchor production shadows to contact points'
          git push origin HEAD:work/r24-shadow-contact-fix
