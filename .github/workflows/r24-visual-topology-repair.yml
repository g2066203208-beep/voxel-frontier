name: R24 Visual Topology Repair

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_visual_topology_repair.py'
      - '.github/workflows/r24-visual-topology-repair.yml'

permissions:
  contents: write

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply visual topology repair
        run: python3 .github/scripts/r24_visual_topology_repair.py

      - name: Validate repair source contract
        shell: bash
        run: |
          git diff --check
          grep -q 'R24 visual-topology safety gate' native/src/render/VulkanRenderer.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/src/render/VulkanRenderer.cpp').read_text()
          s=p.index('R24 visual-topology safety gate')
          e=p.index('createColorPipeline(', s)
          chunk=p[s:e]
          assert 'VK_CULL_MODE_NONE' in chunk
          assert 'VK_CULL_MODE_BACK_BIT' not in chunk
          print('opaque terrain pipeline is two-sided')
          PY

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick xdotool mesa-vulkan-drivers vulkan-tools libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-visual-repair -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-visual-repair --parallel 2

      - name: Run all native tests
        run: ctest --test-dir build/r24-visual-repair --output-on-failure

      - name: Verify Lavapipe Vulkan
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture repaired real Vulkan scenes
        shell: bash
        run: |
          APP="$(find build/r24-visual-repair -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-visual-topology-evidence

      - name: Gate screenshot files
        run: |
          test -s r24-visual-topology-evidence/r24-epic-landscape-overview.png
          for f in r24-visual-topology-evidence/terrain/*.png; do
            test -s "$f"
            colors="$(convert "$f" -format '%k' info:)"
            test "$colors" -gt 512
          done

      - name: Upload evidence always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-visual-topology-${{ github.run_id }}
          path: |
            r24-visual-topology-evidence/**
            vulkan-summary.txt
          retention-days: 30

      - name: Promote repaired production renderer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src/render/VulkanRenderer.cpp
          git commit -m 'fix(r24): restore continuous terrain rendering after culling regression'
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
