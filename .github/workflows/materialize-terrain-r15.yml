name: Materialize Terrain R15 Proxy Separation

on:
  push:
    branches: [test/terrain-r15-proxy-separation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R15 patch
        run: python3 .github/scripts/materialize_terrain_r15.py
      - name: Verify R15 markers
        run: |
          grep -q 'R15 mutually exclusive orbital proxy' native/src/app/Main.cpp
          grep -q 'R15 plateau material semantics' native/src/world/PlanetSurface.cpp
          grep -q 'R14 plateau authority' native/src/world/PlanetSurface.cpp
          grep -q 'R14 water readability' native/shaders/planet.slang
          git diff --check
      - name: Commit materialized R15 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/app/Main.cpp native/src/world/PlanetSurface.cpp
          git commit -m 'terrain: separate orbital proxy from local clipmap R15 [skip ci]'
          git push origin HEAD:test/terrain-r15-proxy-separation
