name: Materialize Terrain R18 High Resolution Process Bake

on:
  push:
    branches: [test/terrain-r18-highres-process-bake]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R18 process patch
        run: python3 .github/scripts/materialize_terrain_r18.py
      - name: Verify R18 invariants
        run: |
          grep -q 'constexpr int kRes = 256' native/include/vf/world/PlanetGeomorph.hpp
          grep -q 'constexpr int kErosionSteps = 60' native/include/vf/world/PlanetGeomorph.hpp
          grep -q 'R17 SINGLE MACRO AUTHORITY' native/src/world/PlanetSurface.cpp
          ! grep -q 'R13 connected orogen structure' native/src/world/PlanetSurface.cpp
          ! grep -q 'const double plateauShelf = 2700.0' native/src/world/PlanetSurface.cpp
          git diff --check
      - name: Commit source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/include/vf/world/PlanetGeomorph.hpp native/src/world/PlanetSurface.cpp
          git commit -m 'terrain: raise R18 geomorph process bake to 256 cubemap [skip ci]'
          git push origin HEAD:test/terrain-r18-highres-process-bake
