name: R47 shaft-aligned tower wind correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/r47-align-tower-wind.yml','public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/align_tower_wind.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            public/thesis-studio/inp-archive/R46_WIND_MAPPING
            public/thesis-studio/inp-archive/R47_RNA_WIND_GATE
            public/thesis-studio/wind-figures/tower-drag/timeseries
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==2.2.6
      - run: python public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/align_tower_wind.py
      - name: Archive corrected CLOAD and actual receipt
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/cload_R44_shaft_aligned.inc public/thesis-studio/inp-archive/R47_RNA_WIND_GATE/tower_alignment_receipt.json
          git commit -m "Archive shaft-aligned tower wind correction and conservation audit"
          git fetch origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
