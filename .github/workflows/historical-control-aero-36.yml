name: Historical OpenFAST control and aerodynamic coefficient recovery
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths: ['.github/workflows/historical-control-aero-36.yml']
  pull_request:
    types: [synchronize, opened, reopened]
    paths: ['.github/workflows/historical-control-aero-36.yml', 'research/wind-tower/experiments/T062/recover_control_aero_36.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: historical-control-aero-36
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062/recover_control_aero_36.py
            research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py
            research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 matplotlib==3.9.2
      - name: Recover original binary histories and render corresponding figures
        run: python research/wind-tower/experiments/T062/recover_control_aero_36.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-control-aero-36
          path: historical-control-figures/
          retention-days: 30
