name: Materialize Terrain R4 Visual Fix

on:
  push:
    branches: [feature/terrain-r4-geomorph-bake]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Refine range silhouettes and daylight off-feature capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Global-bake-guided band-limited mountain/valley refinement.
          p = Path('native/src/world/PlanetSurface.cpp')
          s = p.read_text()
          anchor = '''    elevation = geomorph.elevationMeters;\n    const double geomorphLandness = smooth01(-80.0, 220.0, geomorph.elevationMeters);\n\n'''
          block = '''    elevation = geomorph.elevationMeters;\n    const double geomorphLandness = smooth01(-80.0, 220.0, geomorph.elevationMeters);\n\n    // The global 512x256 process bake owns where mountain belts and drainage basins live,\n    // but on an Earth-radius sphere one bake texel spans tens of kilometres.  Reconstruct\n    // band-limited range structure *inside that authority mask* instead of bilinearly\n    // stretching each bake texel into a smooth ramp.  These wavelengths form range mass,\n    // sub-ranges and valley shoulders; walking-scale noise remains a separate layer below.\n    const double rangeRidgeA = 1.0 - std::abs(fbmSurface(\n        definition.seed ^ 0xD6E8FEB86659FD93ULL, w, 34.0, 5));\n    const double rangeRidgeB = 1.0 - std::abs(fbmSurface(\n        definition.seed ^ 0xA5A3564E27F8862FULL, w, 82.0, 4));\n    const double rangeRidgeC = 1.0 - std::abs(fbmSurface(\n        definition.seed ^ 0x9E3779B185EBCA87ULL, w, 210.0, 3));\n    const double rangeMask = smooth01(0.10, 0.72, geomorph.mountain) * geomorphLandness;\n    const double rangeMass = rangeMask * (0.32 + 0.68 * smooth01(0.30, 0.82, rangeRidgeA));\n    const double rangeShoulders = rangeMask * smooth01(0.36, 0.86, rangeRidgeB);\n    const double rangeFaces = rangeMask * smooth01(0.42, 0.90, rangeRidgeC);\n    elevation += maxLand * (0.075 * rangeMask + 0.145 * rangeMass\n        + 0.085 * rangeShoulders + 0.040 * rangeFaces);\n\n    // Hydrology remains the placement authority for valleys.  A narrow deterministic\n    // sub-channel only sharpens the coarse baked river corridor; it cannot create a river\n    // where the discharge bake has none.\n    const double channelRefineNoise = 1.0 - std::abs(fbmSurface(\n        definition.seed ^ 0xC2B2AE3D27D4EB4FULL, w, 260.0, 3));\n    const double channelCore = geomorph.river\n        * smooth01(0.58, 0.91, channelRefineNoise) * geomorphLandness;\n    elevation -= maxLand * (0.030 * geomorph.incision + 0.045 * channelCore);\n\n    // Give hydrologically low coastal margins a readable land/sea break without changing\n    // the global coastline authority.  Rugged margins expose a short escarpment, while flat\n    // margins remain beaches/floodplains.\n    const double globalCoastBand = geomorphLandness\n        * (1.0 - smooth01(90.0, 680.0, std::abs(geomorph.elevationMeters)));\n    const double globalCoastRugged = globalCoastBand\n        * smooth01(0.46, 0.86, rangeRidgeB);\n    elevation += maxLand * 0.032 * globalCoastRugged;\n\n'''
          if 'const double rangeRidgeA' not in s:
              if anchor not in s:
                  raise SystemExit('geomorph integration anchor not found')
              s = s.replace(anchor, block, 1)
          # Report global coast refinement through the existing landform diagnostic/material path.
          old = '    sample.coastalCliff = coastalCliff;'
          new = '    sample.coastalCliff = std::max(coastalCliff, globalCoastRugged);'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) General camera view setter, used by the deterministic evidence camera.
          h = Path('native/include/vf/player/PlanetCamera.hpp')
          hs = h.read_text()
          decl_anchor = '''    void setExternalWorldState(\n        const glm::dvec3& worldPosition,\n        const glm::dvec3& worldVelocity,\n        bool grounded) noexcept {'''
          if 'void setViewDirection(' not in hs:
              pos = hs.find(decl_anchor)
              if pos < 0:
                  raise SystemExit('camera public anchor not found')
              insert = '''    void setViewDirection(\n        const glm::dvec3& forward,\n        const glm::dvec3& upHint) noexcept;\n\n'''
              hs = hs[:pos] + insert + hs[pos:]
          h.write_text(hs)

          c = Path('native/src/player/PlanetCamera.cpp')
          cs = c.read_text()
          impl_anchor = '''const CelestialBody* PlanetCamera::physicsFrameBody() const noexcept {'''
          if 'void PlanetCamera::setViewDirection(' not in cs:
              impl = '''void PlanetCamera::setViewDirection(\n    const glm::dvec3& forwardInput,\n    const glm::dvec3& upHintInput) noexcept {\n    viewForward_ = safeNormalize(forwardInput, viewForward_);\n    const glm::dvec3 upHint = safeNormalize(upHintInput, currentSurfaceUpWorld());\n    glm::dvec3 right = glm::cross(viewForward_, upHint);\n    if (glm::dot(right, right) <= 1.0e-12) right = stablePerpendicular(viewForward_);\n    right = safeNormalize(right, stablePerpendicular(viewForward_));\n    viewUp_ = safeNormalize(glm::cross(right, viewForward_), upHint);\n    transportedSurfaceUp_ = upHint;\n    viewAttitudeValid_ = true;\n    surfaceTransportValid_ = true;\n}\n\n'''
              if impl_anchor not in cs:
                  raise SystemExit('camera implementation anchor not found')
              cs = cs.replace(impl_anchor, impl + impl_anchor, 1)
          c.write_text(cs)

          # 3) Capture: target a daylight feature, stand off the feature, and look back at it.
          m = Path('native/src/app/Main.cpp')
          ms = m.read_text()
          old_capture = '''        if (!captureMode.empty()) {\n            if (terrain.submerged(planet) || aboveSea < 15.0) continue;\n            double captureScore = -std::numeric_limits<double>::infinity();'''
          new_capture = '''        if (!captureMode.empty()) {\n            if (terrain.submerged(planet) || aboveSea < 15.0) continue;\n            const double sunElevation = glm::dot(d, sunDirection);\n            if (sunElevation < 0.42 || sunElevation > 0.94) continue;\n            const double readableDaylight = 1.0\n                - std::clamp(std::abs(sunElevation - 0.66) / 0.30, 0.0, 1.0);\n            double captureScore = readableDaylight * 1.65;'''
          if old_capture in ms:
              ms = ms.replace(old_capture, new_capture, 1)

          helper_anchor = '''void appendMesh(vf::PlanetMesh& destination, const vf::PlanetMesh& source) {'''
          if 'findCaptureVantageDirection' not in ms:
              helper = '''[[nodiscard]] glm::dvec3 findCaptureVantageDirection(\n    const vf::PlanetDefinition& planet,\n    const glm::dvec3& targetDirectionInput,\n    std::string_view mode) {\n    const glm::dvec3 target = safeNormalize(targetDirectionInput);\n    const glm::dvec3 east = stableTangent(target);\n    const glm::dvec3 north = safeNormalize(glm::cross(target, east), {0.0, 0.0, 1.0});\n    double standOffMeters = 6500.0;\n    if (mode == "mountain") standOffMeters = 14000.0;\n    else if (mode == "river") standOffMeters = 4200.0;\n    else if (mode == "coast") standOffMeters = 6500.0;\n    else if (mode == "highland") standOffMeters = 12000.0;\n    const double angular = standOffMeters / std::max(1.0, planet.radius);\n\n    glm::dvec3 best = target;\n    double bestScore = std::numeric_limits<double>::infinity();\n    for (int i = 0; i < 24; ++i) {\n        const double a = 2.0 * kPi * static_cast<double>(i) / 24.0;\n        const glm::dvec3 d = safeNormalize(\n            target + east * (std::cos(a) * angular) + north * (std::sin(a) * angular), target);\n        const vf::PlanetTerrainSample terrain = vf::samplePlanetTerrain(planet, d);\n        if (terrain.submerged(planet) && mode != "coast") continue;\n        const double targetElevation = vf::planetHeight(planet, target);\n        const double heightPenalty = terrain.elevationMeters - targetElevation;\n        const double wetPenalty = terrain.submerged(planet) ? 800.0 : 0.0;\n        const double ruggedPenalty = terrain.mountain * 420.0 + terrain.canyon * 180.0;\n        const double score = heightPenalty + wetPenalty + ruggedPenalty;\n        if (score < bestScore) {\n            bestScore = score;\n            best = d;\n        }\n    }\n    return safeNormalize(best, target);\n}\n\n'''
              if helper_anchor not in ms:
                  raise SystemExit('Main helper anchor not found')
              ms = ms.replace(helper_anchor, helper + helper_anchor, 1)

          init_old = '''        const glm::dvec3 spawnDirection = findPlayableSpawnDirection(planet, initialSunDirectionPlanet);\n        const vf::PlanetTerrainSample spawnTerrain = vf::samplePlanetTerrain(planet, spawnDirection);\n        vf::PlanetCamera camera{planet, &celestial, asterId, spawnDirection};\n'''
          init_new = '''        const glm::dvec3 featureDirection = findPlayableSpawnDirection(planet, initialSunDirectionPlanet);\n        const char* captureEnv = std::getenv("VF_CAPTURE_LANDFORM");\n        const std::string_view captureMode = captureEnv != nullptr\n            ? std::string_view{captureEnv} : std::string_view{};\n        const glm::dvec3 spawnDirection = captureMode.empty()\n            ? featureDirection\n            : findCaptureVantageDirection(planet, featureDirection, captureMode);\n        const vf::PlanetTerrainSample spawnTerrain = vf::samplePlanetTerrain(planet, spawnDirection);\n        vf::PlanetCamera camera{planet, &celestial, asterId, spawnDirection};\n        if (!captureMode.empty()) {\n            const glm::dvec3 targetPlanet = featureDirection\n                * (vf::planetSurfaceRadius(planet, featureDirection)\n                    + (captureMode == "mountain" || captureMode == "highland" ? 650.0 : 120.0));\n            const glm::dvec3 cameraPlanet = spawnDirection\n                * (vf::planetSurfaceRadius(planet, spawnDirection) + 1.75);\n            const glm::dvec3 targetWorld = aster.position + aster.orientation * targetPlanet;\n            const glm::dvec3 cameraWorld = aster.position + aster.orientation * cameraPlanet;\n            camera.setViewDirection(\n                targetWorld - cameraWorld,\n                safeNormalize(aster.orientation * spawnDirection));\n        }\n'''
          if init_old in ms:
              ms = ms.replace(init_old, init_new, 1)
          elif 'const glm::dvec3 featureDirection = findPlayableSpawnDirection' not in ms:
              raise SystemExit('camera capture initialization anchor not found')
          m.write_text(ms)
          PY

      - name: Remove stale one-shot workflows and retrigger only final evidence gate
        run: |
          rm -f .github/workflows/materialize-terrain-r4.yml
          rm -f .github/workflows/fix-terrain-r4-walkable-relief.yml
      - name: Verify R4 visual-fix markers
        run: |
          grep -q 'rangeRidgeA' native/src/world/PlanetSurface.cpp
          grep -q 'channelCore' native/src/world/PlanetSurface.cpp
          grep -q 'setViewDirection' native/include/vf/player/PlanetCamera.hpp
          grep -q 'findCaptureVantageDirection' native/src/app/Main.cpp
          grep -q 'sunElevation < 0.42' native/src/app/Main.cpp
      - name: Commit corrected same-version R4
        run: |
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native .github/workflows
          git commit -m 'terrain: sharpen R4 landform silhouettes and daylight evidence'
          git push origin HEAD:feature/terrain-r4-geomorph-bake
