name: R24 Visibility Driven Streaming Foundation

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_visibility_driven_streaming_foundation.py'
      - '.github/workflows/r24-visibility-driven-streaming-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-visibility-streaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 foundation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - name: Materialize persistent visibility-driven terrain
        run: python3 .github/scripts/r24_visibility_driven_streaming_foundation.py

      - name: Validate source architecture contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'PlanetTileCache\* tileCache' native/include/vf/world/PlanetLodMeshBuilder.hpp
          grep -q 'samplePlanetTerrainLod' native/include/vf/world/PlanetSurface.hpp
          grep -q 'sampleLod' native/include/vf/world/PlanetSurfaceAuthority.hpp
          grep -q 'terrainSeedConstants' native/src/world/PlanetSurface.cpp
          grep -q 'tileCache->find' native/src/world/PlanetLodMeshBuilder.cpp
          grep -q 'generatedPatches' native/src/world/PlanetLodMeshBuilder.cpp
          grep -q 'terrainTileCache' native/src/app/Main.cpp
          grep -q 'PlanetTileCache.cpp' native/CMakeLists.txt
          grep -q 'vf_planet_tile_streaming_tests' native/CMakeLists.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-visible-streaming -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-visible-streaming --parallel 2

      - name: Run all native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-visible-streaming --verbose --output-on-failure 2>&1 | tee r24-visible-streaming-ctest.log

      - name: Gate tile reuse physical terrain and runtime stability
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-visible-streaming --verbose --output-on-failure \
            -R 'vf_planet_tile_streaming_tests|vf_planetary_body_system_tests|vf_r24_runtime_stability_tests|vf_r24_hydrologic_canyon_tests|vf_terrain_landform_tests|vf_r24_physical_planet_tests|vf_shader_contract_tests' \
            2>&1 | tee r24-visible-streaming-focused.log
          grep -q 'R24 planet tile streaming tests passed' r24-visible-streaming-focused.log
          grep -q 'vf_planetary_body_system_tests: PASS' r24-visible-streaming-focused.log
          grep -q 'vf_r24_runtime_stability_tests: PASS' r24-visible-streaming-focused.log
          grep -q 'Terrain landform tests passed' r24-visible-streaming-focused.log
          grep -q 'R24 hydrologic canyon tests passed' r24-visible-streaming-focused.log
          grep -q 'All production shader SPIR-V entry-point contracts passed' r24-visible-streaming-focused.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('r24-visible-streaming-focused.log').read_text(encoding='utf-8', errors='replace')
          m=re.search(r'R24 planet tile streaming tests passed.*cold_ms=([0-9.]+).*hot_ms=([0-9.]+).*speedup=([0-9.]+)', text)
          if not m:
              raise SystemExit('missing tile-cache timing telemetry')
          cold,hot,speed=map(float,m.groups())
          print('R24_TILE_CACHE_TIMING', 'cold_ms=',cold,'hot_ms=',hot,'speedup=',speed)
          if speed < 1.67:
              raise SystemExit(f'cache speedup too small: {speed:.3f}x')
          Path('r24-tile-cache-performance.txt').write_text(
              f'cold_ms={cold:.6f}\nhot_ms={hot:.6f}\nspeedup={speed:.6f}\n'
              'policy=visible_tiles_only_plus_persistent_cache\n'
              'lod=screen_space_error_plus_distance_band_limit\n', encoding='utf-8')
          PY

      - name: Verify Vulkan device
        shell: bash
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real Vulkan production scenes
        shell: bash
        run: |
          APP="$(find build/r24-visible-streaming -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-visible-streaming-evidence

      - name: Gate real images and visibility telemetry
        shell: bash
        run: |
          set -euo pipefail
          test -s r24-visible-streaming-evidence/r24-epic-landscape-overview.png
          for f in mountain rift canyon abyss; do
            test -s "r24-visible-streaming-evidence/logs/$f.log"
            grep -q 'R24 PERF terrain_build_ms=' "r24-visible-streaming-evidence/logs/$f.log"
            grep -q 'tile_hits=' "r24-visible-streaming-evidence/logs/$f.log"
            grep -q 'generated_patches=' "r24-visible-streaming-evidence/logs/$f.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          rows=[]
          p=re.compile(r'R24 PERF terrain_build_ms=([0-9.]+).*leaf_patches=([0-9]+).*culled_nodes=([0-9]+).*tile_hits=([0-9]+).*tile_misses=([0-9]+).*generated_patches=([0-9]+)')
          for name in ('mountain','rift','canyon','abyss'):
              text=(Path('r24-visible-streaming-evidence/logs')/f'{name}.log').read_text(encoding='utf-8', errors='replace')
              m=p.search(text)
              if not m:
                  raise SystemExit(f'{name}: missing visibility/cache telemetry')
              build,leaves,culled,hits,misses,generated=m.groups()
              row=(name,float(build),int(leaves),int(culled),int(hits),int(misses),int(generated))
              rows.append(row)
              print('VISIBLE_STREAM_SCENE',row)
              if row[2] > 1100:
                  raise SystemExit(f'{name}: leaf budget exceeded: {row[2]}')
              if row[3] <= 0:
                  raise SystemExit(f'{name}: visibility culling did no work')
              if row[6] != row[2]:
                  raise SystemExit(f'{name}: cold build generated {row[6]} patches for {row[2]} leaves')
          Path('r24-visible-scene-performance.txt').write_text('\n'.join(map(str,rows))+'\n', encoding='utf-8')
          PY

      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-visibility-streaming-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-visible-streaming-evidence ]]; then
            cp -a r24-visible-streaming-evidence/. "$EVIDENCE_DIR/"
          fi
          for f in r24-visible-streaming-ctest.log r24-visible-streaming-focused.log r24-tile-cache-performance.txt r24-visible-scene-performance.txt vulkan-summary.txt; do
            [[ -f "$f" ]] && cp -f "$f" "$EVIDENCE_DIR/" || true
          done
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-visibility-streaming-${{ github.run_id }}
          path: |
            r24-visible-streaming-evidence/**
            r24-visible-streaming-ctest.log
            r24-visible-streaming-focused.log
            r24-tile-cache-performance.txt
            r24-visible-scene-performance.txt
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested visibility-driven streaming foundation
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          if ! git diff --cached --quiet; then
            git commit -m "perf(r24): make planet terrain visibility-driven and persistent"
          fi
          git reset --hard HEAD
          git clean -fd build/r24-visible-streaming || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
