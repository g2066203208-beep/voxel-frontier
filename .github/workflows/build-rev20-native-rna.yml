name: Build REV20 native RNA integration
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/build-rev20-native-rna.yml'
      - 'research/wind-tower/experiments/T048/RNA_NATIVE_ROM_20261124/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/wind-tower/experiments/T048
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Download frozen REV18 source
        uses: actions/download-artifact@v4
        with:
          name: HE_REV18_HOOP_EQ
          run-id: 45347120960
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: parent
      - name: Download frozen REV19 independent ROM
        uses: actions/download-artifact@v4
        with:
          name: rna_port_synthetic_test
          run-id: 45350001907
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rom19
      - name: Generate exact mass realization, flat integration and independent audit
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        shell: bash
        run: |
          set -e
          ROOT=research/wind-tower/experiments/T048/RNA_NATIVE_ROM_20261124
          PARENT=parent/HE_REV18_HOOP_EQ_EQ_LEAN010.inp
          echo "91c4d7499ffc7cdd30144fe39f74da3d7fd4b6ce49bbfd6c716d4f5e0ae0b041  $PARENT" | sha256sum -c
          (cd rom19 && zip -q ../rom19.zip *.npz)
          python "$ROOT/build_native_rna.py" --parent "$PARENT" --rom-zip rom19.zip --out output --band 10
          python "$ROOT/flatten_tower.py" --parent "$PARENT" --out output
          python "$ROOT/package_rev20.py" --parent "$PARENT" --out output
          cp "$ROOT/README.md" output/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: HE_REV20_NATIVE_RNA
          path: output/
          if-no-files-found: error
