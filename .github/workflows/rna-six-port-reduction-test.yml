name: RNA six-port reduction prototype test
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/rna-six-port-reduction-test.yml'
      - 'research/wind-tower/experiments/T048/RNA_PORT_REDUCTION_20261124/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/wind-tower/experiments/T048/RNA_PORT_REDUCTION_20261124
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Verify synthetic benchmark and uniform band certificate
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          mkdir -p output
          python research/wind-tower/experiments/T048/RNA_PORT_REDUCTION_20261124/six_port_reduce.py --demo --out output/rna_demo
      - name: Verify cyclic three-blade reconstruction with actual rigid mass blocks
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python research/wind-tower/experiments/T048/RNA_PORT_REDUCTION_20261124/assemble_one_blade.py --demo --out output/rna_cyclic_demo
      - uses: actions/upload-artifact@v4
        with:
          name: rna_port_synthetic_test
          path: output/
