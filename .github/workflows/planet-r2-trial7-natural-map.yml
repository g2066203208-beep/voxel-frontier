name: Planet R2 Trial 7 Natural Map

on:
  push:
    branches: [feature/planet-scale-r2]
  workflow_dispatch:

jobs:
  audit-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install compiler and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libglm-dev imagemagick
      - name: Apply R2 trial 7
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('native/src/world/PlanetSurface.cpp'); s=p.read_text()
          s=s.replace('constexpr std::size_t kPlateCount = 14U;', 'constexpr std::size_t kPlateCount = 20U;')
          needle='''[[nodiscard]] PlateField samplePlateField(std::uint64_t seed, const glm::dvec3& direction) noexcept {\n    double bestScore = -std::numeric_limits<double>::infinity();'''
          repl='''[[nodiscard]] PlateField samplePlateField(std::uint64_t seed, const glm::dvec3& directionInput) noexcept {\n    const glm::dvec3 direction = safeNormalize(directionInput);\n    const glm::dvec3 rawWarp{\n        fbmSurface(seed ^ 0x6A09E667F3BCC909ULL, direction, 2.4, 4),\n        fbmSurface(seed ^ 0xBB67AE8584CAA73BULL, direction, 2.4, 4),\n        fbmSurface(seed ^ 0x3C6EF372FE94F82BULL, direction, 2.4, 4)};\n    const glm::dvec3 tangentWarp = rawWarp - direction * glm::dot(rawWarp, direction);\n    // Broad angular warp bends nominal Voronoi borders by a few hundred kilometres while keeping\n    // the tectonic province scale continental rather than turning it into local noise.\n    const glm::dvec3 plateDirection = safeNormalize(direction + tangentWarp * 0.055, direction);\n    double bestScore = -std::numeric_limits<double>::infinity();'''
          assert needle in s; s=s.replace(needle,repl)
          s=s.replace('const double score = glm::dot(direction, plate.center);','const double score = glm::dot(plateDirection, plate.center);')
          s=s.replace('const double boundary = 1.0 - smooth01(0.004, 0.060, scoreGap);','const double boundary = 1.0 - smooth01(0.006, 0.040, scoreGap);')
          old='''    const double primaryCrust = plates.primary.continental ? 0.43 : -0.48;\n    const double secondaryCrust = plates.secondary.continental ? 0.43 : -0.48;\n    const double boundaryCrustBlend = plates.boundary * 0.28;\n    const double crustBase = primaryCrust * (1.0 - boundaryCrustBlend)\n        + secondaryCrust * boundaryCrustBlend;\n    const double continentalness = std::clamp(crustBase + macro * 0.30, -1.0, 1.0);\n\n    const double landness = smooth01(-0.02, 0.20, continentalness);'''
          new='''    const double crustMacro = fbmSurface(definition.seed ^ 0x243F6A8885A308D3ULL, w, 3.15, 4);\n    const double crustMeso = fbmSurface(definition.seed ^ 0x13198A2E03707344ULL, w, 7.8, 3);\n    const double crustCoast = fbmSurface(definition.seed ^ 0xA4093822299F31D0ULL, w, 21.0, 2);\n    const double islandArcNoise = fbmSurface(definition.seed ^ 0x082EFA98EC4E6C89ULL, w, 38.0, 3);\n    const double continentalness = std::clamp(\n        crustMacro * 0.78 + crustMeso * 0.27 + crustCoast * 0.09 + macro * 0.14\n            + islandArcNoise * plates.convergence * 0.055 - 0.098, -1.0, 1.0);\n    const double landness = smooth01(-0.010, 0.082, continentalness);'''
          assert old in s; s=s.replace(old,new)
          s=s.replace('elevation -= maxOcean * (0.24 + 0.42 * deepOcean) * oceanness;', 'elevation -= maxOcean * (0.295 + 0.410 * deepOcean) * oceanness;')
          s=s.replace('elevation += maxLand * (0.035 + 0.11 * std::pow(landness, 1.35)) * landness;', 'elevation += maxLand * (0.012 + 0.060 * std::pow(landness, 1.35)) * landness;')
          s=s.replace('elevation += maxOcean * 0.12 * shelfZone * oceanness;', 'elevation += maxOcean * 0.110 * shelfZone * oceanness;')
          s=s.replace('elevation += maxOcean * 0.38 * oceanRidge;', 'elevation += maxOcean * 0.320 * oceanRidge;')
          old='''    const double collisionWeight = plates.primary.continental && plates.secondary.continental\n        ? 1.0\n        : (plates.primary.continental || plates.secondary.continental ? 0.82 : 0.45);\n    const double mountain = std::pow(\n        std::clamp(plates.convergence * landness * collisionWeight, 0.0, 1.0),\n        1.15);\n    elevation += maxLand * 0.72 * mountain;'''
          new='''    const double collisionWeight = 0.58 + 0.42 * landness;\n    const double orogenDrive = std::clamp(plates.convergence * landness * collisionWeight, 0.0, 1.0);\n    const double mountain = std::pow(orogenDrive, 1.60);\n    const double peakField = 0.5 + 0.5 * fbmSurface(\n        definition.seed ^ 0x452821E638D01377ULL, w, 135.0, 3);\n    // Broad ranges top out at a few kilometres; independent along-range peak clusters provide a\n    // tiny exceptional population of Himalayan-scale summits without lifting the whole belt.\n    const double summitGate = smooth01(0.68, 0.89, peakField) * smooth01(0.935, 0.992, orogenDrive);\n    elevation += maxLand * (0.245 * mountain + 0.56 * std::pow(summitGate, 4.5));'''
          assert old in s; s=s.replace(old,new)
          s=s.replace('elevation -= maxOcean * 0.42 * trench;', 'elevation -= maxOcean * 0.460 * trench;')
          s=s.replace('elevation += maxLand * 0.27 * plateau;', 'elevation += maxLand * 0.095 * plateau;')
          s=s.replace('elevation += maxLand * 0.36 * volcano;', 'elevation += maxLand * (0.12 * volcano + 0.30 * std::pow(smooth01(0.955, 0.999, volcano), 6.0));')
          s=s.replace('elevation -= maxLand * 0.035 * river;', 'elevation -= maxLand * 0.020 * river;')
          s=s.replace('w, 720.0, 3)', 'w, 95.0, 4)').replace('w, 1350.0, 3)', 'w, 520.0, 3)').replace('w, 3200.0, 3)', 'w, 2100.0, 3)').replace('w, 8200.0, 3)', 'w, 6100.0, 3)')
          s=s.replace('regional * (0.0085 + 0.0090 * mountain + 0.0048 * plateau)', 'regional * (0.0100 + 0.0120 * mountain + 0.0040 * plateau)').replace('hillNoise * (0.0042 * hills)', 'hillNoise * (0.0115 * hills)').replace('local * (0.0031 + 0.0050 * mountain + 0.0014 * coastalCliff)', 'local * (0.0024 + 0.0100 * mountain + 0.0020 * coastalCliff)').replace('(ridged - 0.5) * 0.0024 * mountain', '(ridged - 0.5) * 0.0060 * mountain')
          s=s.replace('elevation += maxLand * 0.012 * coastalCliff', 'elevation += maxLand * 0.015 * coastalCliff').replace('elevation -= maxLand * 0.020 * canyon', 'elevation -= maxLand * 0.030 * canyon').replace('elevation += maxLand * 0.0016 * dunes * duneNoise;', 'elevation += maxLand * 0.0024 * dunes * duneNoise;').replace('elevation += maxLand * 0.0035 * glacier', 'elevation += maxLand * 0.0040 * glacier')
          p.write_text(s)
          PY
      - name: Compile natural whole-planet audit
        shell: bash
        run: |
          sed -n '/cat >\/tmp\/map.cpp/,/CPP/p' .github/workflows/planet-r2-trial5-map.yml | sed '1d;$d' > /tmp/map.cpp
          # Remove debug plate tint and hard glacier debug threshold from the map source; statistics\n          # and terrain samples stay unchanged. This image is strictly a natural hypsometric audit.\n          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/map.cpp');s=p.read_text()
          s=s.replace(' if(s.glacier>.35){double t=std::clamp(s.glacier,0.0,1.0);R=R*(1-t)+230*t;G=G*(1-t)+242*t;B=B*(1-t)+246*t;}','')
          s=s.replace('              if(s.plateBoundary>.72){R=std::min(255.0,R+22*s.plateBoundary);G*=0.94;}\n','')
          p.write_text(s)
          PY
          g++ -std=c++23 -O2 -I native/include /tmp/map.cpp native/src/world/PlanetSurface.cpp -o /tmp/map
      - name: Run audit and render natural map
        run: |
          /tmp/map | tee trial7-report.txt
          mv planet-r2-hypsometric.ppm planet-r2-trial7.ppm
          convert planet-r2-trial7.ppm planet-r2-trial7.png
          identify planet-r2-trial7.png
      - name: Upload trial evidence
        uses: actions/upload-artifact@v5
        with:
          name: planet-r2-trial7-natural-${{ github.sha }}
          path: |
            trial7-report.txt
            planet-r2-trial7.png
            native/src/world/PlanetSurface.cpp
          retention-days: 30
