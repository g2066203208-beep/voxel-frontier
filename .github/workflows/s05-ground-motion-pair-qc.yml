              print('S08_REAL_ESM_AMPLITUDE_SHA_PASS',a['axis'],a['bytes'],actual)
          print('S08_REAL_SOURCE_3COMP_AMPLITUDE_NUMERIC_QC_PASS_NOT_DESIGN_OR_NATIVE')
