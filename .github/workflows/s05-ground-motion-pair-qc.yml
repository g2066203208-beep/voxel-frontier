          for x,y in zip(old,new):
              assert x['status']==y['status']=='PROCESSED_RECORD_ORIENTATION_NUMERICAL_QC_NOT_DESIGN_WAVE'
              for key in x:
                  if key=='status': continue
                  assert math.isclose(float(x[key]),float(y[key]),rel_tol=2e-7,abs_tol=1e-10),(key,x[key],y[key])
                  numeric+=1
          j=json.load(open(root+'recomputed_rotd_receipt.json'))
          k=json.load(open(root+'committed_rotd_receipt.json'))
          for key in k:
              if key!='numpy_version': assert j[key]==k[key],(key,j[key],k[key])
