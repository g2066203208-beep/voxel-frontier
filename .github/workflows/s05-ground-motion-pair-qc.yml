      - name: Real ESM processed low-frequency numerical triage (NOT SNR/design PASS)
        if: success()
        shell: bash
        run: |
          curl -fLsS --retry 3 -o esm-public-processed/committed_lowfreq_qc.csv "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_LOW_FREQUENCY_NUMERICAL_QC_20261029.csv"
          python3 - <<'PY'
          import csv,json,math
          p='esm-public-processed/ESM_IT-2012-0008_NVL_MP_ACC_receipt.json'
          j=json.load(open(p,encoding='utf-8'))
          q=j['processed_pair_low_frequency_diagnostic']
          with open('esm-public-processed/committed_lowfreq_qc.csv',newline='') as f:
              committed={(r['component'],float(r['period_s'])):r for r in csv.DictReader(f)}
          assert len(committed)==8
          assert not q['S05_PASS'] and not q['instrument_SNR_verified']
          assert set(q['components'])=={'HNE','HNN'}
          for name,c in sorted(q['components'].items()):
              assert c['npts']==32040 and abs(c['dt_s']-.005)<1e-12
              assert abs(c['fc_Hz']-.04)<1e-12
              print('REAL_ESM_COMPONENT',name,c['source_numeric_sha256'],
                    'first10_RMS_NOT_SNR',c['first10s_rms_m_s2_NOT_SNR'],
                    'v_end_DIAGNOSTIC',c['final_velocity_m_s_DIAGNOSTIC'],
                    'd_end_DIAGNOSTIC',c['final_displacement_m_DIAGNOSTIC'])
              for row in c['periods']:
                  assert all(math.isfinite(v) for k,v in row.items() if isinstance(v,float))
                  print('REAL_ESM_LONG_PERIOD_NUMERICAL_QC',name,row)
                  old=committed[(name,row['T_s'])]
                  assert old['numeric_source_SHA256']==c['source_numeric_sha256']
                  assert math.isclose(float(old['pseudoSa_dt_m_s2']),row['Sa_dt_m_s2'],rel_tol=1e-9)
                  assert old['original_ESM_filter_pass_count_verified']=='False'
                  g=float(old['ideal_single_pass_gain_CONDITIONAL'])
                  assert math.isclose(float(old['ideal_two_pass_gain_CONDITIONAL']),g*g,rel_tol=1e-12)
                  assert math.isclose(float(old['ideal_two_pass_attenuation_pct_CONDITIONAL']),100*(1-g*g),rel_tol=1e-12)
              extra=c['extra_highpass_sensitivity_NOT_ORIGINAL_ESM_FILTER']
              assert len(extra)==8
              for item in extra:
                  assert item['extra_highpass_passes']==2
                  assert item['extra_highpass_fc_Hz'] in (.04,.08)
                  assert item['T_s'] in (4.,6.,8.,10.)
                  assert all(math.isfinite(v) for v in item.values() if isinstance(v,float))
                  old=committed[(name,item['T_s'])]
                  prefix='extra_HP2_fc004' if item['extra_highpass_fc_Hz']==.04 else 'extra_HP2_fc008'
                  assert math.isclose(float(old[prefix+'_psa_m_s2']),item['extra_highpass_psa_m_s2_DIAGNOSTIC'],rel_tol=1e-9)
                  assert math.isclose(float(old[prefix+'_relative_change']),item['relative_change_from_existing_processed'],rel_tol=1e-9,abs_tol=1e-12)
                  assert old['extra_filter_script_SHA256']=='8996859a27cbb362588d5e12a47f958fd89a88395a6234f216c5ffed0c5bfa41'
                  print('REAL_ESM_EXTRA_HP2_SENSITIVITY_NOT_FILTER_RECOVERY',name,item)
          print('S05_QC_NOT_DESIGN_PASS')
          PY
      - name: REAL ESM 16-period horizontal RotD00/50/100 and vertical PSA regression (NOT design wave)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy==2.3.5'
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079"
