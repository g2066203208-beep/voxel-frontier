          echo "d315ea8a9501bdf5c7542c0b454809ef5b9db7f18e69515cb1ba6e946fd98571  s05_esm_rotd_real.py" | sha256sum -c -
          echo "6f03869384193a4e00b27a11af6470ff3d11fcb73ebb08f0f19332b4edbe0205  esm-public-processed/committed_rotd.csv" | sha256sum -c -
          echo "abd7554a07f8be499469443d9199de19b135f9c3703a06ea3ea833747ed9d63f  esm-public-processed/committed_rotd_receipt.json" | sha256sum -c -
          python3 -m py_compile s05_esm_rotd_real.py
          python3 s05_esm_rotd_real.py --self-test --source-csv esm-public-processed/S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv --reference-csv esm-public-processed/committed_dense.csv --output-csv esm-public-processed/recomputed_rotd.csv --output-receipt esm-public-processed/recomputed_rotd_receipt.json
          python3 - <<'PY'
          import csv, json, math, hashlib
          root='esm-public-processed/'
          def digest(name):
              return hashlib.sha256(open(root+name,'rb').read()).hexdigest()
          assert digest('S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv')=='a353c1216b80cf2739b9cedfbd09b68bab3d3ffe49f1d6f3b537366c3559db34'
          assert digest('committed_dense.csv')=='a2e2ea94d81ef1cfff63863148518cf2159bb821161577a67b5c4b7705143bc6'
          with open(root+'committed_rotd.csv',newline='') as f: old=list(csv.DictReader(f))
          with open(root+'recomputed_rotd.csv',newline='') as f: new=list(csv.DictReader(f))
          assert len(old)==len(new)==16
