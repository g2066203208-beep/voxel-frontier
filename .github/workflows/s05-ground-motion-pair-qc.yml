  event-balanced-source-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch exact PR source and existing real 20-row tables
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079"
          curl -fLsS --retry 3 -o s05_event_balanced_spectrum_gate.py "$base/s05_event_balanced_spectrum_gate.py"
          curl -fLsS --retry 3 -o us.csv "$base/real-records/S05_TWO_EVENT_FOUR_PAIR_LONG_PERIOD_GATE_20261029.csv"
          curl -fLsS --retry 3 -o esm.csv "$base/real-records/S05_ESM_IT2012_NVL_PROCESSED_PAIR_4_10S_20261029.csv"
          curl -fLsS --retry 3 -o expected.csv "$base/real-records/S05_THREE_EVENT_FIVE_PAIR_EVENT_BALANCE_20261029.csv"
          curl -fLsS --retry 3 -o s09_ishihara2024_equation_oracle.py "$base/s09_ishihara2024_equation_oracle.py"
          curl -fLsS --retry 3 -o reference_expected.csv "$base/real-records/S05_ISHIHARA_REFERENCE_PAPER_FOUR_PERIOD_DIAGNOSTIC_20261029.csv"
          sha256sum s05_event_balanced_spectrum_gate.py s09_ishihara2024_equation_oracle.py us.csv esm.csv reference_expected.csv
      - name: Run analytic and negative tests, then actual source-table event balance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile s05_event_balanced_spectrum_gate.py
          python3 s05_event_balanced_spectrum_gate.py --self-test
          python3 s05_event_balanced_spectrum_gate.py --us-csv us.csv --esm-csv esm.csv --output s05-event-balance.json
          python3 - <<'PY'
          import json, math
          d=json.load(open("s05-event-balance.json"))
          assert d["status"]=="INPUT_DIAGNOSTIC_ONLY_HOLD"
          assert len(d["independent_event_ids"])==3 and d["pair_count"]==5
          assert len(d["rows"])==4 and d["S05_PASS"] is False
          assert d["Abaqus_E_WE_RUN"]==0 and d["target_spectrum"]=="MISSING_NO_MATCH_METRIC"
          assert all(math.isfinite(x["event_over_pair_ratio"]) for x in d["rows"])
          import csv
          with open("expected.csv", newline="") as f: expected=list(csv.DictReader(f))
          assert len(expected)==len(d["rows"])
          for a,b in zip(expected,d["rows"]):
              assert float(a["period_s"])==b["period_s"]
              assert int(a["independent_events"])==3 and int(a["horizontal_pairs"])==5
              assert a["status"]=="HETEROGENEOUS_PROCESSING_DIAGNOSTIC_NOT_DESIGN_PASS"
              for key in ("pair_weighted_gm_m_s2","event_weighted_gm_m_s2","event_over_pair_ratio","ridgecrest_station_max_over_min"):
                  assert math.isclose(float(a[key]),b[key],rel_tol=1e-10,abs_tol=1e-12),(key,a[key],b[key])
          print("REAL_3_EVENT_5_PAIR_4_PERIOD_COMMITTED_CSV_CROSSCHECK_PASS")
          PY
      - name: Reference-paper Eq1 and real 20-row PSA mismatch oracle (NOT Jiayu target)
        shell: bash
        run: |
          set -euo pipefail
          python3 s09_ishihara2024_equation_oracle.py --self-test
          python3 s05_event_balanced_spectrum_gate.py --reference-paper-benchmark --us-csv us.csv --esm-csv esm.csv --output reference-paper-diagnostic.json
          python3 - <<'PY'
          import csv,json,math
          x=json.load(open("reference-paper-diagnostic.json"))
          with open("reference_expected.csv",newline="") as f: rows=list(csv.DictReader(f))
          assert x["status"]=="REFERENCE_PAPER_ALGEBRA_ONLY_NOT_DESIGN_SPECTRUM"
          assert not x["design_site_spectrum_PASS"] and not x["record_low_frequency_PASS"]
          assert x["Abaqus_E_WE_RUN"]==0 and x["actual_scaled_waveforms"]==0
          assert len(rows)==len(x["rows"])==5
          for a,b in zip(rows,x["rows"]):
              assert (a["event_id"],a["station"])==(b["event_id"],b["station"])
              assert a["source_HNE_sha256"]==b["source_HNE_sha256"]
              assert a["source_HNN_sha256"]==b["source_HNN_sha256"]
              assert a["decision"]==b["decision"]=="REJECT_DESIGN_USE_REFERENCE_PAPER_ONLY"
              for k in ("pre_scale_log_rmse","least_squares_amplitude_scale_DIAGNOSTIC",
                        "post_scale_log_rmse","max_abs_post_log_residual"):
                  assert math.isclose(float(a[k]),b[k],rel_tol=1e-10,abs_tol=1e-12),(k,a[k],b[k])
          print("REAL_FIVE_PAIRS_REFERENCE_PAPER_EQ1_CROSSCHECK_PASS_NO_DESIGN_WAVES")
          PY
      - name: REAL 3-event 5-pair 20-row source/processing screening (NOT design input)
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079"
          curl -fLsS --retry 3 -o committed_screen.csv "$base/real-records/S05_THREE_EVENT_FIVE_PAIR_20ROW_SOURCE_SCREEN_20261030.csv"
          python3 s05_event_balanced_spectrum_gate.py --us-csv us.csv --esm-csv esm.csv --output real-screen.json --screen-csv real-screen.csv
          python3 - <<'PY'
          import csv,math,json,hashlib
          with open('committed_screen.csv',newline='') as f: expected=list(csv.DictReader(f))
          with open('real-screen.csv',newline='') as f: actual=list(csv.DictReader(f))
          assert len(expected)==len(actual)==20
          expected.sort(key=lambda x:(x['event_id'],x['station'],float(x['period_s'])))
          actual.sort(key=lambda x:(x['event_id'],x['station'],float(x['period_s'])))
          assert {x['event_id'] for x in actual}=={'ci38457511','ci39493944','IT-2012-0008'}
          assert len({(x['event_id'],x['station']) for x in actual})==5
          numeric=('period_s','event_pair_count','gm_psa_m_s2','raw_vs_pre20_rel',
              'pre20_vs_linear_rel','pre20_end_displacement_m',
              'reported_highpass_Hz','f_over_fc')
          count=0
          for a,b in zip(actual,expected):
              assert set(a)==set(b)
              for k in a:
                  if k in numeric and a[k]!='NA':
                      assert b[k]!='NA' and math.isclose(float(a[k]),float(b[k]),rel_tol=1e-9,abs_tol=1e-11),(k,a[k],b[k])
                      count+=1
                  else: assert a[k]==b[k],(k,a[k],b[k])
              assert a['design_wave']=='false' and a['site_target_verified']=='false'
              assert a['low_frequency_verified']=='false' and a['decision'].startswith('HOLD_')
          d=json.load(open('real-screen.json'))
          assert d['S05_PASS'] is False and d['Abaqus_E_WE_RUN']==0
          assert d['US_SHA256']=='45c71c29677dd0918e68c281e6552cedf6d1370a13f6abbf319349cdc1f5fc80'
          assert d['ESM_SHA256']=='4fd1ecf5f3010524e2c5c54dae4072e1187718344f3a64bec46490e9ec617def'
          print('REAL_S05_3EVENT_5PAIR_20ROW_SOURCE_SCREEN_PASS',count,'numeric cells')
          for name in ('committed_screen.csv','real-screen.csv'):
              print(name,hashlib.sha256(open(name,'rb').read()).hexdigest())
          print('NO_SITE_TARGET_OR_INSTRUMENT_LOW_FREQUENCY_PASS; E_WE_RUN=0')
          PY

      - name: Preserve source-hashed diagnostic JSON, never label design PASS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-three-event-event-balanced-source-diagnostic-not-design-pass
          path: |
            s05-event-balance.json
            reference-paper-diagnostic.json
          if-no-files-found: warn
          retention-days: 90
