          expected={'X':'6a5af28067f7dcb3b552439f2d0e4af2ef3fe0db8cb4fba7758dc09f8c674fac','Y':'47d6910ff6201e4756acafab114748272d394f668d78121289667d81977285b6','Z':'2ae9b307315343a17cb60172052f2aa24dd8f0d3762c67e27f6b75344f3d36a0'}
          for a in receipt['artifacts']:
              path=root/a['file'];actual=hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual==a['sha256']==expected[a['axis']],(a['axis'],actual)
