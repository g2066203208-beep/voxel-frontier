name: S05 original-record pair QC self-test (NO real PEER or physics PASS)
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/s05-ground-motion-pair-qc.yml'
      - 'research/wind-tower/experiments/T079/s05_esm_public_processed_pair.py'
      - 'research/wind-tower/experiments/T079/s05_ground_motion_pair_qc.py'
      - 'research/wind-tower/experiments/T079/s05_event_balanced_spectrum_gate.py'
      - 'research/wind-tower/experiments/T079/real-records/S05_THREE_EVENT_FIVE_PAIR_20ROW_SOURCE_SCREEN_20261030.csv'
      - 'research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_MP_PASSBAND_16PERIOD_QC_20261030.csv'
      - 'research/wind-tower/experiments/T079/s08_base_motion_amplitude_gate.py'
      - 'research/wind-tower/experiments/T079/s08_si_motion_diagnostics.py'
      - 'research/wind-tower/experiments/T079/s08_horizontal_orientation_energy_gate.py'
      - 'research/wind-tower/experiments/T079/real-records/S08_ESM_IT2012_NVL_HORIZONTAL_ORIENTATION_20261029.csv'
  pull_request:
    paths:
      - 'research/wind-tower/experiments/T079/s05_ground_motion_pair_qc.py'
      - 'research/wind-tower/experiments/T079/s05_event_balanced_spectrum_gate.py'
      - 'research/wind-tower/experiments/T079/real-records/S05_ISHIHARA_REFERENCE_PAPER_FOUR_PERIOD_DIAGNOSTIC_20261029.csv'
      - 'research/wind-tower/experiments/T079/real-records/S05_THREE_EVENT_FIVE_PAIR_EVENT_BALANCE_20261029.csv'
      - 'research/wind-tower/experiments/T079/s05_cesmd_processed_metadata.py'
      - 'research/wind-tower/experiments/T079/s05_esm_public_processed_pair.py'
      - 'research/wind-tower/experiments/T079/s08_si_motion_diagnostics.py'
      - 'research/wind-tower/experiments/T079/s08_horizontal_orientation_energy_gate.py'
      - 'research/wind-tower/experiments/T079/real-records/S08_ESM_IT2012_NVL_HORIZONTAL_ORIENTATION_20261029.csv'
      - 'research/wind-tower/experiments/T079/real-records/S08_ESM_IT2012_NVL_ARIAS_HUSID_3COMP_20261029.csv'
      - 'research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_LOW_FREQUENCY_NUMERICAL_QC_20261029.csv'
      - 'research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv'
      - 'research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_MP_PASSBAND_16PERIOD_QC_20261030.csv'
      - '.github/workflows/s05-ground-motion-pair-qc.yml'
      - 'research/wind-tower/experiments/T079/real-records/USGS_ci38457511/CI_RVR_manifest.json'
      - 'research/wind-tower/experiments/T079/real-records/USGS_ci38457511/station_pair_baseline_triage_20261028.json'
      - 'research/wind-tower/experiments/T079/real-records/S05_TWO_EVENT_FOUR_PAIR_LONG_PERIOD_GATE_20261029.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seismic-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact PR script without large checkout
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --output s05_ground_motion_pair_qc.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/s05_ground_motion_pair_qc.py"
          sha256sum s05_ground_motion_pair_qc.py
      - name: Python source QC and independent analytic SDOF convergence
        run: |
          python3 -m py_compile s05_ground_motion_pair_qc.py
          python3 s05_ground_motion_pair_qc.py --self-test
          echo 'Synthetic unit tests ONLY; 0 real PEER records, 0 Abaqus RUN, 0 S05 physics PASS.'
      - name: REAL ESM 16-period source-locked highpass-distance and dt-grid QC (not design PASS)
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/real-records"
          curl -fLsS --retry 3 -o esm_dense.csv "$base/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv"
          curl -fLsS --retry 3 -o esm_committed_band.csv "$base/S05_ESM_IT2012_NVL_MP_PASSBAND_16PERIOD_QC_20261030.csv"
          echo "a2e2ea94d81ef1cfff63863148518cf2159bb821161577a67b5c4b7705143bc6  esm_dense.csv" | sha256sum -c -
          python3 s05_ground_motion_pair_qc.py --esm-band-csv esm_dense.csv --expected-source-sha256 a2e2ea94d81ef1cfff63863148518cf2159bb821161577a67b5c4b7705143bc6 --output esm_recomputed_band.csv
          python3 - <<'PY'
          import csv,math
          with open('esm_recomputed_band.csv',newline='') as f: a=list(csv.DictReader(f))
          with open('esm_committed_band.csv',newline='') as f: b=list(csv.DictReader(f))
          assert len(a)==len(b)==16 and list(a[0])==list(b[0])
          for x,y in zip(a,b):
              for k in x:
                  if k=='decision': assert x[k]==y[k] and x[k].startswith('HOLD_')
                  else: assert math.isclose(float(x[k]),float(y[k]),rel_tol=5e-10,abs_tol=1e-12),(k,x[k],y[k])
          assert float(a[-1]['frequency_over_reported_0p040hz_corner'])==2.5
          print('REAL_ESM_16_PERIOD_PASSBAND_AND_DT2_QC_PASS_NOT_INSTRUMENT_OR_DESIGN_PASS')
          PY
          sha256sum esm_dense.csv esm_committed_band.csv esm_recomputed_band.csv
      - name: REAL CI.CLC baseline spectral sensitivity on immutable source and pre20 pairs (not a design wave)
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/real-records/USGS_ci38457511/CI_CLC"
          mkdir -p real-ci-clc/raw real-ci-clc/pre20
          for file in manifest.json CI_CLC_HNE_accel_mps2.csv CI_CLC_HNN_accel_mps2.csv; do
            curl -fLsS --retry 3 --output "real-ci-clc/raw/$file" "$base/$file"
          done
          for file in manifest.json CI_CLC_HNE_preevent20_mps2.csv CI_CLC_HNN_preevent20_mps2.csv; do
            curl -fLsS --retry 3 --output "real-ci-clc/pre20/$file" "$base/processed/$file"
          done
          python3 s05_ground_motion_pair_qc.py --spectral-stability \
            --manifest real-ci-clc/raw/manifest.json \
            --processed-manifest real-ci-clc/pre20/manifest.json \
            --output real-ci-clc/long_period_spectral_sensitivity.json
          python3 - <<'PY'
          import json
          j=json.load(open('real-ci-clc/long_period_spectral_sensitivity.json'))
          for c in j['components']:
              print('REAL_CI_CLC',c['component'],'T_ge_4s_max_relative_change',
                    c['max_raw_vs_pre20_relative_change_T_ge_4s'])
              for row in c['spectrum']:
                  if row['period_s'] in (1.0,6.0,10.0):
                      print('SPECTRUM',c['component'],row)
          assert j['S05_PASS'] is False and j['Abaqus_RUN'] is False
          PY
      - name: REAL 3-station / 6-horizontal-trace baseline and long-period QC (single event; no site PASS)
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/real-records/USGS_ci38457511"
          mkdir -p triage/clc triage/root
          for file in manifest.json CI_CLC_HNE_accel_mps2.csv CI_CLC_HNN_accel_mps2.csv; do
            curl -fLsS --retry 3 --output "triage/clc/$file" "$base/CI_CLC/$file"
          done
          for file in manifest.json CI_RVR_manifest.json CI_PASC_HNE_accel_mps2.csv CI_PASC_HNN_accel_mps2.csv CI_RVR_HNE_accel_mps2.csv CI_RVR_HNN_accel_mps2.csv; do
            curl -fLsS --retry 3 --output "triage/root/$file" "$base/$file"
          done
          curl -fLsS --retry 3 --output triage/triage_v8.json "$base/station_pair_baseline_triage_20261028.json"
          python3 s05_ground_motion_pair_qc.py --station-triage --triage-manifests \
            triage/clc/manifest.json triage/root/manifest.json triage/root/CI_RVR_manifest.json \
            --output triage/triage_python.json
          python3 - <<'PY'
          import json,math
          v=json.load(open('triage/triage_v8.json'))
          p=json.load(open('triage/triage_python.json'))
          assert not p['S05_PASS'] and not p['Abaqus_RUN']
          assert p['independent_event_count']==1 and len(p['stations'])==3
          assert {s['station'] for s in p['stations']}=={'CI.CLC','CI.PASC','CI.RVR'}
          n=0
          for a,b in zip(v['stations'],p['stations']):
              assert a['station']==b['station']
              for ca,cb in zip(a['components'],b['components']):
                  assert ca['component']==cb['component'] and ca['source_sha256']==cb['source_sha256']
                  for key in ('pre20_offset_m_s2','raw_pga_g','pre20_pga_g','pre20_noise_rms_m_s2','post35to120_signal_rms_m_s2','signal_to_noise_rms_ratio','long_period_max_raw_vs_pre20_rel','long_period_max_linear_vs_pre20_rel'):
                      assert math.isclose(ca[key],cb[key],rel_tol=1e-6,abs_tol=1e-8),(a['station'],key,ca[key],cb[key])
                      n+=1
                  for xa,xb in zip(ca['spectrum'],cb['spectrum']):
                      assert xa['period_s']==xb['period_s']
                      for key in ('raw_psa_m_s2','pre20_psa_m_s2','linear_psa_m_s2'):
                          assert math.isclose(xa[key],xb[key],rel_tol=1e-6,abs_tol=1e-8),(a['station'],ca['component'],key,xa[key],xb[key])
                          n+=1
          print('REAL_S05_CROSS_LANGUAGE_V8_PYTHON_SIX_TRACE_COMPARISON_PASS',n,'numeric checks')
          print('NOT_DESIGN_PASS same earthquake, unknown long-period instrument reliability, no target spectrum')
          PY
      - name: REAL two-event four-horizontal-pair long-period gate (16 rows; reject design use)
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079"
          curl -fLsS --retry 3 -o triage/ridge.json "$base/real-records/USGS_ci38457511/station_pair_baseline_triage_20261028.json"
          curl -fLsS --retry 3 -o triage/lone.json "$base/real-records/USGS_ci39493944/CI_CLC/processed/baseline_sensitivity_report.json"
          curl -fLsS --retry 3 -o triage/committed_long_period.csv "$base/real-records/S05_TWO_EVENT_FOUR_PAIR_LONG_PERIOD_GATE_20261029.csv"
          python3 s05_ground_motion_pair_qc.py --long-period-gate --triage-json triage/ridge.json --second-event-json triage/lone.json --output triage/recomputed_long_period.csv
          python3 - <<'PY'
          import csv,math
          with open('triage/recomputed_long_period.csv') as f:a=list(csv.DictReader(f))
          with open('triage/committed_long_period.csv') as f:b=list(csv.DictReader(f))
          assert len(a)==len(b)==16
          assert len({x['event_id'] for x in a})==2
          keys=['raw_pair_gm_psa_m_s2','pre20_pair_gm_psa_m_s2','linear_pair_gm_psa_m_s2','raw_vs_pre20_pair_relative_change','max_abs_pre20_end_displacement_m']
          for x,y in zip(a,b):
              assert (x['event_id'],x['station'],x['period_s'])==(y['event_id'],y['station'],y['period_s'])
              assert x['decision']==y['decision']=='REJECT_RAW__HOLD_PRE20_NO_LOWFREQ_TARGET'
              assert x['source_HNE_sha256']==y['source_HNE_sha256'] and x['source_HNN_sha256']==y['source_HNN_sha256']
              for k in keys:assert math.isclose(float(x[k]),float(y[k]),rel_tol=1e-10,abs_tol=1e-12),(k,x[k],y[k])
          print('REAL_TWO_EVENT_FOUR_PAIR_LONG_PERIOD_16_ROWS_VERIFIED_NOT_DESIGN_PASS')
          PY
      - name: Preserve REAL S05 diagnostic report as CI artifact (not S05 PASS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-ci-clc-long-period-diagnostic-not-design-pass
          path: |
            real-ci-clc/long_period_spectral_sensitivity.json
            triage/triage_python.json
            triage/triage_v8.json
          if-no-files-found: warn
          retention-days: 90

  cesmd-processed-metadata-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch SHA-pinned CESMD metadata preflight source
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --output s05_cesmd_processed_metadata.py \
            "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/s05_cesmd_processed_metadata.py"
          sha256sum s05_cesmd_processed_metadata.py
      - name: Test metadata schema and adversarial inputs (synthetic only)
        run: |
          python3 -m py_compile s05_cesmd_processed_metadata.py
          python3 s05_cesmd_processed_metadata.py --self-test
      - name: Query official CESMD metadata for TWO existing independent events
        shell: bash
        run: |
          set -euo pipefail
          python3 s05_cesmd_processed_metadata.py \
            --event-id CI38457511 --event-id CI39493944 --output-dir cesmd-official-metadata
          echo 'CESMD metadata only; processed waveform download requires registered email; 0 accepted design waves.'
      - name: Preserve exact official response bytes and SHA256 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-cesmd-processed-availability-metadata-not-design-wave
          path: cesmd-official-metadata/
          if-no-files-found: warn
          retention-days: 90

  esm-public-processed-accelerogram-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact PR-head ESM source-receipt program
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o s05_esm_public_processed_pair.py "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/s05_esm_public_processed_pair.py"
          sha256sum s05_esm_public_processed_pair.py
          curl -fLsS --retry 3 -o s05_ground_motion_pair_qc.py "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/s05_ground_motion_pair_qc.py"
          sha256sum s05_ground_motion_pair_qc.py
      - name: Synthetic ZIP security and source-identity tests
        run: |
          python3 -m py_compile s05_esm_public_processed_pair.py
          python3 s05_esm_public_processed_pair.py --self-test
      - name: Fetch one PUBLIC official ESM manually processed acceleration ZIP (not a design wave)
        run: |
          python3 s05_esm_public_processed_pair.py --fetch --timeout 90 --output-dir esm-public-processed
      - name: Diagnostic original DYNA lines 33-70 even when parser rejects source
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob,zipfile
          files=glob.glob('esm-public-processed/*original.zip')
          if files:
              with zipfile.ZipFile(files[0]) as z:
                  name=next(n for n in z.namelist() if '.HNE.' in n)
                  lines=z.read(name).decode('utf-8',errors='replace').splitlines()
                  print('REAL_DYNA_HNE_HEADER_COUNT_DIAGNOSTIC',len(lines))
                  for i in range(32,min(72,len(lines))):
                      print('REAL_DYNA_LINE',i+1,repr(lines[i][:180]))
          PY
      - name: Display immutable official DYNA source headers for scientific triage
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          p='esm-public-processed/ESM_IT-2012-0008_NVL_MP_ACC_receipt.json'
          x=json.load(open(p,encoding='utf-8'))
          print('ESM_REAL_SOURCE',x['event_id'],x['station_requested'],x['zip_sha256'],x['zip_bytes'])
          for row in x['processed_pair_spectrum']['spectrum']:
              print('ESM_REAL_PSA_5PCT',row)
          for f in x['unpacked_files']:
              print('ESM_MEMBER',f['filename'],f['bytes'],f['sha256'],f['dyna_selected_header_fields'])
              for i,line in enumerate(f['dyna_header_lines_SOURCE_TEXT'],1):
                  print('ESM_HEADER',f['filename'],i,repr(line))
          assert x['S05_PASS'] is False and x['actual_processing_filter_corner_confirmed'] is False
          PY
      - name: REAL 16-period ESM processed pair dense PSA and four-period regression (not design PASS)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o esm-public-processed/committed_four_period.csv "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_PROCESSED_PAIR_4_10S_20261029.csv"
          python3 - <<'PY'
          import csv,hashlib,json,math,pathlib
          folder=pathlib.Path('esm-public-processed')
          x=json.loads((folder/'ESM_IT-2012-0008_NVL_MP_ACC_receipt.json').read_text())
          p=x['processed_pair_spectrum']
          assert p['status']=='REAL_ESM_MP_PAIR_DENSE_SPECTRUM_NUMERICAL_DIAGNOSTIC_ONLY'
          assert p['period_count']==16 and len(p['spectrum'])==16
          assert p['period_range_s']==[0.5,10.0] and p['damping_ratio']==.05
          assert p['npts']==32040 and math.isclose(p['dt_s'],.005)
          assert p['Abaqus_E_WE_RUN']==0 and p['S05_PASS'] is False
          assert p['low_frequency_usable_band_verified'] is False
          assert p['site_design_target_spectrum_verified'] is False
          assert p['decimation_antialias_filter_applied'] is False
          assert p['source_numeric_sha256_by_stream']['HNE']=='f1c06ee4b201276657c3da627b24121e2b05377936ecc3adc11d78f7f3d3242a'
          assert p['source_numeric_sha256_by_stream']['HNN']=='bfef0cf1623fbbd8c15f95ec49bb7a714d300fb98fea11d03b159a4e77ede275'
          with (folder/'committed_four_period.csv').open(newline='') as f:
              old={float(row['period_s']):row for row in csv.DictReader(f)}
          assert set(old)=={4.,6.,8.,10.}
          for row in p['spectrum']:
              if row['period_s'] not in old: continue
              previous=old[row['period_s']]
              for new_key,old_key in [('HNE_pseudoSa_m_s2','HNE_pseudoSa_m_s2'),
                                      ('HNN_pseudoSa_m_s2','HNN_pseudoSa_m_s2'),
                                      ('horizontal_gm_pseudoSa_m_s2','pair_gm_pseudoSa_m_s2')]:
                  assert math.isclose(row[new_key],float(previous[old_key]),rel_tol=2e-9,abs_tol=1e-12),(row['period_s'],new_key,row[new_key],previous[old_key])
          keys=['period_s','HNE_pseudoSa_m_s2','HNN_pseudoSa_m_s2','horizontal_gm_pseudoSa_m_s2',
                'HNE_2dt_pseudoSa_m_s2_DIAGNOSTIC','HNN_2dt_pseudoSa_m_s2_DIAGNOSTIC',
                'max_component_dt2_relative_difference_DIAGNOSTIC','frequency_over_highpass_corner']
          output=folder/'S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv'
          with output.open('w',newline='') as f:
              w=csv.DictWriter(f,fieldnames=keys)
              w.writeheader()
              for row in p['spectrum']:
                  w.writerow({key:format(row[key],'.12g') for key in keys})
                  print('S05_REAL_DENSE_ROW',json.dumps({key:format(row[key],'.12g') for key in keys},sort_keys=True))
          print('S05_DENSE_REAL_CSV_SHA256',hashlib.sha256(output.read_bytes()).hexdigest())
          print('S05_DENSE_16_PERIOD_2_COMPONENT_4_OLD_PERIOD_REGRESSION_PASS_NO_DESIGN_WAVE')
          PY
          curl -fLsS --retry 3 -o esm-public-processed/committed_dense.csv "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv"
          cmp esm-public-processed/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv esm-public-processed/committed_dense.csv
          sha256sum esm-public-processed/S05_ESM_IT2012_NVL_MP_DENSE_16PERIOD_20261029.csv esm-public-processed/committed_dense.csv
          echo 'S05_REAL_DENSE_16_ROW_COMMITTED_BYTE_IDENTITY_PASS_NOT_DESIGN_WAVE'
      - name: REAL three-component processed acceleration time-grid export for S08 handoff (NOT a design wave)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 s05_esm_public_processed_pair.py --export-s08 \
            --source-zip esm-public-processed/ESM_IT-2012-0008_NVL_MP_ACC_original.zip \
            --output-dir esm-public-processed
          python3 - <<'PY'
          import csv,hashlib,json,math,pathlib,zipfile
          folder=pathlib.Path('esm-public-processed')
          rec=json.loads((folder/'S08_ESM_IT2012_NVL_MP_ACCEL_SI_SOURCE_RECEIPT.json').read_text())
          data=(folder/'S08_ESM_IT2012_NVL_MP_3COMP_ACCEL_SI_NOT_DESIGN_WAVE.csv').read_bytes()
          assert hashlib.sha256(data).hexdigest()==rec['csv_sha256']
          assert rec['source_numeric_sha256_verified'] is True
          assert rec['npts']==32040 and math.isclose(rec['dt_s'],.005)
          assert math.isclose(rec['last_time_s'],160.195,rel_tol=0,abs_tol=1e-10)
          assert rec['Abaqus_E_WE_RUN']==0 and rec['S08_PASS'] is False
          rows=list(csv.DictReader(data.decode('utf-8').splitlines()))
          assert len(rows)==32040
          with zipfile.ZipFile(folder/'ESM_IT-2012-0008_NVL_MP_ACC_original.zip') as z:
              for stream in ('HNE','HNN','HNZ'):
                  name=next(n for n in z.namelist() if '.'+stream+'.' in n)
                  lines=z.read(name).decode('utf-8').splitlines()
                  idx=next(i for i,line in enumerate(lines) if ':' not in line)
                  original=[float(v) for line in lines[idx:] for v in line.split()]
                  assert len(original)==32040
                  for i in (0,12345,32039):
                      assert math.isclose(float(rows[i][stream+'_acc_m_s2']),original[i]*.01,
                                          rel_tol=2e-11,abs_tol=1e-12)
          for i in (0,1,12345,32039):
