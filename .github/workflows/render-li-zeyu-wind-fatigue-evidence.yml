name: Render Li Zeyu wind fatigue evidence

on:
  push:
    paths:
      - '.github/workflows/render-li-zeyu-wind-fatigue-evidence.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf
            research/wind-tower/references/reading-notes/evidence/li-zeyu
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf
      - name: Render chapter 6 contextual crops
        shell: bash
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          pdf=Path("research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf")
          root=Path("research/wind-tower/references/reading-notes/evidence/li-zeyu/wind-fatigue")
          root.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(pdf)
          jobs=[
            (138,.03,.96,"p138_print126_ch6_start_weibull"),
            (139,.03,.96,"p139_print127_probability_spectrum"),
            (140,.03,.96,"p140_print128_kaimal_harmonic"),
            (143,.03,.96,"p143_print131_tower_wind_load"),
            (144,.03,.96,"p144_print132_wind_sim_params"),
            (145,.03,.96,"p145_print133_spectrum_aero_load"),
            (146,.03,.96,"p146_print134_dynamic_response"),
            (148,.03,.96,"p148_print136_table6_1_mean_vs_turbulent"),
            (149,.03,.96,"p149_print137_fatigue_method_intro"),
            (150,.03,.96,"p150_print138_fatigue_flow_rainflow"),
            (151,.03,.96,"p151_print139_concrete_rebar_SN"),
            (152,.03,.96,"p152_print140_steel_SN_regions"),
            (153,.03,.96,"p153_print141_fatigue_locations"),
            (154,.03,.96,"p154_print142_critical_stress"),
            (156,.03,.96,"p156_print144_table6_2_stress"),
            (157,.03,.96,"p157_print145_table6_3_wind_hours"),
            (158,.03,.96,"p158_print146_rainflow_life"),
            (159,.03,.96,"p159_print147_table6_4_ch6_summary"),
          ]
          rows=[]
          for pno,y0f,y1f,label in jobs:
            p=doc[pno-1]; r=p.rect
            clip=fitz.Rect(r.x0+22,r.y0+r.height*y0f,r.x1-22,r.y0+r.height*y1f)
            fn=f"{label}.png"
            p.get_pixmap(matrix=fitz.Matrix(1.75,1.75),clip=clip,alpha=False).save(root/fn)
            rows.append((pno,fn))
          idx=Path("research/wind-tower/references/reading-notes/evidence/li-zeyu/WIND_FATIGUE_INDEX.md")
          with idx.open("w",encoding="utf-8") as f:
            f.write("# 李泽宇博士论文第6章原文截图索引\n\n")
            f.write("> 直接由仓库原PDF渲染。PDF页码为文件页码，文件名同时标注论文印刷页。\n\n")
            for pno,fn in rows:
              f.write(f"- PDF p.{pno}: ![](wind-fatigue/{fn})\n")
          print("rendered",len(rows))
          PY
      - name: Commit evidence
        run: |
          git config user.name "openai-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/references/reading-notes/evidence/li-zeyu
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: add original chapter 6 wind-fatigue screenshots"
            git push
          fi
