name: S07 A-case PE/ABI binary preflight (NO solver)
on:
  push:
    paths:
      - '.github/workflows/s07-a-native-binary-abi-gate.yml'
      - 'research/wind-tower/experiments/T077/recovery/s07_a_native_binary_abi_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pe-controller-export-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sparse checkout source, executable pointer and controller DLL
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T077/recovery/s07_a_native_binary_abi_gate.py
            research/wind-tower/experiments/T077/recovery/S07_U11p4_ETM_S04_A/S07_A_ASSEMBLY_RECEIPT.json
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll

      - name: Fetch only 61 MB EXE LFS entity; never fetch 437 MB BTS
        shell: bash
        run: |
          set -euo pipefail
          exe=research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
          dll=research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
          git lfs install --local
          git lfs pull --include="$exe" --exclude=""
          test "$(stat -c%s "$exe")" -eq 61086208
          test "$(stat -c%s "$dll")" -eq 1122431
          printf '%s  %s\n' \
            '0cc8147fdda188365b8eacda8a831e74fafef59440d71185d66c3272af9e176a' "$exe" \
            '7aebb0d2166c0cc095d11c2b7bc13da136547c557b0f331dcdce84fe181802aa' "$dll" \
            | sha256sum --check
          echo 'S07_EXE_DLL_REAL_BYTES_SHA_VERIFIED; BTS_download=0; solver=0'

      - name: Python synthetic reject tests and actual PE/AMD64/DISCON export audit
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower
          py="$root/experiments/T077/recovery/s07_a_native_binary_abi_gate.py"
          python3 --version
          python3 -m py_compile "$py"
          python3 "$py" --selftest
          python3 "$py" \
            --receipt "$root/experiments/T077/recovery/S07_U11p4_ETM_S04_A/S07_A_ASSEMBLY_RECEIPT.json" \
            --exe "$root/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe" \
            --dll "$root/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll" \
            --output S07_A_NATIVE_BINARY_ABI_RECEIPT.json
          sha256sum "$py" S07_A_NATIVE_BINARY_ABI_RECEIPT.json
          echo 'STATIC ABI ONLY: no OpenFAST process started; not a native initialization or physics PASS.'

      - name: Upload small verified audit receipt (only if created)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s07-a-native-binary-abi-receipt
          path: S07_A_NATIVE_BINARY_ABI_RECEIPT.json
          if-no-files-found: ignore
          retention-days: 30

  windows-reference-dll-load-only:
    name: Windows reference DISCON LoadLibrary only (NO OpenFAST, NO DISCON call)
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T077/recovery/s07_a_native_binary_abi_gate.py
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native Windows x64 loader and SHA-locked reference DLL (no solver)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $py = 'research/wind-tower/experiments/T077/recovery/s07_a_native_binary_abi_gate.py'
          $dll = 'research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll'
          $actual = (Get-FileHash -Algorithm SHA256 $dll).Hash.ToLowerInvariant()
          if ($actual -ne '7aebb0d2166c0cc095d11c2b7bc13da136547c557b0f331dcdce84fe181802aa') { throw 'REFERENCE_DLL_SHA_MISMATCH' }
          if ((Get-Item $dll).Length -ne 1122431) { throw 'REFERENCE_DLL_SIZE_MISMATCH' }
          python --version
          python -m py_compile $py
          python $py --selftest
          python $py --native-load-only --dll $dll --output S07_A_WINDOWS_REFERENCE_DLL_LOAD_RECEIPT.json
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_LOAD_DIAGNOSTIC_FAILED' }
          $result = Get-Content S07_A_WINDOWS_REFERENCE_DLL_LOAD_RECEIPT.json -Raw | ConvertFrom-Json
          if ($result.RUN.openfast -ne 0 -or $result.RUN.discon_calls -ne 0 -or $result.physical_pass -ne $false) { throw 'UNSAFE_NATIVE_LOAD_RECEIPT' }
          if ($result.status -notin @('PASS_REFERENCE_DLL_WINDOWS_LOAD_AND_EXPORT_ONLY','HOLD_WINDOWS_REFERENCE_DLL_LOAD_OR_EXPORT')) { throw 'UNEXPECTED_LOAD_STATUS' }
          Write-Host ('S07_WINDOWS_REFERENCE_LOAD_STATUS=' + $result.status)
          if ($result.failure) { Write-Host ('S07_WINDOWS_LOAD_FAILURE=' + ($result.failure | ConvertTo-Json -Compress)) }
          Write-Host 'REFERENCE_ONLY; historical DLL absent; OpenFAST=0; DISCON_CALLS=0; physical PASS=FALSE'
      - name: Persist one new Windows-native receipt on Draft branch (create-only)
        if: github.ref == 'refs/heads/research/t080-seismic-integration-gates-20261022'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path S07_A_WINDOWS_REFERENCE_DLL_LOAD_RECEIPT.json)) { throw 'NATIVE_RECEIPT_MISSING' }
          @'
          import base64, json, os, urllib.request, urllib.error
          repo=os.environ['GITHUB_REPOSITORY']
          branch=os.environ['GITHUB_REF_NAME']
          assert branch=='research/t080-seismic-integration-gates-20261022'
          path='research/wind-tower/experiments/T077/recovery/S07_U11p4_ETM_S04_A/S07_A_WINDOWS_REFERENCE_DLL_LOAD_RECEIPT.json'
          data=open('S07_A_WINDOWS_REFERENCE_DLL_LOAD_RECEIPT.json','rb').read()
          result=json.loads(data)
          assert result['RUN']['openfast']==0 and result['RUN']['discon_calls']==0
          assert not result['physical_pass'] and result['stages_passed']==0
          assert result['status'] in ('PASS_REFERENCE_DLL_WINDOWS_LOAD_AND_EXPORT_ONLY','HOLD_WINDOWS_REFERENCE_DLL_LOAD_OR_EXPORT')
          payload={'message':'research(S07): persist real Windows reference DLL LoadLibrary-only receipt (NOT historical or solver PASS)',
                   'branch':branch,'content':base64.b64encode(data).decode('ascii')}
          url='https://api.github.com/repos/'+repo+'/contents/'+path
          # Idempotent create-only: never overwrite another runner's receipt.
          probe=urllib.request.Request(url+'?ref='+branch,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(probe,timeout=30) as resp:
                  existing=json.load(resp)
              prior=base64.b64decode(existing['content'])
              if prior != data:
                  raise ValueError('EXISTING_WINDOWS_NATIVE_RECEIPT_DIFFERS_DO_NOT_OVERWRITE')
              print('S07_WINDOWS_NATIVE_REFERENCE_RECEIPT_ALREADY_IDENTICAL',result['status'])
              raise SystemExit(0)
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
          req=urllib.request.Request(url,data=json.dumps(payload).encode('utf-8'),method='PUT',
                headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                         'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=60) as resp:
                  body=json.load(resp)
                  assert resp.status==201
                  print('S07_WINDOWS_NATIVE_REFERENCE_RECEIPT_CREATED',body['commit']['sha'],result['status'])
          except urllib.error.HTTPError as exc:
              print('S07_NATIVE_RECEIPT_PERSIST_ERROR',exc.code,exc.read().decode('utf-8','replace')[:500])
              raise
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s07-windows-reference-dll-load-only
          path: S07_A_WINDOWS_REFERENCE_DLL_LOAD_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
