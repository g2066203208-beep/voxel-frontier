name: S07 A-case PE/ABI binary preflight (NO solver)
on:
  push:
    paths:
      - '.github/workflows/s07-a-native-binary-abi-gate.yml'
      - 'research/wind-tower/experiments/T077/recovery/s07_a_native_binary_abi_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pe-controller-export-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sparse checkout source, executable pointer and controller DLL
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T077/recovery/s07_a_native_binary_abi_gate.py
            research/wind-tower/experiments/T077/recovery/S07_U11p4_ETM_S04_A/S07_A_ASSEMBLY_RECEIPT.json
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll

      - name: Fetch only 61 MB EXE LFS entity; never fetch 437 MB BTS
        shell: bash
        run: |
          set -euo pipefail
          exe=research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
          dll=research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
          git lfs install --local
          git lfs pull --include="$exe" --exclude=""
          test "$(stat -c%s "$exe")" -eq 61086208
          test "$(stat -c%s "$dll")" -eq 1122431
          printf '%s  %s\n' \
            '0cc8147fdda188365b8eacda8a831e74fafef59440d71185d66c3272af9e176a' "$exe" \
            '7aebb0d2166c0cc095d11c2b7bc13da136547c557b0f331dcdce84fe181802aa' "$dll" \
            | sha256sum --check
          echo 'S07_EXE_DLL_REAL_BYTES_SHA_VERIFIED; BTS_download=0; solver=0'

      - name: Python synthetic reject tests and actual PE/AMD64/DISCON export audit
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower
          py="$root/experiments/T077/recovery/s07_a_native_binary_abi_gate.py"
          python3 --version
          python3 -m py_compile "$py"
          python3 "$py" --selftest
          python3 "$py" \
            --receipt "$root/experiments/T077/recovery/S07_U11p4_ETM_S04_A/S07_A_ASSEMBLY_RECEIPT.json" \
            --exe "$root/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe" \
            --dll "$root/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll" \
            --output S07_A_NATIVE_BINARY_ABI_RECEIPT.json
          sha256sum "$py" S07_A_NATIVE_BINARY_ABI_RECEIPT.json
          echo 'STATIC ABI ONLY: no OpenFAST process started; not a native initialization or physics PASS.'

      - name: Upload small verified audit receipt (only if created)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s07-a-native-binary-abi-receipt
          path: S07_A_NATIVE_BINARY_ABI_RECEIPT.json
          if-no-files-found: ignore
          retention-days: 30
