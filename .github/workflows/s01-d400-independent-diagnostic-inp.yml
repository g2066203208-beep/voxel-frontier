name: S01 D400 Independent Diagnostic INP (Static Only)
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - 'research/wind-tower/experiments/T077/recovery/s01_d400_relayout_pe_diagnostic_inp.py'
      - 'research/wind-tower/experiments/T077/recovery/s01_d400_d500_straight_t3d2_exact.py'
      - 'research/wind-tower/experiments/T077/recovery/s01_native_inp_cage_polygon_clearance.py'
      - 'research/wind-tower/experiments/T077/recovery/s01_straight_bar_radial_clearance.py'
      - 'research/wind-tower/experiments/T077/recovery/S01_D400_D500_UNMOVED_CAGE_CLEARANCE_31SEG_20261025.csv'
      - '.github/workflows/s01-d400-independent-diagnostic-inp.yml'
      - 'research/wind-tower/experiments/T077/recovery/s10_d400_midplane_azimuth_gate.py'
  pull_request:
    branches: [main]
    paths:
      - 'research/wind-tower/experiments/T077/recovery/s01_d400_relayout_pe_diagnostic_inp.py'
      - '.github/workflows/s01-d400-independent-diagnostic-inp.yml'
      - 'research/wind-tower/experiments/T077/recovery/s10_d400_midplane_azimuth_gate.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  static-d400-pe-diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/T057/inputs
            research/wind-tower/experiments/T077/recovery
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate SHA-locked 62-row geometric source
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/wind-tower/experiments/T057/inputs/BASE001_T057_EVIDENCE_RECONCILED_HRB335_Q345_PTBF8_CONTACT_RNA_R2.inp"
          TOOL="research/wind-tower/experiments/T077/recovery/s01_d400_d500_straight_t3d2_exact.py"
          python "$TOOL" --inp "$SRC" --outdir "$RUNNER_TEMP/s01_geom" > "$RUNNER_TEMP/s01_geom_stdout.json"
      - name: Generate independent diagnostic INP and exact parent reverse-patch proof
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/wind-tower/experiments/T057/inputs/BASE001_T057_EVIDENCE_RECONCILED_HRB335_Q345_PTBF8_CONTACT_RNA_R2.inp"
          TOOL="research/wind-tower/experiments/T077/recovery/s01_d400_relayout_pe_diagnostic_inp.py"
          GEOM="$RUNNER_TEMP/s01_geom/S01_D400_D500_31SEG_STRAIGHT_T3D2_EXACT_GEOMETRY.csv"
          python "$TOOL" --inp "$SRC" --geometry "$GEOM" --outdir "$RUNNER_TEMP/s01_d400_candidate" | tee "$RUNNER_TEMP/s01_d400_stdout.json"
          python - <<'PY'
          import hashlib, json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "s01_d400_candidate"
          meta = json.loads((p/"S01_D400_RELAYOUT_Pe_PROXY_DIAGNOSTIC_MANIFEST.json").read_text())
          raw = (p/"S01_D400_RELAYOUT_Pe_PROXY_DIAGNOSTIC_ONLY.inp").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == meta["candidate_sha256"]
          assert meta["changed_longitudinal_segments"] == 31
          assert meta["reverse_patch_exact_parent"]
          assert meta["status"] == "STATIC_DIAGNOSTIC_ONLY_HOLD"
          assert meta["native_Abaqus_Data_Check"] == "NOT_RUN"
          assert meta["PT_gravity_contact_equilibrium"] == "NOT_RUN"
          assert meta["earthquake_results"] == 0
          print("S01 STATIC INPUT TRANSFORM VERIFIED; NO ABAQUS, NO PHYSICAL PASS")
          PY
      - name: Archive candidate INP and provenance manifest (NOT a native RUN)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: s01-d400-pe-diagnostic-inp-static-not-validated
          path: |
            ${{ runner.temp }}/s01_d400_candidate/S01_D400_RELAYOUT_Pe_PROXY_DIAGNOSTIC_ONLY.inp
            ${{ runner.temp }}/s01_d400_candidate/S01_D400_RELAYOUT_Pe_PROXY_DIAGNOSTIC_MANIFEST.json
            ${{ runner.temp }}/s01_d400_stdout.json
            ${{ runner.temp }}/s01_geom/S01_D400_D500_31SEG_STRAIGHT_T3D2_EXACT_MANIFEST.json
          retention-days: 14

      - name: S10 direct 31x4x2 midplane concrete element extraction from SHA-locked D400 INP (static only)
        if: github.event_name == 'push' && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
        shell: bash
        run: |
          set -euo pipefail
          root="research/wind-tower/experiments/T077/recovery"
          # IMPORTANT: 0965... is a mixed-hoop/tie diagnostic, NOT the SHA-locked
          # 22c... uniform D400/Pe/G1 child used to derive the 68-part map.
          # Reproduce exact 0965 -> 4c84 (G1-only) -> 22c (uniform material refs).
          python - <<'PY'
          import hashlib, os, pathlib, sys
          root=pathlib.Path("research/wind-tower/experiments/T077/recovery")
          sys.path.insert(0,str(root.resolve()))
          from s01_d400_pe_g1_instrument import instrument
          from s01_d400_uniform_pe_repro_min import make
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])/"s01_d400_candidate"
          source=temp/"S01_D400_RELAYOUT_Pe_PROXY_DIAGNOSTIC_ONLY.inp"
          g1=instrument(source.read_bytes())
          assert hashlib.sha256(g1).hexdigest()=="4c84c61ea07138428d4c0a8f742a9ab6e55725c49d16a94f5d9eaa8f7d9d3d29"
          uniform=make(g1)
          assert hashlib.sha256(uniform).hexdigest()=="22c29916aa78f289d95b036d1c63dec68c886d8994b5c32909d4f3a0206d9f2a"
          dest=temp/"S01_D400_UNIFORM_REBAR_Pe_G1_PROVISIONAL_NOT_FROZEN.inp"
          assert not dest.exists()
          dest.write_bytes(uniform)
          print("S10_EXACT_0965_TO_4C84_TO_22C_SOURCE_BRANCH_REPRODUCED",len(uniform))
          PY
          child="$RUNNER_TEMP/s01_d400_candidate/S01_D400_UNIFORM_REBAR_Pe_G1_PROVISIONAL_NOT_FROZEN.inp"
          python "$root/s10_d400_midplane_azimuth_gate.py" --self-test
          # Never write into an already tracked output while validating; fail closed
          # on temporary new paths, then replace only after all checks succeed.
          work="$RUNNER_TEMP/s10_midplane"
          mkdir -p "$work"
          python "$root/s10_d400_midplane_azimuth_gate.py" \
            --inp "$child" \
            --source-map "$root/S10_D400_PE_68PART_INP_METADATA_20261028.csv" \
            --out "$work/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_ELEMENTS_20261031.csv" \
            --receipt "$work/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_RECEIPT_20261031.json"
          python - <<'PY'
          import csv, hashlib, json, pathlib
          import os
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"s10_midplane"
          c=p/"S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_ELEMENTS_20261031.csv"
          j=p/"S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_RECEIPT_20261031.json"
          r=list(csv.DictReader(c.open()))
          m=json.loads(j.read_text())
          assert len(r)==248 and len({(x['segment'],x['radial_layer'],x['requested_azimuth_deg']) for x in r})==248
          assert len({(x['instance'],x['element_label']) for x in r})==248
          assert all(x['odb_integration_point']==x['local_stress_MPa']=='' for x in r)
          assert m['rows_over_0p1m_axial']==0 and m['physical_pass'] is False
          assert hashlib.sha256(c.read_bytes()).hexdigest()==m['output_sha256']
          print('S10_248_MIDPLANE_REAL_INP_SOURCE_ROWS_SHA_AND_NO_ODB_PASS')
          PY
          cp "$work/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_ELEMENTS_20261031.csv" "$root/"
          cp "$work/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_RECEIPT_20261031.json" "$root/"
          sha256sum "$child" "$root/s10_d400_midplane_azimuth_gate.py" \
            "$root/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_ELEMENTS_20261031.csv" \
            "$root/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_RECEIPT_20261031.json"
      - name: Persist 248 real source-element records and provenance to PR42 branch (never merge)
        if: github.event_name == 'push' && github.ref_name == 'research/t080-seismic-integration-gates-20261022'
        shell: bash
        run: |
          set -euo pipefail
          root="research/wind-tower/experiments/T077/recovery"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$root/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_ELEMENTS_20261031.csv" \
            "$root/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_RECEIPT_20261031.json"
          if git diff --cached --quiet; then
            echo 'S10_MIDPLANE_NO_CHANGE_VERIFIED'
          else
            git commit -m 'data(S10): persist 248 direct D400 midplane concrete element candidates'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo 'S10 SOURCE-ELEMENT CENTROIDS ONLY; NO ODB/LOCAL STRESS/PHYSICS PASS'
