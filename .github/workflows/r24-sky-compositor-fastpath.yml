name: R24 200FPS Sky Compositor Fast Path

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_sky_compositor_fastpath.py'
      - '.github/workflows/r24-sky-compositor-fastpath.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-200fps-sky-compositor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - name: Materialize Hillaire SkyView LUT
        run: python3 .github/scripts/r24_hillaire_skyview_lut.py

      - name: Materialize full-resolution compositor fast path
        run: python3 .github/scripts/r24_sky_compositor_fastpath.py

      - name: Validate optimized source contracts
        shell: bash
        run: |
          git diff --check
          grep -q 'kSkyViewLutWidth = 192' native/include/vf/render/VulkanRenderer.hpp
          grep -q 'VK_FORMAT_R16G16B16A16_SFLOAT' native/src/render/VulkanRenderer.cpp
          grep -q 'float3 viewRay : TEXCOORD1' native/shaders/planet.slang
          grep -q 'conservativeCosGate' native/shaders/planet.slang
          grep -q 'const float starVisibility' native/src/render/VulkanRenderer.cpp
          grep -q 'gSkyViewLut.SampleLevel' native/shaders/planet.slang
          ! grep -q 'pow(h, 24.0)' native/shaders/planet.slang
          ! grep -q 'float3 ray = reconstructWorldRay(input.uv);' native/shaders/planet.slang

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-sky-fast -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-sky-fast --parallel 2

      - name: Run all native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-sky-fast --verbose --output-on-failure 2>&1 | tee r24-sky-fast-ctest.log

      - name: Gate physics terrain shader and runtime contracts
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-sky-fast --verbose --output-on-failure \
            -R 'vf_planetary_body_system_tests|vf_r24_runtime_stability_tests|vf_r24_hydrologic_canyon_tests|vf_terrain_landform_tests|vf_r24_physical_planet_tests|vf_shader_contract_tests' \
            2>&1 | tee r24-sky-fast-focused.log
          grep -q 'vf_planetary_body_system_tests: PASS' r24-sky-fast-focused.log
          grep -q 'vf_r24_runtime_stability_tests: PASS' r24-sky-fast-focused.log
          grep -q 'Terrain landform tests passed' r24-sky-fast-focused.log
          grep -q 'R24 hydrologic canyon tests passed' r24-sky-fast-focused.log
          grep -q 'All production shader SPIR-V entry-point contracts passed' r24-sky-fast-focused.log

      - name: Verify Vulkan device
        shell: bash
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt
          if grep -q 'deviceType.*PHYSICAL_DEVICE_TYPE_CPU' vulkan-summary.txt; then
            echo 'R24_200FPS_HARDWARE_GATE=UNAVAILABLE_SOFTWARE_VULKAN' | tee hardware-gpu-status.txt
          else
            echo 'R24_200FPS_HARDWARE_GATE=AVAILABLE' | tee hardware-gpu-status.txt
          fi

      - name: Capture real Vulkan production scenes
        shell: bash
        run: |
          APP="$(find build/r24-sky-fast -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-sky-fast-evidence

      - name: Gate real images and A-B performance
        shell: bash
        run: |
          test -s r24-sky-fast-evidence/r24-epic-landscape-overview.png
          test -s r24-sky-fast-evidence/terrain/mega-mountain-range.png
          test -s r24-sky-fast-evidence/terrain/mega-rift-valley.png
          test -s r24-sky-fast-evidence/terrain/mega-canyon.png
          test -s r24-sky-fast-evidence/terrain/mega-abyss-cave-throat.png
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics

          root = Path('r24-sky-fast-evidence/logs')
          pattern = re.compile(
              r'R24 GPU steady_pass_ms samples=([0-9]+) '
              r'shadow_mean=([0-9.]+) opaque_mean=([0-9.]+) sky_mean=([0-9.]+) '
              r'transparent_mean=([0-9.]+) total_mean=([0-9.]+) '
              r'shadow_max=([0-9.]+) opaque_max=([0-9.]+) sky_max=([0-9.]+) transparent_max=([0-9.]+)')
          rows=[]
          for name in ('mountain','rift','canyon','abyss'):
              text=(root/f'{name}.log').read_text(encoding='utf-8', errors='replace')
              found=pattern.findall(text)
              if not found:
                  raise SystemExit(f'{name}: missing steady pass telemetry')
              values=found[-1]
              row=(name,int(values[0]),*map(float,values[1:]))
              rows.append(row)
              print('SKY_FAST_STEADY',row)
              if row[1] < 8:
                  raise SystemExit(f'{name}: too few steady samples: {row[1]}')

          totals=[r[6] for r in rows]
          total_mean=statistics.mean(totals)
          shadow_mean=statistics.mean(r[2] for r in rows)
          opaque_mean=statistics.mean(r[3] for r in rows)
          sky_mean=statistics.mean(r[4] for r in rows)
          transparent_mean=statistics.mean(r[5] for r in rows)

          production_before_lut=54.610250
          first_skyview=26.457000
          vs_production=(production_before_lut-total_mean)/production_before_lut
          vs_first_skyview=(first_skyview-total_mean)/first_skyview
          print('SKY_FAST_SUMMARY',
                'total_mean_ms=',total_mean,
                'vs_production=',vs_production,
                'vs_first_skyview=',vs_first_skyview,
                'shadow=',shadow_mean,
                'opaque=',opaque_mean,
                'sky=',sky_mean,
                'transparent=',transparent_mean)

          Path('r24-sky-fast-performance.txt').write_text(
              f'production_before_lut_total_ms={production_before_lut:.6f}\n'
              f'first_skyview_total_ms={first_skyview:.6f}\n'
              f'sky_fast_total_ms={total_mean:.6f}\n'
              f'reduction_vs_production_fraction={vs_production:.6f}\n'
              f'reduction_vs_first_skyview_fraction={vs_first_skyview:.6f}\n'
              f'shadow_attributed_ms={shadow_mean:.6f}\n'
              f'opaque_attributed_ms={opaque_mean:.6f}\n'
              f'sky_attributed_ms={sky_mean:.6f}\n'
              f'transparent_attributed_ms={transparent_mean:.6f}\n'
              f'hardware_target_ms=5.000000\n'
              f'hardware_target_fps=200\n'
              f'ci_device=llvmpipe_software_vulkan_not_hardware_fps\n'
              f'note=pass attribution across split dynamic-rendering instances is diagnostic; total is the A-B gate\n',
              encoding='utf-8')

          # First Hillaire experiment already proved 26.457 ms total on the same software Vulkan
          # runner. This refinement is promoted only if it beats that experiment and preserves all
          # real screenshots. Do not substitute a per-pass attribution win for a total-frame win.
          if total_mean >= first_skyview:
              raise SystemExit(
                  f'compositor fast path did not beat first SkyView A-B: {total_mean:.3f} >= {first_skyview:.3f} ms')
          if total_mean >= production_before_lut * 0.60:
              raise SystemExit(
                  f'combined SkyView path has <40% total work reduction: {total_mean:.3f} ms')
          PY

      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-sky-compositor-fast-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-sky-fast-evidence ]]; then
            cp -a r24-sky-fast-evidence/. "$EVIDENCE_DIR/"
          fi
          for f in r24-sky-fast-ctest.log r24-sky-fast-focused.log vulkan-summary.txt hardware-gpu-status.txt r24-sky-fast-performance.txt; do
            [[ -f "$f" ]] && cp -f "$f" "$EVIDENCE_DIR/" || true
          done
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-sky-compositor-fast-${{ github.run_id }}
          path: |
            r24-sky-fast-evidence/**
            r24-sky-fast-ctest.log
            r24-sky-fast-focused.log
            vulkan-summary.txt
            hardware-gpu-status.txt
            r24-sky-fast-performance.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested SkyView compositor
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          if ! git diff --cached --quiet; then
            git commit -m "perf(r24): render atmosphere through fast sky compositor"
          fi
          git reset --hard HEAD
          git clean -fd build/r24-sky-fast || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
