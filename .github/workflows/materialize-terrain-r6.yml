name: Materialize Terrain R6 Landform Shape

on:
  push:
    branches: [test/terrain-r6-geomorph]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R6 landform shape source
        run: |
          python3 .github/scripts/materialize_r6_geomorph.py
          git diff --check
          grep -q 'R6 mountain shape' native/src/world/PlanetSurface.cpp
          grep -q 'R6 plateau shape' native/src/world/PlanetSurface.cpp
          grep -q 'R6 capture geometry' native/src/app/Main.cpp
          grep -q 'R5 river corridor' native/src/world/PlanetSurface.cpp
          grep -q 'R5 river exclusion' native/src/world/ProceduralEcology.cpp
      - name: Commit materialized source
        run: |
          rm -f .github/scripts/materialize_r6_geomorph.py .github/workflows/materialize-terrain-r6.yml
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp native/src/app/Main.cpp .github
          git commit -m 'terrain: materialize R6 landform shape candidate'
          git push origin HEAD:test/terrain-r6-geomorph
