name: t066-archive-fatigue-reference-evidence-pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t066-archive-fatigue-reference-evidence-pages.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/references/user-provided/Fatigue analysis of segmental precast post-tensioned concrete towers under operational wind turbine loads.pdf
            research/wind-tower/references/user-provided/The Response and Optimisation of Hybrid Wind Turbine Towers_Alan Kenna.pdf
            research/wind-tower/references/open-access/Qu_2026_Buildings_16_3854.pdf
            research/wind-tower/references/user-provided/Numerical Simulation and Fatigue Analysis of the Grout Layer Replacement for Horizontal Joint of Wind Turbine Prestressed Concrete Tower.pdf
            research/wind-tower/references/open-access/Zhao_2023_AdvCivilEng_1100725_SteelTower_Fatigue_MeasuredData.pdf
            research/wind-tower/references/user-provided/Experimental Investigation of the Steel-Concrete Joint in a Hybrid Tower for a Wind Turbine under Fatigue Loading.pdf
          sparse-checkout-cone-mode: false

      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Render selected evidence pages
        shell: bash
        run: |
          set -euo pipefail
          OUT='/tmp/t066'
          mkdir -p "$OUT"

          H='research/wind-tower/references/user-provided/Fatigue analysis of segmental precast post-tensioned concrete towers under operational wind turbine loads.pdf'
          K='research/wind-tower/references/user-provided/The Response and Optimisation of Hybrid Wind Turbine Towers_Alan Kenna.pdf'
          Q='research/wind-tower/references/open-access/Qu_2026_Buildings_16_3854.pdf'
          W='research/wind-tower/references/user-provided/Numerical Simulation and Fatigue Analysis of the Grout Layer Replacement for Horizontal Joint of Wind Turbine Prestressed Concrete Tower.pdf'
          Z='research/wind-tower/references/open-access/Zhao_2023_AdvCivilEng_1100725_SteelTower_Fatigue_MeasuredData.pdf'
          J='research/wind-tower/references/user-provided/Experimental Investigation of the Steel-Concrete Joint in a Hybrid Tower for a Wind Turbine under Fatigue Loading.pdf'

          render() {
            pdf="$1"; page="$2"; name="$3"
            pdftoppm -f "$page" -l "$page" -r 160 -png -singlefile "$pdf" "$OUT/$name" >/dev/null 2>&1
          }

          render "$H" 3  REF018_Huang2025_p03_Fig04_sectional_stress_fatigue
          render "$H" 4  REF018_Huang2025_p04_Fig06_07_wind_probability_and_timeseries
          render "$H" 5  REF018_Huang2025_p05_Fig09_azimuth_damage
          render "$H" 6  REF018_Huang2025_p06_Fig10_windbin_damage_and_rainflow_method
          render "$H" 7  REF018_Huang2025_p07_Fig11_mean_stress_correction
          render "$H" 8  REF018_Huang2025_p08_Fig13_14_cycle_damage_and_initial_prestress
          render "$H" 10 REF018_Huang2025_p10_Fig17_18_concrete_and_steel_damage
          render "$H" 11 REF018_Huang2025_p11_Fig20_SPPT_stress_timeseries
          render "$H" 13 REF018_Huang2025_p13_Fig24_26_project_factor_sensitivity

          render "$K" 205 REF002_Kenna2019_p205_steel_concrete_fatigue_design_requirement
          render "$K" 206 REF002_Kenna2019_p206_rainflow_Miner_and_separate_material_fatigue

          render "$Q" 4  REF023_Qu2026_p04_Fig01_bidirectional_fatigue_framework
          render "$Q" 13 REF023_Qu2026_p13_Fig04_Weibull_wind_distribution
          render "$Q" 16 REF023_Qu2026_p16_Fig06_tendon_load_spectrum
          render "$Q" 17 REF023_Qu2026_p17_Table07_tendon_annual_damage
          render "$Q" 18 REF023_Qu2026_p18_Fig07_08_tendon_fatigue_life
          render "$Q" 20 REF023_Qu2026_p20_Fig09_10_Weibull_and_relaxation_effect
          render "$Q" 21 REF023_Qu2026_p21_Table08_concrete_annual_damage
          render "$Q" 24 REF023_Qu2026_p24_Fig15_16_min_concrete_and_coupled_life

          render "$W" 16 REF041_Wang2025_p16_Fig17_joint_contact_stress
          render "$W" 20 REF041_Wang2025_p20_Fig19_fatigue_verification_area
          render "$W" 21 REF041_Wang2025_p21_Table04_reference_stress_and_damage

          render "$Z" 8  REF143_Zhao2023_p08_Fig09_flange_principal_stress
          render "$Z" 9  REF143_Zhao2023_p09_Fig10_11_Table02_damage_and_SCF
          render "$Z" 11 REF143_Zhao2023_p11_Fig16_fatigue_assessment_process
          render "$Z" 13 REF143_Zhao2023_p13_Table05_07_annual_and_weld_damage

          render "$J" 4 REF036_Kim2019_p04_Fig04_joint_section_and_fatigue_load
          render "$J" 6 REF036_Kim2019_p06_Fig07_specimens_and_reinforcement
          render "$J" 7 REF036_Kim2019_p07_two_million_cycle_test_method
          render "$J" 8 REF036_Kim2019_p08_Fig10_cyclic_load_displacement

          sha256sum "$H" "$K" "$Q" "$W" "$Z" "$J" > "$OUT/SOURCE_PDF_SHA256.txt"
          sha256sum "$OUT"/*.png > "$OUT/EVIDENCE_PAGE_SHA256.txt"

          cat > "$OUT/README.md" <<'EOF'
          # 第四章疲劳参考文献原页证据图

          这些图片均由仓库中的原始PDF直接渲染，仅用于方法证据、图表核对和答辩追溯，不能冒充本文计算结果。

          ## REF018 Huang et al. 2025
          p03/Fig.4：截面局部应力用于疲劳damage评价。
          p04/Fig.6-7：长期风速概率与随机风时程。
          p05/Fig.9：方位角对不同风速bin damage贡献的影响。
          p06/Fig.10及正文：wind-bin damage、rainflow、Miner。
          p07/Fig.11：mean-stress correction影响。
          p08/Fig.13-14：cycle range/mean与初始prestress影响。
          p10/Fig.17-18：SPPT接缝与钢塔分材料fatigue damage。
          p11/Fig.20：SPPT局部stress time series。
          p13/Fig.24-26：基础刚度、混凝土E、控制策略敏感性。

          ## REF002 Kenna 2019
          p205：钢段和混凝土段分别满足疲劳寿命要求，混凝土处于永久压应力状态。
          p206：rainflow + Palmgren-Miner；钢和混凝土采用不同疲劳设计体系。

          ## REF023 Qu et al. 2026
          p04/Fig.1：PT-混凝土双向耦合疲劳框架。
          p13/Fig.4：Weibull风速频率分布。
          p16/Fig.6：PT tendon load spectrum。
          p17/Table 7：单根PT各风速annual damage。
          p18/Fig.7-8：PT空间寿命与松弛影响。
          p20/Fig.9-10：Weibull参数与prestress relaxation影响。
          p21/Table 8：混凝土观察区annual damage。
          p24/Fig.15-16：最小混凝土寿命与耦合寿命。

          ## REF041 Wang et al. 2025
          p16/Fig.17：水平接缝contact stress。
          p20/Fig.19：fatigue verification area。
          p21/Table 4：Reference Stress与Miner damage验证。

          ## REF143 Zhao et al. 2023
          p08/Fig.9：法兰最大主应力。
          p09/Fig.10-11 + Table 2：hourly damage与SCF。
          p11/Fig.16：fatigue life assessment process。
          p13/Tables 5-7：annual damage matrix与flange weld fatigue damage。

          ## REF036 Kim et al. 2019
          p04/Fig.4 + Table 3：钢-混连接截面及fatigue design load。
          p06/Fig.7：full-scale连接试件与配筋。
          p07：2 million cyclic loading + monotonic residual test方法。
          p08/Fig.10：循环load-displacement响应。

          ## 使用边界
          原图用于证明“文献确实这样做”。最终Word优先重绘方法示意图并标注参考来源；若直接引用原图，必须标明“引自××文献”。每张PNG和原PDF哈希分别见EVIDENCE_PAGE_SHA256.txt和SOURCE_PDF_SHA256.txt。
          EOF

      - name: Commit evidence images
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          src=Path('/tmp/t066')
          prefix='research/wind-tower/references/evidence-screenshots/fatigue-ch4'
          H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'t066'}
          def api(m,p,x=None):
            data=None if x is None else json.dumps(x).encode()
            q=urllib.request.Request('https://api.github.com/repos/'+repo+p,data=data,headers=H,method=m)
            with urllib.request.urlopen(q,timeout=300) as r:return json.loads(r.read().decode())
          ref=api('GET','/git/ref/heads/'+branch); parent=ref['object']['sha']; base=api('GET','/git/commits/'+parent)['tree']['sha']
          ents=[]
          for p in sorted(src.glob('*')):
            if not p.is_file(): continue
            raw=p.read_bytes()
            b=api('POST','/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
            ents.append({'path':prefix+'/'+p.name,'mode':'100644','type':'blob','sha':b['sha']})
          t=api('POST','/git/trees',{'base_tree':base,'tree':ents})
          c=api('POST','/git/commits',{'message':'references: archive original fatigue-reference evidence pages','tree':t['sha'],'parents':[parent]})
          api('PATCH','/git/refs/heads/'+branch,{'sha':c['sha'],'force':False})
          print(c['sha'])
          PY
