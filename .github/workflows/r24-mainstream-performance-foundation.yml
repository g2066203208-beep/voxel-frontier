name: R24 Mainstream Performance Foundation

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_mainstream_performance_foundation.py'
      - '.github/workflows/r24-mainstream-performance-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-mainstream-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-benchmark-and-vulkan-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 foundation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 5

      - name: Materialize celestial simulation LOD first
        run: python3 .github/scripts/r24_celestial_simulation_lod.py

      - name: Materialize mainstream performance foundation
        run: python3 .github/scripts/r24_mainstream_performance_foundation.py

      - name: Validate architecture and benchmark contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'CelestialOrbitMode::AnalyticKepler' native/src/world/CelestialSystem.cpp
          grep -q 'R24 CELESTIAL dynamic_bodies=' native/src/app/Main.cpp
          grep -q 'VF_PERF_PROFILE' native/src/app/Main.cpp
          grep -q 'mainstream_1080p' native/src/app/Main.cpp
          grep -q 'PerformanceBenchmark' native/src/app/Main.cpp
          grep -q 'viewportHeightPixels = mainstreamPerfProfile ? 1080.0 : 900.0' native/src/app/Main.cpp
          grep -q 'mainstreamPerfProfile ? 4.08 : 3.4' native/src/app/Main.cpp
          grep -q 'vf_performance_benchmark_tests' native/CMakeLists.txt
          grep -q 'R24 BENCHMARK profile=' native/include/vf/perf/PerformanceBenchmark.hpp

      - name: Record actual CI host
        shell: bash
        run: |
          {
            echo 'target_profile=Windows11_6core_16GiB_1080p_RTX3060-4060-class'
            echo "ci_os=$(uname -a)"
            echo "ci_logical_cores=$(nproc)"
            echo "ci_memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            lscpu | grep -E 'Model name|CPU\(s\)|Core\(s\) per socket|Thread\(s\) per core' || true
          } | tee r24-mainstream-host.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-mainstream -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-mainstream --parallel 2

      - name: Run complete native regression suite
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-mainstream --verbose --output-on-failure 2>&1 | tee r24-mainstream-ctest.log

      - name: Gate benchmark statistics and physical foundations
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-mainstream --verbose --output-on-failure \
            -R 'vf_performance_benchmark_tests|vf_celestial_simulation_lod_tests|vf_celestial_system_tests|vf_r24_runtime_stability_tests|vf_r24_physical_planet_tests|vf_planet_tile_streaming_tests|vf_r24_hydrologic_canyon_tests|vf_shader_contract_tests' \
            2>&1 | tee r24-mainstream-focused.log
          grep -q 'R24 performance benchmark tests passed' r24-mainstream-focused.log
          grep -q 'R24 celestial simulation LOD tests passed analytic=64 dynamic=1' r24-mainstream-focused.log
          grep -q 'nbody_pair_evals=0' r24-mainstream-focused.log
          grep -q 'R24 planet tile streaming tests passed' r24-mainstream-focused.log
          grep -q 'R24 hydrologic canyon tests passed' r24-mainstream-focused.log
          grep -q 'All production shader SPIR-V entry-point contracts passed' r24-mainstream-focused.log

      - name: Verify actual Vulkan implementation
        shell: bash
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Run real 1920x1080 Vulkan frame benchmark
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/r24-mainstream -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r24-mainstream-evidence
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > r24-mainstream-evidence/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 1
          export DISPLAY=:99
          export SDL_VIDEODRIVER=x11
          export VF_PERF_PROFILE=mainstream_1080p
          export VF_CAPTURE_AERIAL=1
          export VF_CAPTURE_ALTITUDE_METERS=7000
          export VF_TERRAIN_TARGET=canyon
          export VF_RUNTIME_DIAGNOSTICS=1
          export VF_CELESTIAL_TIME_SCALE=1
          CPU_COUNT="$(nproc)"
          if [[ "$CPU_COUNT" -ge 6 ]]; then
            CPU_PREFIX=(taskset -c 0-5)
            echo 'actual_runtime_cpu_limit=6' >> r24-mainstream-host.txt
          else
            CPU_PREFIX=()
            echo "actual_runtime_cpu_limit=$CPU_COUNT (runner has fewer than target 6 cores)" >> r24-mainstream-host.txt
          fi
          set +e
          timeout 35s "${CPU_PREFIX[@]}" "$APP" > r24-mainstream-evidence/benchmark.log 2>&1 &
          APP_PID=$!
          sleep 5
          import -window root r24-mainstream-evidence/mainstream-1080p-benchmark.png || true
          wait $APP_PID
          APP_STATUS=$?
          set -e
          if [[ "$APP_STATUS" -ne 0 ]]; then
            cat r24-mainstream-evidence/benchmark.log
            exit "$APP_STATUS"
          fi
          cat r24-mainstream-evidence/benchmark.log
          test -s r24-mainstream-evidence/mainstream-1080p-benchmark.png

      - name: Parse and gate measured frame pacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('r24-mainstream-evidence/benchmark.log').read_text(encoding='utf-8', errors='replace')
          lines=[line for line in text.splitlines() if line.startswith('R24 BENCHMARK profile=')]
          if not lines:
              raise SystemExit('missing R24 BENCHMARK summary')
          line=lines[-1]
          print(line)
          def num(key):
              m=re.search(rf'\b{re.escape(key)}=([0-9]+(?:\.[0-9]+)?)', line)
              if not m: raise SystemExit(f'missing {key}')
              return float(m.group(1))
          if 'profile=mainstream_1080p' not in line or 'resolution=1920x1080' not in line:
              raise SystemExit('benchmark did not execute exact mainstream 1080p profile')
          if 'valid=1' not in line:
              raise SystemExit('benchmark sample invalid')
          frames=num('frames'); fps=num('avg_fps'); low=num('one_percent_low_fps')
          p95=num('p95_ms'); p99=num('p99_ms'); maxms=num('max_ms')
          busy=num('streaming_busy_pct'); tris=num('static_tris_max')
          if frames < 40: raise SystemExit('insufficient steady-state frame samples')
          if fps <= 1.0 or p99 >= 1500.0: raise SystemExit('catastrophic software-Vulkan regression')
          if busy > 5.0: raise SystemExit('stationary benchmark keeps rebuilding terrain')
          if tris > 750000: raise SystemExit('mainstream profile exceeded static triangle safety budget')
          cel=re.findall(r'R24 CELESTIAL dynamic_bodies=([0-9]+) analytic_bodies=([0-9]+) nbody_pairs=([0-9]+) ephemeris_evals=([0-9]+)', text)
          if not cel: raise SystemExit('missing production celestial telemetry')
          if not any(tuple(map(int,x)) == (1,3,0,3) for x in cel):
              raise SystemExit(f'production celestial LOD telemetry wrong: {cel[-3:]}')
          Path('r24-mainstream-evidence/benchmark-summary.txt').write_text(
              line+'\n'
              f'actual_backend=software_vulkan_lavapipe_ci\n'
              f'gpu_fps_classification=stress_regression_not_discrete_gpu_claim\n'
              f'target_discrete_gpu=RTX_3060_or_RTX_4060_class\n'
              f'target_cpu=6_core\n'
              f'target_ram_gib=16\n'
              f'target_resolution=1920x1080\n'
              f'target_fps=60\n', encoding='utf-8')
          print(f'CI software Vulkan measured avg={fps:.2f} 1%low={low:.2f} p95={p95:.2f}ms p99={p99:.2f}ms max={maxms:.2f}ms tris={tris:.0f}')
          PY

      - name: Capture four real production terrain views
        shell: bash
        run: |
          APP="$(find build/r24-mainstream -type f -name voxel_frontier -perm -111 | head -n 1)"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-mainstream-evidence/terrain-scenes

      - name: Build evidence overview
        if: always()
        shell: bash
        run: |
          if [[ -s r24-mainstream-evidence/mainstream-1080p-benchmark.png ]]; then
            cp r24-mainstream-evidence/mainstream-1080p-benchmark.png r24-mainstream-evidence/latest-mainstream-benchmark.png
          fi
          EVIDENCE_DIR="docs/evidence/r24-mainstream-performance-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-mainstream-evidence ]]; then cp -a r24-mainstream-evidence/. "$EVIDENCE_DIR/"; fi
          for f in r24-mainstream-host.txt r24-mainstream-ctest.log r24-mainstream-focused.log vulkan-summary.txt; do
            [[ -f "$f" ]] && cp -f "$f" "$EVIDENCE_DIR/" || true
          done
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence always
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-mainstream-performance-${{ github.run_id }}
          path: |
            r24-mainstream-evidence/**
            r24-mainstream-host.txt
            r24-mainstream-ctest.log
            r24-mainstream-focused.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested celestial and performance foundation
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          if ! git diff --cached --quiet; then
            git commit -m "perf(r24): promote ephemeris and mainstream frame benchmark"
          fi
          git reset --hard HEAD
          git clean -fd build/r24-mainstream || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
