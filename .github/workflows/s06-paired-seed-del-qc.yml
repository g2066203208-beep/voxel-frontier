name: S06 paired ETM seed DEL source-level QC (not fatigue PASS)
on:
  push:
    paths:
      - '.github/workflows/s06-paired-seed-del-qc.yml'
      - 'research/wind-tower/experiments/T077/recovery/s06_qc_half_window_rms.py'
      - 'research/wind-tower/experiments/T077/recovery/S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv'
      - 'research/wind-tower/experiments/T077/recovery/S06_4CASE_6COMP_HALF_WINDOW_RMS_QC_20261027.csv'
      - 'research/wind-tower/experiments/T077/recovery/S06_U19_ETM_S04_S06_PAIRED_DEL_SENSITIVITY_20261028.csv'
      - 'research/wind-tower/experiments/T077/recovery/s10_load_del_control_stability.py'
      - 'research/wind-tower/experiments/T077/recovery/S10_ETM_LOAD_DEL_CONTROL_186_20261028.csv'
      - 'research/wind-tower/experiments/T077/recovery/S10_ETM_LOAD_DEL_CONTROL_SUMMARY_6_20261028.csv'
      - 'research/wind-tower/experiments/T062/s06_ntm_18case_input_identity.js'
      - 'research/wind-tower/experiments/T062/S06_18NTM_INPUT_SOURCE_IDENTITY_20261031.csv'
      - 'research/wind-tower/experiments/T062/s07_sixdof_wrench_source_contract.mjs'
      - 'research/wind-tower/experiments/T062/S07_18NTM_10STATION_NATIVE_MEAN_WRENCH_SI_20261031.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-level-paired-seed-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce original 18 NTM input/OUTB SHA identity without any solver or ZIP download
        shell: bash
        run: |
          set -euo pipefail
          node research/wind-tower/experiments/T062/s06_ntm_18case_input_identity.js \
            --static research/wind-tower/archive/local-assets-20261004/file-manifest.json \
            --supplement research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json \
            --receipt research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_LOAD_DEL_RECEIPT_20261031.json \
            --check research/wind-tower/experiments/T062/S06_18NTM_INPUT_SOURCE_IDENTITY_20261031.csv \
            --self-test
      - name: S07 native-frame real 18x10 mean wrenches, synthetic 6DOF transform invariance
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          node "$root/s07_sixdof_wrench_source_contract.mjs" --self-test
          node "$root/s07_sixdof_wrench_source_contract.mjs" --frame-gate --mean-csv "$root/S07_18NTM_10STATION_NATIVE_MEAN_WRENCH_SI_20261031.csv"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          node "$root/s07_sixdof_wrench_source_contract.mjs" \
            --source "$root/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv" \
            --out "$tmp/s07.csv"
          cmp "$tmp/s07.csv" "$root/S07_18NTM_10STATION_NATIVE_MEAN_WRENCH_SI_20261031.csv"
          cp "$root/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv" "$tmp/tampered.csv"
          sed -i '2s/U09p343881/INVALID_CASE/' "$tmp/tampered.csv"
          if node "$root/s07_sixdof_wrench_source_contract.mjs" \
            --source "$tmp/tampered.csv" --out "$tmp/should_not_exist.csv"; then
            echo "FAIL: altered source accepted"; exit 1
          fi
          sha256sum "$root/s07_sixdof_wrench_source_contract.mjs" "$tmp/s07.csv"
          echo 'S07_NUMERIC_ONLY_PASS; OpenFAST native t frame not yet mapped to Abaqus, no time-series or physical PASS'
      - name: Reproduce all 12 paired DEL rows from source SHA; reject altered input
        shell: bash
        run: |
          set -euo pipefail
          cd research/wind-tower/experiments/T077/recovery
          python3 s06_qc_half_window_rms.py \
            --source S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv \
            --qc S06_4CASE_6COMP_HALF_WINDOW_RMS_QC_20261027.csv \
            --paired-qc S06_U19_ETM_S04_S06_PAIRED_DEL_SENSITIVITY_20261028.csv
          python3 - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('s06_qc', 's06_qc_half_window_rms.py')
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          source=Path('S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv')
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp)/'tampered.csv'
              raw=bytearray(source.read_bytes())
              pos=raw.find(b'U19p202140_ETM_S06')
              assert pos>=0
              raw[pos]=ord('X')
              p.write_bytes(raw)
              try: mod.paired_seed_summary(p)
              except ValueError as e:
                  assert 'SHA mismatch' in str(e), str(e)
              else: raise AssertionError('tampered source accepted')
          print('PASS: source tamper rejected; 12 rows are exact and source-SHA bound')
          PY
          sha256sum S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv \
            S06_U19_ETM_S04_S06_PAIRED_DEL_SENSITIVITY_20261028.csv
          python3 s10_load_del_control_stability.py \
            --source S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv \
            --detail S10_ETM_LOAD_DEL_CONTROL_186_20261028.csv \
            --summary S10_ETM_LOAD_DEL_CONTROL_SUMMARY_6_20261028.csv
          sha256sum S10_ETM_LOAD_DEL_CONTROL_186_20261028.csv S10_ETM_LOAD_DEL_CONTROL_SUMMARY_6_20261028.csv
          echo 'SOURCE-LEVEL ONLY; NOT DLC1.2/SEED CONVERGENCE/MATERIAL FATIGUE/ABAQUS PASS'
