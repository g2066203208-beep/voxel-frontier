name: S07 OpenFAST v3.5.3 exact-t-axis diagnostic source and Fortran smoke
on:
  push:
    paths:
      - '.github/workflows/s07-elastodyn-taxis-ownership-probe-qc.yml'
      - 'research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py'
      - 'research/wind-tower/experiments/T062/s07_native_2s_bundle_gate.py'
      - 'research/wind-tower/experiments/T062/s07_recovered_2s_input_gate.py'
      - 'research/wind-tower/experiments/T062/S06_ETM_2S_CHANNEL_COVERAGE_RECEIPT_20261101.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  official-source-and-synthetic-fortran:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sparse checkout existing diagnostic (never the frozen structure model)
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source-locked parser and gravity-inertia ledger selftests
        shell: bash
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py
          python --version
          gfortran --version | head -n 1
          python -m py_compile "$script"
          python "$script" --selftest | tee source_ledger_selftest.log
          python "$script" --fortran-smoke | tee fortran_smoke.log
          grep -q '"synthetic_ledger": "PASS_NONZERO_GRAVITY_INERTIA_HYDRO"' source_ledger_selftest.log
          grep -q '"fortran_syntax_and_runtime": "PASS"' fortran_smoke.log
          grep -q '"scope": "SYNTHETIC_STUB_NOT_OPENFAST_NATIVE"' fortran_smoke.log
          echo 'S07_SYNTHETIC_FORTRAN_AND_OWNERSHIP_TESTS_PASS; NOT_OPENFAST_NATIVE'
      - name: Verify official tagged ElastoDyn source and fail-closed patch
        shell: bash
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py
          curl --fail --location --silent --show-error --retry 2 --max-time 50 \
            https://raw.githubusercontent.com/OpenFAST/openfast/v3.5.3/modules/elastodyn/src/ElastoDyn.f90 \
            --output official_ElastoDyn_v353.f90
          printf '%s  %s\n' \
            'a8ea1a88dc22d5401ea450f376aa7f66e3242785f1e038a22933054aaaf4f7d3' \
            official_ElastoDyn_v353.f90 | sha256sum --check
          python "$script" --source official_ElastoDyn_v353.f90 --out patched_diagnostic_only.f90 \
            | tee source_patch_receipt.log
          grep -q 'S07_DIAGNOSTIC_ONLY' patched_diagnostic_only.f90
          test "$(grep -c 'S07_DIAGNOSTIC_ONLY' patched_diagnostic_only.f90)" -eq 1
          cp official_ElastoDyn_v353.f90 tampered_source.f90
          printf '\n! intentional SHA mismatch\n' >> tampered_source.f90
          if python "$script" --source tampered_source.f90 --out rejected_output.f90 > negative_stdout.log 2>&1; then
            echo 'TAMPERED_SOURCE_WAS_ACCEPTED' >&2
            exit 1
          fi
          test ! -e rejected_output.f90
          grep -q 'OFFICIAL_SOURCE_SHA256_MISMATCH' negative_stdout.log
          echo 'S07_OFFICIAL_SOURCE_PATCH_AND_TAMPER_REJECTION_PASS; NOT_COMPILED_OPENFAST'
          sha256sum official_ElastoDyn_v353.f90 patched_diagnostic_only.f90 "$script" \
            | tee source_sha256.log
      - name: Preserve small real logs, including failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s07-exact-t-axis-source-and-fortran-smoke-logs
          path: |
            source_ledger_selftest.log
            fortran_smoke.log
            source_patch_receipt.log
            source_sha256.log
            negative_stdout.log
          if-no-files-found: warn
          retention-days: 30

  original-native-2s-input-availability:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sparse checkout S07 original-artifact identity gate
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062/s07_native_2s_bundle_gate.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original real OpenFAST 2s Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/13080759167/zip" \
            --output native_2s_original.zip
          echo "7fcae2bf57be571cacc6d3d9b82f1a254257ce59fdb946a1cfb56d3639eb9f1b  native_2s_original.zip" | sha256sum --check
      - name: Audit original ZIP bytes, run positive and three negative tests
        shell: bash
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T062/s07_native_2s_bundle_gate.py
          python -m py_compile "$script"
          python "$script" --archive native_2s_original.zip --selftest --out native_input_gap_receipt.json | tee native_input_gap_stdout.log
          python - <<'PY'
          import json
          x=json.load(open('native_input_gap_receipt.json'))
          assert x['status']=='OUTPUT_ZIP_VERIFIED__NATIVE_RERUN_INPUT_BUNDLE_HOLD'
          assert x['missing_identity_count']==23 and x['native_samples_total']==164
          assert x['tests']['negative_rejections']==3
          assert x['runnable_bundle_in_this_zip'] is False
          assert x['native_exact_dcm_obtained'] is False
          print('S07_REAL_2S_OUTPUT_ARCHIVE_VERIFIED__RERUN_INPUT_HOLD_NOT_NATIVE_DCM')
          PY
          sha256sum "$script" native_input_gap_receipt.json | tee native_input_gap_sha256.log
      - name: Preserve real artifact gate and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s07-real-native-2s-input-availability-gate
          path: |
            native_input_gap_receipt.json
            native_input_gap_stdout.log
            native_input_gap_sha256.log
          if-no-files-found: warn
          retention-days: 30

  restored-2s-input-source-identity-no-solver:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - name: Sparse checkout existing T062 preparer, three original ZIPs and LFS source pointers
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062/s06_etm_2s_native_overlap.py
            research/wind-tower/experiments/T062/s06_ntm_native_0p1s_probe.py
            research/wind-tower/experiments/T062/s06_native_4batch_common_channel_qc.py
            research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py
            research/wind-tower/experiments/T062/s07_recovered_2s_input_gate.py
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
            research/wind-tower/experiments/T062/S06_ETM_NATIVE_2S_OVERLAP_QC_20261101.json
            research/wind-tower/experiments/T062/S06_ETM_2S_CHANNEL_COVERAGE_RECEIPT_20261101.json
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-002.zip
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact historical LFS BTS and exe and run fail-closed selftests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='research/wind-tower'
          $bts="$root/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts"
          $exe="$root/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe"
          git lfs install --local
          git lfs pull --include="$exe,$bts" --exclude=""
          if ($LASTEXITCODE -ne 0) { throw 'LFS_SOURCE_RECOVERY_FAILED' }
          if ((Get-Item $exe).Length -ne 61086208) { throw 'EXE_SIZE_MISMATCH' }
          if ((Get-Item $bts).Length -lt 1024 -or (Get-Item $bts).Length -gt 524288000) { throw 'BTS_LFS_POINTER_OR_RESOURCE_CAP' }
          python "$root/experiments/T062/s07_recovered_2s_input_gate.py" --selftest
          if ($LASTEXITCODE -ne 0) { throw 'INPUT_IDENTITY_SELFTEST_FAILED' }
          python "$root/experiments/T062/s06_etm_2s_native_overlap.py" --selftest
          if ($LASTEXITCODE -ne 0) { throw 'PREPARER_SELFTEST_FAILED' }
          Write-Host 'S07_ORIGINAL_LFS_MATERIALIZED_AND_SELFTESTS_PASS__NO_SOLVER'
      - name: Reconstruct all four original 2s ETM input directories, no solver
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='research/wind-tower'
          $script="$root/experiments/T062/s06_etm_2s_native_overlap.py"
          foreach ($b in 1..4) {
            $prepareArgs=@('--prepare','--overlap','--batch',"$b",
              '--archive1',"$root/archive/local-assets-20261004/openfast-36-r2/part-001.zip",
              '--archive2',"$root/archive/local-assets-20261004/openfast-36-r2/part-002.zip",
              '--supp',"$root/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip",
              '--dll',"$root/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll",
              '--exe',"$root/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe",
              '--contract',"$root/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json",
              '--bts',"$root/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts",
              '--outdir',"work/batch$b")
            & python $script @prepareArgs
            if ($LASTEXITCODE -ne 0) { throw "SOURCE_PREP_BATCH_$b FAILED" }
          }
          Write-Host 'S07_FOUR_INPUT_BATCHES_RECONSTRUCTED__ZERO_OPENFAST_RUNS'
      - name: Validate all 23 exact SHA identities and four historical derived input maps
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='research/wind-tower'
          $gate="$root/experiments/T062/s07_recovered_2s_input_gate.py"
          $gateArgs=@('--root','work',
            '--source-receipt',"$root/experiments/T062/S06_ETM_2S_CHANNEL_COVERAGE_RECEIPT_20261101.json",
            '--historical-qc',"$root/experiments/T062/S06_ETM_NATIVE_2S_OVERLAP_QC_20261101.json",
            '--archive1',"$root/archive/local-assets-20261004/openfast-36-r2/part-001.zip",
            '--archive2',"$root/archive/local-assets-20261004/openfast-36-r2/part-002.zip",
            '--supp',"$root/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip",
            '--exe',"$root/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe",
            '--bts',"$root/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts",
            '--out','work/s07_recovered_2s_input_gate_receipt.json')
          & python $gate @gateArgs 2>&1 | Tee-Object -FilePath 's07_reconstruction_gate.log'
          if ($LASTEXITCODE -ne 0) { throw 'S07_RECONSTRUCTED_SOURCE_GATE_HOLD' }
          python -c "import json; r=json.load(open('work/s07_recovered_2s_input_gate_receipt.json')); assert r['identity_count']==23 and r['physical_pass'] is False and r['status'].startswith('ALL_23_'); print('S07_ALL_23_SOURCE_IDENTITIES_VERIFIED__NO_SOLVER_NO_DCM')"
          if ($LASTEXITCODE -ne 0) { throw 'S07_GATE_RECEIPT_ASSERTION_FAILED' }
          Get-FileHash 'work/s07_recovered_2s_input_gate_receipt.json' -Algorithm SHA256
      - name: Retain only small receipts and real failure logs, never BTS or binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s07-original-four-batch-2s-input-reconstruction-only
          path: |
            work/s07_recovered_2s_input_gate_receipt.json
            work/batch*/S06_0P1S_PREP_RECEIPT.json
            s07_reconstruction_gate.log
          if-no-files-found: warn
          retention-days: 30


  full-openfast-v353-patched-native-build-no-production:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - name: Sparse checkout S07 diagnostic and original 2s source dependencies only
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py
            research/wind-tower/experiments/T062/s06_etm_2s_native_overlap.py
            research/wind-tower/experiments/T062/s06_ntm_native_0p1s_probe.py
            research/wind-tower/experiments/T062/s06_native_4batch_common_channel_qc.py
            research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-002.zip
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official v3.5.3 documented minimal build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran g++ cmake make libblas-dev liblapack-dev
          { gfortran --version | head -1; cmake --version | head -1; git --version; } | tee s07_native_toolchain.log
      - name: Clone exact tagged official OpenFAST and insert source-locked t-axis probe
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.5.3 https://github.com/OpenFAST/openfast.git official-openfast
          cd official-openfast
          test "$(git rev-parse HEAD)" = '6a7a543790f3cad4a65b87242a619ac5b34b4c0f'
          git submodule update --init --recursive --depth 1
          cd ..
          source=official-openfast/modules/elastodyn/src/ElastoDyn.f90
          echo 'a8ea1a88dc22d5401ea450f376aa7f66e3242785f1e038a22933054aaaf4f7d3  '"$source" | sha256sum -c
          python research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py --source "$source" --out s07_ElastoDyn_patched.f90 | tee s07_native_patch_receipt.log
          echo '0412e3d8bab3729ec488853e053297c17aab3863e746e4a3178286049b366f00  s07_ElastoDyn_patched.f90' | sha256sum -c
          cp s07_ElastoDyn_patched.f90 "$source"
          sha256sum "$source" research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py | tee s07_native_input_hashes.log
          echo 'S07_FULL_SOURCE_PATCHED__NOT_YET_COMPILED'
      - name: Configure and build actual complete OpenFAST native binary (no turbine run)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S official-openfast -B official-openfast/build -DCMAKE_BUILD_TYPE=Release -DBUILD_FASTFARM=OFF -DBUILD_OPENFAST_CPP_API=OFF 2>&1 | tee s07_native_cmake.log
          cmake --build official-openfast/build --target openfast -j 2 2>&1 | tee s07_native_build.log
          exe=official-openfast/build/glue-codes/openfast/openfast
          test -x "$exe"
          "$exe" -v 2>&1 | tee s07_native_version.log
          sha256sum "$exe" | tee s07_native_binary_hash.log
          echo 'S07_FULL_PATCHED_OPENFAST_NATIVE_BINARY_BUILT__NO_TURBINE_RUN_NO_DCM'
      - name: Recover and SHA-verify one original 2s ETM batch (no solver yet)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower
          bts="$root/archive/local-large-assets-20261004/turbSim-36/inputs/U09p343881_ETM_S06.bts"
          winexe="$root/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe"
          git lfs install --local
          git lfs pull --include="$bts,$winexe" --exclude=""
          echo 'ad68a83a63f197c528c07502db8adff883e9c737863ef3c4cab99cfa76052147  '"$bts" | sha256sum -c
          echo '0cc8147fdda188365b8eacda8a831e74fafef59440d71185d66c3272af9e176a  '"$winexe" | sha256sum -c
          python "$root/experiments/T062/s06_etm_2s_native_overlap.py" --selftest
          python "$root/experiments/T062/s06_etm_2s_native_overlap.py" --prepare --overlap --batch 1 \
            --archive1 "$root/archive/local-assets-20261004/openfast-36-r2/part-001.zip" \
            --archive2 "$root/archive/local-assets-20261004/openfast-36-r2/part-002.zip" \
            --supp "$root/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip" \
            --dll "$root/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll" \
            --exe "$winexe" \
            --contract "$root/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json" \
            --bts "$bts" --outdir work/batch1 | tee s07_linux_prep.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('work/batch1/S06_0P1S_PREP_RECEIPT.json').read_text())
          assert r['case']=='U09p343881_ETM_S06' and r['TMax_s']==2.0
          assert r['gage_nodes'][-1]==220 and len(r['gage_nodes'])==9
          print('S07_ORIGINAL_2S_BATCH1_PREP_PASS__NOT_NATIVE_RUN')
          PY
      - name: Compile official ROSCO v2.9.0 Linux Bladed interface (diagnostic substitution)
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.9.0 https://github.com/NREL/ROSCO.git official-rosco
          git -C official-rosco rev-parse HEAD | tee s07_rosco_source_commit.log
          cmake -S official-rosco/rosco/controller -B official-rosco/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/rosco-install" 2>&1 | tee s07_rosco_cmake.log
          cmake --build official-rosco/build -j 2 2>&1 | tee s07_rosco_build.log
          cmake --install official-rosco/build 2>&1 | tee s07_rosco_install.log
          find official-rosco rosco-install -type f -name 'libdiscon.so*' -print | tee s07_rosco_library_locations.log
          so=$(find rosco-install official-rosco -type f -name libdiscon.so -print -quit)
          test -n "$so" && test -s "$so"
          cp "$so" work/batch1/Control/libdiscon.so
          sha256sum work/batch1/Control/libdiscon.so | tee s07_rosco_library_sha256.log
          ldd work/batch1/Control/libdiscon.so | tee s07_rosco_ldd.log
          ! grep -q 'not found' s07_rosco_ldd.log
          echo 'S07_LINUX_ROSCO_LIBRARY_COMPILED__HISTORICAL_WINDOWS_DLL_NOT_IDENTICAL'
      - name: Port only ServoDyn DLL path, run exactly one 2s native ETM diagnostic
        shell: bash
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,re,json
          from pathlib import Path
          p=Path('work/batch1/Control/DTU_10MW_RWT_ServoDyn.dat')
          src=p.read_bytes()
          text=src.decode('utf-8-sig')
          pat=r'(?m)^(\s*)(?:"[^"\r\n]+"|\S+)(\s+DLL_FileName\b[^\r\n]*)$'
          edited,n=re.subn(pat,lambda m:m.group(1)+'"Control/libdiscon.so"'+m.group(2),text)
          if n!=1: raise ValueError('DLL_FILENAME_CARDINALITY_HOLD_'+str(n))
          p.write_text(edited)
          r={'source_servo_sha256':hashlib.sha256(src).hexdigest(),
             'derived_linux_servo_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
             'source_controller_sha256':hashlib.sha256(Path('work/batch1/Control/libdiscon.dll').read_bytes()).hexdigest(),
             'linux_controller_sha256':hashlib.sha256(Path('work/batch1/Control/libdiscon.so').read_bytes()).hexdigest(),
             'change':'DLL_FileName only; historical Windows controller replaced by ROSCO v2.9.0 Linux diagnostic build',
             'source_equivalence':False,'physical_pass':False}
          Path('s07_linux_derived_identity.json').write_text(json.dumps(r,indent=2)+'\n')
          print('S07_LINUX_DLL_PATH_ONLY_CHANGE',json.dumps(r))
          PY
          set +e
          (cd work/batch1 && OPENFAST_S07_DCM_PROBE="$PWD/s07_native_dcm_raw.log" \
            timeout 180 ../../official-openfast/build/glue-codes/openfast/openfast DTU_10MW_RWT.fst) \
            > s07_linux_native_stdout.log 2>&1
          rc=$?
          set -e
          echo "$rc" | tee s07_linux_native_exit_code.log
          tail -n 65 s07_linux_native_stdout.log | tee s07_linux_native_stdout_tail.log
          if [ -f work/batch1/s07_native_dcm_raw.log ]; then
            sha256sum work/batch1/s07_native_dcm_raw.log | tee s07_linux_dcm_raw_sha256.log
            wc -l -c work/batch1/s07_native_dcm_raw.log | tee s07_linux_dcm_raw_size.log
            python research/wind-tower/experiments/T062/s07_elastodyn_taxis_ownership_probe.py \
              --audit work/batch1/s07_native_dcm_raw.log > s07_linux_dcm_audit.json
            python - <<'PY'
          import json
          r=json.load(open('s07_linux_dcm_audit.json'))
          assert r['rows'] and all(x['element_rows']>0 for x in r['rows'])
          print('S07_ACTUAL_NATIVE_DCM_AND_OWNERSHIP_DIAGNOSTIC_QC',len(r['rows']))
          PY
          else
            echo 'S07_NO_NATIVE_DCM_RAW__HOLD' | tee s07_linux_dcm_missing.log
          fi
          test "$rc" -eq 0
          grep -q 'OpenFAST terminated normally.' s07_linux_native_stdout.log
          test -s s07_linux_dcm_audit.json
          echo 'S07_SINGLE_2S_NATIVE_DIAGNOSTIC_COMPLETED__NOT_HISTORICAL_EQUIVALENCE_OR_PHYSICAL_PASS'
