name: S07 18 original NTM OUTB operating-state source QC (NO production)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - '.github/workflows/s07-ntm18-operating-state-qc.yml'
      - 'research/wind-tower/experiments/T062/s07_ntm18_operating_state_gate.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ntm-operating-state-source:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062
            research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
      - name: Parser selftest and fail-closed four negative tests
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          python3 -m py_compile "$root/s07_ntm18_operating_state_gate.py"
          python3 "$root/s07_ntm18_operating_state_gate.py" --self-test
      - name: Fetch only the 18 archived original NTM OUTB ZIPs (no solver)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          manifest=research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
          mkdir -p /tmp/ntm-operating-zips
          count=0
          while IFS= read -r p; do
            echo "SOURCE_ARCHIVE $p"
            curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --output "/tmp/ntm-operating-zips/$(basename "$p")" \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$p"
            count=$((count+1))
          done < <(python3 "$root/s06_ntm_18case_original_outb_gate.py" \
                    --manifest "$manifest" --list-archives)
          test "$count" -eq 18
      - name: Original 18 NTM synchronized operating-state QC and SHA receipt
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          python3 "$root/s07_ntm18_operating_state_gate.py" \
            --manifest research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json \
            --config "$root/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_INPUTS_20261031.csv" \
            --identity "$root/S06_18NTM_INPUT_SOURCE_IDENTITY_20261031.csv" \
            --zip-dir /tmp/ntm-operating-zips \
            --out "$root/S07_18NTM_ORIGINAL_OPERATING_STATE_QC_20261101.csv" \
            --receipt "$root/S07_18NTM_ORIGINAL_OPERATING_STATE_RECEIPT_20261101.json"
          python3 - <<'PY'
          import csv,json,hashlib,pathlib
          p=pathlib.Path('research/wind-tower/experiments/T062')
          a=p/'S07_18NTM_ORIGINAL_OPERATING_STATE_QC_20261101.csv'
          b=p/'S07_18NTM_ORIGINAL_OPERATING_STATE_RECEIPT_20261101.json'
          rows=list(csv.DictReader(a.open()))
          r=json.loads(b.read_text())
          assert len(rows)==18 and len({x['case'] for x in rows})==18
          assert r['original_outb_verified']==18 and not r['physical_pass']
          assert r['summary']['formal_dlc12_approved']==0
          assert hashlib.sha256(a.read_bytes()).hexdigest()==r['output_csv_sha256']
          assert all(int(x['n_samples'])==12001 and float(x['last_time_s'])==700 for x in rows)
          print('S07_18_ORIGINAL_NTM_OPERATING_STATE_SOURCE_QC_PASS_NOT_DLC12')
          PY
          sha256sum "$root/s07_ntm18_operating_state_gate.py" \
            "$root/S07_18NTM_ORIGINAL_OPERATING_STATE_QC_20261101.csv" \
            "$root/S07_18NTM_ORIGINAL_OPERATING_STATE_RECEIPT_20261101.json"
      - name: Preserve original source QC outputs and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s07-18ntm-original-operating-state-qc
          path: |
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_OPERATING_STATE_QC_20261101.csv
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_OPERATING_STATE_RECEIPT_20261101.json
          if-no-files-found: warn
          retention-days: 21
      - name: Persist source-derived outputs on Draft PR branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/t080-seismic-integration-gates-20261022
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_OPERATING_STATE_QC_20261101.csv \
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_OPERATING_STATE_RECEIPT_20261101.json
          if git diff --cached --quiet; then
            echo 'S07_SOURCE_OUTPUTS_UNCHANGED'
            exit 0
          fi
          git commit -m 'data(S07): archive 18 original NTM operating-state source QC'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo 'S07_SOURCE_ONLY_PERSISTED_NOT_DLC12_NOT_ABAQUS'
