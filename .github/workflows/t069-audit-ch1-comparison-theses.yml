name: t069-audit-ch1-comparison-theses

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t069-audit-ch1-comparison-theses.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/references/user-provided/风电机组钢-混凝土混合塔筒动力性能及损伤识别研究_李守振.pdf
            research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf
          sparse-checkout-cone-mode: false

      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Extract TOC, chapter map and conclusions
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/t069; mkdir -p "$OUT"
          A='research/wind-tower/references/user-provided/风电机组钢-混凝土混合塔筒动力性能及损伤识别研究_李守振.pdf'
          B='research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf'
          pdftotext -layout "$A" "$OUT/LiShouzhen.txt"
          pdftotext -layout "$B" "$OUT/LiZeyu.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          out=Path('/tmp/t069')
          specs=[('REF006_LiShouzhen',out/'LiShouzhen.txt'),('REF007_LiZeyu',out/'LiZeyu.txt')]
          result={}
          for sid,p in specs:
              raw=p.read_text(errors='ignore')
              pages=raw.split('\f')
              toc=[]; conc=[]
              for pi,page in enumerate(pages,1):
                  lines=[re.sub(r'\s+',' ',x).strip() for x in page.splitlines() if x.strip()]
                  text=' '.join(lines)
                  # chapter/section headings and table-of-contents-like lines
                  ch=[x for x in lines if re.search(r'^(第\s*[一二三四五六七八九十0-9]+\s*章|[1-9]\.[0-9]+)',x)]
                  if ch: toc.append({'pdf_page':pi,'lines':ch[:60]})
                  if any(k in text for k in ['结论与展望','主要结论','研究结论','结 论','结论']):
                      # capture page if conclusion density is meaningful
                      hits=sum(text.count(k) for k in ['结论与展望','主要结论','研究结论','结论'])
                      if hits:
                          conc.append({'pdf_page':pi,'text':'\n'.join(lines[:120])})
              result[sid]={'pages':len(pages),'chapter_pages':toc[:80],'conclusion_pages':conc[-20:]}
          (out/'THESIS_ARCHITECTURE_AUDIT.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          p=Path('/tmp/t069/THESIS_ARCHITECTURE_AUDIT.json')
          H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'t069'}
          def api(m,path,x=None):
            data=None if x is None else json.dumps(x).encode()
            q=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=data,headers=H,method=m)
            with urllib.request.urlopen(q,timeout=300) as r:return json.loads(r.read().decode())
          parent=api('GET','/git/ref/heads/'+branch)['object']['sha']; base=api('GET','/git/commits/'+parent)['tree']['sha']
          raw=p.read_bytes(); b=api('POST','/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
          t=api('POST','/git/trees',{'base_tree':base,'tree':[{'path':'research/wind-tower/experiments/T069/THESIS_ARCHITECTURE_AUDIT.json','mode':'100644','type':'blob','sha':b['sha']}]})
          c=api('POST','/git/commits',{'message':'research: audit comparison theses for chapter architecture','tree':t['sha'],'parents':[parent]})
          api('PATCH','/git/refs/heads/'+branch,{'sha':c['sha'],'force':False}); print(c['sha'])
          PY
