name: Materialize Terrain R17 Walkable Relief V2

on:
  push:
    branches: [test/terrain-r17-authority-cleanup]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/materialize_terrain_r17_walkable_relief_v2.py
      - run: |
          grep -q 'R17 walkable micro-relief floor v2' native/src/world/PlanetSurface.cpp
          grep -q 'R17 SINGLE MACRO AUTHORITY' native/src/world/PlanetSurface.cpp
          ! grep -q 'R13 connected orogen structure' native/src/world/PlanetSurface.cpp
          ! grep -q 'const double plateauShelf = 2700.0' native/src/world/PlanetSurface.cpp
          git diff --check
      - name: Commit source
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/world/PlanetSurface.cpp
          git commit -m 'terrain: tune R17 walkable relief without macro override [skip ci]'
          git push origin HEAD:test/terrain-r17-authority-cleanup
