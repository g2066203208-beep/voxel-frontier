name: S07 original 18 NTM TurbSim and controller source inputs (NO production)
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - '.github/workflows/s07-ntm18-original-controller-input-qc.yml'
      - 'research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py'
      - 'research/wind-tower/experiments/T062/s10_lowwind_75_source_pilot.py'
      - 'research/wind-tower/experiments/T062/s07_ntm18_controller_native_log_gate.py'
      - 'research/wind-tower/experiments/T062/s07_ntm18_discon_operating_contract.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-ntm-config-source:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004/file-manifest.json
            research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-002.zip
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-003.zip
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-004.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-005.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-006.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-010.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-011.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-012.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-016.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-017.zip
            research/wind-tower/archive/local-assets-20261004/turbSim-36/part-018.zip
            research/wind-tower/experiments/T062/S06_18NTM_INPUT_SOURCE_IDENTITY_20261031.csv
            research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py
            research/wind-tower/experiments/T062/s10_lowwind_75_source_pilot.py
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_INPUTS_20261031.csv
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_RECEIPT_20261031.json
            research/wind-tower/experiments/T062/s07_ntm18_controller_native_log_gate.py
            research/wind-tower/experiments/T062/s07_ntm18_discon_operating_contract.py
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_OPERATING_STATE_QC_20261101.csv
            research/wind-tower/experiments/T062/S07_18NTM_NATIVE_CONTROLLER_LOG_QC_20261101.csv
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
      - name: Python parser selftest and fail-closed original member SHA audit
        shell: bash
        run: |
          set -euo pipefail
          script=research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py
          python3 -m py_compile "$script"
          python3 "$script" --self-test
          python3 "$script" --repo-root . \
            --out research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_INPUTS_20261031.csv \
            --receipt research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_RECEIPT_20261031.json
          python3 - <<'PY'
          import csv,json,hashlib,pathlib
          p=pathlib.Path('research/wind-tower/experiments/T062')
          a=p/'S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_INPUTS_20261031.csv'
          b=p/'S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_RECEIPT_20261031.json'
          rows=list(csv.DictReader(a.open()))
          r=json.loads(b.read_text())
          assert len(rows)==18 and r['original_members_verified']==127
          assert r['formal_dlc12_reuse_approved']==0 and not r['physical_pass']
          assert hashlib.sha256(a.read_bytes()).hexdigest()==r['output_csv_sha256']
          assert all(x['bts_archived_sha256']=='' for x in rows)
          print('S07_ORIGINAL_18_CONFIG_BYTES_SHA_VERIFIED_NO_DLC12_APPROVAL')
          PY
          sha256sum "$script" research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_*
      - name: Prepare source-locked 7.5m/s S01 TurbSim candidate (NO SOLVER)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          python3 -m py_compile "$root/s10_lowwind_75_source_pilot.py"
          python3 "$root/s10_lowwind_75_source_pilot.py" --selftest
          python3 "$root/s10_lowwind_75_source_pilot.py" --repo-root . --out-dir "$root"
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("research/wind-tower/experiments/T062")
          j=json.loads((p/"S10_U07p5_NTM_S01_SOURCE_PILOT_RECEIPT_20261105.json").read_text())
          b=(p/"S10_U07p5_NTM_S01_TURBSIM_PILOT_20261105.inp").read_bytes()
          assert hashlib.sha256(b).hexdigest()==j["output_turbsim_inp_sha256"]
          assert j["candidate_case_NOT_RUN"]=="U07p5_NTM_S01"
          assert j["status"]=="SOURCE_ONLY_CANDIDATE_NOT_RUN"
          assert not j["physical_pass"] and j["stage_passed"]==0
          assert j["changed_fields"]=={"URef_mps":{"from":9.343881,"to":7.5}}
          g=j["dll_identity_source_gate"]
          assert g["original_case_count"]==36 and g["original_NTM"]==18 and g["original_ETM"]==18
          assert g["original_case_sha256_verified"]==0 and not g["historical_runtime_equivalence_verified"]
          assert g["reference_byte_sha_verified"] and g["reference_sha256"]=="7aebb0d2166c0cc095d11c2b7bc13da136547c557b0f331dcdce84fe181802aa"
          print("S10_DLL_36_HISTORICAL_EXCLUDED_REFERENCE_BYTES_SHA_VERIFIED_NOT_RUNTIME_EQUIVALENT")
          print("S10_75_REAL_PARENT_SHA_AND_REVERSIBLE_INPUT_PASS_NOT_RUN")
          PY
          sha256sum "$root/s10_lowwind_75_source_pilot.py" "$root/S10_U07p5_NTM_S01_"*
      - name: Read original 18 NTM ServoDyn sums and OpenFAST stdout with exact SHA (no solver)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          python3 -m py_compile "$root/s07_ntm18_controller_native_log_gate.py"
          python3 "$root/s07_ntm18_controller_native_log_gate.py" --self-test
          python3 "$root/s07_ntm18_controller_native_log_gate.py" --repo-root . \
            --out "$root/S07_18NTM_NATIVE_CONTROLLER_LOG_QC_20261101.csv" \
            --receipt "$root/S07_18NTM_NATIVE_CONTROLLER_LOG_RECEIPT_20261101.json"
          python3 - <<'PY'
          import csv,json,hashlib,pathlib
          p=pathlib.Path('research/wind-tower/experiments/T062')
          a=p/'S07_18NTM_NATIVE_CONTROLLER_LOG_QC_20261101.csv'
          b=p/'S07_18NTM_NATIVE_CONTROLLER_LOG_RECEIPT_20261101.json'
          rows=list(csv.DictReader(a.open()))
          r=json.loads(b.read_text())
          assert len(rows)==18 and r['source_logs_verified']==36
          assert r['original_per_case_dll_manifest']['original_sha256_available']==0
          assert r['summary']['formal_dlc12_reuse_approved']==0 and not r['physical_pass']
          assert hashlib.sha256(a.read_bytes()).hexdigest()==r['output_csv_sha256']
          print('S07_ORIGINAL_36_NATIVE_LOG_BYTES_SHA_VERIFIED_RUNTIME_DLL_HOLD')
          PY
          sha256sum "$root/S07_18NTM_NATIVE_CONTROLLER_LOG_QC_20261101.csv" \
            "$root/S07_18NTM_NATIVE_CONTROLLER_LOG_RECEIPT_20261101.json"
      - name: Verify original ROSCO DISCON numeric settings against 18 NTM operating summaries (NO solver)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T062
          python3 -m py_compile "$root/s07_ntm18_discon_operating_contract.py"
          python3 "$root/s07_ntm18_discon_operating_contract.py" --self-test
          python3 "$root/s07_ntm18_discon_operating_contract.py" --repo-root . \
            --out "$root/S07_18NTM_DISCON_VS_OPERATING_QC_20261101.csv" \
            --receipt "$root/S07_18NTM_DISCON_VS_OPERATING_RECEIPT_20261101.json" \
            --extended-out "$root/S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_20261101.csv" \
            --extended-receipt "$root/S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_RECEIPT_20261101.json"
          python3 - <<'PY'
          import csv,json,hashlib,pathlib
          p=pathlib.Path('research/wind-tower/experiments/T062')
          a=p/'S07_18NTM_DISCON_VS_OPERATING_QC_20261101.csv'
          b=p/'S07_18NTM_DISCON_VS_OPERATING_RECEIPT_20261101.json'
          rows=list(csv.DictReader(a.open()))
          r=json.loads(b.read_text())
          assert len(rows)==18 and len({x['case'] for x in rows})==18
          assert r['recognized_parameter_count']>=6 and r['formal_dlc12_approved']==0
          assert not r['physical_pass'] and r['native_earthquake_results']==0
          assert hashlib.sha256(a.read_bytes()).hexdigest()==r['output_csv_sha256']
          assert all(x['runtime_dll_sha_verified']=='NO' for x in rows)
          ext=p/'S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_20261101.csv'
          ext_receipt=p/'S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_RECEIPT_20261101.json'
          ext_rows=list(csv.DictReader(ext.open()))
          ext_r=json.loads(ext_receipt.read_text())
          assert len(ext_rows)==9 and len({x['parameter'] for x in ext_rows})==9
          assert ext_r['input_sha256']['original_discon']=='8f5d7546420ee34838e66b63e4b26d64460be5d5492f99c60b6d1ef977ffc61a'
          assert ext_r['formal_dlc12_approved']==0 and not ext_r['physical_pass']
          assert ext_r['native_earthquake_results']==0 and ext_r['stages_passed']==0
          assert hashlib.sha256(ext.read_bytes()).hexdigest()==ext_r['output_csv_sha256']
          assert all(x['status'] in ('ORIGINAL_VALUE','NOT_PRESENT_IN_ORIGINAL','ORIGINAL_VALUE_SEMANTIC_HOLD') for x in ext_rows)
          assert ext_r['semantic_validation_pass'] == (len(ext_r['semantic_holds']) == 0)
          assert all(h['parameter'] in ('VS_GenEff','WE_Mode','SS_Mode') for h in ext_r['semantic_holds'])
          assert all(any(row['parameter']==h['parameter'] and row['status']=='ORIGINAL_VALUE_SEMANTIC_HOLD' for row in ext_rows) for h in ext_r['semantic_holds'])
          assert all(x['raw_value']=='' for x in ext_rows if x['status']=='NOT_PRESENT_IN_ORIGINAL')
          print('S07_EXTENDED_ORIGINAL_DISCON_9KEYS_SHA_VERIFIED_NO_DLC12')
          print('S07_18NTM_ORIGINAL_DISCON_PARAMETER_SOURCE_QC_PASS_NOT_DLC12')
          PY
          sha256sum "$root/s07_ntm18_discon_operating_contract.py" \
            "$root/S07_18NTM_DISCON_VS_OPERATING_QC_20261101.csv" \
            "$root/S07_18NTM_DISCON_VS_OPERATING_RECEIPT_20261101.json"
      - name: Archive source QC output and failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s07-original-18ntm-turbsim-controller-source-qc
          path: |
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_INPUTS_20261031.csv
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_RECEIPT_20261031.json
            research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_TURBSIM_PILOT_20261105.inp
            research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_SOURCE_PILOT_RECEIPT_20261105.json
            research/wind-tower/experiments/T062/S07_18NTM_NATIVE_CONTROLLER_LOG_QC_20261101.csv
            research/wind-tower/experiments/T062/S07_18NTM_NATIVE_CONTROLLER_LOG_RECEIPT_20261101.json
            research/wind-tower/experiments/T062/S07_18NTM_DISCON_VS_OPERATING_QC_20261101.csv
            research/wind-tower/experiments/T062/S07_18NTM_DISCON_VS_OPERATING_RECEIPT_20261101.json
            research/wind-tower/experiments/T062/S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_20261101.csv
            research/wind-tower/experiments/T062/S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_RECEIPT_20261101.json
          if-no-files-found: warn
          retention-days: 21
      - name: Persist source-verified small CSV and receipt on Draft PR only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = research/t080-seismic-integration-gates-20261022
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_TURBSIM_PILOT_20261105.inp \
            research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_SOURCE_PILOT_RECEIPT_20261105.json \
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_INPUTS_20261031.csv \
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_RECEIPT_20261031.json \
            research/wind-tower/experiments/T062/S07_18NTM_NATIVE_CONTROLLER_LOG_QC_20261101.csv \
            research/wind-tower/experiments/T062/S07_18NTM_NATIVE_CONTROLLER_LOG_RECEIPT_20261101.json \
            research/wind-tower/experiments/T062/S07_18NTM_DISCON_VS_OPERATING_QC_20261101.csv \
            research/wind-tower/experiments/T062/S07_18NTM_DISCON_VS_OPERATING_RECEIPT_20261101.json \
            research/wind-tower/experiments/T062/S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_20261101.csv \
            research/wind-tower/experiments/T062/S07_ROSCO_V260_ORIGINAL_EXTENDED_KEYS_RECEIPT_20261101.json
          if git diff --cached --quiet; then echo 'SOURCE_QC_UNCHANGED'; exit 0; fi
          git commit -m 'data(S07): preserve source-verified 18 NTM TurbSim and controller input QC'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo 'S07_18NTM_SOURCE_QC_PERSISTED_NOT_DLC12_NOT_ABAQUS'
