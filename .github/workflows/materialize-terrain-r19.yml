name: Materialize Terrain R19 Process Cascade

on:
  push:
    branches: [test/terrain-r19-process-cascade]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R19 source patch
        run: python3 .github/scripts/materialize_terrain_r19.py
      - name: Verify R19 markers
        run: |
          grep -q 'R19 DEMIURGE PROCESS CASCADE' native/src/world/PlanetSurface.cpp
          grep -q 'double hardness{};' native/include/vf/world/PlanetGeomorph.hpp
          grep -q 'apparent < glm::radians(7.0)' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized source
        run: |
          rm .github/scripts/materialize_terrain_r19.py .github/workflows/materialize-terrain-r19.yml
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'terrain: materialize R19 process-guided terrain cascade [skip ci]'
          git push origin HEAD:test/terrain-r19-process-cascade
