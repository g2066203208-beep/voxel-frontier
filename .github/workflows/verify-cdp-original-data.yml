name: Verify original CDP plot data
on:
  push:
    paths:
      - '.github/workflows/verify-cdp-original-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          dir=public/thesis-studio/inp-archive/REV22_REVIEW
          python "$dir/verify_cdp_original.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir/cdp-direct-source-verification.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Verify all 100 CDP plotted points directly against original archived REV22 bytes'
          git pull --rebase origin main
          git push origin HEAD:main
