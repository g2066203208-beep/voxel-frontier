name: T079 E04 RSN5835 official SCEDC source probe
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths: ['.github/workflows/seismic-e04-scedc-source-20261124.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve targeted official data and record exact HTTP results
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, concurrent.futures, hashlib, json, pathlib
          root=pathlib.Path('evidence')
          host='https://service.scedc.caltech.edu'
          fdsn={'net':'CE','sta':'00022','loc':'--','cha':'HN*','starttime':'2010-04-04T22:40:30','endtime':'2010-04-04T22:44:00'}
          meta=dict(fdsn); meta.update(level='response',format='xml')
          stp={'outputformat':'cosmos-v1','requesttype':'continuous','selection':';'.join('CE 00022 '+c+' -- 2010/04/04,22:40:30 2010/04/04,22:44:00' for c in ['HNE','HNN','HNZ'])+';','zerofilloff':'true','Submit':'Submit'}
          ces={'eventid':'ci14607652','stname':'*Winterhaven*','abandoned':'true','groupby':'station','rettype':'metadata','format':'json','nodata':'404'}
          urls={
            'SCEDC_CE_00022.mseed':host+'/fdsnws/dataselect/1/query?'+urllib.parse.urlencode(fdsn),
            'SCEDC_CE_00022_station.xml':host+'/fdsnws/station/1/query?'+urllib.parse.urlencode(meta),
            'SCEDC_CE_00022_cosmos_v1.tar.gz':host+'/webstp/query?'+urllib.parse.urlencode(stp),
            'CESMD_CE_00022_metadata.json':'https://www.strongmotioncenter.org/wserv/records/query?'+urllib.parse.urlencode(ces)
          }
          def acquire(item):
            name,url=item
            receipt={'file':name,'url':url}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'T079 academic research source verification'})
              with urllib.request.urlopen(req,timeout=45) as response:
                data=response.read(25_000_001)
                receipt.update(http=response.status,bytes=len(data),content_type=response.headers.get('Content-Type'),sha256=hashlib.sha256(data).hexdigest())
              if len(data)>25_000_000: raise ValueError('response exceeds bound')
              if not data: raise ValueError('empty response')
              if name.endswith('.tar.gz') and not data.startswith(bytes([31,139])): raise ValueError('not gzip archive')
              if name.endswith('.mseed') and (len(data)<256 or data.lstrip().startswith(b'<')): raise ValueError('not plausible miniSEED')
              if name.endswith('.xml') and b'FDSNStationXML' not in data: raise ValueError('not StationXML')
              if name.endswith('.json'): json.loads(data)
              (root/name).write_bytes(data)
              receipt['status']='BYTES_RECEIVED_PENDING_DECODE'
            except Exception as e:
              receipt.update(status='NOT_ACQUIRED',error=str(e))
              if isinstance(e,urllib.error.HTTPError): receipt['http']=e.code
            return receipt
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as ex: rows=list(ex.map(acquire,urls.items()))
          summary={'event':'ci14607652','station':'CE.00022','event_origin_utc':'2010-04-04T22:40:42','RSN':5835,'processing':'SCEDC raw/source data; not certified PEER AT2; no public waveform rehosting','receipts':rows}
          (root/'source_receipt.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Retain source evidence for inspection
        uses: actions/upload-artifact@v4
        with:
          name: T079-E04-SCEDC-source-probe
          path: evidence/
          retention-days: 30
