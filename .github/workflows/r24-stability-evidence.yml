name: R24 Runtime Stability Evidence

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_stability_round2.py'
      - '.github/scripts/r24_stability_capture.sh'
      - '.github/workflows/r24-stability-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-runtime-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout R24
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/r24-unified-planetary-physics

      - name: Stage R24 round2 source and tests
        run: |
          python3 .github/scripts/r24_stability_round2.py
          git diff --check
          grep -q 'VF_CAPTURE_HIGH_SPEED' native/src/app/Main.cpp
          grep -q 'VF_CAPTURE_SHADOW_CONTACT' native/src/app/Main.cpp
          grep -q 'setCreativeFlightSpeedMps' native/include/vf/player/PlanetCamera.hpp
          grep -q 'testCreativeFlightConfigurationUsesProductionLimits' native/tests/R24RuntimeStabilityTests.cpp
          git diff --stat

      - name: Install Vulkan X11 and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure native runtime and tests
        id: configure
        continue-on-error: true
        run: cmake -S native -B build/r24-stability -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build native runtime and tests
        id: build
        if: steps.configure.outcome == 'success'
        continue-on-error: true
        run: cmake --build build/r24-stability --parallel 2

      - name: Run full native correctness suite
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-stability --verbose --output-on-failure 2>&1 | tee r24-stability-ctest.log

      - name: Re-run R24 stability gates explicitly
        id: stability_test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-stability --verbose --output-on-failure \
            -R 'vf_r24_runtime_stability_tests|vf_celestial_physics_frame_tests|vf_planet_physics_tests' \
            2>&1 | tee r24-stability-focused-tests.log

      - name: Verify real Lavapipe Vulkan device
        id: vulkan
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real framebuffer stability evidence
        id: capture
        if: steps.build.outcome == 'success' && steps.vulkan.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          APP="$(find build/r24-stability -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_stability_capture.sh
          .github/scripts/r24_stability_capture.sh "$APP" r24-stability-evidence

      - name: Assemble permanent repository evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-stability-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          cp -a r24-stability-evidence/. "$EVIDENCE_DIR/" 2>/dev/null || true
          cp -f r24-stability-ctest.log "$EVIDENCE_DIR/" 2>/dev/null || true
          cp -f r24-stability-focused-tests.log "$EVIDENCE_DIR/" 2>/dev/null || true
          cp -f vulkan-summary.txt "$EVIDENCE_DIR/" 2>/dev/null || true
          git diff -- native > "$EVIDENCE_DIR/tested-source.patch" 2>/dev/null || true
          cat > "$EVIDENCE_DIR/ci-status.txt" <<EOF
          workflow_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          configure=${{ steps.configure.outcome }}
          build=${{ steps.build.outcome }}
          tests=${{ steps.tests.outcome }}
          stability_test=${{ steps.stability_test.outcome }}
          vulkan=${{ steps.vulkan.outcome }}
          capture=${{ steps.capture.outcome }}
          EOF

      - name: Commit tested source tests and framebuffer evidence
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          if git diff --cached --quiet; then
            echo 'No staged production/evidence changes.'
          else
            git commit -m "R24: round2 harden visual evidence and high-speed proof [run ${GITHUB_RUN_ID}]"
            git push origin HEAD:work/r24-unified-planetary-physics
          fi

      - name: Upload all evidence even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-stability-real-vulkan-${{ github.run_id }}
          path: |
            r24-stability-evidence/**
            r24-stability-ctest.log
            r24-stability-focused-tests.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce test and capture gate after preserving evidence
        if: always()
        shell: bash
        run: |
          test '${{ steps.configure.outcome }}' = 'success'
          test '${{ steps.build.outcome }}' = 'success'
          test '${{ steps.tests.outcome }}' = 'success'
          test '${{ steps.stability_test.outcome }}' = 'success'
          test '${{ steps.vulkan.outcome }}' = 'success'
          test '${{ steps.capture.outcome }}' = 'success'

  windows-runtime-tests:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout R24
        uses: actions/checkout@v6
        with:
          ref: work/r24-unified-planetary-physics

      - name: Stage identical round2 source
        shell: pwsh
        run: |
          python .github/scripts/r24_stability_round2.py
          git diff --check

      - name: Configure Windows x64
        run: cmake -S native -B build/r24-stability-win -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Windows x64
        run: cmake --build build/r24-stability-win --config Release --parallel 2

      - name: Run Windows native tests
        run: ctest --test-dir build/r24-stability-win -C Release --verbose --output-on-failure
