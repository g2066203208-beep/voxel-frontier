name: R24 Fast Water V2 Isolated GPU Timing

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_fast_water_v2_isolated_timing.py'
      - '.github/workflows/r24-fast-water-v2-isolated-timing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r24-fast-water-v2-isolated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 24

      - name: Materialize V2 plus isolated timing
        run: |
          set -euo pipefail
          python3 .github/scripts/r24_fast_water_v2_isolated_timing.py
          git diff --check
          grep -q 'R24_FAST_WATER_V2_BINNED' native/shaders/planet.slang
          grep -q 'R24_GPU_PASS_TIMING_ISOLATED_ALL_COMMANDS' native/src/render/VulkanRenderer.cpp
          test "$(grep -o 'VK_PIPELINE_STAGE_2_TOP_OF_PIPE_BIT' native/src/render/VulkanRenderer.cpp | wc -l)" -eq 0
          test "$(grep -o 'VK_PIPELINE_STAGE_2_BOTTOM_OF_PIPE_BIT' native/src/render/VulkanRenderer.cpp | wc -l)" -eq 0

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build curl unzip xvfb imagemagick mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
          curl -L --fail --retry 3 https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip -o /tmp/slang.zip
          mkdir -p "$HOME/slang" && unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Release build and complete regressions
        run: |
          set -euo pipefail
          mkdir -p evidence
          cmake -S native -B build/r24-v2-isolated -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
          cmake --build build/r24-v2-isolated --parallel 2
          ctest --test-dir build/r24-v2-isolated --verbose --output-on-failure 2>&1 | tee evidence/ctest.log
          grep -q '100% tests passed' evidence/ctest.log

      - name: Lock software Vulkan reference
        run: |
          set -euo pipefail
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee evidence/vulkan-summary.txt
          grep -qi llvmpipe evidence/vulkan-summary.txt
          printf '%s\n' 'PERF_CLASS=CI_SW_RELATIVE_ONLY' 'TIMING_MODE=ISOLATED_ALL_COMMANDS' 'ABSOLUTE_120FPS_CERTIFICATION=INVALID_ON_SOFTWARE_VULKAN' > evidence/classification.txt

      - name: Start 1080p display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > evidence/xvfb.log 2>&1 &
          echo $! > /tmp/xvfb.pid
          sleep 1
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
          echo 'SDL_VIDEODRIVER=x11' >> "$GITHUB_ENV"

      - name: Same-binary ABBA
        run: |
          set -euo pipefail
          APP="$(find build/r24-v2-isolated -type f -name voxel_frontier -perm -111 | head -n1)"
          run_case() {
            local name="$1" enabled="$2"
            env VF_PERF_PROFILE=mainstream_1080p VF_TERRAIN_TARGET=coast VF_CAPTURE_AERIAL=1 \
              VF_CAPTURE_WATER_VIEW=1 VF_CAPTURE_ALTITUDE_METERS=1200 VF_RUNTIME_DIAGNOSTICS=1 \
              VF_CELESTIAL_TIME_SCALE=1 VF_VELOCITY_AWARE_LOD=1 VF_PERCEPTUAL_RESIDENCY=1 \
              VF_FAST_WATER="$enabled" timeout 28s "$APP" > "evidence/${name}.log" 2>&1 &
            local pid=$!; sleep 4
            import -window root "evidence/${name}.png" || true
            set +e; wait "$pid"; local rc=$?; set -e
            test "$rc" -eq 0 -o "$rc" -eq 124
            test -s "evidence/${name}.png"
            grep -q '^R24 GPU steady_pass_ms' "evidence/${name}.log"
            grep -q '^R24 BENCHMARK profile=' "evidence/${name}.log"
          }
          run_case A_off 0
          run_case B_on 1
          run_case B2_on 1
          run_case A2_off 0

      - name: Parse isolated pass means
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, statistics
          root=Path('evidence')
          names=('A_off','B_on','B2_on','A2_off')
          def last(prefix,n):
              xs=[x for x in (root/f'{n}.log').read_text(errors='replace').splitlines() if x.startswith(prefix)]
              if not xs: raise SystemExit(f'missing {prefix} {n}')
              return xs[-1]
          def gpu(n):
              line=last('R24 GPU steady_pass_ms',n)
              vals={k:float(v) for k,v in re.findall(r'(shadow_mean|opaque_mean|sky_mean|transparent_mean|total_mean)=([0-9.]+)',line)}
              return line,vals
          def bench(n):
              line=last('R24 BENCHMARK profile=',n)
              vals={k:float(v) for k,v in re.findall(r'(avg_fps|one_percent_low_fps|p99_ms|render_mean_ms)=([0-9.]+)',line)}
              return line,vals
          G={n:gpu(n) for n in names}; B={n:bench(n) for n in names}
          off=('A_off','A2_off'); on=('B_on','B2_on')
          m=lambda group,d,key: statistics.mean(d[n][1][key] for n in group)
          lines=['R24 V2 ISOLATED GPU TIMING','PERF_CLASS=CI_SW_RELATIVE_ONLY','TIMING_MODE=ISOLATED_ALL_COMMANDS']
          for key in ('shadow_mean','opaque_mean','sky_mean','transparent_mean','total_mean'):
              a=m(off,G,key); b=m(on,G,key); lines.append(f'{key}: off={a:.4f} on={b:.4f} delta_pct={(b/a-1)*100:.3f}')
          for key in ('avg_fps','one_percent_low_fps','p99_ms','render_mean_ms'):
              a=m(off,B,key); b=m(on,B,key); lines.append(f'{key}: off={a:.4f} on={b:.4f} delta_pct={(b/a-1)*100:.3f}')
          lines += [f'{n}: {G[n][0]}' for n in names]
          out='\n'.join(lines)+'\n'; (root/'README.txt').write_text(out); print(out)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-fast-water-v2-isolated-${{ github.run_id }}
          path: evidence/**
          retention-days: 30

      - name: Stop display
        if: always()
        run: if test -f /tmp/xvfb.pid; then kill "$(cat /tmp/xvfb.pid)" 2>/dev/null || true; fi
