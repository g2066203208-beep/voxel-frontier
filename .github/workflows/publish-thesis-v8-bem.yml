name: Publish V8-R9 revised aerodynamic interface and thesis summary
on:
  push:
    branches: [main]
    paths:
      - 'scripts/thesis-edit/publish_v8_bem.py'
      - 'scripts/thesis-edit/ch3_bem_v8.json'
      - 'public/thesis-studio/downloads/bem-streamtube-rotor-v9.svg'
      - 'public/thesis-studio/downloads/bem-airfoil-velocity-force-v9.svg'
      - '.github/workflows/publish-thesis-v8-bem.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: thesis-v8-bem
  cancel-in-progress: true
jobs:
  merge-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            scripts/thesis-edit
            public/thesis-studio/downloads
            public/thesis-studio/editor-data
            public/thesis-studio/documents
            public/thesis-studio/he-thesis-comparison
            public/thesis-studio/manuscript-workbench.js
            public/thesis-studio/manuscript-workbench.html
            public/thesis-studio/chapter3-bem-v8.html
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Word tools and native math converter
        run: |
          python -m pip install --quiet python-docx pymupdf pillow cairosvg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-math fonts-opensymbol fonts-freefont-otf fonts-noto-cjk pandoc
      - name: Build V8 from exact V7 parent and render actual pages
        run: python scripts/thesis-edit/publish_v8_bem.py
      - name: Verify generated references and page images
        run: |
          node --check public/thesis-studio/manuscript-workbench.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/thesis-studio/he-thesis-comparison")
          m=json.loads((p/"v8r9-page-map.json").read_text())
          assert m["version"]=="V8-R9" and len(m["equation_pages"])==37
          assert 1<=len(m["pages"]["28"])<=3, "HE28_ORIGINAL_PAGE_NOT_PAIRED"
          assert all((p/x["image"]).stat().st_size>100000 for x in m["pages"]["28"])
          assert (p/"ch3-v8r6/he28-academic-revision.html").stat().st_size>2500
          assert 1<=len(m["pages"]["27"])<=3, "HE27_PHYSICAL_PAGE_RANGE_INVALID"
          assert (p/m["pages"]["27"][0]["image"]).stat().st_size>100000
          for k in range(20,28):assert m["pages"][str(k)]
          for ls in m["pages"].values():
              for item in ls:assert (p/item["image"]).stat().st_size>10000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V8R9-BEM-actual-Word-and-pages
          path: |
            _generated_thesis_v8/10MW-thesis-v8r9-he28-20261123.docx
            _generated_thesis_v8/10MW-thesis-v8r9-he28-20261123.pdf
            _generated_thesis_v8/v8-audit.json
            _generated_thesis_v8/bem-pages
            public/thesis-studio/he-thesis-comparison/v8r9-spreads
          retention-days: 30
      - name: Publish V8 candidate assets and existing online editor
        run: |
          git config user.name 'thesis-editor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/thesis-studio/downloads/10MW-thesis-v8r9-he28-20261123.* public/thesis-studio/editor-data/manuscript-v8-bem.json public/thesis-studio/he-thesis-comparison/v8r9-page-map.json public/thesis-studio/he-thesis-comparison/v8r9-spreads public/thesis-studio/he-thesis-comparison/index.html public/thesis-studio/he-thesis-comparison/ch3-v8r6/index.html public/thesis-studio/he-thesis-comparison/ch3-v8r6/he28-academic-revision.html public/thesis-studio/manuscript-workbench.js public/thesis-studio/manuscript-workbench.html
          git commit -m 'docs(thesis): publish V8-R9 claim-audited Word/PDF with historic Simpack route corrected'
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
      - name: Trigger existing Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
