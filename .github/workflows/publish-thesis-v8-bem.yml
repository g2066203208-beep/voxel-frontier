name: Publish V8 thesis BEM theory and real page comparison
on:
  push:
    branches: [main]
    paths:
      - 'scripts/thesis-edit/publish_v8_bem.py'
      - 'scripts/thesis-edit/ch3_bem_v8.json'
      - '.github/workflows/publish-thesis-v8-bem.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: thesis-v8-bem
  cancel-in-progress: false
jobs:
  merge-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            scripts/thesis-edit
            public/thesis-studio/downloads
            public/thesis-studio/editor-data
            public/thesis-studio/documents
            public/thesis-studio/he-thesis-comparison
            public/thesis-studio/manuscript-workbench.js
            public/thesis-studio/manuscript-workbench.html
            public/thesis-studio/chapter3-bem-v8.html
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Word tools and native math converter
        run: |
          python -m pip install --quiet python-docx pymupdf pillow cairosvg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk pandoc
      - name: Build V8 from exact V7 parent and render actual pages
        run: python scripts/thesis-edit/publish_v8_bem.py
      - name: Verify generated references and page images
        run: |
          node --check public/thesis-studio/manuscript-workbench.js
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/thesis-studio/he-thesis-comparison")
          m=json.loads((p/"v8-page-map.json").read_text())
          assert m["version"]=="V8" and len(m["equation_pages"])==27
          for k in range(20,25):assert m["pages"][str(k)]
          for ls in m["pages"].values():
              for item in ls:assert (p/item["image"]).stat().st_size>10000
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V8-reviewed-BEM-actual-Word-and-pages
          path: |
            _generated_thesis_v8/10MW-thesis-v8-bem-20261122.docx
            _generated_thesis_v8/10MW-thesis-v8-bem-20261122.pdf
            _generated_thesis_v8/v8-audit.json
            _generated_thesis_v8/bem-pages
            public/thesis-studio/he-thesis-comparison/v8-spreads
          retention-days: 30
      - name: Publish V8 candidate assets and existing online editor
        run: |
          git config user.name 'thesis-editor[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/thesis-studio/downloads/10MW-thesis-v8-bem-20261122.* public/thesis-studio/editor-data/manuscript-v8-bem.json public/thesis-studio/he-thesis-comparison/v8-page-map.json public/thesis-studio/he-thesis-comparison/v8-spreads public/thesis-studio/he-thesis-comparison/index.html public/thesis-studio/manuscript-workbench.js public/thesis-studio/manuscript-workbench.html
          git commit -m 'docs(thesis): publish V8 reviewed BEM Word and real page comparison'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Trigger existing Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
