name: S05 retrieve original seismic journal PDFs (no solver; research only)
on:
  push:
    branches:
      - research/t080-seismic-integration-gates-20261022
    paths:
      - '.github/workflows/s05-seismic-fulltext-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-original-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/t080-seismic-integration-gates-20261022
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible PDF parser
        run: python -m pip install 'pypdf>=5,<7'
      - name: Check downloader syntax and known SHA256 vector
        run: |
          python -m py_compile research/wind-tower/experiments/T079/seismic_fulltext_acquire.py
          python research/wind-tower/experiments/T079/seismic_fulltext_acquire.py --self-test
      - name: Actually download 4 original full-PDF candidates and validate PDF bytes/pages/SHA256
        continue-on-error: true
        run: |
          python research/wind-tower/experiments/T079/seismic_fulltext_acquire.py \
            --output-dir "$RUNNER_TEMP/seismic_original_pdfs"
      - name: Save real original PDFs in private 90-day Actions artifact (not public repo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s05-original-seismic-journal-fulltext-pdfs
          path: ${{ runner.temp }}/seismic_original_pdfs/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit byte/source/page/failure receipt in existing T079 evidence directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/seismic_original_pdfs/seismic_fulltext_download_receipt.json"
          if [[ -f "$source" ]]; then
            cp "$source" research/wind-tower/experiments/T079/S05_SEISMIC_FULLTEXT_DOWNLOAD_RECEIPT_20261028.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/wind-tower/experiments/T079/S05_SEISMIC_FULLTEXT_DOWNLOAD_RECEIPT_20261028.json
            if ! git diff --cached --quiet; then
              git commit -m 'research(S05): record actual verified seismic PDF downloads and access failures'
              git pull --rebase origin research/t080-seismic-integration-gates-20261022
              git push origin HEAD:research/t080-seismic-integration-gates-20261022
            fi
          else
            echo 'No receipt generated; check the download step failure logs'
            exit 1
          fi
