name: Native Engine CI

on:
  push:
    branches:
      - engine/cpp-wasm-webgpu
  pull_request:
    branches:
      - main
    paths:
      - 'engine/**'
      - 'src/engine/**'
      - 'src/render-next/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/native-engine.yml'

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure native C++23 tests
        run: cmake -S engine -B build/native -DCMAKE_BUILD_TYPE=Release

      - name: Compile native engine tests
        run: cmake --build build/native --parallel

      - name: Run correctness and performance gates
        run: ctest --test-dir build/native --verbose --output-on-failure

  wasm-release:
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:6.0.9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          em++ --version
          cmake --version

      - name: Configure WebAssembly build
        run: emcmake cmake -S engine -B build/wasm -DCMAKE_BUILD_TYPE=Release

      - name: Compile C++23 engine to WebAssembly
        run: cmake --build build/wasm --parallel

      - name: Verify browser artifacts
        run: |
          test -s build/wasm/vf_engine.js
          test -s build/wasm/vf_engine.wasm
          ls -lh build/wasm/vf_engine.js build/wasm/vf_engine.wasm

  web-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check WebGPU/WASM bridge and build web app
        run: npm run build
