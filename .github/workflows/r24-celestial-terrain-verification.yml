name: R24 Celestial Terrain Verification

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - 'native/include/vf/world/PlanetSurfaceAuthority.hpp'
      - 'native/src/world/PlanetSurfaceAuthority.cpp'
      - 'native/include/vf/world/PlanetLodMeshBuilder.hpp'
      - 'native/src/world/PlanetLodMeshBuilder.cpp'
      - 'native/include/vf/world/CelestialSystem.hpp'
      - 'native/src/world/CelestialSystem.cpp'
      - 'native/include/vf/world/CelestialPhysicsFrame.hpp'
      - 'native/src/world/CelestialPhysicsFrame.cpp'
      - 'native/include/vf/player/PlanetCamera.hpp'
      - 'native/src/player/PlanetCamera.cpp'
      - 'native/src/app/Main.cpp'
      - 'native/tests/CameraInputTests.cpp'
      - 'native/tests/CelestialSystemTests.cpp'
      - 'native/tests/CelestialPhysicsFrameTests.cpp'
      - 'native/tests/R24PhysicalPlanetTests.cpp'
      - 'native/tests/R24RuntimeStabilityTests.cpp'
      - '.github/scripts/r24_stability_capture.sh'
      - '.github/workflows/r24-celestial-terrain-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-celestial-terrain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-real-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Validate checked-in source
        run: |
          git diff --check HEAD^
          grep -q 'sampleSurface' native/include/vf/world/PlanetSurfaceAuthority.hpp
          grep -q 'reliefErrorScale' native/include/vf/world/PlanetLodMeshBuilder.hpp
          grep -q 'testGroundedCameraCoRotatesWithPlanetWithoutTerrainYaw' native/tests/CameraInputTests.cpp
          grep -q 'testAdaptiveTerrainLodProducesBoundedFiniteSurface' native/tests/R24PhysicalPlanetTests.cpp

      - name: Install Vulkan X11 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure R24 runtime and tests
        run: cmake -S native -B build/r24-celestial-terrain -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build R24 runtime and tests
        run: cmake --build build/r24-celestial-terrain --parallel 2

      - name: Run complete native regression suite
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-celestial-terrain --verbose --output-on-failure 2>&1 | tee r24-celestial-terrain-ctest.log

      - name: Run focused celestial terrain gates
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-celestial-terrain --verbose --output-on-failure \
            -R 'vf_camera_input_tests|vf_celestial_system_tests|vf_celestial_physics_frame_tests|vf_celestial_surface_frames_tests|vf_r24_physical_planet_tests|vf_r24_runtime_stability_tests' \
            2>&1 | tee r24-celestial-terrain-focused.log

      - name: Verify real Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real framebuffer evidence
        shell: bash
        run: |
          APP="$(find build/r24-celestial-terrain -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_stability_capture.sh
          .github/scripts/r24_stability_capture.sh "$APP" r24-celestial-terrain-evidence

      - name: Preserve permanent evidence for this exact commit
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-celestial-terrain-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          cp -a r24-celestial-terrain-evidence/. "$EVIDENCE_DIR/"
          cp -f r24-celestial-terrain-ctest.log "$EVIDENCE_DIR/"
          cp -f r24-celestial-terrain-focused.log "$EVIDENCE_DIR/"
          cp -f vulkan-summary.txt "$EVIDENCE_DIR/"
          git diff "${GITHUB_SHA}^" "${GITHUB_SHA}" -- native > "$EVIDENCE_DIR/tested-source.patch" || true
          cat > "$EVIDENCE_DIR/ci-status.txt" <<EOF
          workflow_sha=${GITHUB_SHA}
          workflow_run=${GITHUB_RUN_ID}
          full_tests=success
          focused_tests=success
          vulkan=success
          capture=success
          EOF

      - name: Upload real Vulkan evidence
        uses: actions/upload-artifact@v5
        with:
          name: r24-celestial-terrain-real-vulkan-${{ github.run_id }}
          path: |
            r24-celestial-terrain-evidence/**
            r24-celestial-terrain-ctest.log
            r24-celestial-terrain-focused.log
            vulkan-summary.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit permanent evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence
          git commit -m "R24: preserve celestial terrain Vulkan evidence [run ${GITHUB_RUN_ID}]"
          git push origin HEAD:work/r24-unified-planetary-physics

  windows-native-regression:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Validate checked-in source
        shell: pwsh
        run: git diff --check HEAD^

      - name: Configure Windows x64
        run: cmake -S native -B build/r24-celestial-terrain-win -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Windows x64
        run: cmake --build build/r24-celestial-terrain-win --config Release --parallel 2

      - name: Run complete Windows native suite
        run: ctest --test-dir build/r24-celestial-terrain-win -C Release --verbose --output-on-failure
