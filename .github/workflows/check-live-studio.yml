name: Verify Published Research Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for published studio and check real evidence catalog
        run: node scripts/check-live-studio.cjs
      - name: Archive deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-pages-source-catalog
          path: artifacts/studio-live-deployment.json
          retention-days: 14
