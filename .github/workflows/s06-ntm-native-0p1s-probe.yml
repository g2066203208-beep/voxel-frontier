name: S06 four-batch native 0.1s OpenFAST common-channel QC (STEADY WIND ONLY)
on:
  push:
    paths:
      - '.github/workflows/s06-ntm-native-0p1s-probe.yml'
      - 'research/wind-tower/experiments/T062/s06_ntm_native_0p1s_probe.py'
      - 'research/wind-tower/experiments/T062/s06_native_4batch_common_channel_qc.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  four-batch-native-0p1s:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - name: Sparse checkout source, never fetch 436MB turbulent BTS
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/experiments/T062/s06_ntm_native_0p1s_probe.py
            research/wind-tower/experiments/T062/s06_native_4batch_common_channel_qc.py
            research/wind-tower/experiments/T062/s06_historical_outb_source_gate.py
            research/wind-tower/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-002.zip
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe
            research/wind-tower/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll
            research/wind-tower/experiments/T062/S06_NTM_NATIVE_4BATCH_COMMON_CHANNEL_QC_20261031.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact native executable SHA and run negative tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe='research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe'
          git lfs install --local
          git lfs pull --include="$exe" --exclude=""
          if ((Get-Item $exe).Length -ne 61086208) { throw 'EXECUTABLE_NOT_MATERIALIZED' }
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '0cc8147fdda188365b8eacda8a831e74fafef59440d71185d66c3272af9e176a') { throw "EXE_SHA256_MISMATCH $sha" }
          $root='research/wind-tower/experiments/T062'
          python -m py_compile "$root/s06_ntm_native_0p1s_probe.py" "$root/s06_native_4batch_common_channel_qc.py"
          if ($LASTEXITCODE -ne 0) { throw 'PY_COMPILE_FAILURE' }
          python "$root/s06_ntm_native_0p1s_probe.py" --selftest
          if ($LASTEXITCODE -ne 0) { throw 'PREP_NEGATIVE_TEST_FAILURE' }
          python "$root/s06_native_4batch_common_channel_qc.py" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'COMPARATOR_NEGATIVE_TEST_FAILURE' }
          Write-Host "SOURCE_EXECUTABLE_SHA_PASS $sha"
      - name: Prepare 9+9+9+4 source-verified gage configurations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='research/wind-tower'
          $script="$root/experiments/T062/s06_ntm_native_0p1s_probe.py"
          foreach ($b in 1..4) {
            $args=@('--prepare','--batch',"$b",
              '--archive1',"$root/archive/local-assets-20261004/openfast-36-r2/part-001.zip",
              '--archive2',"$root/archive/local-assets-20261004/openfast-36-r2/part-002.zip",
              '--supp',"$root/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip",
              '--dll',"$root/references/baselines-and-site-20261004/openfast-v330-adaptation/1FreeDecay/Control/libdiscon.dll",
              '--exe',"$root/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe",
              '--contract',"$root/experiments/T062/S06_NTM_ORIGINAL_FST_ED_31GAGE_CONTRACT_20261031.json",
              '--outdir',"work/batch$b")
            & python "$script" @args
            if ($LASTEXITCODE -ne 0) { throw "BATCH_$b SOURCE_PREPARATION_FAILURE" }
          }
          Write-Host 'ALL_4_PREP_PASS STEADY_WIND_ONLY NO_700S_PRODUCTION'
      - name: Run four independent 0.1s native diagnostics, retain all failures
        shell: pwsh
        continue-on-error: true
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          $ErrorActionPreference='Continue'
          $exe=(Resolve-Path 'research/wind-tower/references/baselines-and-site-20261004/runtime-binaries/openfast_x64_v353.exe').Path
          $fail=0
          foreach ($b in 1..4) {
            Push-Location "work/batch$b"
            & $exe 'DTU_10MW_RWT.fst' 2>&1 | Tee-Object -FilePath 'native_stdout.log'
            $code=$LASTEXITCODE
            if ($null -eq $code) { $code=999 }
            Set-Content -Path 'native_exit_code.txt' -Value "$code"
            Pop-Location
            Write-Host "BATCH_$b NATIVE_0P1S_EXIT_CODE $code"
            if ($code -ne 0) { $fail++ }
          }
          if ($fail -gt 0) { throw "$fail native batch(es) failed; artifacts preserved" }
      - name: Independently inspect each native header and common channel parity
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='research/wind-tower/experiments/T062'
          foreach ($b in 1..4) {
            $p="work/batch$b"
            if (-not (Test-Path "$p/S06_0P1S_PREP_RECEIPT.json")) { throw "BATCH_$b PREP_MISSING" }
            $args=@('--inspect','--outdir',"$p",'--log',"$p/native_stdout.log",
              '--exit-code-file',"$p/native_exit_code.txt",'--receipt',"$p/S06_NATIVE_RECEIPT.json")
            & python "$root/s06_ntm_native_0p1s_probe.py" @args
            if ($LASTEXITCODE -ne 0) { throw "BATCH_$b NATIVE_CHANNEL_FAILURE" }
          }
          & python "$root/s06_native_4batch_common_channel_qc.py" --root work --out "$root/S06_NTM_NATIVE_4BATCH_COMMON_CHANNEL_QC_20261031.json"
          if ($LASTEXITCODE -ne 0) { throw 'FOUR_BATCH_COMMON_CHANNEL_PARITY_HOLD' }
      - name: Archive all four native OUTBs, logs, and QC (failure evidence too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s06-four-batch-native-0p1s-steady-wind-diagnostic-not-ntm
          path: |
            work/batch*/native_stdout.log
            work/batch*/native_exit_code.txt
            work/batch*/S06_0P1S_PREP_RECEIPT.json
            work/batch*/S06_NATIVE_RECEIPT.json
            work/batch*/DTU_10MW_RWT.outb
            research/wind-tower/experiments/T062/S06_NTM_NATIVE_4BATCH_COMMON_CHANNEL_QC_20261031.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit small real QC receipt to existing Draft PR branch only
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='research/wind-tower/experiments/T062/S06_NTM_NATIVE_4BATCH_COMMON_CHANNEL_QC_20261031.json'
          if (-not (Test-Path $p)) { throw 'QC_RECEIPT_MISSING' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -- $p
          if ($LASTEXITCODE -ne 0) { throw 'GIT_ADD_FAILURE' }
          if (git diff --cached --quiet) { Write-Host 'QC_RECEIPT_UNCHANGED'; exit 0 }
          git commit -m 'data(S06): preserve four-batch 0.1s native common-channel parity'
          if ($LASTEXITCODE -ne 0) { throw 'GIT_COMMIT_FAILURE' }
          git pull --rebase origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'GIT_REBASE_FAILURE' }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'GIT_PUSH_FAILURE' }
          Write-Host 'FOUR_BATCH_QC_PERSISTED; NOT NTM OR PHYSICS PASS'
