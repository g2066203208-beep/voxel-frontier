name: R24 Core Physical Fix

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_fix_core_tests.py'
      - '.github/workflows/r24-core-fix.yml'

permissions:
  contents: write

jobs:
  integrate-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/r24-unified-planetary-physics
      - name: Integrate R24 core
        run: python3 .github/scripts/r24_integrate_core.py
      - name: Update compatibility tests
        run: python3 .github/scripts/r24_fix_core_tests.py
      - name: Configure
        run: cmake -S native -B native/build-r24-core -DVF_BUILD_RUNTIME=OFF -DVF_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build-r24-core --parallel 2
      - name: Test
        run: ctest --test-dir native/build-r24-core --output-on-failure
      - name: Commit integrated tracked source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'R24: integrate physical gravity climate water and unified surface core'
            git push origin HEAD:work/r24-unified-planetary-physics
          fi
