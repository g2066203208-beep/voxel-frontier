name: T071 inspect exact DISCON hash
on:
  push:
    paths:
      - '.github/workflows/t071-inspect-discon-hash.yml'
      - 'research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py'
      - 'research/wind-tower/experiments/T062/s10_lowwind_75_source_pilot.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip
            research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip
            research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py
            research/wind-tower/experiments/T062/s10_lowwind_75_source_pilot.py
            research/wind-tower/experiments/T062/S07_18NTM_ORIGINAL_TURBSIM_CONTROLLER_INPUTS_20261031.csv
            research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_SOURCE_PILOT_RECEIPT_20261105.json
            research/wind-tower/experiments/T062/S07_U04p5_NTM_S01_InflowWind_NOT_RUN.dat
            research/wind-tower/archive/local-assets-20261004/file-manifest.json
            research/wind-tower/archive/local-assets-20261004-supplement/file-manifest.json
          sparse-checkout-cone-mode: false
      - name: Hash exact canonical controller file
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/supp && mkdir -p /tmp/supp
          unzip -q research/wind-tower/archive/local-assets-20261004-supplement/openfast-36-r2/part-001.zip -d /tmp/supp
          f=/tmp/supp/CASES/U09p343881_ETM_S01/Control/DTU_10MW_RWT_DISCON.IN
          ls -l "$f"
          sha256sum "$f"
          echo "FIRST LINES"
          sed -n '1,25p' "$f"

      - name: Validate exact original DISCON low-wind shutdown and reference clamp (NO solver)
        shell: bash
        run: |
          set -euo pipefail
          f=/tmp/supp/CASES/U09p343881_ETM_S01/Control/DTU_10MW_RWT_DISCON.IN
          python3 research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py \
            --self-test \
            --discon-lowwind-source "$f" \
            --discon-lowwind-receipt original_discon_lowwind_receipt.json
          python3 - <<'PY'
          import json
          r=json.load(open('original_discon_lowwind_receipt.json'))
          assert r['original_discon_sha256']=='8f5d7546420ee34838e66b63e4b26d64460be5d5492f99c60b6d1ef977ffc61a'
          assert r['original_discon_bytes']==17600
          assert r['original_SD_Mode']==0 and r['original_PS_Mode']==1
          assert r['original_VS_ControlMode']==2 and r['original_WE_Mode']==2
          assert r['cut_in_verdict']=='NOT_ESTABLISHED_FROM_DISCON_OR_SERVODYN'
          assert not r['physical_pass'] and r['stage_passed']==0
          print('S07_ORIGINAL_DISCON_SHA_SHUTDOWN_SOURCE_PASS_NOT_CUTIN')
          PY
          sha256sum original_discon_lowwind_receipt.json
      - name: Read exact original 158m ServoDyn startup card (SOURCE ONLY)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/original_servo
          unzip -p research/wind-tower/archive/local-assets-20261004/openfast-36-r2/part-001.zip \
            CASES/U09p343881_ETM_S01/Control/DTU_10MW_RWT_ServoDyn.dat \
            > /tmp/original_servo/DTU_10MW_RWT_ServoDyn.dat
          python research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py \
            --self-test \
            --servo-startup-source /tmp/original_servo/DTU_10MW_RWT_ServoDyn.dat \
            --servo-startup-receipt original_servo_startup_receipt.json
          sha256sum /tmp/original_servo/DTU_10MW_RWT_ServoDyn.dat original_servo_startup_receipt.json
          cat original_servo_startup_receipt.json
      - name: Inspect original FST modules and ServoDyn-DISCON-DLL source graph (NO solver)
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wind-tower/experiments/T062/s07_ntm18_original_control_input_gate.py \
            --self-test --repo-root . --module-graph-receipt /tmp/s07_module_graph.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_SOURCE_PILOT_RECEIPT_20261105.json')
          existing=json.loads(p.read_text(encoding='utf-8'))
          result=json.loads(Path('/tmp/s07_module_graph.json').read_text(encoding='utf-8'))
          assert result['input_sha256']['original_fst']=='5307e04d27721095ce6cbb6c125b8be1b4be71790af6c6258e3187343f5db605'
          assert result['input_sha256']['original_servo']=='103e7bd71209a095b833ca4ba62627ae7724870615112fdccfbff502076c966e'
          assert result['input_sha256']['original_discon']=='8f5d7546420ee34838e66b63e4b26d64460be5d5492f99c60b6d1ef977ffc61a'
          assert not result['physical_pass'] and result['formal_dlc12_verified_slots']==0
          existing['lowwind_45_s01_full_module_graph_20261106']=result
          p.write_text(json.dumps(existing,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('S07_ORIGINAL_MODULE_GRAPH_VERIFIED',json.dumps({
            'verified':result['active_module_source_verified'],
            'unresolved':result['unresolved_active_modules'],
            'dll':result['dll_source']['status'],
            'servo':result['servo_controller_fields'],
            'modules':[{'flag':x['flag'],'ref':x['reference'],'status':x['source']['status']}
                       for x in result['fst_modules']]},sort_keys=True))
          PY
          sha256sum /tmp/s07_module_graph.json
      - name: Rebind exact original InflowWind 4.5 S01 (SOURCE ONLY; NOT RUN)
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wind-tower/experiments/T062/s10_lowwind_75_source_pilot.py --inflow-rebind-write
          python3 research/wind-tower/experiments/T062/s10_lowwind_75_source_pilot.py --inflow-rebind-check
          sha256sum research/wind-tower/experiments/T062/S07_U04p5_NTM_S01_InflowWind_NOT_RUN.dat
          python3 - <<'PY'
          import json
          p='research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_SOURCE_PILOT_RECEIPT_20261105.json'
          r=json.load(open(p,encoding='utf-8'))['lowwind_45_s01_exact_inflow_rebind_20261106']
          assert r['input_sha256']['source_inflow_card']=='d204329f881836ffe0895b7d81aa28cae7540d5df56c754880db3d6c5c11d3a9'
          assert r['tests']['byte_exact_reverse']=='PASS' and r['tests']['synthetic_negative_rejected']==8
          assert not r['physical_pass'] and r['candidate_BTS_sha256'] is None and r['stages_passed']==0
          print('S07_ORIGINAL_INFLOW_45_S01_SOURCE_ONLY_NOT_DLC12',r['candidate_card_sha256'])
          PY
      - name: Persist exact source-derived candidate and receipt to existing Draft PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T062/S07_U04p5_NTM_S01_InflowWind_NOT_RUN.dat \
                  research/wind-tower/experiments/T062/S10_U07p5_NTM_S01_SOURCE_PILOT_RECEIPT_20261105.json
          if ! git diff --cached --quiet; then
            git commit -m "research(S07): persist original-byte-verified 4.5 S01 InflowWind candidate (NOT_RUN)"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: s07-original-servo-startup-source-qc
          path: |
            original_servo_startup_receipt.json
            original_discon_lowwind_receipt.json
            /tmp/s07_module_graph.json
            research/wind-tower/experiments/T062/S07_U04p5_NTM_S01_InflowWind_NOT_RUN.dat
          retention-days: 7
