name: archive-wechat-gbt5224

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/archive-wechat-gbt5224.yml'

permissions:
  contents: write

concurrency:
  group: archive-wechat-gbt5224
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install browser tools
        shell: bash
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium

      - name: Capture article, screenshots and original images
        shell: bash
        env:
          ARTICLE_URL: https://mp.weixin.qq.com/s/RtUgb7I55W1sNzuDxemzJA
        run: |
          cat > /tmp/capture.py <<'PY'
          import asyncio, hashlib, json, os, re
          from pathlib import Path
          from PIL import Image
          from playwright.async_api import async_playwright

          URL = os.environ["ARTICLE_URL"]
          out = Path("/tmp/gbt5224_wechat_archive")
          imgdir = out / "images"
          shotdir = out / "screenshots"
          imgdir.mkdir(parents=True, exist_ok=True)
          shotdir.mkdir(parents=True, exist_ok=True)

          def sha256(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(1024*1024), b""):
                      h.update(b)
              return h.hexdigest()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  ctx = await browser.new_context(
                      viewport={"width": 1440, "height": 1800},
                      device_scale_factor=1,
                      locale="zh-CN",
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                 "AppleWebKit/537.36 (KHTML, like Gecko) "
                                 "Chrome/154.0.0.0 Safari/537.36"
                  )
                  page = await ctx.new_page()
                  await page.goto(URL, wait_until="domcontentloaded", timeout=120000)
                  await page.wait_for_timeout(5000)

                  title = (await page.title()).strip()
                  body_text = (await page.locator("body").inner_text()).strip()
                  if "环境异常" in body_text or "验证" in body_text[:500]:
                      print("WARNING: WeChat may have shown a verification page.")

                  # Scroll through the article to force lazy images to load.
                  height = await page.evaluate("document.documentElement.scrollHeight")
                  y = 0
                  while y < height:
                      await page.evaluate(f"window.scrollTo(0, {y})")
                      await page.wait_for_timeout(250)
                      y += 1200
                      height = max(height, await page.evaluate("document.documentElement.scrollHeight"))
                  await page.evaluate("window.scrollTo(0, 0)")
                  await page.wait_for_timeout(1000)

                  # Save browser-rendered HTML as provenance.
                  (out / "article_rendered.html").write_text(await page.content(), encoding="utf-8")

                  # Segment screenshots so very long WeChat pages do not exceed browser/image limits.
                  total_h = await page.evaluate("document.documentElement.scrollHeight")
                  viewport_w = await page.evaluate("document.documentElement.clientWidth")
                  seg_h = 1800
                  nseg = (total_h + seg_h - 1) // seg_h
                  for i in range(nseg):
                      top = i * seg_h
                      h = min(seg_h, total_h - top)
                      await page.evaluate(f"window.scrollTo(0, {top})")
                      await page.wait_for_timeout(150)
                      fn = shotdir / f"segment_{i+1:03d}.jpg"
                      await page.screenshot(
                          path=str(fn),
                          type="jpeg",
                          quality=78,
                          clip={"x": 0, "y": 0, "width": viewport_w, "height": h}
                      )

                  # Extract article images in DOM order. Prefer WeChat data-src original image URLs.
                  imgs = await page.locator("#js_content img").evaluate_all("""
                    els => els.map((e, i) => ({
                      index: i + 1,
                      data_src: e.getAttribute('data-src') || '',
                      src: e.currentSrc || e.src || '',
                      alt: e.getAttribute('alt') || ''
                    }))
                  """)

                  seen = set()
                  records = []
                  for obj in imgs:
                      u = obj["data_src"] or obj["src"]
                      if not u or u.startswith("data:") or u in seen:
                          continue
                      seen.add(u)
                      try:
                          resp = await ctx.request.get(u, headers={
                              "Referer": URL,
                              "User-Agent": "Mozilla/5.0"
                          }, timeout=60000)
                          if not resp.ok:
                              records.append({"url": u, "status": resp.status, "saved": False})
                              continue
                          data = await resp.body()
                          ctype = (resp.headers.get("content-type") or "").lower()
                          ext = ".jpg"
                          if "png" in ctype: ext = ".png"
                          elif "webp" in ctype: ext = ".webp"
                          elif "gif" in ctype: ext = ".gif"
                          fn = imgdir / f"img_{len(records)+1:03d}{ext}"
                          fn.write_bytes(data)
                          w = h = None
                          try:
                              with Image.open(fn) as im:
                                  w, h = im.size
                          except Exception:
                              pass
                          records.append({
                              "url": u,
                              "status": resp.status,
                              "saved": True,
                              "file": fn.name,
                              "bytes": len(data),
                              "width": w,
                              "height": h,
                              "sha256": sha256(fn),
                              "alt": obj.get("alt","")
                          })
                      except Exception as e:
                          records.append({"url": u, "saved": False, "error": repr(e)})

                  meta = {
                      "source_url": URL,
                      "page_title": title,
                      "rendered_height_px": total_h,
                      "screenshot_segments": nseg,
                      "article_dom_images": len(imgs),
                      "unique_images_attempted": len(seen),
                      "saved_images": sum(1 for r in records if r.get("saved")),
                      "images": records,
                  }
                  (out / "manifest.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")

                  lines = [
                      "# 微信文章图片归档：GB/T 5224-2023 相关材料",
                      "",
                      f"- 来源：{URL}",
                      f"- 页面标题：{title}",
                      f"- 截图分段：{nseg}",
                      f"- DOM 图片数：{len(imgs)}",
                      f"- 去重后尝试抓取：{len(seen)}",
                      f"- 成功保存原图：{meta['saved_images']}",
                      "",
                      "## 使用边界",
                      "",
                      "该目录是对用户指定公开微信文章的研究证据归档。截图与文章图片仅用于论文/模型资料核对。",
                      "能否作为 GB/T 5224-2023 的正式全文依据，需要后续逐页核对标准号、页码、正文连续性和版本信息；",
                      "不得仅因图片来源于该文章就标记为“官方标准原件”。",
                      "",
                      "## 原始图片",
                      "",
                      "|序号|文件|尺寸|字节|SHA256|",
                      "|---:|---|---:|---:|---|",
                  ]
                  j = 0
                  for r in records:
                      if not r.get("saved"): continue
                      j += 1
                      dim = f"{r.get('width')}×{r.get('height')}" if r.get("width") else ""
                      lines.append(f"|{j}|images/{r['file']}|{dim}|{r['bytes']}|{r['sha256']}|")
                  (out / "README.md").write_text("\n".join(lines)+"\n", encoding="utf-8")
                  await browser.close()

          asyncio.run(main())
          PY
          python3 /tmp/capture.py

      - name: Commit archive with Git Data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "main"
          src = Path("/tmp/gbt5224_wechat_archive")
          prefix = "research/wind-tower/references/standards/gbt5224-2023-wechat-archive-20261006"

          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "wind-tower-wechat-archive"
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=300) as r:
                  return json.loads(r.read().decode())

          ref = api("GET", "/git/ref/heads/" + branch)
          parent = ref["object"]["sha"]
          base_tree = api("GET", "/git/commits/" + parent)["tree"]["sha"]
          entries = []

          for p in sorted(src.rglob("*")):
              if not p.is_file():
                  continue
              raw = p.read_bytes()
              if len(raw) > 95 * 1024 * 1024:
                  raise RuntimeError(f"File too large for GitHub blob: {p} {len(raw)}")
              blob = api("POST", "/git/blobs", {
                  "content": base64.b64encode(raw).decode(),
                  "encoding": "base64"
              })
              rel = p.relative_to(src).as_posix()
              entries.append({
                  "path": prefix + "/" + rel,
                  "mode": "100644",
                  "type": "blob",
                  "sha": blob["sha"]
              })

          tree = api("POST", "/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = api("POST", "/git/commits", {
              "message": "references: archive GB/T 5224 WeChat page images",
              "tree": tree["sha"],
              "parents": [parent]
          })
          api("PATCH", "/git/refs/heads/" + branch, {"sha": commit["sha"], "force": False})
          print("Committed:", commit["sha"])
          PY
