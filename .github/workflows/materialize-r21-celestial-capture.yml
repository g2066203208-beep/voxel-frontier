name: Materialize R21 Celestial Capture

on:
  push:
    branches: [test/terrain-r21-celestial]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R21 celestial capture patch
        run: python3 .github/scripts/materialize_r21_celestial_capture.py
      - name: Verify R21 celestial camera
        run: |
          grep -q 'R21 CELESTIAL EVIDENCE CAMERA' native/src/app/Main.cpp
          grep -q 'Celestial capture:' native/src/app/Main.cpp
          git diff --check
      - name: Commit materialized capture source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native/src/app/Main.cpp
          git commit -m 'test: materialize physical Sun Moon capture [skip ci]'
          git push origin HEAD:test/terrain-r21-celestial
