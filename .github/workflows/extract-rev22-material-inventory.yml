name: Extract REV22 material inventory
on:
  push:
    paths:
      - '.github/workflows/extract-rev22-material-inventory.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -eu
          dir=public/thesis-studio/inp-archive/REV22_REVIEW
          python "$dir/extract_rev22_material_inventory.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dir/rev22-material-inventory.json"
          git diff --cached --quiet && exit 0
          git commit -m 'Archive actual REV22 material inventory and section assignment evidence'
          git pull --rebase origin main
          git push origin HEAD:main
