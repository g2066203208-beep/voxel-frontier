name: Audit T058 exact roundtrip

on:
  push:
    paths:
      - 'research/wind-tower/experiments/T058/audit_t058_roundtrip.py'
      - '.github/workflows/audit-t058-exact-roundtrip.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/wind-tower/experiments/T058/inputs/BASE001_T058_T057_PLUS_G1_OBSERVABILITY.inp
            research/wind-tower/experiments/T058/audit_t058_roundtrip.py
            research/wind-tower/experiments/T058/extract_t058_g1.py
            research/wind-tower/experiments/T058/T058_ROUNDTRIP_AUDIT.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reverse T058 to parent and verify SHA
        run: python research/wind-tower/experiments/T058/audit_t058_roundtrip.py
      - name: Compile ODB extractor syntax
        run: python -m py_compile research/wind-tower/experiments/T058/extract_t058_g1.py
      - name: Commit audit report
        run: |
          git config user.name "openai-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T058/T058_ROUNDTRIP_AUDIT.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "audit: verify T058 exactly roundtrips to T057 physics parent"
            git push
          fi
