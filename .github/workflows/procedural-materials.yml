name: Procedural Materials Lab

on:
  push:
    branches:
      - work/procedural-materials
    paths:
      - material_lab/**
      - .github/workflows/procedural-materials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procedural-materials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MESHOVA_COMMIT: "129f5130c02581dcd53b2cb334136985946e3df0"
      PNPM_VERSION: "10.15.1"
      VF_STYLE_ID: "VF_PAINTERLY_PLANETARY_V1"

    steps:
      - name: Checkout material branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce material source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -s material_lab/README.md
          test -s material_lab/meshova/bake-request.ts
          test -s material_lab/tests/surface-context.spec.ts
          test -s material_lab/preview/render_3d_surface_showcase.py

          expected=$(printf '%s\n' \
            vf-3d-material-showcase.ts \
            vf-layered-sandstone-painted.ts \
            vf-painterly-bark.ts \
            vf-painterly-core.ts \
            vf-painterly-dirt.ts \
            vf-painterly-leaves.ts \
            vf-painterly-snow.ts \
            vf-painterly-water.ts \
            vf-surface-context.ts \
            vf-surface-layers.ts | sort)
          actual=$(find material_lab/meshova/recipes -maxdepth 1 -type f -name '*.ts' -printf '%f\n' | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Production recipe directory differs from approved source set." >&2
            echo "EXPECTED:" >&2; echo "$expected" >&2
            echo "ACTUAL:" >&2; echo "$actual" >&2
            exit 1
          fi

          raster_sources=$(find material_lab -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.tga' \) -print)
          if [[ -n "$raster_sources" ]]; then
            echo "Raster source assets are forbidden in material_lab:" >&2
            echo "$raster_sources" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path("material_lab/request.json").read_text())
          materials = request.get("materials", [request])
          base_allowed = {
              "vfLayeredSandstonePainted",
              "vfPainterlyDirt",
              "vfPainterlyBark",
              "vfPainterlyLeaves",
              "vfPainterlySnow",
              "vfPainterlyWater",
          }
          showcase3d = {"vf3DGrass","vf3DMoss","vf3DFur","vf3DFire"}
          presets = [m.get("preset") for m in materials]
          modes = {m.get("params", {}).get("mode") for m in materials}
          names = {m.get("name", "") for m in materials}
          production = len(materials) == 6 and set(presets) == base_allowed
          water_showcase = len(materials) == 4 and set(presets) == {"vfPainterlyWater"} and modes == {"calm", "windy", "foam", "shallow"}
          layer_showcase_names = {
              "vf_layer_sandstone_dry",
              "vf_layer_sandstone_snow_half",
              "vf_layer_sandstone_snow_full",
              "vf_layer_sandstone_wet",
              "vf_layer_water_rain",
              "vf_layer_leaves_cutout",
          }
          layer_showcase = len(materials) == 6 and names == layer_showcase_names
          surface3d_showcase = len(materials) == 4 and set(presets) == showcase3d
          if not (production or water_showcase or layer_showcase or surface3d_showcase):
              raise SystemExit("Request must be production-six, water-showcase, exact surface-layer showcase, or exact 3D material showcase")
          for item in materials:
              name = item.get("name", "")
              if any(token in name.lower() for token in ("reference", "test", "draft", "final", "_v1", "_v2", "_v3", "_v4", "_v5", "_v6", "_v7", "_v8", "_v9")):
                  raise SystemExit(f"Unstable production/showcase material name: {name}")
          print("3d-showcase" if surface3d_showcase else ("layer-showcase" if layer_showcase else ("water-showcase" if water_showcase else "production-six")))
          PY

      - name: Install preview tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick python3-numpy python3-pil

      - name: Checkout pinned Meshova
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wellingfeng/Meshova.git .cache/Meshova
          cd .cache/Meshova
          git checkout --detach "$MESHOVA_COMMIT"
          test "$(git rev-parse HEAD)" = "$MESHOVA_COMMIT"

      - name: Install Meshova dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          cd .cache/Meshova
          pnpm install --frozen-lockfile

      - name: Test adaptive surface context resolver
        shell: bash
        run: |
          set -euo pipefail
          cd .cache/Meshova
          pnpm tsx ../../material_lab/tests/surface-context.spec.ts

      - name: Inject approved procedural production sources
        shell: bash
        run: |
          set -euo pipefail
          cp material_lab/request.json .cache/Meshova/vf-request.json
          cp material_lab/meshova/bake-request.ts .cache/Meshova/examples/vf-bake-request.ts
          mkdir -p .cache/Meshova/examples/vf-recipes
          for file in \
            vf-3d-material-showcase.ts \
            vf-layered-sandstone-painted.ts \
            vf-painterly-bark.ts \
            vf-painterly-core.ts \
            vf-painterly-dirt.ts \
            vf-painterly-leaves.ts \
            vf-painterly-snow.ts \
            vf-painterly-water.ts \
            vf-surface-context.ts \
            vf-surface-layers.ts; do
            cp "material_lab/meshova/recipes/$file" ".cache/Meshova/examples/vf-recipes/$file"
          done

      - name: Bake deterministic PBR material library
        shell: bash
        run: |
          set -euo pipefail
          cd .cache/Meshova
          MESHOVA_COMMIT="$MESHOVA_COMMIT" pnpm tsx examples/vf-bake-request.ts vf-request.json

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          src=".cache/Meshova/out/vf-materials"
          test -d "$src"
          mkdir -p build/generated-materials
          cp -R "$src"/* build/generated-materials/
          expected_count=$(python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('material_lab/request.json').read_text())
          print(len(r.get('materials',[r])))
          PY
          )
          material_count=$(find build/generated-materials -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$material_count" -eq "$expected_count" || { echo "Expected $expected_count material directories, got $material_count" >&2; exit 1; }
          while IFS= read -r dir; do
            name=$(basename "$dir")
            for suffix in baseColor normal roughness height ao metallic; do
              file="$dir/${name}_${suffix}.png"
              test -s "$file" || { echo "Missing $file" >&2; exit 1; }
              dims=$(identify -format '%wx%h' "$file")
              test "$dims" = "1024x1024" || { echo "Unexpected dimensions for $file: $dims" >&2; exit 1; }
            done
            grep -q 'VF_PAINTERLY_PLANETARY_V1' "$dir/manifest.json"
          done < <(find build/generated-materials -mindepth 1 -maxdepth 1 -type d | sort)

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/generated-materials')
          req=json.loads(Path('material_lab/request.json').read_text())
          required={
            'vf3DGrass':('bladeDensity','bladeLength','bladeBend'),
            'vf3DMoss':('mossDensity','mossHeight','tuftVariation'),
            'vf3DFur':('strandDensity','strandLength','strandBend','strandVariation'),
            'vf3DFire':('flameDensity','flameHeight','heatDistortion','smoke','sparks'),
          }
          for item in req.get('materials',[req]):
              d=root/item['name']; n=item['name']; preset=item['preset']; layers=item.get('layers',{})
              def need(key):
                  p=d/f'{n}_mask-{key}.png'
                  if not p.is_file(): raise SystemExit(f'Missing semantic mask: {p}')
              if preset=='vfPainterlyLeaves': need('opacity')
              if preset=='vfPainterlyWater':
                  for k in ('foam','transmission','refraction','glint'): need(k)
              for k in required.get(preset,()): need(k)
              if layers.get('snowCoverage',0)>0: need('snowCoverage')
              if layers.get('wetness',0)>0: need('wetness'); need('puddles')
              if layers.get('rainIntensity',0)>0 and preset=='vfPainterlyWater': need('rainRipples')
          PY

          mapfile -t pngs < <(find build/generated-materials -type f -name '*.png' | sort)
          sha256sum "${pngs[@]}" > build/generated-materials/SHA256SUMS.txt

      - name: Render standardized displaced PBR previews
        shell: bash
        run: |
          set -euo pipefail
          python3 material_lab/preview/render_material_previews.py build/generated-materials
          python3 material_lab/preview/render_layer_diagnostics.py build/generated-materials
          python3 material_lab/preview/render_3d_surface_showcase.py build/generated-materials
          expected_count=$(python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('material_lab/request.json').read_text())
          print(len(r.get('materials',[r])))
          PY
          )
          mapfile -t spheres < <(find build/generated-materials -type f -name 'preview-sphere.png' | sort)
          test ${#spheres[@]} -eq "$expected_count"
          if [[ "$expected_count" -le 4 ]]; then tile="2x"; else tile="3x"; fi
          montage "${spheres[@]}" -thumbnail 720x720 -tile "$tile" -geometry +18+18 -background '#202020' build/material-spheres-overview.png

      - name: Upload PBR material library
        uses: actions/upload-artifact@v4
        with:
          name: vf-procedural-materials-${{ github.run_id }}
          path: |
            build/generated-materials/
            build/material-spheres-overview.png
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Procedural Materials Lab'
            echo
            echo "- Branch: \`work/procedural-materials\`"
            echo "- Style: \`$VF_STYLE_ID\`"
            echo '- Adaptive resolver inputs: weather / exposure / environment / material traits / player+prop interactions / previous state / dt'
            echo '- 3D showcase: grass blades / moss tufts / fur strands / emissive flame volume'
            echo '- Surface layers: snow coverage/depth/compaction, wetness/puddles, rain ripples'
            echo '- Foliage: true opacity alpha-cutout mask'
            echo '- Water fields: foam / transmission / refraction / glint / optional rainRipples'
            echo '- Source: procedural code only; raster source assets rejected'
            echo '- Every material: PBR maps + true-Height displaced studio sphere; 3D presets receive procedural geometry/volume preview pass'
          } >> "$GITHUB_STEP_SUMMARY"
