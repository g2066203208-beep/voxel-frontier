name: Procedural Materials Lab

on:
  push:
    branches:
      - work/procedural-materials
    paths:
      - material_lab/**
      - .github/workflows/procedural-materials.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: procedural-materials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MESHOVA_COMMIT: "129f5130c02581dcd53b2cb334136985946e3df0"
      PNPM_VERSION: "10.15.1"
      VF_STYLE_ID: "VF_PAINTERLY_PLANETARY_V1"

    steps:
      - name: Checkout material branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enforce material source hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -s material_lab/README.md
          test -s material_lab/meshova/bake-request.ts

          expected=$(printf '%s\n' \
            vf-layered-sandstone-painted.ts \
            vf-painterly-bark.ts \
            vf-painterly-core.ts \
            vf-painterly-dirt.ts \
            vf-painterly-leaves.ts \
            vf-painterly-snow.ts \
            vf-painterly-water.ts | sort)
          actual=$(find material_lab/meshova/recipes -maxdepth 1 -type f -name '*.ts' -printf '%f\n' | sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Production recipe directory differs from approved source set." >&2
            echo "EXPECTED:" >&2; echo "$expected" >&2
            echo "ACTUAL:" >&2; echo "$actual" >&2
            exit 1
          fi

          raster_sources=$(find material_lab -type f \
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.tga' \) -print)
          if [[ -n "$raster_sources" ]]; then
            echo "Raster source assets are forbidden in material_lab:" >&2
            echo "$raster_sources" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(Path("material_lab/request.json").read_text())
          materials = request.get("materials", [request])
          allowed = {
              "vfLayeredSandstonePainted",
              "vfPainterlyDirt",
              "vfPainterlyBark",
              "vfPainterlyLeaves",
              "vfPainterlySnow",
              "vfPainterlyWater",
          }
          if len(materials) != 6:
              raise SystemExit(f"Expected exactly six category masters, got {len(materials)}")
          if {m.get("preset") for m in materials} != allowed:
              raise SystemExit("Production request must contain exactly the six approved master presets")
          for item in materials:
              name = item.get("name", "")
              if any(token in name.lower() for token in ("reference", "test", "draft", "final", "_v1", "_v2", "_v3", "_v4", "_v5", "_v6", "_v7", "_v8", "_v9")):
                  raise SystemExit(f"Unstable production material name: {name}")
          PY

      - name: Install preview tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick python3-numpy python3-pil

      - name: Checkout pinned Meshova
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/wellingfeng/Meshova.git .cache/Meshova
          cd .cache/Meshova
          git checkout --detach "$MESHOVA_COMMIT"
          test "$(git rev-parse HEAD)" = "$MESHOVA_COMMIT"

      - name: Install Meshova dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate
          cd .cache/Meshova
          pnpm install --frozen-lockfile

      - name: Inject approved procedural production sources
        shell: bash
        run: |
          set -euo pipefail
          cp material_lab/request.json .cache/Meshova/vf-request.json
          cp material_lab/meshova/bake-request.ts .cache/Meshova/examples/vf-bake-request.ts
          mkdir -p .cache/Meshova/examples/vf-recipes
          for file in \
            vf-layered-sandstone-painted.ts \
            vf-painterly-bark.ts \
            vf-painterly-core.ts \
            vf-painterly-dirt.ts \
            vf-painterly-leaves.ts \
            vf-painterly-snow.ts \
            vf-painterly-water.ts; do
            cp "material_lab/meshova/recipes/$file" ".cache/Meshova/examples/vf-recipes/$file"
          done

      - name: Bake deterministic PBR material library
        shell: bash
        run: |
          set -euo pipefail
          cd .cache/Meshova
          MESHOVA_COMMIT="$MESHOVA_COMMIT" pnpm tsx examples/vf-bake-request.ts vf-request.json

      - name: Validate and package outputs
        shell: bash
        run: |
          set -euo pipefail
          src=".cache/Meshova/out/vf-materials"
          test -d "$src"
          mkdir -p build/generated-materials
          cp -R "$src"/* build/generated-materials/
          material_count=$(find build/generated-materials -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$material_count" -eq 6 || { echo "Expected 6 material directories, got $material_count" >&2; exit 1; }
          while IFS= read -r dir; do
            name=$(basename "$dir")
            for suffix in baseColor normal roughness height ao metallic; do
              file="$dir/${name}_${suffix}.png"
              test -s "$file" || { echo "Missing $file" >&2; exit 1; }
              dims=$(identify -format '%wx%h' "$file")
              test "$dims" = "1024x1024" || { echo "Unexpected dimensions for $file: $dims" >&2; exit 1; }
            done
            grep -q 'VF_PAINTERLY_PLANETARY_V1' "$dir/manifest.json"
          done < <(find build/generated-materials -mindepth 1 -maxdepth 1 -type d | sort)
          mapfile -t pngs < <(find build/generated-materials -type f -name '*.png' | sort)
          sha256sum "${pngs[@]}" > build/generated-materials/SHA256SUMS.txt

      - name: Render standardized displaced PBR previews
        shell: bash
        run: |
          set -euo pipefail
          python3 material_lab/preview/render_material_previews.py build/generated-materials
          mapfile -t spheres < <(find build/generated-materials -type f -name 'preview-sphere.png' | sort)
          test ${#spheres[@]} -eq 6
          montage "${spheres[@]}" -thumbnail 720x720 -tile 3x -geometry +18+18 -background '#202020' build/material-spheres-overview.png

      - name: Upload PBR material library
        uses: actions/upload-artifact@v4
        with:
          name: vf-procedural-materials-${{ github.run_id }}
          path: |
            build/generated-materials/
            build/material-spheres-overview.png
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Procedural Materials Lab'
            echo
            echo "- Branch: \`work/procedural-materials\`"
            echo "- Style: \`$VF_STYLE_ID\`"
            echo '- Production set: sandstone / dirt / bark / leaves / snow / water'
            echo '- Source: procedural code only; raster source assets rejected'
            echo '- Production recipe directory: exact allow-list enforced'
            echo '- Every material: PBR maps + true-Height displaced studio sphere'
          } >> "$GITHUB_STEP_SUMMARY"
