name: R24 Extreme Runtime Rescue

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_extreme_runtime_rescue.py'
      - '.github/scripts/r24_ecology_hotpath.py'
      - '.github/workflows/r24-extreme-runtime-rescue.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-extreme-runtime-rescue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact R24 production commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply ecology hotpath rescue
        run: python3 .github/scripts/r24_ecology_hotpath.py

      - name: Apply extreme runtime rescue
        run: python3 .github/scripts/r24_extreme_runtime_rescue.py

      - name: Validate optimized source contracts
        shell: bash
        run: |
          git diff --check
          grep -q 'terrainSamples_' native/include/vf/world/PlanetClimateGrid.hpp
          grep -q 'kClimateServiceStepSeconds = 300.0' native/src/world/PlanetaryBodySystem.cpp
          grep -q 'viewConeHalfAngleRadians' native/include/vf/world/PlanetLodMeshBuilder.hpp
          grep -q 'cheap. The old order paid one center terrain sample' native/src/world/PlanetLodMeshBuilder.cpp
          grep -q 'PatchScratch scratch' native/src/world/PlanetLodMeshBuilder.cpp
          grep -q '2200U' native/src/app/Main.cpp
          grep -q 'viewPrefetchExpired' native/src/app/Main.cpp
          grep -q 'forestRoll > 0.68' native/src/world/ProceduralEcology.cpp
          ! grep -q 'surfaceAuthority->surfaceNormal(direction)' native/src/world/ProceduralEcology.cpp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure Release runtime
        run: cmake -S native -B build/r24-extreme -G Ninja -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Release runtime
        run: cmake --build build/r24-extreme --parallel 2

      - name: Run full native tests
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-extreme --verbose --output-on-failure 2>&1 | tee r24-extreme-ctest.log

      - name: Gate multi-rate climate terrain and runtime stability
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build/r24-extreme --verbose --output-on-failure \
            -R 'vf_planetary_body_system_tests|vf_r24_runtime_stability_tests|vf_r24_hydrologic_canyon_tests|vf_terrain_landform_tests|vf_r24_physical_planet_tests' \
            2>&1 | tee r24-extreme-focused.log
          grep -q 'vf_planetary_body_system_tests: PASS' r24-extreme-focused.log
          grep -q 'vf_r24_runtime_stability_tests: PASS' r24-extreme-focused.log
          grep -q 'Terrain landform tests passed' r24-extreme-focused.log
          grep -q 'R24 hydrologic canyon tests passed' r24-extreme-focused.log

      - name: Verify Lavapipe Vulkan
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture real extreme-optimized production terrain
        shell: bash
        run: |
          APP="$(find build/r24-extreme -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_epic_landscape_capture.sh
          .github/scripts/r24_epic_landscape_capture.sh "$APP" r24-extreme-runtime-evidence

      - name: Gate real images and extreme performance telemetry
        shell: bash
        run: |
          test -s r24-extreme-runtime-evidence/r24-epic-landscape-overview.png
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('r24-extreme-runtime-evidence/logs')
          rows = []
          pattern = re.compile(
              r'R24 PERF terrain_build_ms=([0-9.]+) vertices=([0-9]+) indices=([0-9]+) '
              r'leaf_patches=([0-9]+) culled_nodes=([0-9]+) hydrology_reused=([01])')
          for log in root.glob('*.log'):
              if log.name.startswith('xvfb'):
                  continue
              text = log.read_text(encoding='utf-8', errors='replace')
              found = pattern.findall(text)
              if not found:
                  continue
              ms, verts, inds, leaves, culled, reused = found[-1]
              row = (log.stem, float(ms), int(verts), int(inds), int(leaves), int(culled), int(reused))
              rows.append(row)
              print('EXTREME_PERF', row)

          if len(rows) < 4:
              raise SystemExit(f'expected at least four terrain performance rows, got {len(rows)}')
          max_indices = max(r[3] for r in rows)
          max_leaves = max(r[4] for r in rows)
          min_culled = min(r[5] for r in rows)
          max_build_ms = max(r[1] for r in rows)
          print('EXTREME_SUMMARY', 'max_build_ms=', max_build_ms,
                'max_indices=', max_indices, 'max_leaves=', max_leaves,
                'min_culled=', min_culled)

          # Previous validated R24 was ~4.49-4.54 M indices in difficult scenes and up to 3600
          # leaves. View-aware streaming must prove a material reduction instead of merely moving
          # work around. This gate does not relax physical relief/SSE tests above.
          if max_indices >= 3_200_000:
              raise SystemExit(f'index budget regression: {max_indices} >= 3,200,000')
          if max_leaves > 2200:
              raise SystemExit(f'leaf budget regression: {max_leaves} > 2200')
          if min_culled <= 0:
              raise SystemExit('view/horizon culling did not reject any nodes')
          if max_build_ms >= 2200.0:
              raise SystemExit(f'terrain build still too slow on CI: {max_build_ms:.1f} ms')
          PY

      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          EVIDENCE_DIR="docs/evidence/r24-extreme-runtime-${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR"
          if [[ -d r24-extreme-runtime-evidence ]]; then
            cp -a r24-extreme-runtime-evidence/. "$EVIDENCE_DIR/"
          fi
          [[ -f r24-extreme-ctest.log ]] && cp -f r24-extreme-ctest.log "$EVIDENCE_DIR/" || true
          [[ -f r24-extreme-focused.log ]] && cp -f r24-extreme-focused.log "$EVIDENCE_DIR/" || true
          [[ -f vulkan-summary.txt ]] && cp -f vulkan-summary.txt "$EVIDENCE_DIR/" || true
          printf 'workflow_run=%s\nworkflow_sha=%s\njob_status=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ job.status }}" > "$EVIDENCE_DIR/ci-status.txt"

      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-extreme-runtime-${{ github.run_id }}
          path: |
            r24-extreme-runtime-evidence/**
            r24-extreme-ctest.log
            r24-extreme-focused.log
            vulkan-summary.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Promote tested extreme runtime rescue
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs/evidence
          git commit -m "perf(r24): decouple climate and cull invisible terrain work"
          git reset --hard HEAD
          git clean -fd build/r24-extreme || true
          git fetch origin work/r24-unified-planetary-physics
          git rebase origin/work/r24-unified-planetary-physics
          git push origin HEAD:work/r24-unified-planetary-physics
