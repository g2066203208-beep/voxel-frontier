name: Verify complete REV16 INP archive
on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - '.github/workflows/verify-rev16-rna-archive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 33900b0915ab8730101e653e0e120b6c211f0520
      - name: Reconstruct REV15 and apply exact RNA replacement
        run: |
          python public/thesis-studio/inp-archive/REV16_EQ_FLEX_RNA/build_rev16.py --archive public/thesis-studio/inp-archive --output output/HE_REV16_EQ_FLEX_RNA.inp
          sha256sum output/HE_REV16_EQ_FLEX_RNA.inp
      - uses: actions/upload-artifact@v4
        with:
          name: HE_REV16_EQ_FLEX_RNA_verified
          path: output/
          if-no-files-found: error
