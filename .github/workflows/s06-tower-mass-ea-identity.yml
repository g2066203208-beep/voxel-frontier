name: S06 158m tower mass-EA identity (static only)
on:
  push:
    paths:
      - '.github/workflows/s06-tower-mass-ea-identity.yml'
      - 'research/wind-tower/experiments/T077/recovery/s06_tower_ea_mass_ownership_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/S06_C02R3R2_158M_Tower_RECOVERED_20261026.dat'
      - 'research/wind-tower/experiments/T077/recovery/s06_tower_gross_section_identity_31seg.py'
      - 'research/wind-tower/experiments/T077/recovery/S06_158M_TOWER_GROSS_SECTION_IDENTITY_31SEG_20261026.csv'
      - 'research/wind-tower/experiments/T038/model-disclosure-20261005/tower-segment-geometry-mesh.csv'
      - 'research/wind-tower/experiments/T077/recovery/s01_s06_d400_composite_identity_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/S01_S06_D400_COMPOSITE_VS_158M_31SEG_20261027.csv'
      - 'research/wind-tower/experiments/T077/recovery/S01_D400_VS_FORMAL_158M_OPENFAST_31SEG_20261026.csv'
      - 'research/wind-tower/experiments/T077/recovery/S06_158M_TOWER_MASS_EA_31SEG_20261026.csv'
      - 'research/wind-tower/experiments/T077/recovery/s01_s06_integrated_concrete_compliance_gate.py'
      - 'research/wind-tower/experiments/T077/recovery/S01_S06_112M_INTEGRATED_COMPLIANCE_31SEG_20261027.csv'
      - 'research/wind-tower/experiments/T077/recovery/S01_S06_112M_INTEGRATED_COMPLIANCE_SUMMARY_20261027.json'
  workflow_dispatch:

jobs:
  source-identity-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source SHA and 31-segment EA/mass identity
        shell: bash
        run: |
          set -euo pipefail
          python3 research/wind-tower/experiments/T077/recovery/s06_tower_ea_mass_ownership_gate.py \
            research/wind-tower/experiments/T077/recovery/S06_C02R3R2_158M_Tower_RECOVERED_20261026.dat \
            --outdir /tmp/s06-mass-ea
          python3 research/wind-tower/experiments/T077/recovery/s06_tower_gross_section_identity_31seg.py \
            research/wind-tower/experiments/T077/recovery/S06_C02R3R2_158M_Tower_RECOVERED_20261026.dat \
            research/wind-tower/experiments/T038/model-disclosure-20261005/tower-segment-geometry-mesh.csv \
            --out /tmp/s06-mass-ea/S06_158M_TOWER_GROSS_SECTION_IDENTITY_31SEG_20261026.csv
          diff -u research/wind-tower/experiments/T077/recovery/S06_158M_TOWER_GROSS_SECTION_IDENTITY_31SEG_20261026.csv \
            /tmp/s06-mass-ea/S06_158M_TOWER_GROSS_SECTION_IDENTITY_31SEG_20261026.csv
          python3 research/wind-tower/experiments/T077/recovery/s01_s06_d400_composite_identity_gate.py \
            --out /tmp/s06-mass-ea/S01_S06_D400_COMPOSITE_VS_158M_31SEG_20261027.csv
          diff -u research/wind-tower/experiments/T077/recovery/S01_S06_D400_COMPOSITE_VS_158M_31SEG_20261027.csv \
            /tmp/s06-mass-ea/S01_S06_D400_COMPOSITE_VS_158M_31SEG_20261027.csv
          sha256sum research/wind-tower/experiments/T077/recovery/S06_158M_TOWER_GROSS_SECTION_IDENTITY_31SEG_20261026.csv \
            research/wind-tower/experiments/T077/recovery/S01_D400_VS_FORMAL_158M_OPENFAST_31SEG_20261026.csv \
            research/wind-tower/experiments/T077/recovery/S06_158M_TOWER_MASS_EA_31SEG_20261026.csv
          python3 research/wind-tower/experiments/T077/recovery/s01_s06_integrated_concrete_compliance_gate.py \
            --outdir /tmp/s06-mass-ea/compliance
          diff -u research/wind-tower/experiments/T077/recovery/S01_S06_112M_INTEGRATED_COMPLIANCE_31SEG_20261027.csv \
            /tmp/s06-mass-ea/compliance/S01_S06_112M_INTEGRATED_COMPLIANCE_31SEG_20261027.csv
          diff -u research/wind-tower/experiments/T077/recovery/S01_S06_112M_INTEGRATED_COMPLIANCE_SUMMARY_20261027.json \
            /tmp/s06-mass-ea/compliance/S01_S06_112M_INTEGRATED_COMPLIANCE_SUMMARY_20261027.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/s06-mass-ea/compliance/S01_S06_112M_INTEGRATED_COMPLIANCE_SUMMARY_20261027.json')
          d = json.loads(p.read_text())
          expected = {'mass_change_pct': 3.6507150264,
                      'tip_compliance_change_pct': -11.8503484459,
                      'concrete_CG_shift_m': -0.6312126237,
                      'represented_length_m': 111.939}
          for key, val in expected.items():
              assert abs(d[key] - val) < 1e-5, (key, d[key], val)
          print('INDEPENDENT_PRECOMPUTED_STATIC_INTEGRATION_ASSERTIONS_PASS')
          PY
          sha256sum /tmp/s06-mass-ea/compliance/*
          sha256sum /tmp/s06-mass-ea/*.csv /tmp/s06-mass-ea/*.json
          echo 'STATIC ONLY: no Abaqus/OpenFAST solver, no material/standard PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: s06-158m-mass-ea-static-evidence
          path: /tmp/s06-mass-ea/
          retention-days: 14
