name: S06 source-only 18 NTM low-gage seed dispersion and BTS readiness
on:
  push:
    paths:
      - '.github/workflows/s06-ntm-low-gage-seed-qc.yml'
      - 'research/wind-tower/experiments/T077/recovery/s10_openfast_abaqus_handedness_gate.cjs'
      - 'research/wind-tower/experiments/T077/recovery/S10_31SEG_4AZ_2RAD_HANDEDNESS_CORRECTED_CANDIDATES_20261031.csv'
      - 'research/wind-tower/experiments/T062/s06_ntm_seed_dispersion_and_bts_gate.js'
      - 'research/wind-tower/experiments/T062/S06_18NTM_NATIVE_LOW_GAGE_MYT_SEED_SPREAD_20261031.csv'
      - 'research/wind-tower/experiments/T062/S10_18NTM_6SEED_LOAD_DEL_CONVERGENCE_SUMMARY_20261031.csv'
      - 'research/wind-tower/experiments/T062/S10_18NTM_6SEED_EXHAUSTIVE_SUBSET_CONVERGENCE_20261031.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ntm-source-only:
    if: github.ref_name == 'research/t080-seismic-integration-gates-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            research/wind-tower/archive/local-assets-20261004/file-manifest.json
            research/wind-tower/experiments/T062/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv
            research/wind-tower/experiments/T062/S06_18NTM_NATIVE_LOW_GAGE_MYT_SEED_SPREAD_20261031.csv
            research/wind-tower/experiments/T062/S10_18NTM_6SEED_LOAD_DEL_CONVERGENCE_SUMMARY_20261031.csv
            research/wind-tower/experiments/T062/S10_18NTM_6SEED_EXHAUSTIVE_SUBSET_CONVERGENCE_20261031.csv
            research/wind-tower/experiments/T062/s06_ntm_seed_dispersion_and_bts_gate.js
            research/wind-tower/experiments/T077/recovery/s10_openfast_abaqus_handedness_gate.cjs
            research/wind-tower/experiments/T077/recovery/S10_D400_PE_31SEG_4AZ_2RAD_MIDPLANE_ELEMENTS_20261031.csv
            research/wind-tower/experiments/T077/recovery/S10_4ETM_31SEG_MIDPLANE_2RAD_CONTROL_BINDING_20261031.csv
            research/wind-tower/experiments/T077/recovery/S10_31SEG_4AZ_2RAD_HANDEDNESS_CORRECTED_CANDIDATES_20261031.csv
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: S10 248 real element coordinate handedness and independent annular equilibrium (NO Abaqus)
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower/experiments/T077/recovery
          node --check "$root/s10_openfast_abaqus_handedness_gate.cjs"
          node "$root/s10_openfast_abaqus_handedness_gate.cjs" --check
          sha256sum "$root/s10_openfast_abaqus_handedness_gate.cjs" "$root/S10_31SEG_4AZ_2RAD_HANDEDNESS_CORRECTED_CANDIDATES_20261031.csv"
          echo 'CONDITIONAL_RIGHT_HANDED_STATIC_ALGEBRA_ONLY: no native local DCM, no ODB/PT, no material fatigue or physical PASS'
      - name: Actual source SHA and six-seed arithmetic; negative tests; exact output diff
        shell: bash
        run: |
          set -euo pipefail
          root=research/wind-tower
          node --check "$root/experiments/T062/s06_ntm_seed_dispersion_and_bts_gate.js"
          node "$root/experiments/T062/s06_ntm_seed_dispersion_and_bts_gate.js" --self-test
          node "$root/experiments/T062/s06_ntm_seed_dispersion_and_bts_gate.js" \
            --source "$root/experiments/T062/S06_18NTM_ORIGINAL_9GAGE_LOAD_DEL_20261031.csv" \
            --manifest "$root/archive/local-assets-20261004/file-manifest.json" \
            --out "$RUNNER_TEMP/s06_ntm_seed_spread.csv" \
            --convergence-summary "$RUNNER_TEMP/s10_convergence_summary.csv" \
            --convergence-subsets "$RUNNER_TEMP/s10_convergence_subsets.csv"
          cmp "$RUNNER_TEMP/s06_ntm_seed_spread.csv" "$root/experiments/T062/S06_18NTM_NATIVE_LOW_GAGE_MYT_SEED_SPREAD_20261031.csv"
          cmp "$RUNNER_TEMP/s10_convergence_summary.csv" "$root/experiments/T062/S10_18NTM_6SEED_LOAD_DEL_CONVERGENCE_SUMMARY_20261031.csv"
          if ! cmp "$RUNNER_TEMP/s10_convergence_subsets.csv" "$root/experiments/T062/S10_18NTM_6SEED_EXHAUSTIVE_SUBSET_CONVERGENCE_20261031.csv"; then
            diff -u "$RUNNER_TEMP/s10_convergence_subsets.csv" "$root/experiments/T062/S10_18NTM_6SEED_EXHAUSTIVE_SUBSET_CONVERGENCE_20261031.csv" | head -40 || true
            exit 1
          fi
          echo 'SOURCE_ONLY_30_GROUP_180_SUBSET_ROW_QC_PASS; LOAD_DEL_ONLY_NOT_MATERIAL_DAMAGE; NO SOLVER'
