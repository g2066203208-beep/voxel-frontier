name: Audit public skeletal-animation sources
on:
  push:
    branches: [x2d-bone-player-apk]
    paths:
      - 'public-rig-pipeline/SOURCES.json'
      - 'public-rig-pipeline/README.md'
      - '.github/workflows/build-public-rig-examples.yml'
  workflow_dispatch: {}

jobs:
  audit-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install archive tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y p7zip-full

      - name: Download original public sources
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf public-rig-pipeline/audit-work
          mkdir -p public-rig-pipeline/audit-work
          cd public-rig-pipeline/audit-work
          curl -fL --retry 4 -A "Mozilla/5.0" -o f.png "https://opengameart.org/sites/default/files/f_1.png"
          curl -fL --retry 4 -A "Mozilla/5.0" -o m.png "https://opengameart.org/sites/default/files/m_3.png"
          curl -fL --retry 4 -A "Mozilla/5.0" -o sprites.7z "https://opengameart.org/sites/default/files/sprites.7z"
          curl -fL --retry 4 -A "Mozilla/5.0" -o archer.zip "https://opengameart.org/sites/default/files/2dpixx_-_archer_for_animation.zip"
          git clone --depth 1 https://github.com/godotengine/godot-demo-projects.git godot-demo-projects

      - name: Verify source classifications
        shell: bash
        run: |
          set -euxo pipefail
          cd public-rig-pipeline/audit-work
          mkdir sprites archer
          7z x -y sprites.7z -osprites >/dev/null
          unzip -oq archer.zip -d archer

          # Asset-only examples: verify they really contain separated parts.
          test -f archer/head.png
          test -f archer/torso.png
          test -f archer/upper_arm_left.png
          test -f archer/lower_arm_left.png
          test -f archer/upper_leg_left.png
          test -f archer/lower_leg_left.png

          # Native professional animation reference: verify exact Godot rig/animation source exists.
          test -f godot-demo-projects/2d/skeleton/player/player.tscn
          test -f godot-demo-projects/2d/skeleton/player/player.gd
          grep -q 'type="Bone2D"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q 'type="Polygon2D"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q 'bones = \[' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"idle"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"walk"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"run"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"fly"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"fall"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"jump"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"land"' godot-demo-projects/2d/skeleton/player/player.tscn
          grep -q '&"land_hard"' godot-demo-projects/2d/skeleton/player/player.tscn

          echo "PASS: Godot official Skeleton2D is a native rig+mesh+weights+animation case."
          echo "PASS: Archer and the body-part sheets are asset references only."
          echo "No X2D animation package is produced by this audit workflow."
