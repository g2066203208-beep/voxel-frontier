name: R24.2 Physical Scale Globe Motion

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_2_fix_scale_globes_motion.py'
      - '.github/scripts/r24_2_capture.sh'
      - '.github/workflows/r24-2-scale-globe-motion.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-2-scale-globe-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout R24.2 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/r24-unified-planetary-physics

      - name: Stage R24.2 physical scale and globe fixes
        run: |
          python3 .github/scripts/r24_2_fix_scale_globes_motion.py
          git diff --check
          grep -q 'buildPlanetGlobeSurface' native/src/app/Main.cpp
          grep -q 'earth-from-moon' native/src/app/Main.cpp
          grep -q 'testEarthMoonPhysicalScaleRotationAndRevolution' native/tests/R24PhysicalPlanetTests.cpp

      - name: Install Vulkan X11 and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick xdotool \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang compiler
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"
          "$SLANGC" -version

      - name: Configure C++23 Vulkan runtime
        run: cmake -S native -B build/r24-2 -G Ninja -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build runtime and tests
        run: cmake --build build/r24-2 --parallel 2

      - name: Run full native test suite
        run: ctest --test-dir build/r24-2 --verbose --output-on-failure

      - name: Verify real Lavapipe Vulkan device
        run: |
          ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' | head -n 1)"
          test -n "$ICD"
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary | tee vulkan-summary.txt

      - name: Capture mandatory real framebuffer evidence
        run: |
          APP="$(find build/r24-2 -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          chmod +x .github/scripts/r24_2_capture.sh
          .github/scripts/r24_2_capture.sh "$APP" r24-2-evidence

      - name: Commit tested production source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native
          if git diff --cached --quiet; then
            echo 'No production source changes to commit.'
          else
            git commit -m 'R24.2: fix physical Earth Moon scale globes performance and motion'
            git push origin HEAD:work/r24-unified-planetary-physics
          fi

      - name: Preserve diagnostics after every outcome
        if: always()
        run: |
          mkdir -p r24-2-evidence
          cp -f vulkan-summary.txt r24-2-evidence/ 2>/dev/null || true
          git diff -- native > r24-2-evidence/tested-source.patch 2>/dev/null || true
          printf 'workflow_sha=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > r24-2-evidence/workflow-source.txt

      - name: Upload every framebuffer even when bad
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r24-2-real-vulkan-evidence-${{ github.sha }}
          path: r24-2-evidence/**
          if-no-files-found: warn
          retention-days: 30

  windows-build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout R24.2 branch
        uses: actions/checkout@v6
        with:
          ref: work/r24-unified-planetary-physics

      - name: Stage identical R24.2 source
        shell: pwsh
        run: |
          python .github/scripts/r24_2_fix_scale_globes_motion.py
          git diff --check

      - name: Configure Windows x64
        run: cmake -S native -B build/r24-2-win -A x64 -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON

      - name: Build Windows x64
        run: cmake --build build/r24-2-win --config Release --parallel 2

      - name: Test Windows x64
        run: ctest --test-dir build/r24-2-win -C Release --output-on-failure
