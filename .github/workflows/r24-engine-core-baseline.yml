name: R24 True ALL-OFF Engine Core Baseline

on:
  push:
    branches: [work/r24-unified-planetary-physics]
    paths:
      - '.github/scripts/r24_engine_core_baseline.py'
      - '.github/workflows/r24-engine-core-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r24-engine-core-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  true-all-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact R24 commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8

      - name: Materialize renderer-free engine core path
        run: |
          set -euo pipefail
          python3 .github/scripts/r24_engine_core_baseline.py
          git diff --check
          grep -q 'R24_ENGINE_CORE_NO_RENDERER_V1' native/src/app/Main.cpp
          grep -q 'VF_ENGINE_CORE_ONLY' native/src/app/Main.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build curl unzip xvfb imagemagick \
            mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Install Slang
        run: |
          curl -L --fail --retry 3 \
            https://github.com/shader-slang/slang/releases/download/v2026.16.1/slang-2026.16.1-linux-x86_64-glibc-2.28.zip \
            -o /tmp/slang.zip
          mkdir -p "$HOME/slang"
          unzip -q /tmp/slang.zip -d "$HOME/slang"
          SLANGC="$(find "$HOME/slang" -type f -name slangc -perm -111 | head -n 1)"
          test -n "$SLANGC"
          echo "$(dirname "$SLANGC")" >> "$GITHUB_PATH"

      - name: Configure and build Release
        run: |
          cmake -S native -B build/r24-engine-core -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_RUNTIME=ON -DVF_BUILD_TESTS=ON
          cmake --build build/r24-engine-core --parallel 2

      - name: Run native regression suite
        run: |
          ctest --test-dir build/r24-engine-core --output-on-failure

      - name: Measure true ALL-OFF core and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/r24-engine-core -type f -name voxel_frontier -perm -111 | head -n 1)"
          test -n "$APP"
          mkdir -p r24-engine-core-evidence
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > r24-engine-core-evidence/xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 1
          export DISPLAY=:99 SDL_VIDEODRIVER=x11
          export VF_PERF_PROFILE=mainstream_1080p
          export VF_ENGINE_CORE_ONLY=1

          "$APP" > r24-engine-core-evidence/engine-core.log 2>&1 &
          APP_PID=$!
          sleep 1
          import -window root r24-engine-core-evidence/engine-core-all-off.png || true
          wait "$APP_PID"

          grep -q '^R24 ENGINE_CORE renderer=0 present=0 camera=0 terrain=0 physics=0 celestial=0 weather=0 ui=0' \
            r24-engine-core-evidence/engine-core.log
          BENCH="$(grep '^R24 BENCHMARK profile=engine_core_no_renderer' r24-engine-core-evidence/engine-core.log | tail -n 1)"
          test -n "$BENCH"
          echo "$BENCH" | tee r24-engine-core-evidence/engine-core-summary.txt
          test -s r24-engine-core-evidence/engine-core-all-off.png

          python3 - <<'PY'
          from pathlib import Path
          import re
          line = Path('r24-engine-core-evidence/engine-core-summary.txt').read_text().strip()
          def f(key):
              m = re.search(rf'\b{key}=([0-9.+-]+)', line)
              if not m: raise SystemExit(f'missing {key}')
              return float(m.group(1))
          fps = f('avg_fps')
          mean = f('frame_mean_ms')
          p99 = f('p99_ms')
          render = f('render_mean_ms')
          valid = int(f('valid'))
          if valid != 1: raise SystemExit('invalid core benchmark')
          if abs(render) > 1e-9: raise SystemExit(f'render work leaked into core baseline: {render} ms')
          report = (
              'R24 TRUE ALL-OFF ENGINE CORE BASELINE\n'
              'renderer=0 present=0 camera=0 terrain=0 terrain_streaming=0 water=0 ecology=0 '
              'dynamic_scene=0 sky=0 shadows=0 physics=0 celestial=0 weather=0 ui=0\n'
              f'avg_fps={fps:.3f}\nframe_mean_ms={mean:.6f}\np99_ms={p99:.6f}\nrender_mean_ms={render:.6f}\n'
              'note=CI host/Xvfb CPU-side shell baseline; rendering is uncapped and 120 FPS is only the minimum gameplay acceptance line.\n'
          )
          Path('r24-engine-core-evidence/README.txt').write_text(report)
          print(report)
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: r24-true-all-off-engine-core-${{ github.run_id }}
          path: r24-engine-core-evidence
          retention-days: 30

      - name: Promote benchmark evidence to R24 branch
        if: success() && github.ref == 'refs/heads/work/r24-unified-planetary-physics'
        shell: bash
        run: |
          set -euo pipefail
          DEST="docs/evidence/r24-engine-core-${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp r24-engine-core-evidence/README.txt "$DEST/"
          cp r24-engine-core-evidence/engine-core-summary.txt "$DEST/"
          cp r24-engine-core-evidence/engine-core-all-off.png "$DEST/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'perf(r24): record true renderer-free engine core baseline'
          git push origin HEAD:work/r24-unified-planetary-physics
