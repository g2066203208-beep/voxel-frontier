name: Chapter 3 real-source ETM figures verification
on:
  push:
    branches: [research/t080-seismic-integration-gates-20261022]
    paths:
      - 'research/wind-tower/manuscript/final-thesis/figures/**'
      - 'research/wind-tower/experiments/T077/recovery/S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv'
      - '.github/workflows/ch3-source-figures-repro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-figure-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/manuscript/final-thesis/figures
            research/wind-tower/experiments/T077/recovery/S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv
            research/wind-tower/experiments/T079/real-records/S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv
            research/wind-tower/experiments/T079/real-records/S05_ESM_ROTD50_VS_HYPOTHETICAL_6DEG_12PERIOD_20261030.csv
          sparse-checkout-cone-mode: false
      - name: Verify source SHA and exact SVG/CSV rerender
        run: node research/wind-tower/manuscript/final-thesis/figures/plot_ch3_s06_etm_screening.js --check
      - name: Validate SVG XML and plot data integrity
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from xml.etree import ElementTree as ET
          folder=Path("research/wind-tower/manuscript/final-thesis/figures")
          paths=sorted(folder.glob("FIG3_S06_0*_SCREEN.svg"))
          assert len(paths)==3, paths
          for path in paths:
              root=ET.parse(path).getroot()
              assert root.tag=="{http://www.w3.org/2000/svg}svg", path
              assert len(list(root.iter("{http://www.w3.org/2000/svg}text")))>=20, path
              if "_01_" in path.name or "_03_" in path.name:
                  assert len(list(root.iter("{http://www.w3.org/2000/svg}polyline")))==4, path
              else:
                  assert len(list(root.iter("{http://www.w3.org/2000/svg}rect")))>=13, path
          with (folder/"FIG3_S06_PLOT_POINTS_124.csv").open(newline="",encoding="utf-8") as s:
              rows=list(csv.DictReader(s))
          assert len(rows)==124, len(rows)
          assert len({r["case"] for r in rows})==4
          assert len({r["segment"] for r in rows})==31
          print("SVG_XML_PASS 3; ORIGIN_CSV_PASS 124; SOURCE_REGEN_PASS")
          PY
      - name: Reproduce real ESM S05 figures with SHA-locked source and exact byte comparison
        run: |
          set -euo pipefail
          root=research/wind-tower
          fig="$root/manuscript/final-thesis/figures"
          src="$root/experiments/T079/real-records"
          node "$fig/plot_s05_esm_real_spectra.js" \
            "$src/S05_ESM_IT2012_NVL_MP_RotD_16PERIOD_20261030.csv" \
            "$src/S05_ESM_ROTD50_VS_HYPOTHETICAL_6DEG_12PERIOD_20261030.csv" \
            /tmp/s05_rotd.svg /tmp/s05_fit.svg
          cmp /tmp/s05_rotd.svg "$fig/FIG_S05_01_ESM_REAL_ROTD_16PERIOD_SOURCE_QC.svg"
          cmp /tmp/s05_fit.svg "$fig/FIG_S05_02_ESM_REAL_ROTD50_VS_HYPOTHETICAL_SPECTRUM_QC.svg"
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          for p in ['/tmp/s05_rotd.svg','/tmp/s05_fit.svg']:
              root=ET.parse(p).getroot()
              assert root.tag=='{http://www.w3.org/2000/svg}svg'
              assert len(list(root.iter('{http://www.w3.org/2000/svg}polyline'))) >= 3
          print('S05_TWO_REAL_SOURCE_SVG_XML_AND_EXACT_REGEN_PASS')
          PY
          sha256sum "$fig/plot_s05_esm_real_spectra.js" "$fig"/FIG_S05_0*.svg
      - name: Record exact source, figures and plotted CSV SHA256
        run: |
          sha256sum \
            research/wind-tower/experiments/T077/recovery/S06_4CASE_31GAGE_6COMP_RAINFLOW_DEL_20261027.csv \
            research/wind-tower/manuscript/final-thesis/figures/FIG3_S06_0*_SCREEN.svg \
            research/wind-tower/manuscript/final-thesis/figures/FIG3_S06_PLOT_POINTS_124.csv \
            research/wind-tower/manuscript/final-thesis/figures/plot_ch3_s06_etm_screening.js
