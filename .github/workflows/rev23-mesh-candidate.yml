name: REV23 source locked mesh refinement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rev23-mesh-candidate.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            public/thesis-studio/inp-archive/REV22_VALIDATION_KIT
            public/thesis-studio/inp-archive/REV23_MESH_CANDIDATE
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 matplotlib==3.9.2 pillow==10.4.0
      - run: python public/thesis-studio/inp-archive/REV23_MESH_CANDIDATE/refine_rev23.py
      - name: Archive verified candidate, not native validated
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f public/thesis-studio/inp-archive/REV23_MESH_CANDIDATE/HE_REV23_CONCRETE_MESH_EQ005.inp public/thesis-studio/inp-archive/REV23_MESH_CANDIDATE/receipt.json public/thesis-studio/inp-archive/REV23_MESH_CANDIDATE/mesh-comparison.jpg
          git commit -m "REV23 actual nested concrete mesh refinement candidate"
          git fetch --depth=20 origin main
          git rebase FETCH_HEAD
          git push origin HEAD:main
