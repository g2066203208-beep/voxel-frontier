name: Materialize R21 Celestial Terrain

on:
  push:
    branches: [test/terrain-r20-tectonic-folds]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply R21 source patch
        run: python3 .github/scripts/materialize_r21_celestial_terrain.py
      - name: Verify R21 markers
        run: |
          grep -q 'R21 ORBIT-COUPLED CLIMATE' native/src/world/PlanetSurface.cpp
          grep -q 'R21 Earth-Moon-Sun physical baseline' native/src/app/Main.cpp
          grep -q 'Newtonian N-body propagation' native/src/world/CelestialSystem.cpp
          grep -q 'struct KeplerianElements' native/include/vf/world/CelestialSystem.hpp
          git diff --check
      - name: Commit materialized R21 source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Voxel Frontier CI'
          git config user.email 'actions@users.noreply.github.com'
          git add native docs/CELESTIAL_PHYSICS_REFERENCES_R21.md
          git commit -m 'physics: materialize R21 n-body Sun Moon terrain coupling [skip ci]'
          git push origin HEAD:test/terrain-r20-tectonic-folds
