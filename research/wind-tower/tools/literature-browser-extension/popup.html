<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Studio 文献下载助手</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;margin:0;width:430px;background:#f6f8f3;color:#33452f}
header{padding:18px 18px 12px;background:#eef3e9;border-bottom:1px solid #dce6d7}
h1{font-size:18px;margin:0 0 8px}p{font-size:12px;line-height:1.65;margin:6px 0;color:#60705a}
main{padding:14px 16px 18px}.status{background:#fff;border:1px solid #dfe7da;border-radius:9px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row>*{flex:1}
button{border:1px solid #bccbb5;border-radius:7px;background:white;color:#40583a;padding:9px 10px;cursor:pointer}
button.primary{background:#4f6e49;color:white;border-color:#4f6e49}button.danger{color:#8b4e43}
select{width:100%;padding:8px;border:1px solid #cfd9ca;border-radius:6px;background:white}
ol{padding-left:24px;max-height:260px;overflow:auto;background:white;border:1px solid #dfe7da;border-radius:9px;margin:12px 0}
li{padding:8px 6px;font-size:11px;line-height:1.5;border-bottom:1px solid #edf1ea}li:last-child{border-bottom:0}
.done{color:#6c8a62}.failed{color:#9d6458}.current{font-weight:700;color:#365d35}
small{display:block;color:#879282;font-size:10px;margin-top:4px;overflow-wrap:anywhere}
.notice{font-size:10px;color:#776d4d;background:#fff8e7;border:1px solid #eadfbd;padding:9px;border-radius:7px}
</style>
</head>
<body>
<header>
  <h1>Paper Studio 文献下载助手</h1>
  <p>先在 Edge 正常登录武汉理工 CARSI。扩展只利用当前浏览器会话，不读取、不导出、不保存登录凭据。</p>
</header>
<main>
  <div class="status">
    <strong id="headline">正在读取队列…</strong>
    <p id="detail">—</p>
  </div>
  <div class="row">
    <label>批次
      <select id="batch">
        <option value="A">A · 最优先</option>
        <option value="B">B · OA/次优先</option>
        <option value="all">全部</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button class="primary" id="start">开始 / 继续</button>
    <button id="open">只打开下一篇</button>
    <button class="danger" id="stop">停止</button>
  </div>
  <div class="row">
    <button id="retry">重试当前篇</button>
    <button id="skip">跳过当前篇</button>
    <button id="refresh">刷新队列</button>
  </div>
  <div class="notice">默认逐篇处理，成功开始下载后至少等待8秒再进入下一篇；遇到权限页、验证码、PDF按钮缺失会停下来让你处理，避免触发出版社反爬。</div>
  <ol id="queue"></ol>
</main>
<script src="popup.js"></script>
</body>
</html>
