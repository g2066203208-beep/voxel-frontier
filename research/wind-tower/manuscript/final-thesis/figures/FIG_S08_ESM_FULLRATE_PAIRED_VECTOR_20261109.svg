<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="white"/><text x="50" y="49" font-family="Arial" font-size="26" font-weight="bold">Full-rate coincident horizontal response | E-only beam proxy</text><text x="50" y="77" font-family="Arial" font-size="15">Real ESM HNE/HNN; 0.005 s, 32040 samples/axis; not structural design</text><text x="55" y="132" font-family="Arial" font-size="19">A  Coarse-sample miss vs 0.005 s peak</text><text x="635" y="132" font-family="Arial" font-size="19">B  Independent-peak RSS excess</text><text x="55" y="175" font-family="Arial" font-size="15">Tower-top displacement</text><rect x="55" y="187" width="440" height="25" fill="#eaf0f3"/><rect x="55" y="187" width="30.694" height="25" fill="#267e98"/><text x="506" y="206" font-family="Arial" font-size="15">0.140%</text><text x="635" y="175" font-family="Arial" font-size="15">Tower-top displacement</text><rect x="635" y="187" width="440" height="25" fill="#eaf0f3"/><rect x="635" y="187" width="359.420" height="25" fill="#d07846"/><text x="1085" y="206" font-family="Arial" font-size="15">20.422%</text><text x="55" y="280" font-family="Arial" font-size="15">Tower-top acceleration</text><rect x="55" y="292" width="440" height="25" fill="#eaf0f3"/><rect x="55" y="292" width="27.517" height="25" fill="#267e98"/><text x="506" y="311" font-family="Arial" font-size="15">0.125%</text><text x="635" y="280" font-family="Arial" font-size="15">Tower-top acceleration</text><rect x="635" y="292" width="440" height="25" fill="#eaf0f3"/><rect x="635" y="292" width="276.239" height="25" fill="#d07846"/><text x="1085" y="311" font-family="Arial" font-size="15">15.695%</text><text x="55" y="385" font-family="Arial" font-size="15">Base elastic shear</text><rect x="55" y="397" width="440" height="25" fill="#eaf0f3"/><rect x="55" y="397" width="36.875" height="25" fill="#267e98"/><text x="506" y="416" font-family="Arial" font-size="15">0.168%</text><text x="635" y="385" font-family="Arial" font-size="15">Base elastic shear</text><rect x="635" y="397" width="440" height="25" fill="#eaf0f3"/><rect x="635" y="397" width="372.399" height="25" fill="#d07846"/><text x="1085" y="416" font-family="Arial" font-size="15">21.159%</text><text x="55" y="490" font-family="Arial" font-size="15">Base elastic moment</text><rect x="55" y="502" width="440" height="25" fill="#eaf0f3"/><rect x="55" y="502" width="380.043" height="25" fill="#267e98"/><text x="506" y="521" font-family="Arial" font-size="15">1.727%</text><text x="635" y="490" font-family="Arial" font-size="15">Base elastic moment</text><rect x="635" y="502" width="440" height="25" fill="#eaf0f3"/><rect x="635" y="502" width="324.417" height="25" fill="#d07846"/><text x="1085" y="521" font-family="Arial" font-size="15">18.433%</text><text x="55" y="630" font-family="Arial" font-size="14">A: 0.1 s decimation misses maxima (2% scale). B: asynchronous RSS excess (25% scale).</text><text x="55" y="661" font-family="Arial" font-size="14">Shear/moment are elastic restoring components, NOT total dynamic reactions.</text></svg>
