<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640"><rect width="1180" height="640" fill="white"/><text x="55" y="53" font-family="Arial" font-size="27" font-weight="bold" fill="#172a3c">Paired horizontal response: peak noncoincidence and bounds</text><text x="55" y="82" font-family="Arial" font-size="15" fill="#526373">Real ESM HNE/HNN, 158 m linear E-only beam proxy, 0.1 s displayed samples; NOT wind-seismic design</text><text x="55" y="137" font-family="Arial" font-size="19" font-weight="bold">A  Coincident vector / independent RSS</text><text x="628" y="137" font-family="Arial" font-size="19" font-weight="bold">B  Full-rate peak: lower / upper bound</text><text x="55" y="181" font-family="Arial" font-size="15" fill="#40546a">Top displacement</text><rect x="55" y="190" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="55" y="190" width="348.612" height="25" fill="#227d93" rx="3"/><text x="485" y="209" font-family="Arial" font-size="15">83.00%</text><text x="628" y="181" font-family="Arial" font-size="15" fill="#40546a">Top displacement</text><rect x="628" y="190" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="628" y="190" width="348.289" height="25" fill="#c67b4d" rx="3"/><text x="1058" y="209" font-family="Arial" font-size="15">82.93%</text><text x="55" y="271" font-family="Arial" font-size="15" fill="#40546a">Top acceleration</text><rect x="55" y="280" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="55" y="280" width="385.036" height="25" fill="#227d93" rx="3"/><text x="485" y="299" font-family="Arial" font-size="15">91.68%</text><text x="628" y="271" font-family="Arial" font-size="15" fill="#40546a">Top acceleration</text><rect x="628" y="280" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="628" y="280" width="362.569" height="25" fill="#c67b4d" rx="3"/><text x="1058" y="299" font-family="Arial" font-size="15">86.33%</text><text x="55" y="361" font-family="Arial" font-size="15" fill="#40546a">Base elastic shear</text><rect x="55" y="370" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="55" y="370" width="359.577" height="25" fill="#227d93" rx="3"/><text x="485" y="389" font-family="Arial" font-size="15">85.61%</text><text x="628" y="361" font-family="Arial" font-size="15" fill="#40546a">Base elastic shear</text><rect x="628" y="370" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="628" y="370" width="346.072" height="25" fill="#c67b4d" rx="3"/><text x="1058" y="389" font-family="Arial" font-size="15">82.40%</text><text x="55" y="451" font-family="Arial" font-size="15" fill="#40546a">Base elastic moment</text><rect x="55" y="460" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="55" y="460" width="362.117" height="25" fill="#227d93" rx="3"/><text x="485" y="479" font-family="Arial" font-size="15">86.22%</text><text x="628" y="451" font-family="Arial" font-size="15" fill="#40546a">Base elastic moment</text><rect x="628" y="460" width="420" height="25" fill="#e7edf1" rx="3"/><rect x="628" y="460" width="348.609" height="25" fill="#c67b4d" rx="3"/><text x="1058" y="479" font-family="Arial" font-size="15">83.00%</text><text x="55" y="572" font-family="Arial" font-size="14" fill="#526373">A: gray is the extra peak implied by combining non-simultaneous maxima.</text><text x="628" y="572" font-family="Arial" font-size="14" fill="#526373">B: gray is unresolved, not a statistical confidence interval.</text><text x="55" y="611" font-family="Arial" font-size="13" fill="#526373">Full-rate individual peaks constrain but do not identify the unarchived paired full-rate vector peak.</text></svg>
