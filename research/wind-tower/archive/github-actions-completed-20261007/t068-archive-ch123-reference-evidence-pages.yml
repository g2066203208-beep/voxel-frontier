name: t068-archive-ch123-reference-evidence-pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t068-archive-ch123-reference-evidence-pages.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/references/user-provided/He_Zeyu_2024_hybrid_tower_thesis.pdf
            research/wind-tower/references/user-provided/Experimental and two-scale numerical studies on the behavior of prestressed concrete-steel hybrid wind turbine tower models.pdf
            research/wind-tower/references/user-provided/Intelligent analysis of dynamic characteristics of steel-concrete hybrid wind turbine tower based on adaptive vibration mode.pdf
            research/wind-tower/references/user-provided/Closed-Form Solution of Fundamental Frequency of Steel-Concrete Hybrid Wind Turbine Tower.pdf
            research/wind-tower/references/user-provided/Nonlinear dynamic response analyses of Onshore Wind Turbines with Steel-Concrete Hybrid Tower using a co-simulation approach.pdf
            research/wind-tower/references/open-access/Bak_2013_DTU_Wind_Energy_Report_I_0092.pdf
            research/wind-tower/references/user-provided/ERA5 - The new champion of wind power modelling.pdf
            research/wind-tower/references/user-provided/Spatiotemporal variation of power law exponent on the use of wind energy.pdf
            research/wind-tower/references/user-provided/Analysing the uncertainties of reanalysis data used for wind resource assessment - A critical review.pdf
            research/wind-tower/references/open-access/Abbas_2022_WES_ROSCO_7_53.pdf
            research/wind-tower/references/open-access/Brown_2024_WES_9_1791.pdf
          sparse-checkout-cone-mode: false

      - name: Install PDF renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Render evidence pages
        shell: bash
        run: |
          set -euo pipefail
          OUT='/tmp/t068'; mkdir -p "$OUT"
          HE='research/wind-tower/references/user-provided/He_Zeyu_2024_hybrid_tower_thesis.pdf'
          LI='research/wind-tower/references/user-provided/Experimental and two-scale numerical studies on the behavior of prestressed concrete-steel hybrid wind turbine tower models.pdf'
          CH='research/wind-tower/references/user-provided/Intelligent analysis of dynamic characteristics of steel-concrete hybrid wind turbine tower based on adaptive vibration mode.pdf'
          FR='research/wind-tower/references/user-provided/Closed-Form Solution of Fundamental Frequency of Steel-Concrete Hybrid Wind Turbine Tower.pdf'
          XU='research/wind-tower/references/user-provided/Nonlinear dynamic response analyses of Onshore Wind Turbines with Steel-Concrete Hybrid Tower using a co-simulation approach.pdf'
          DTU='research/wind-tower/references/open-access/Bak_2013_DTU_Wind_Energy_Report_I_0092.pdf'
          ER='research/wind-tower/references/user-provided/ERA5 - The new champion of wind power modelling.pdf'
          DA='research/wind-tower/references/user-provided/Spatiotemporal variation of power law exponent on the use of wind energy.pdf'
          RR='research/wind-tower/references/user-provided/Analysing the uncertainties of reanalysis data used for wind resource assessment - A critical review.pdf'
          RO='research/wind-tower/references/open-access/Abbas_2022_WES_ROSCO_7_53.pdf'
          BR='research/wind-tower/references/open-access/Brown_2024_WES_9_1791.pdf'
          render(){ pdftoppm -f "$2" -l "$2" -r 150 -png -singlefile "$1" "$OUT/$3" >/dev/null 2>&1; }

          # Ch1/2 — prototype, detailed FE, RNA, modal validation, nonlinear lineage
          render "$HE" 33 REF008_He2024_p33_reinforcement_and_PT_model
          render "$HE" 34 REF008_He2024_p34_31segment_rebar_table
          render "$HE" 35 REF008_He2024_p35_tower_geometry_and_model
          render "$LI" 1 REF005_Li2023_p01_abstract_global_local_two_scale
          render "$LI" 5 REF005_Li2023_p05_C3D8R_T3D2_tendon_and_fracture_energy
          render "$LI" 7 REF005_Li2023_p07_load_displacement_and_stress_validation
          render "$LI" 9 REF005_Li2023_p09_fullscale_two_scale_modal_and_unbonded_tendon
          render "$LI" 10 REF005_Li2023_p10_local_stress_and_mesh_requirement
          render "$CH" 3 REF010_Cheng2024_p03_RNA_eccentricity_inertia_prestress_model
          render "$CH" 7 REF010_Cheng2024_p07_FE_model_and_RNA_mass_properties
          render "$CH" 9 REF010_Cheng2024_p09_RNA_simplification_frequency_effect
          render "$FR" 23 REF039_Frequency2023_p23_FE_model
          render "$FR" 25 REF039_Frequency2023_p25_mesh_sensitivity
          render "$FR" 29 REF039_Frequency2023_p29_frequency_comparison
          render "$XU" 3 REF061_Xu2025_p03_DTU10MW_and_hybrid_tower_lineage
          render "$XU" 10 REF061_Xu2025_p10_Abaqus_model_and_pushover_validation
          render "$XU" 11 REF061_Xu2025_p11_linear_nonlinear_model_comparison
          render "$DTU" 13 REF001_DTU10MW_p13_key_parameters
          render "$DTU" 33 REF001_DTU10MW_p33_operational_parameters

          # Ch3 — reanalysis, hub-height extrapolation, controller and OpenFAST validation
          render "$ER" 3 REF080_ERA5_p03_100m_wind_and_dataset_comparison
          render "$ER" 7 REF080_ERA5_p07_model_performance
          render "$ER" 8 REF080_ERA5_p08_PSD_and_individual_turbine_results
          render "$DA" 4 REF093_DynamicAlpha_p04_tower_validation_method
          render "$DA" 5 REF093_DynamicAlpha_p05_measured_vs_ERA5_alpha
          render "$DA" 6 REF093_DynamicAlpha_p06_dynamic_alpha_vs_one_seventh
          render "$RR" 8 REF090_ReanalysisReview_p08_uncertainty_by_height_and_location
          render "$RR" 10 REF090_ReanalysisReview_p10_reanalysis_bias_RMSE_correlation
          render "$RR" 11 REF090_ReanalysisReview_p11_ERA5_comparative_performance
          render "$RO" 4 REF046_ROSCO_p04_workflow_and_operating_regions
          render "$RO" 6 REF046_ROSCO_p06_controller_logic
          render "$RO" 13 REF046_ROSCO_p13_near_rated_time_domain_response
          render "$RO" 17 REF046_ROSCO_p17_DLC_operational_comparison
          render "$BR" 5 REF009_Brown2024_p05_tower_frequency_validation
          render "$BR" 7 REF009_Brown2024_p07_modal_validation
          render "$BR" 10 REF009_Brown2024_p10_10min_inflow_bins
          render "$BR" 13 REF009_Brown2024_p13_operability_validation
          render "$BR" 15 REF009_Brown2024_p15_DEL_validation
          render "$BR" 17 REF009_Brown2024_p17_tower_base_load_validation

          sha256sum "$OUT"/*.png > "$OUT/EVIDENCE_PAGE_SHA256.txt"
          sha256sum "$HE" "$LI" "$CH" "$FR" "$XU" "$DTU" "$ER" "$DA" "$RR" "$RO" "$BR" > "$OUT/SOURCE_PDF_SHA256.txt"
          cat > "$OUT/README.md" <<'EOF'
          # Chapters 1–3 reference evidence pages
          Direct page renders from repository PDFs. These are literature-evidence pages, not thesis result figures.
          Ch1 uses these pages to support the research-gap narrative.
          Ch2 uses prototype/model/V&V pages from REF008/005/010/039/061/001.
          Ch3 uses ERA5/reanalysis/alpha/controller/OpenFAST-validation pages from REF080/093/090/046/009.
          Final thesis figures should normally be redrawn and cited; these page images remain for evidence tracing and audit.
          EOF

      - name: Commit evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          src=Path('/tmp/t068'); prefix='research/wind-tower/references/evidence-screenshots/ch1-ch3'
          H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'t068'}
          def api(m,p,x=None):
            data=None if x is None else json.dumps(x).encode()
            req=urllib.request.Request('https://api.github.com/repos/'+repo+p,data=data,headers=H,method=m)
            with urllib.request.urlopen(req,timeout=300) as r:return json.loads(r.read().decode())
          parent=api('GET','/git/ref/heads/'+branch)['object']['sha']; base=api('GET','/git/commits/'+parent)['tree']['sha']
          ents=[]
          for p in sorted(src.glob('*')):
            raw=p.read_bytes(); b=api('POST','/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
            ents.append({'path':prefix+'/'+p.name,'mode':'100644','type':'blob','sha':b['sha']})
          t=api('POST','/git/trees',{'base_tree':base,'tree':ents})
          c=api('POST','/git/commits',{'message':'references: archive source-evidence pages for Chapters 1-3','tree':t['sha'],'parents':[parent]})
          api('PATCH','/git/refs/heads/'+branch,{'sha':c['sha'],'force':False}); print(c['sha'])
          PY
