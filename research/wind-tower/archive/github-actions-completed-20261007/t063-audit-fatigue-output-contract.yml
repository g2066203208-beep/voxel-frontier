name: t063-audit-fatigue-output-contract

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t063-audit-fatigue-output-contract.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/experiments/T057/inputs/BASE001_T057_EVIDENCE_RECONCILED_HRB335_Q345_PTBF8_CONTACT_RNA_R2.inp
          sparse-checkout-cone-mode: false

      - name: Parse fatigue-relevant sets and output requests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p=Path('research/wind-tower/experiments/T057/inputs/BASE001_T057_EVIDENCE_RECONCILED_HRB335_Q345_PTBF8_CONTACT_RNA_R2.inp')
          lines=p.read_text(errors='ignore').splitlines()

          output_blocks=[]
          set_hits=[]
          step_hits=[]
          for i,l in enumerate(lines):
              u=l.upper()
              if u.startswith('*OUTPUT') or u.startswith('*ELEMENT OUTPUT') or u.startswith('*NODE OUTPUT') or u.startswith('*CONTACT OUTPUT') or u.startswith('*EL PRINT') or u.startswith('*NODE PRINT'):
                  block=[f'{i+1}: {l}']
                  for j in range(i+1,min(i+8,len(lines))):
                      if lines[j].startswith('*') and j>i+1: break
                      block.append(f'{j+1}: {lines[j]}')
                  output_blocks.append('\n'.join(block))
              if any(k in u for k in ['PT_','PT-', 'CSEG_', 'SSEG_', 'FLANGE', 'JOINT', 'CONTACT']):
                  if u.startswith('*ELSET') or u.startswith('*NSET') or u.startswith('*SURFACE') or u.startswith('*TIE') or u.startswith('*CONTACT PAIR') or u.startswith('*COUPLING'):
                      set_hits.append(f'{i+1}: {l}')
              if u.startswith('*STEP') or u.startswith('*STATIC') or u.startswith('*DYNAMIC') or u.startswith('*FREQUENCY'):
                  step_hits.append(f'{i+1}: {l}')

          out=Path('/tmp/t063'); out.mkdir(parents=True,exist_ok=True)
          (out/'T057_OUTPUT_BLOCKS.txt').write_text('\n\n'.join(output_blocks),encoding='utf-8')
          (out/'T057_FATIGUE_RELEVANT_SETS.txt').write_text('\n'.join(set_hits),encoding='utf-8')
          (out/'T057_STEPS.txt').write_text('\n'.join(step_hits),encoding='utf-8')

          req={
            'input':str(p),
            'output_block_count':len(output_blocks),
            'fatigue_relevant_set_declarations':len(set_hits),
            'step_line_count':len(step_hits),
            'required_for_material_fatigue':{
              'concrete':['S principal/directional stress history at selected CSEG regions','optionally LE/PE if needed for nonlinear diagnostics'],
              'prestressing_steel':['S11 axial stress history for PT elements'],
              'ordinary_rebar':['S11 only if response screening proves rebar fatigue relevant'],
              'steel_tower':['stress tensor at selected SSEG elements; weld fatigue requires nominal/hot-spot structural stress postprocessing'],
              'joints':['CPRESS','COPEN','CSHEAR1/2 or equivalent contact outputs'],
              'global_balance':['RF/RM at tower base and flange/reference points']
            }
          }
          (out/'T057_FATIGUE_OUTPUT_AUDIT.json').write_text(json.dumps(req,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          src=Path('/tmp/t063'); prefix='research/wind-tower/experiments/T063'
          H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'t063'}
          def api(m,p,x=None):
              data=None if x is None else json.dumps(x).encode()
              q=urllib.request.Request('https://api.github.com/repos/'+repo+p,data=data,headers=H,method=m)
              with urllib.request.urlopen(q,timeout=300) as r:return json.loads(r.read().decode())
          ref=api('GET','/git/ref/heads/'+branch); parent=ref['object']['sha']; base=api('GET','/git/commits/'+parent)['tree']['sha']
          e=[]
          for p in sorted(src.iterdir()):
              raw=p.read_bytes(); b=api('POST','/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              e.append({'path':prefix+'/'+p.name,'mode':'100644','type':'blob','sha':b['sha']})
          t=api('POST','/git/trees',{'base_tree':base,'tree':e}); c=api('POST','/git/commits',{'message':'research: audit T057 fatigue output readiness','tree':t['sha'],'parents':[parent]})
          api('PATCH','/git/refs/heads/'+branch,{'sha':c['sha'],'force':False}); print(c['sha'])
          PY
