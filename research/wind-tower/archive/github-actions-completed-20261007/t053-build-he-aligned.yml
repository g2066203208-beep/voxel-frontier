name: T053 Build He-aligned Abaqus candidate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t053-build-he-aligned.yml"
      - "research/wind-tower/experiments/T053/build_t053_he_aligned.py"
      - "research/wind-tower/experiments/T050/inputs/BASE001_T050_E2_HRB335_REBAR_HOOP_TIE_NSM_REMOVE.inp"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build T053
        run: python research/wind-tower/experiments/T053/build_t053_he_aligned.py

      - name: Commit generated candidate and audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/wind-tower/experiments/T053/inputs research/wind-tower/experiments/T053/T053_BUILD_AUDIT.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "T053: generate He-aligned S345 Abaqus candidate"
            git pull --rebase origin main
            git push
          fi
