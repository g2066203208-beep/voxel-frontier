name: t070-archive-thesis-evidence-pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t070-archive-thesis-evidence-pages.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            research/wind-tower/references/user-provided/风电机组钢-混凝土混合塔筒动力性能及损伤识别研究_李守振.pdf
            research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf
          sparse-checkout-cone-mode: false

      - name: Install renderer
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils

      - name: Render selected thesis pages
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/t070; mkdir -p "$OUT"
          LS='research/wind-tower/references/user-provided/风电机组钢-混凝土混合塔筒动力性能及损伤识别研究_李守振.pdf'
          LZ='research/wind-tower/references/user-provided/预应力混凝土-钢混合风电塔架结构优化及性能分析_李泽宇.pdf'
          render(){ pdftoppm -f "$2" -l "$2" -r 160 -png -singlefile "$1" "$OUT/$3" >/dev/null 2>&1; }
          render "$LS" 95 REF006_LiShouzhen_p095_gravity_second_order_dynamic_conclusions
          render "$LZ" 149 REF007_LiZeyu_p149_Ch6_time_domain_fatigue_method
          render "$LZ" 151 REF007_LiZeyu_p151_Ch6_SN_curves
          render "$LZ" 152 REF007_LiZeyu_p152_Ch6_fatigue_analysis_regions
          render "$LZ" 157 REF007_LiZeyu_p157_Ch6_fatigue_results
          render "$LZ" 159 REF007_LiZeyu_p159_Ch6_fatigue_life_table_and_summary
          sha256sum "$OUT"/*.png > "$OUT/EVIDENCE_PAGE_SHA256.txt"
          sha256sum "$LS" "$LZ" > "$OUT/SOURCE_PDF_SHA256.txt"
          cat > "$OUT/README.md" <<'EOF'
          # Comparison-thesis evidence pages

          REF006 Li Shouzhen 2023:
          - PDF p95: Chapter 3 summary. Supports the importance of higher modes for acceleration and gravity second-order effects in hybrid-tower dynamic response. It does not supply the present tower's numerical results.

          REF007 Li Zeyu 2024:
          - PDF p149: Chapter 6 time-domain fatigue method.
          - PDF p151: material S-N treatment.
          - PDF p152: fatigue analysis regions / critical-location selection.
          - PDF p157: wind-induced fatigue results section.
          - PDF p159: Table 6.4 and Chapter 6 summary; source-specific fatigue lives and control regions.
          
          REF007 is a strong secondary reference for the present Chapter 4 because it directly organizes PCSH wind response -> critical local stress -> wind-speed probability -> rainflow -> Miner -> material-specific fatigue. Its specific life values and control locations are source-specific and must not be copied as present-thesis results.
          EOF

      - name: Commit evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; branch='main'
          src=Path('/tmp/t070'); prefix='research/wind-tower/references/evidence-screenshots/comparison-theses'
          H={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'t070'}
          def api(m,p,x=None):
            data=None if x is None else json.dumps(x).encode()
            q=urllib.request.Request('https://api.github.com/repos/'+repo+p,data=data,headers=H,method=m)
            with urllib.request.urlopen(q,timeout=300) as r:return json.loads(r.read().decode())
          parent=api('GET','/git/ref/heads/'+branch)['object']['sha']; base=api('GET','/git/commits/'+parent)['tree']['sha']
          ents=[]
          for p in sorted(src.glob('*')):
            raw=p.read_bytes(); b=api('POST','/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
            ents.append({'path':prefix+'/'+p.name,'mode':'100644','type':'blob','sha':b['sha']})
          t=api('POST','/git/trees',{'base_tree':base,'tree':ents})
          cm=api('POST','/git/commits',{'message':'references: archive comparison-thesis evidence for dynamics and fatigue','tree':t['sha'],'parents':[parent]})
          api('PATCH','/git/refs/heads/'+branch,{'sha':cm['sha'],'force':False}); print(cm['sha'])
          PY
