name: t061-archive-zhao-steel-fatigue

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/t061-archive-zhao-steel-fatigue.yml'

permissions:
  contents: write

concurrency:
  group: t061-archive-zhao-steel-fatigue
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download open-access Zhao 2023 fatigue paper
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pdfs.semanticscholar.org/cfcb/0098170c29700a778a47a5fe358f8965b214.pdf'
          OUT='/tmp/Zhao_2023_AdvCivilEng_1100725_SteelTower_Fatigue_MeasuredData.pdf'
          curl -fL --connect-timeout 20 --max-time 180 --retry 3 "$URL" -o "$OUT"
          test "$(head -c 5 "$OUT")" = '%PDF-'
          test "$(stat -c%s "$OUT")" -gt 500000
          sha256sum "$OUT"

      - name: Commit PDF through Git Data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]; token=os.environ["GH_TOKEN"]; branch="main"
          src=Path("/tmp/Zhao_2023_AdvCivilEng_1100725_SteelTower_Fatigue_MeasuredData.pdf")
          path="research/wind-tower/references/open-access/Zhao_2023_AdvCivilEng_1100725_SteelTower_Fatigue_MeasuredData.pdf"
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28","User-Agent":"wind-tower-t061"}
          def api(method,p,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request("https://api.github.com/repos/"+repo+p,data=data,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=300) as r: return json.loads(r.read().decode())
          ref=api("GET","/git/ref/heads/"+branch); parent=ref["object"]["sha"]
          base=api("GET","/git/commits/"+parent)["tree"]["sha"]
          raw=src.read_bytes()
          blob=api("POST","/git/blobs",{"content":base64.b64encode(raw).decode(),"encoding":"base64"})
          tree=api("POST","/git/trees",{"base_tree":base,"tree":[{"path":path,"mode":"100644","type":"blob","sha":blob["sha"]}]})
          commit=api("POST","/git/commits",{"message":"references: archive Zhao 2023 steel tower fatigue paper","tree":tree["sha"],"parents":[parent]})
          api("PATCH","/git/refs/heads/"+branch,{"sha":commit["sha"],"force":False})
          print(commit["sha"])
          PY
