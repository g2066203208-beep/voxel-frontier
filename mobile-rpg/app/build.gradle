plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faithbound.game'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.faithbound.game'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-playability-alpha'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -O2 -ffast-math -fno-exceptions -fno-rtti'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    lint { abortOnError false }
}
